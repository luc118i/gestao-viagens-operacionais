// ============================================================
//  Modal de esquema
// ============================================================
// ============================================================
//  Home — seleção por região (cards)
// ============================================================
var REGIOES_ORDEM  = ['Norte', 'Nordeste', 'Centro-Oeste', 'Sudeste', 'Sul'];
var PERIODOS_ORDEM = ['Madrugada (00–05)', 'Manhã (06–11)', 'Tarde (12–17)', 'Noite (18–23)', 'Sem horário'];
var _homeGroupKeys  = ['regiao'];  // array ordenado de chaves ativas
var _homeLocalFilter = '';         // texto digitado no autocomplete de local
var _homeLocalSel    = null;       // local selecionado: { codigo, descricao }
var _homeView       = 'grid';   // 'grid' | 'list'
var _homeHideEmpty  = false;    // ocultar esquemas sem pontos
var _homeSelectMode = false;
var _homeSelected   = {};      // { id_esquema: true }
var _pdfLoteList    = null;    // lista de esquemas para o batch (null = todos)

// Dimensões de agrupamento da home. keyOf(e) → rótulo do grupo; order (opcional)
// define a ordem fixa das seções.
var HOME_GROUPS = {
  regiao:  { order: REGIOES_ORDEM.concat('Outros'), keyOf: function(e){ return (e.regiao  && e.regiao.trim())  ? e.regiao.trim()  : 'Outros'; } },
  horario: { order: PERIODOS_ORDEM,                 keyOf: function(e){ return _periodoDe(e.horario); } },
  partida: { keyOf: function(e){ return (e.partida && String(e.partida).trim()) ? String(e.partida).trim() : 'Sem partida'; } },
  fim:     { keyOf: function(e){ return (e.fim     && String(e.fim).trim())     ? String(e.fim).trim()     : 'Sem encerramento'; } },
  linha:   { keyOf: function(e){ return (e.nome_linha && String(e.nome_linha).trim()) ? String(e.nome_linha).trim() : '—'; } },
  codigo:  { keyOf: function(e){ return (e.cod_linha  && String(e.cod_linha).trim())  ? String(e.cod_linha).trim()  : 'Sem código'; } },
  sentido: { order: ['Ida', 'Volta'],   keyOf: function(e){ return (e.sentido && String(e.sentido).trim()) ? String(e.sentido).trim() : '—'; } },
  // Filtro-eixo: mostra só os esquemas sem pontos (os com pontos não geram chave).
  pontos:  { keysOf: function(e){ return e.temPontos ? [] : ['Sem pontos']; } },
  // Filtro-eixo: esquemas com pontos cadastrados mas nenhum com horário comercial
  // preenchido (no modo Hor. Comercial, o PDF desses sai com a tabela vazia).
  horcom:  { keysOf: function(e){ return (e.temPontos && !e.temHorarioComercial) ? ['Sem horário comercial'] : []; } },
  // Eixo de busca por local: o usuário escolhe um local cadastrado e vê as
  // linhas que passam por ele. Casa por CÓDIGO do ponto (preciso), não por texto.
  // Sem local selecionado, não devolve seções (renderHome mostra o prompt).
  local:   { keysOf: function(e){
               var sel = _homeLocalSel;
               if (!sel) return [];
               var codSel = String(sel.codigo).trim();
               var has = (e.paradas || []).some(function(p){ return String(p.cod).trim() === codSel; });
               return has ? [sel.descricao || codSel] : [];
             } }
};

function mostrarHome() {
  // Reseta a navbar para o estado "home": esconde o seletor de esquema (redundante
  // aqui, já há busca + grid) e os controles do editor (toggle de view, salvar, volta).
  ['hdrEsqBtn', 'hdrViewToggle', 'btnSalvar', 'btnVolta', 'btnAnalisar'].forEach(function(id) {
    var el = document.getElementById(id); if (el) el.style.display = 'none';
  });
  _updateHdrEsq(null);

  try { var v = localStorage.getItem('vc_homeView'); if (v) setHomeView(v); } catch(e) {}
  try {
    var he = localStorage.getItem('vc_homeHideEmpty');
    if (he === '1' && !_homeHideEmpty) toggleHideEmpty();
  } catch(e) {}
  _updateGroupBar();
  renderHome();
  var h = document.getElementById('homeScreen');
  if (h) h.classList.add('open');
}

function esconderHome() {
  var h = document.getElementById('homeScreen');
  if (h) h.classList.remove('open');
  // Saindo para o editor: o seletor de esquema volta (mostra o esquema atual).
  var b = document.getElementById('hdrEsqBtn'); if (b) b.style.display = '';
}

function novoEsquemaHome() {
  esconderHome();
  abrirModalEsquema();
  novoEsquema();
}

function setHomeGroup(g) {
  if (!HOME_GROUPS[g]) return;

  // 'local' é um modo de busca exclusivo (não empilha com os outros eixos).
  if (g === 'local') {
    var jaLocal = _homeGroupKeys.length === 1 && _homeGroupKeys[0] === 'local';
    if (jaLocal) {
      _homeGroupKeys = ['regiao'];   // toggle off → volta ao padrão
      _homeLocalSel = null;
      _homeLocalFilter = '';
    } else {
      _homeGroupKeys = ['local'];     // entra no modo busca por local
    }
    _updateGroupBar();
    renderHome();
    if (_homeGroupKeys[0] === 'local') {
      var inp = document.getElementById('homeLocalInput');
      if (inp) { inp.value = ''; setTimeout(function(){ inp.focus(); }, 0); }
    }
    return;
  }

  // Escolher qualquer outro eixo sai do modo 'local'.
  if (_homeGroupKeys.indexOf('local') !== -1) { _homeGroupKeys = []; _homeLocalSel = null; }

  // "Sem pontos" mostra esquemas vazios: desliga o "ocultar sem pontos" se estiver ligado.
  if (g === 'pontos' && _homeHideEmpty) {
    _homeHideEmpty = false;
    var hb = document.getElementById('homeBtnHideEmpty');
    if (hb) hb.classList.remove('active');
    try { localStorage.setItem('vc_homeHideEmpty', ''); } catch (e) {}
  }

  var idx = _homeGroupKeys.indexOf(g);
  if (idx !== -1) {
    // já está ativo: remove (mas mantém ao menos 1)
    if (_homeGroupKeys.length > 1) _homeGroupKeys.splice(idx, 1);
  } else {
    _homeGroupKeys.push(g);
  }
  if (!_homeGroupKeys.length) _homeGroupKeys = ['regiao'];
  _updateGroupBar();
  renderHome();
}

function _updateGroupBar() {
  var bar = document.getElementById('homeGroupBar');
  if (!bar) return;

  // "Sem pontos" só faz sentido quando existe ao menos um esquema sem pontos.
  var temSem    = (_esqs || []).some(function(e) { return !e.temPontos; });
  var pontosBtn = bar.querySelector('.home-gbtn[data-g="pontos"]');
  if (pontosBtn) pontosBtn.style.display = temSem ? '' : 'none';
  if (!temSem && _homeGroupKeys.indexOf('pontos') !== -1) {
    _homeGroupKeys = _homeGroupKeys.filter(function(k) { return k !== 'pontos'; });
    if (!_homeGroupKeys.length) _homeGroupKeys = ['regiao'];
  }

  // "Sem horário comercial" só aparece quando há esquema com pontos mas nenhum
  // horário comercial preenchido.
  var temSemHorCom = (_esqs || []).some(function(e) { return e.temPontos && !e.temHorarioComercial; });
  var horComBtn = bar.querySelector('.home-gbtn[data-g="horcom"]');
  if (horComBtn) horComBtn.style.display = temSemHorCom ? '' : 'none';
  if (!temSemHorCom && _homeGroupKeys.indexOf('horcom') !== -1) {
    _homeGroupKeys = _homeGroupKeys.filter(function(k) { return k !== 'horcom'; });
    if (!_homeGroupKeys.length) _homeGroupKeys = ['regiao'];
  }

  bar.querySelectorAll('.home-gbtn').forEach(function(b) {
    var g   = b.getAttribute('data-g');
    var idx = _homeGroupKeys.indexOf(g);
    var badge = b.querySelector('.home-gbtn-badge');
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'home-gbtn-badge';
      b.appendChild(badge);
    }
    if (idx !== -1) {
      b.classList.add('active');
      badge.textContent = _homeGroupKeys.length > 1 ? (idx + 1) : '';
      badge.style.display = _homeGroupKeys.length > 1 ? '' : 'none';
    } else {
      b.classList.remove('active');
      badge.style.display = 'none';
    }
  });

  // Filtro de local só aparece quando o eixo 'local' está ativo.
  var lf = document.getElementById('homeLocalFilter');
  if (lf) lf.style.display = (_homeGroupKeys.indexOf('local') !== -1) ? '' : 'none';
}

// ── Autocomplete de local ────────────────────────────────────
// Digita "PIRAPORA" → lista os locais cadastrados que casam; seleciona um →
// renderHome mostra as linhas que passam por aquele ponto (match por código).
function onHomeLocalInput(v) {
  _homeLocalFilter = v || '';
  _homeLocalSel = null;                 // digitar de novo limpa a seleção anterior
  renderLocalSuggestions();
  renderHome();
}

function renderLocalSuggestions() {
  var drop = document.getElementById('homeLocalDrop');
  if (!drop) return;
  var q = norm(_homeLocalFilter);
  if (!q) { drop.classList.remove('open'); drop.innerHTML = ''; return; }

  var list = (_locais || []).filter(function(l) {
    return norm(l.descricao).indexOf(q) !== -1 || norm(String(l.codigo)).indexOf(q) !== -1;
  }).slice(0, 50);

  if (!list.length) {
    drop.innerHTML = '<div class="home-localdrop-empty">Nenhum local encontrado</div>';
  } else {
    drop.innerHTML = list.map(function(l) {
      return '<div class="home-localdrop-opt" data-cod="' + esc(String(l.codigo)) + '">'
        + '<span class="home-localdrop-name">' + esc(l.descricao) + '</span>'
        + '<span class="home-localdrop-meta">' + esc(String(l.codigo))
        + (l.tipo ? ' · ' + esc(l.tipo) : '') + '</span></div>';
    }).join('');
  }
  drop.classList.add('open');
  drop.querySelectorAll('.home-localdrop-opt').forEach(function(el) {
    el.addEventListener('mousedown', function(ev) {
      ev.preventDefault();
      selecionarLocalHome(el.getAttribute('data-cod'));
    });
  });
}

function selecionarLocalHome(cod) {
  var l = (_locais || []).find(function(x) { return String(x.codigo) === String(cod); });
  if (!l) return;
  _homeLocalSel = { codigo: l.codigo, descricao: l.descricao };
  _homeLocalFilter = l.descricao;
  var inp = document.getElementById('homeLocalInput');
  if (inp) inp.value = l.descricao;
  var drop = document.getElementById('homeLocalDrop');
  if (drop) drop.classList.remove('open');
  renderHome();
}

// Fecha o dropdown de local ao clicar fora dele.
document.addEventListener('click', function(e) {
  if (!e.target.closest('#homeLocalInput') && !e.target.closest('#homeLocalDrop')) {
    var d = document.getElementById('homeLocalDrop');
    if (d) d.classList.remove('open');
  }
});

function toggleHideEmpty() {
  _homeHideEmpty = !_homeHideEmpty;
  var btn = document.getElementById('homeBtnHideEmpty');
  if (btn) btn.classList.toggle('active', _homeHideEmpty);
  try { localStorage.setItem('vc_homeHideEmpty', _homeHideEmpty ? '1' : ''); } catch(e) {}
  renderHome();
}

function setHomeView(v) {
  _homeView = v;
  var gBtn = document.getElementById('homeBtnViewGrid');
  var lBtn = document.getElementById('homeBtnViewList');
  if (gBtn) gBtn.classList.toggle('active', v === 'grid');
  if (lBtn) lBtn.classList.toggle('active', v === 'list');
  try { localStorage.setItem('vc_homeView', v); } catch(e) {}
  renderHome();
}

function _sortedGroupKeys(groups, cfg) {
  var present = Object.keys(groups);
  if (!cfg.order) return present.sort(function(a, b) { return a.localeCompare(b, 'pt-BR'); });
  var fixed = cfg.order.filter(function(k) { return groups[k]; });
  var rest  = present.filter(function(k) { return cfg.order.indexOf(k) === -1; })
                     .sort(function(a, b) { return a.localeCompare(b, 'pt-BR'); });
  return fixed.concat(rest);
}

function _sortItems(items) {
  return items.sort(function(a, b) {
    return String(a.horario || '~').localeCompare(String(b.horario || '~'))
        || norm(a.nome_linha).localeCompare(norm(b.nome_linha));
  });
}

var _LIST_HEADER = '<div class="home-list-header">'
  + '<span>Linha</span><span>Código</span><span style="text-align:center;">Hor.</span>'
  + '<span>Partida</span><span>Encerramento</span><span>Sentido</span><span></span>'
  + '</div>';

function _renderItems(items, isList) {
  return isList
    ? '<div class="home-list">' + _LIST_HEADER + _sortItems(items).map(_homeRowHtml).join('') + '</div>'
    : '<div class="home-cards">' + _sortItems(items).map(_homeCardHtml).join('') + '</div>';
}

function _renderGroups(esqs, keys, depth, isList) {
  // keys: array de chaves de agrupamento restantes
  if (!keys.length) return _renderItems(esqs, isList);
  var cfg    = HOME_GROUPS[keys[0]] || HOME_GROUPS.regiao;
  var rest   = keys.slice(1);
  var groups = {};
  esqs.forEach(function(e) {
    // Eixos N:N usam keysOf (array); os demais, keyOf (chave única).
    var ks = cfg.keysOf ? cfg.keysOf(e) : [cfg.keyOf(e) || '—'];
    ks.forEach(function(k) {
      if (!k) return;
      (groups[k] = groups[k] || []).push(e);
    });
  });
  var sorted = _sortedGroupKeys(groups, cfg);
  if (!sorted.length) return '<div class="home-empty">Nenhum esquema.</div>';
  return sorted.map(function(rk) {
    var inner = _renderGroups(groups[rk], rest, depth + 1, isList);
    var cls   = depth === 0 ? 'home-region' : 'home-subregion';
    var hcls  = depth === 0 ? 'home-region-h' : 'home-subregion-h';
    return '<section class="' + cls + '">'
      + '<div class="' + hcls + '"><span class="home-region-name">' + esc(rk) + '</span>'
      + '<span class="home-region-c">' + groups[rk].length + '</span></div>'
      + inner
      + '</section>';
  }).join('');
}

// ── Sidebar de navegação (scrollspy) ─────────────────────────
// Lista vertical das LINHAS (seções) renderizadas; conforme o usuário rola, o
// item correspondente à linha visível no topo da tela fica em destaque. Clicar
// num item rola até a linha. Só aparece no agrupamento por "Linha".
var _sideNavRows       = [];     // [{ id, el }] na ordem em que aparecem
var _sideNavSpyBound   = false;  // listener de scroll preso uma única vez

function _renderSideNav(body) {
  var aside  = document.getElementById('homeSideNav');
  var list   = document.getElementById('homeSideNavList');
  var screen = document.getElementById('homeScreen');
  if (!aside || !list || !screen) return;

  var secs = body.querySelectorAll(':scope > .home-region');
  // Só no agrupamento por Linha e com ao menos 2 linhas.
  if (_homeGroupKeys[0] !== 'linha' || secs.length < 2) {
    aside.style.display = 'none';
    screen.classList.remove('has-sidenav');
    list.innerHTML = '';
    _sideNavRows = [];
    return;
  }

  var html = [];
  _sideNavRows = [];
  secs.forEach(function(sec, i) {
    var id = 'homesec-' + i;
    sec.id = id;
    var nameEl = sec.querySelector('.home-region-name');
    var cEl    = sec.querySelector('.home-region-c');
    var name   = nameEl ? nameEl.textContent : ('Linha ' + (i + 1));
    _sideNavRows.push({ id: id, el: sec });
    var cor = _lineColor(name);
    html.push('<button type="button" class="home-sidenav-item" data-id="' + id + '" style="border-left-color:' + cor + ';">'
      + '<span class="home-sidenav-name">' + esc(name) + '</span>'
      + (cEl ? '<span class="home-sidenav-c">' + esc(cEl.textContent) + '</span>' : '')
      + '</button>');
  });

  list.innerHTML = html.join('');
  aside.style.display = '';
  screen.classList.add('has-sidenav');

  list.querySelectorAll('.home-sidenav-item').forEach(function(it) {
    it.addEventListener('click', function() {
      var id  = it.getAttribute('data-id');
      var hit = _sideNavRows.find(function(r) { return r.id === id; });
      if (hit) {
        hit.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        _flashRegion(hit.el);
      }
    });
  });

  if (!_sideNavSpyBound) {
    var ticking = false;
    screen.addEventListener('scroll', function() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function() { ticking = false; _updateSideNavActive(screen); });
    });
    _sideNavSpyBound = true;
  }
  _updateSideNavActive(screen);
}

function _updateSideNavActive(screen) {
  if (!_sideNavRows.length) return;
  // Linha de referência: logo abaixo das barras fixas (header + guia).
  var refTop  = screen.getBoundingClientRect().top + 120;
  var active  = _sideNavRows[0];
  for (var i = 0; i < _sideNavRows.length; i++) {
    if (_sideNavRows[i].el.getBoundingClientRect().top <= refTop) active = _sideNavRows[i];
    else break;
  }

  var list = document.getElementById('homeSideNavList');
  if (!list) return;
  list.querySelectorAll('.home-sidenav-item').forEach(function(it) {
    var on = it.getAttribute('data-id') === active.id;
    it.classList.toggle('active', on);
    if (on) {
      // Mantém o item ativo visível dentro da própria sidebar (sem mexer na página).
      var top = it.offsetTop, bot = top + it.offsetHeight;
      if (top < list.scrollTop) list.scrollTop = top - 8;
      else if (bot > list.scrollTop + list.clientHeight) list.scrollTop = bot - list.clientHeight + 8;
    }
  });
}

// Pisca um realce ao redor do bloco da linha quando o usuário chega nele
// via sidebar, para sinalizar onde os esquemas daquela linha estão.
function _flashRegion(el) {
  if (!el) return;
  el.classList.remove('flash');
  void el.offsetWidth;          // reflow: reinicia a animação se clicar de novo
  el.classList.add('flash');
  setTimeout(function() { el.classList.remove('flash'); }, 1900);
}

function renderHome() {
  var body = document.getElementById('homeBody');
  if (!body) return;

  _updateGroupBar();   // mantém o botão "Sem pontos" coerente com os dados atuais

  var esqs = _homeHideEmpty ? _esqs.filter(function(e) { return e.temPontos; }) : _esqs;

  if (!esqs.length) {
    body.innerHTML = '<div class="home-empty">Nenhum esquema cadastrado.</div>';
    body.classList.toggle('selecting', _homeSelectMode);
    return;
  }

  var isList = (_homeView === 'list');

  // Modo busca por local: sem local selecionado, mostra orientação em vez de
  // despejar todas as paradas.
  if (_homeGroupKeys.length === 1 && _homeGroupKeys[0] === 'local' && !_homeLocalSel) {
    body.innerHTML = '<div class="home-empty">'
      + (_homeLocalFilter
          ? 'Selecione um local na lista para ver as linhas que passam por ele.'
          : 'Digite o nome de um local ou cidade (ex.: <strong>Pirapora</strong>) e selecione-o para ver as linhas que passam por ali.')
      + '</div>';
    body.classList.toggle('selecting', _homeSelectMode);
    return;
  }

  body.innerHTML = _renderGroups(esqs, _homeGroupKeys, 0, isList);
  _renderSideNav(body);

  body.classList.toggle('selecting', _homeSelectMode);
  body.querySelectorAll('.home-card, .home-row').forEach(function(el) {
    var id = el.getAttribute('data-id');
    if (_homeSelectMode && _homeSelected[id]) el.classList.add('selected');
    el.addEventListener('click', function() {
      var esq = _esqs.find(function(e) { return e.id_esquema === id; });
      if (_homeSelectMode) {
        if (esq && esq.temPontos) _toggleHomeSel(id, el);
        return;
      }
      if (esq) selecionarEsq(esq);
    });
    // Clique do scroll (botão do meio) abre o esquema em outra aba.
    el.addEventListener('auxclick', function(ev) {
      if (ev.button !== 1) return;
      ev.preventDefault();
      _abrirEsqNovaAba(id);
    });
    // Evita o autoscroll do navegador ao pressionar o botão do meio.
    el.addEventListener('mousedown', function(ev) {
      if (ev.button === 1) ev.preventDefault();
    });
  });
}

// Abre o editor de um esquema numa nova aba (deep-link ?page=manager&esq=ID).
// Usa um <a target="_blank"> sintético em vez de window.open: dentro do iframe
// sandbox do Apps Script, window.open no clique esquerdo costuma ser bloqueado
// como popup, enquanto o clique programático num link é tratado como navegação.
function _abrirEsqNovaAba(id) {
  if (!id) return;
  if (typeof WEB_APP_URL === 'undefined' || !WEB_APP_URL) {
    toast('URL do app indisponível para abrir em nova aba.', 'error');
    return;
  }
  var url = WEB_APP_URL + '?page=manager&esq=' + encodeURIComponent(id);
  var a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function _sentidoTag(s) {
  var t = String(s || '').toLowerCase();
  var cls = t.indexOf('volta') !== -1 ? 'tag-volta'
          : 'tag-ida';
  return '<span class="home-tag ' + cls + '">' + esc(s || '—') + '</span>';
}

function _periodoDe(hhmm) {
  var h = parseInt(String(hhmm || '').split(':')[0], 10);
  if (isNaN(h)) return 'Sem horário';
  if (h < 6)  return 'Madrugada (00–05)';
  if (h < 12) return 'Manhã (06–11)';
  if (h < 18) return 'Tarde (12–17)';
  return 'Noite (18–23)';
}

// Cor determinística por linha (mesma linha → mesma cor)
function _lineColor(key) {
  var s = String(key || ''), h = 0;
  for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
  return 'hsl(' + (h % 360) + ', 62%, 52%)';
}

function confirmarExclusao(ev, idEsquema, nomeLinha) {
  ev.stopPropagation(); // não abre o esquema ao clicar na lixeira
  var ex = document.getElementById('homeDelOverlay');
  if (ex) ex.remove();

  var modal =
    '<div id="homeDelOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;">'
    + '<div style="background:#fff;border-radius:12px;width:400px;max-width:92vw;box-shadow:0 8px 40px rgba(0,0,0,0.25);overflow:hidden;">'
      + '<div style="background:#1a1d23;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;">'
        + '<div style="font-size:14px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px;">'
          + ico('alert-triangle', 15) + ' Excluir Esquema</div>'
        + '<button onclick="document.getElementById(\'homeDelOverlay\').remove()" style="background:none;border:none;color:#9aa0ad;cursor:pointer;padding:4px;display:flex;">' + ico('x', 15) + '</button>'
      + '</div>'
      + '<div style="padding:20px;">'
        + '<p style="font-size:13px;color:#3a3f52;margin:0 0 6px;">Tem certeza que deseja excluir:</p>'
        + '<p style="font-size:14px;font-weight:700;color:#1a1d23;margin:0 0 14px;">' + esc(nomeLinha) + ' <span style="color:#9aa0ad;font-weight:400;">(#' + esc(idEsquema) + ')</span></p>'
        + '<p style="font-size:12px;color:#e05050;margin:0;">Esta ação também remove todos os pontos configurados e <strong>não pode ser desfeita</strong>.</p>'
      + '</div>'
      + '<div style="padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;">'
        + '<button onclick="document.getElementById(\'homeDelOverlay\').remove()" style="padding:8px 16px;border:1px solid #d4d8e8;border-radius:6px;background:#fff;font-size:12px;cursor:pointer;color:#5a6070;">Cancelar</button>'
        + '<button onclick="_executarExclusao(\'' + esc(idEsquema) + '\',\'' + esc(nomeLinha) + '\')" style="padding:8px 18px;border:none;border-radius:6px;background:#e05050;color:#fff;font-size:12px;font-weight:700;cursor:pointer;">Excluir</button>'
      + '</div>'
    + '</div></div>';

  document.getElementById('homeDelOverlay').addEventListener('click', function(e) {
    if (e.target === this) this.remove();
  });

function _executarExclusao(idEsquema, nomeLinha) {
  var overlay = document.getElementById('homeDelOverlay');
  if (overlay) overlay.remove();
  loading('Excluindo esquema…');
  google.script.run
    .withSuccessHandler(function() {
      doneLoading();
      _esqs = _esqs.filter(function(e) { return e.id_esquema !== idEsquema; });
      if (_sel && _sel.id_esquema === idEsquema) { _sel = null; _seq = []; _seqDirt = false; }
      delete _homeSelected[idEsquema];
      renderHome();
      toast('Esquema "' + nomeLinha + '" excluído.', 'success', 3500);
    })
    .withFailureHandler(function(e) {
      doneLoading();
      toast('Erro ao excluir: ' + (e.message || e), 'error');
    })
    .excluirEsquema(idEsquema);
}

function toggleHomeSelectMode() {
  _homeSelectMode = !_homeSelectMode;
  if (!_homeSelectMode) _homeSelected = {};
  _updateHomeSelUI();
  renderHome();
}

function _toggleHomeSel(id, el) {
  if (_homeSelected[id]) { delete _homeSelected[id]; el.classList.remove('selected'); }
  else { _homeSelected[id] = true; el.classList.add('selected'); }
  _updateHomeSelCount();
}

function homeSelectAll() {
  _esqs.forEach(function(e) { if (e.temPontos) _homeSelected[e.id_esquema] = true; });
  renderHome();
  _updateHomeSelCount();
}

function homeSelectClear() {
  _homeSelected = {};
  renderHome();
  _updateHomeSelCount();
}

  return _esqs.filter(function(e) { return _homeSelected[e.id_esquema]; });
}

// Máximo de esquemas por análise de IA em grupo (limite de tokens/min do plano).
var MAX_ANALISE_IA_GRUPO = 10;

function _updateHomeSelCount() {
  var n = Object.keys(_homeSelected).length;
  var c = document.getElementById('homeSelCount');
  if (c) c.textContent = n + (n === 1 ? ' selecionado' : ' selecionados');
  var d = document.getElementById('homeSelDownload');
  if (d) d.textContent = 'Baixar PDFs (' + n + ')';
  var a = document.getElementById('homeSelAnalise');
  if (a) {
    a.textContent = 'Analisar grupo (' + n + ')';
    var excede = n > MAX_ANALISE_IA_GRUPO;
    a.disabled = excede;
    a.style.opacity = excede ? '0.5' : '';
    a.style.cursor = excede ? 'not-allowed' : '';
    a.title = excede
      ? 'A IA aceita no máximo ' + MAX_ANALISE_IA_GRUPO + ' esquemas por vez. Reduza a seleção para analisar.'
      : '';
  }
}

function pdfLoteModeSelect(mode) {
  var isCom  = (mode === 'comercial');
  var isPers = (mode === 'personalizado');
  var nLbl = document.getElementById('pdfLoteModeNormalLabel');
  var cLbl = document.getElementById('pdfLoteModeComercialLabel');
  var pLbl = document.getElementById('pdfLoteModePersonalizadoLabel');
  if (nLbl) { nLbl.style.borderColor = (!isCom && !isPers) ? '#f47920' : '#d4d8e8'; nLbl.style.background = (!isCom && !isPers) ? '#fff8f0' : '#fff'; }
  if (cLbl) { cLbl.style.borderColor = isCom  ? '#f47920' : '#d4d8e8'; cLbl.style.background = isCom  ? '#fff8f0' : '#fff'; }
  if (pLbl) { pLbl.style.borderColor = isPers ? '#f47920' : '#d4d8e8'; pLbl.style.background = isPers ? '#fff8f0' : '#fff'; }
  var nr = document.querySelector('input[name="pdfLoteMode"][value="normal"]');
  var cr = document.querySelector('input[name="pdfLoteMode"][value="comercial"]');
  var pr = document.querySelector('input[name="pdfLoteMode"][value="personalizado"]');
  if (nr) nr.checked = (!isCom && !isPers);
  if (cr) cr.checked = isCom;
  if (pr) pr.checked = isPers;
  ['comercial','dif'].forEach(function(k) {
    var lbl = document.getElementById('pdfLoteColLabel_' + k);
    if (lbl) { lbl.style.opacity = isCom ? '0.4' : ''; lbl.style.pointerEvents = isCom ? 'none' : ''; }
  });
  var sec = document.getElementById('pdfLotePersonConfig');
  if (sec) sec.style.display = isPers ? '' : 'none';
}

function pdfLotePersonFormatoSelect(fmt) {
  _pdfPersonConfig.formato = fmt;
  var hLbl = document.getElementById('pdfLotePersonFmtHhmmLabel');
  var mLbl = document.getElementById('pdfLotePersonFmtMinLabel');
  var hRad = document.getElementById('pdfLotePersonFmtHhmm');
  var mRad = document.getElementById('pdfLotePersonFmtMin');
  var isMin = (fmt === 'min');
  if (hLbl) { hLbl.style.borderColor = isMin ? '#d4d8e8' : '#f47920'; hLbl.style.background = isMin ? '#fff' : '#fff8f0'; }
  if (mLbl) { mLbl.style.borderColor = isMin ? '#f47920' : '#d4d8e8'; mLbl.style.background = isMin ? '#fff8f0' : '#fff'; }
  if (hRad) hRad.checked = !isMin;
  if (mRad) mRad.checked =  isMin;
}

function gerarPdfsLote() {
  ['chegada','parada','saida','desl','comercial','dif'].forEach(function(k) {
    var el = document.getElementById('pdfLoteCol_' + k);
    if (el) _pdfCols[k] = el.checked;
  });
  var mEl = document.querySelector('input[name="pdfLoteMode"]:checked');
  _pdfMode = mEl ? mEl.value : 'normal';
  if (_pdfMode === 'personalizado') {
    var fEl = document.querySelector('input[name="pdfLotePersonFormato"]:checked');
    _pdfPersonConfig.formato = fEl ? fEl.value : 'hhmm';
    _pdfPersonConfig.pontos  = null; // lote não filtra pontos individualmente
  }
  _savePdfPrefs();

  var esqList = ((_pdfLoteList && _pdfLoteList.length) ? _pdfLoteList : _esqs)
                  .filter(function(e) { return e.temPontos; });
  fecharModalPdfLote();
  if (!esqList.length) { toast('Nenhum esquema para gerar.', 'error'); return; }

  // Antes de gerar: identifica esquemas que produziriam o mesmo nome de arquivo
  // (mesma linha, horário e sentido) e abre um aviso para revisão.
  var dups = _detectarDuplicadosLote(esqList);
  if (dups.length) { _abrirModalDuplicados(esqList, dups); return; }

  _iniciarLoteServer(esqList);
}

// Agrupa os esquemas pelo nome de arquivo final; retorna só os grupos com 2+ itens.
function _detectarDuplicadosLote(esqList) {
  var byName = {};
  esqList.forEach(function(e) {
    var k = _loteFilename(e).toLowerCase();
    (byName[k] = byName[k] || []).push(e);
  });
  return Object.keys(byName)
    .filter(function(k) { return byName[k].length > 1; })
    .map(function(k) { return byName[k]; });
}

function _iniciarLoteServer(esqList) {
  loading('Preparando dados…');
  google.script.run
    .withSuccessHandler(function(pontosByEsq) {
      pontosByEsq = pontosByEsq || {};
      // No modo "Hor. Comercial", pontos sem horário comercial são descartados
      // da tabela (imprimirHorario). Se nenhum ponto do esquema tiver horário
      // comercial, o PDF sairia com o corpo vazio — trata como "sem pontos".
      var semPontos = esqList.filter(function(e) {
        var pts = pontosByEsq[e.id_esquema] || [];
        if (!pts.length) return true;
        if (_pdfMode === 'comercial') return !pts.some(function(p) { return p.horarioComercial; });
        return false;
      });
      if (semPontos.length) {
        doneLoading();
        _abrirModalSemPontos(esqList, pontosByEsq, semPontos);
        return;
      }
      _continuarLoteComPontos(esqList, pontosByEsq);
    })
    .withFailureHandler(function(e) { doneLoading(); toast('Erro ao carregar pontos: ' + (e.message || e), 'error'); })
    .getTodosPontosParaFormulario();
}

function _continuarLoteComPontos(esqList, pontosByEsq) {
  loading('Preparando dados…');
  var seen = {}, allPairs = [];
  esqList.forEach(function(e) {
    var pts = (pontosByEsq[e.id_esquema] || []).filter(function(p) {
      var l = _lMap[String(p.idPonto)]; return l && l.lat && l.lng;
    });
    for (var i = 0; i < pts.length - 1; i++) {
      var a = pts[i].idPonto, b = pts[i + 1].idPonto;
      var k = a <= b ? a + ':' + b : b + ':' + a;
      if (!seen[k]) { seen[k] = 1; allPairs.push({ a: a, b: b }); }
    }
  });
  if (!allPairs.length) { _processLote(esqList, pontosByEsq, {}); return; }
  google.script.run
    .withSuccessHandler(function(cacheMap) { _processLote(esqList, pontosByEsq, cacheMap || {}); })
    .withFailureHandler(function() { _processLote(esqList, pontosByEsq, {}); })
    .getDistanciasCached(allPairs);
}

function massaPickInput(slot, v) {
  if (slot !== 'novo') { _massa[slot] = null; }
  _massa.preview = null; renderMassaPreviewBox(); renderMassaFoot();
  if (slot === 'ra' || slot === 'rb') renderRotaPreview();
  var drop = document.getElementById('massaDrop_' + slot); if (!drop) return;
  var q = norm(v);
  if (!q) { drop.classList.remove('open'); drop.innerHTML = ''; return; }
  var list = (_locais || []).filter(function(l) {
    return norm(l.descricao).indexOf(q) !== -1 || norm(String(l.codigo)).indexOf(q) !== -1;
  }).slice(0, 40);
  drop.innerHTML = list.length ? list.map(function(l) {
    return '<div class="home-localdrop-opt" data-cod="' + esc(String(l.codigo)) + '">'
      + '<span class="home-localdrop-name">' + esc(l.descricao) + '</span>'
      + '<span class="home-localdrop-meta">' + esc(String(l.codigo)) + (l.tipo ? ' · ' + esc(l.tipo) : '') + '</span></div>';
  }).join('') : '<div class="home-localdrop-empty">Nenhum local encontrado</div>';
  drop.classList.add('open');
  drop.querySelectorAll('.home-localdrop-opt').forEach(function(el) {
    el.addEventListener('mousedown', function(ev) { ev.preventDefault(); massaPickSelect(slot, el.getAttribute('data-cod')); });
  });
}

function massaPickSelect(slot, cod) {
  var l = (_locais || []).find(function(x) { return String(x.codigo) === String(cod); }); if (!l) return;
  var inp = document.getElementById('massaPick_' + slot);
  var drop = document.getElementById('massaDrop_' + slot); if (drop) drop.classList.remove('open');
  _massa.preview = null; renderMassaPreviewBox();
  if (slot === 'novo') {
    _massa.novos.push({ cod: String(l.codigo), nome: l.descricao, tipo: l.tipo || '' });
    if (inp) inp.value = '';
    renderMassaNovos(); renderMassaFoot();
    return;
  }
  if (inp) inp.value = l.descricao;
  _massa[slot] = { codigo: String(l.codigo), descricao: l.descricao, lat: l.lat, lng: l.lng };
  if (slot === 'ra' || slot === 'rb') { renderRotaPreview(); _rotaPointsChanged(); }
  renderMassaFoot();
}

  if (!descricao) { massaMsg('Informe a descrição.', 'error'); var dd = document.getElementById('np_descricao'); if (dd) dd.focus(); return; }

  var btn = document.getElementById('massaBtnCad');
  if (btn) { btn.disabled = true; btn.textContent = 'Cadastrando…'; }
  massaMsg('');

  var dados = {
    codigo: codigo, codEmb: _npVal('codEmb'), descResumida: _npVal('descResumida'),
    descricao: descricao, unidade: _npVal('unidade'), tipo: _npVal('tipo'),
    ajusteHorario: _npVal('ajusteHorario'), raio: _npVal('raio'), raioAdvert: _npVal('raioAdvert'),
    vel: _npVal('vel'), grupoPc: _npVal('grupoPc'), distVel: _npVal('distVel'),
    codigoExterno: _npVal('codigoExterno'), direcoes: _npVal('direcoes'),
    latitude: _npVal('latitude'), longitude: _npVal('longitude'),
    ativo: _npChk('ativo'), pedagio: _npChk('pedagio'), rodoviaria: _npChk('rodoviaria'),
    suspensao: _npChk('suspensao'), garagem: _npChk('garagem'), online: _npChk('online'),
    auxiliar: _npChk('auxiliar'), seletivo: _npChk('seletivo'),
    pontoVel: _npChk('pontoVel'), areaVel: _npChk('areaVel')
  };

  google.script.run
    .withSuccessHandler(function(novo) {

// ── Importação de CSV ────────────────────────────────────────
// Ordem das colunas da aba LOCAIS (0..28) com aliases de cabeçalho normalizados.
var _LOC_HEADERS = [
  ['codigo'], ['cod emb'], ['desc resumida'], ['descricao'],
  ['unidade empresarial', 'unidade'], ['tipo'], ['ajuste horario'], ['raio'],
  ['raio advert'], ['vel'], ['grupo pc'], ['dist uso vel'], ['codigo externo'],
  ['ativo'], ['pedagio'], ['rodoviaria'], ['suspensao'], ['garagem'], ['online'],
  ['auxiliar', 'auxlilar'], ['seletivo'], ['ponto vel'], ['area vel'], ['direcoes'],
  ['latitude'], ['longitude'], ['chave'], ['data cadastro'], ['data alteracao']
];

function _normHdr(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}

function _coerceCsv(v) {
  var s = String(v == null ? '' : v).trim();
  if (s === '') return '';
  if (/^-?\d+(?:\.\d+)?$/.test(s)) return Number(s);
  return s;
}

// Parser CSV: aspas, vírgulas internas, CRLF e quebras dentro de aspas.
function _parseCSV(text) {
  var rows = [], row = [], cur = '', q = false, i = 0, c;
  for (; i < text.length; i++) {
    c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\r') { /* ignora */ }
      else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function massaCsvFile(input) {
  var file = input && input.files && input.files[0];
  if (!file) return;
  var upd = !!(_massa.import && _massa.import.atualizar);
  _massa.import = { rows: [], fileName: file.name, atualizar: upd };
  massaMsg('Lendo ' + file.name + '…', 'info');
  var reader = new FileReader();
  reader.onload = function() {
    try { _processarCsv(String(reader.result || '')); }
    catch (e) { massaMsg('Erro ao ler CSV: ' + (e.message || e), 'error'); }
  };
  reader.onerror = function() { massaMsg('Não consegui ler o arquivo.', 'error'); };
  // O export vem em Latin-1 (ISO-8859-1) — preserva os acentos.
  reader.readAsText(file, 'ISO-8859-1');
}

function _processarCsv(text) {
  var grid = _parseCSV(text).filter(function(r) {
    return r.some(function(c) { return String(c).trim() !== ''; });
  });
  if (grid.length < 2) { massaMsg('CSV sem linhas de dados.', 'error'); return; }

  // Mapa: índice da coluna no CSV → índice na aba LOCAIS
  var header = grid[0].map(_normHdr);
  var csvToLoc = header.map(function(h) {
    for (var li = 0; li < _LOC_HEADERS.length; li++) {
      if (_LOC_HEADERS[li].indexOf(h) !== -1) return li;
    }
    return -1;
  });
  if (csvToLoc.indexOf(0) === -1) { massaMsg('O cabeçalho não tem a coluna "Código". Confira o arquivo.', 'error'); return; }

  var rows = [];
  for (var r = 1; r < grid.length; r++) {
    var arr = new Array(_LOC_HEADERS.length).fill('');
    grid[r].forEach(function(val, j) {
      var li = csvToLoc[j];
      if (li >= 0) arr[li] = _coerceCsv(val);
    });
    var cod = String(arr[0]).trim();
    var status = !cod ? 'erro' : (_lMap[cod] ? 'existe' : 'novo');
    rows.push({ arr: arr, codigo: cod, descricao: String(arr[3] || ''), tipo: String(arr[5] || ''),
                lat: arr[24], lng: arr[25], status: status });
  }
  // Duplicado dentro do próprio arquivo → marca como 'existe' a partir da 2ª ocorrência
  var seen = {};
  rows.forEach(function(it) {
    if (it.status === 'novo') {
      if (seen[it.codigo]) it.status = 'existe';
      else seen[it.codigo] = true;
    }
  });

  _massa.import.rows = rows;
  _aplicarModoAtualizarImport();
  massaMsg('');
  renderImportTable();
  renderMassaFoot();
}

// Reflete a flag "atualizar existentes" nos status das linhas (existe <-> atualizar).
function _aplicarModoAtualizarImport() {
  var imp = _massa.import; if (!imp) return;
  (imp.rows || []).forEach(function(r) {
    if (imp.atualizar && r.status === 'existe')   r.status = 'atualizar';
    else if (!imp.atualizar && r.status === 'atualizar') r.status = 'existe';
  });
}

function massaImportToggleUpd(checked) {
  if (!_massa.import) return;
  _massa.import.atualizar = !!checked;
  _aplicarModoAtualizarImport();
  renderImportTable();
  renderMassaFoot();
}

function renderImportTable() {
  var box = document.getElementById('massaImportBox'); if (!box) return;
  var data = (_massa.import && _massa.import.rows) || [];
  if (!data.length) { box.innerHTML = ''; return; }
  var nNovo = data.filter(function(r) { return r.status === 'novo'; }).length;
  var nUpd  = data.filter(function(r) { return r.status === 'atualizar'; }).length;
  var nEx   = data.filter(function(r) { return r.status === 'existe'; }).length;
  var nErr  = data.filter(function(r) { return r.status === 'erro'; }).length;
  var nOk   = data.filter(function(r) { return r.status === 'importado' || r.status === 'atualizado'; }).length;

  var badge = {
    novo:       '<span class="imp-b imp-novo">Novo</span>',
    atualizar:  '<span class="imp-b imp-upd">Atualizar</span>',
    existe:     '<span class="imp-b imp-existe">Já existe</span>',
    erro:       '<span class="imp-b imp-erro">Erro</span>',
    importado:  '<span class="imp-b imp-ok">Importado</span>',
    atualizado: '<span class="imp-b imp-ok">Atualizado</span>'
  };
  var head = '<div class="imp-sum"><strong>' + data.length + '</strong> linha(s) · '
    + '<span style="color:#1e7d43;">' + nNovo + ' novo(s)</span>'
    + (nUpd ? ' · <span style="color:#c47f17;">' + nUpd + ' p/ atualizar</span>' : '')
    + (nEx  ? ' · <span style="color:#7a8299;">' + nEx + ' já existe(m)</span>' : '')
    + (nErr ? ' · <span style="color:#c62828;">' + nErr + ' erro</span>' : '')
    + (nOk  ? ' · <span style="color:#1e7d43;">' + nOk + ' gravado(s)</span>' : '') + '</div>';

  var rowsHtml = data.map(function(r) {
    var skip = (r.status === 'existe' || r.status === 'erro');
    return '<tr class="' + (skip ? 'imp-row-skip' : '') + '">'
      + '<td>' + (badge[r.status] || '') + '</td>'
      + '<td>' + esc(r.codigo || '—') + '</td>'
      + '<td>' + esc(r.descricao || '') + '</td>'
      + '<td>' + esc(r.tipo || '') + '</td>'
      + '<td class="imp-num">' + esc(r.lat === '' ? '' : String(r.lat)) + '</td>'
      + '<td class="imp-num">' + esc(r.lng === '' ? '' : String(r.lng)) + '</td>'
      + '</tr>';
  }).join('');

  box.innerHTML = head
    + '<div class="imp-table-wrap"><table class="imp-table">'
    + '<thead><tr><th>Status</th><th>Código</th><th>Descrição</th><th>Tipo</th><th>Lat</th><th>Lng</th></tr></thead>'
    + '<tbody>' + rowsHtml + '</tbody></table></div>';
}

function massaImportSalvar() {
  var data = (_massa.import && _massa.import.rows) || [];
  var gravar = data.filter(function(r) { return r.status === 'novo' || r.status === 'atualizar'; });
  if (!gravar.length) { massaMsg('Nenhuma linha para gravar.', 'error'); return; }
  var atualizar = !!(_massa.import && _massa.import.atualizar);
  var btn = document.getElementById('massaBtnImp');
  if (btn) { btn.disabled = true; btn.textContent = 'Importando…'; }
  massaMsg('');
  var payload = gravar.map(function(r) { return r.arr; });
  google.script.run
    .withSuccessHandler(function(res) {
      res = res || { imported: [], updated: [], skipped: [] };
      var impSet = {}, updSet = {};
      (res.imported || []).forEach(function(c) { impSet[String(c)] = true; });
      (res.updated  || []).forEach(function(c) { updSet[String(c)] = true; });
      data.forEach(function(r) {
        var obj = { codigo: r.codigo, descricao: r.descricao, tipo: r.tipo,
                    lat: (r.lat === '' ? null : Number(r.lat)), lng: (r.lng === '' ? null : Number(r.lng)) };
        if (impSet[r.codigo]) { r.status = 'importado'; _locais.push(obj); _lMap[r.codigo] = obj; }
        else if (updSet[r.codigo]) { r.status = 'atualizado'; _lMap[r.codigo] = obj; }
      });
      renderImportTable(); renderMassaFoot();
      var nImp = (res.imported || []).length, nUpd = (res.updated || []).length;
      var partes = [];
      if (nImp) partes.push(nImp + ' importado(s)');
      if (nUpd) partes.push(nUpd + ' atualizado(s)');
      if ((res.skipped || []).length) partes.push((res.skipped).length + ' pulado(s)');
      massaMsg(partes.join(' · ') || 'Nada a gravar.', 'success');
      toast((nImp + nUpd) + ' ponto(s) gravado(s).', 'success', 4000);
    })
    .withFailureHandler(function(e) {
      var b = document.getElementById('massaBtnImp');
      if (b) { b.disabled = false; b.textContent = 'Importar'; }
      massaMsg('Erro ao importar: ' + (e.message || e), 'error');
    })
    .importarLocais(payload, atualizar);
}

function renderMassaNovos() {
  var el = document.getElementById('massaNovosList'); if (!el) return;
  if (!_massa.novos.length) { el.innerHTML = '<div class="massa-novos-empty">Nenhum ponto adicionado ainda.</div>'; return; }

      + '<span class="massa-chip-name">' + esc(n.nome) + '</span>'
      + '<button class="massa-chip-rm" onclick="massaRemoverNovo(' + i + ')" title="Remover">' + ico('x', 12) + '</button></div>';

function massaRemoverNovo(i) {

function _nomeEsq(id) {
  var e = _esqs.find(function(x) { return String(x.id_esquema) === String(id); });
  return e ? (e.id_esquema + ' — ' + e.nome_linha) : ('#' + id);
}

function renderMassaPreviewBox() {
  var box = document.getElementById('massaPreviewBox'); if (!box) return;
  var p = _massa.preview;
  if (!p) { box.innerHTML = ''; return; }
  var ap = p.applied || [], sk = p.skipped || [];
  box.innerHTML = '<div class="massa-prev">'
    + '<div class="massa-prev-h"><strong>' + ap.length + '</strong> linha(s) serão alteradas'
    + (sk.length ? ' · <span style="color:#c47f17;">' + sk.length + ' pulada(s)</span>' : '') + '</div>'
    + (ap.length
        ? '<div class="massa-prev-list">' + ap.map(function(id) { return '<div>' + esc(_nomeEsq(id)) + '</div>'; }).join('') + '</div>'
        : '<div class="massa-prev-empty">Nenhuma linha corresponde aos critérios.</div>')
    + (sk.length
        ? '<div class="massa-prev-sub">Puladas (já contêm o ponto destino):</div>'
          + '<div class="massa-prev-list muted">' + sk.map(function(s) { return '<div>' + esc(_nomeEsq(s.id)) + '</div>'; }).join('') + '</div>'
        : '')
    + '</div>';
}

function _massaPronto() {
  return _massa.tab === 'sub'
    ? !!(_massa.x && _massa.y)
    : !!(_massa.a && _massa.b && _massa.novos.length);
}

function renderMassaFoot() {
  var foot = document.getElementById('massaFoot'); if (!foot) return;
  if (_massa.tab === 'novo') {
    foot.innerHTML =
      '<button class="btn btn-ghost" onclick="fecharModalMassa()">Fechar</button>'
      + '<button id="massaBtnCad" class="btn btn-dark" onclick="massaCadastrar()">Cadastrar ponto</button>';
    return;
  }
  if (_massa.tab === 'import') {
    var dataI = (_massa.import && _massa.import.rows) || [];
    var nGravar = dataI.filter(function(r) { return r.status === 'novo' || r.status === 'atualizar'; }).length;
    foot.innerHTML =
      '<button class="btn btn-ghost" onclick="fecharModalMassa()">Fechar</button>'
      + '<button id="massaBtnImp" class="btn btn-dark" onclick="massaImportSalvar()"' + (nGravar ? '' : ' disabled') + '>Importar' + (nGravar ? ' (' + nGravar + ')' : '') + '</button>';
    return;
  }
  if (_massa.tab === 'rota') {
    var ok = !!(_massa.ra && _massa.rb);
    foot.innerHTML =
      '<button class="btn btn-ghost" onclick="fecharModalMassa()">Fechar</button>'
      + '<button id="massaBtnRota" class="btn btn-dark" onclick="massaRotaSalvar()"' + (ok ? '' : ' disabled') + '>Salvar ajuste</button>';
    return;
  }
  var pronto = _massaPronto();
  var podeAplicar = !!(_massa.preview && (_massa.preview.applied || []).length);
  foot.innerHTML =
    '<button class="btn btn-ghost" onclick="fecharModalMassa()">Cancelar</button>'
    + '<button class="btn btn-ghost" onclick="massaPreview()"' + (pronto ? '' : ' disabled') + '>Pré-visualizar</button>'
    + '<button class="btn btn-dark" onclick="massaAplicar()"' + (podeAplicar ? '' : ' disabled') + '>Aplicar' + (podeAplicar ? ' (' + _massa.preview.applied.length + ')' : '') + '</button>';
}

function massaPreview() {
  if (!_massaPronto()) { toast('Preencha os campos antes de pré-visualizar.', 'error'); return; }
  loading('Calculando impacto…');
  var ok = function(r) { doneLoading(); massaMsg(''); _massa.preview = r || { applied: [], skipped: [] }; renderMassaPreviewBox(); renderMassaFoot(); };
  var fail = function(e) { doneLoading(); massaMsg('Erro: ' + (e.message || e), 'error'); };
  if (_massa.tab === 'sub') {
    google.script.run.withSuccessHandler(ok).withFailureHandler(fail)
      .substituirPontoEmMassa(_massa.x.codigo, _massa.y.codigo, _massa.y.descricao, false);
  } else {
    google.script.run.withSuccessHandler(ok).withFailureHandler(fail)
      .inserirEntrePontosEmMassa(_massa.a.codigo, _massa.b.codigo, _massa.novos, false);
  }
}

function massaAplicar() {
  if (!_massa.preview || !(_massa.preview.applied || []).length) return;
  var n = _massa.preview.applied.length;
  appConfirm({
    titulo: 'Aplicar alteração',
    mensagem: 'Aplicar a alteração em ' + n + ' linha(s)?\nEsta ação grava na planilha e não tem desfazer automático.',
    okLabel: 'Aplicar (' + n + ')',
    onOk: function() { _massaAplicarConfirmado(n); }
  });
}

function _massaAplicarConfirmado(n) {
  var fail = function(e) { appConfirmClose(); doneLoading(); massaMsg('Erro ao aplicar: ' + (e.message || e), 'error'); };
  var ok = function(r) {
    appConfirmClose();
    fecharModalMassa();
    _recarregarDadosManager(function() {
      toast('Pronto — ' + ((r && r.applied) ? r.applied.length : n) + ' linha(s) alterada(s).', 'success', 4000);
    });
  };
  if (_massa.tab === 'sub') {
    google.script.run.withSuccessHandler(ok).withFailureHandler(fail)
      .substituirPontoEmMassa(_massa.x.codigo, _massa.y.codigo, _massa.y.descricao, true);
  } else {
    google.script.run.withSuccessHandler(ok).withFailureHandler(fail)
      .inserirEntrePontosEmMassa(_massa.a.codigo, _massa.b.codigo, _massa.novos, true);
  }
}

function _parseTempoMin(s) {
  s = String(s || '').trim();
  if (!s) return 0;
  if (s.indexOf(':') !== -1) { var p = s.split(':'); return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0); }
  var m = s.match(/(\d+)\s*h\s*(\d+)?/i);
  if (m) return (parseInt(m[1], 10) || 0) * 60 + (parseInt(m[2], 10) || 0);
  return parseInt(s, 10) || 0;
}
function _fmtMin(min) {
  min = Math.round(min || 0); var h = Math.floor(min / 60), m = min % 60;
  return h ? (h + 'h' + (m ? (' ' + m + 'min') : '')) : (m + 'min');
}

// Linhas onde A e B são paradas consecutivas (qualquer sentido).
function _linhasComTrecho(codA, codB) {
  if (!codA || !codB) return [];
  return _esqs.filter(function(e) {
    var ps = e.paradas || [];
    for (var i = 0; i < ps.length - 1; i++) {
      var a = String(ps[i].cod), b = String(ps[i + 1].cod);
      if ((a === codA && b === codB) || (a === codB && b === codA)) return true;
    }
    return false;
  });
}

function renderRotaPreview() {

function massaRotaSalvar() {

// ── Mapa-arrasta do ajuste de rota (Leaflet + OSRM) ──────────
var _rotaMap = null, _rotaLine = null, _rotaLineHit = null, _rotaVias = [], _rotaViaMarkers = [], _rotaABMarkers = [];
var _rotaResult = { km: 0, min: 0, geom: null };

function _rotaHasCoords(p) { return !!(p && p.lat != null && p.lng != null && !isNaN(+p.lat) && !isNaN(+p.lng)); }

function _rotaPointsChanged() {
  if (!_massa || _massa.tab !== 'rota') return;
  var status = document.getElementById('rotaMapStatus');
  var clearBtn = document.getElementById('rotaBtnClear');
  var a = _massa.ra, b = _massa.rb;
  if (!_rotaHasCoords(a) || !_rotaHasCoords(b)) {
    if (status) status.textContent = (a && b)
      ? 'Um dos pontos não tem coordenadas — informe km/tempo manualmente.'
      : 'Selecione A e B (com coordenadas) para abrir o mapa.';
    _rotaDestroyMap();
    if (clearBtn) clearBtn.style.display = 'none';
    return;
  }
  var existing = _findRotaAjusteEntry(String(a.codigo), String(b.codigo));
  _rotaVias = existing ? _viasFromEntry(existing) : [];
  var motivoEl = document.getElementById('ra_motivo');
  if (motivoEl) motivoEl.value = existing ? (existing.entry.motivo || '') : '';
  _rotaInitMap();
  _rotaRoute();
}

function _rotaInitMap() {
  var el = document.getElementById('rotaMap'); if (!el || typeof L === 'undefined') return;
  _rotaDestroyMap();
  _rotaMap = L.map(el, { zoomControl: true, attributionControl: false });
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, crossOrigin: true }).addTo(_rotaMap);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', { subdomains: 'abcd', maxZoom: 19, opacity: 0.85, crossOrigin: true }).addTo(_rotaMap);
  setTimeout(function() { if (_rotaMap) _rotaMap.invalidateSize(); }, 80);
}

function _rotaDestroyMap() {
  if (_rotaMap) { try { _rotaMap.remove(); } catch (e) {} _rotaMap = null; }
  _rotaLine = null; _rotaLineHit = null; _rotaViaMarkers = []; _rotaABMarkers = [];
}

function _rotaWaypoints() {
  var wp = [];
  if (_rotaHasCoords(_massa.ra)) wp.push({ lat: +_massa.ra.lat, lng: +_massa.ra.lng });
  _rotaVias.forEach(function(v) { wp.push({ lat: v.lat, lng: v.lng }); });
  if (_rotaHasCoords(_massa.rb)) wp.push({ lat: +_massa.rb.lat, lng: +_massa.rb.lng });
  return wp;
}

function _rotaRoute() {
  if (!_rotaMap) return;
  var wp = _rotaWaypoints(); if (wp.length < 2) return;
  var status = document.getElementById('rotaMapStatus');
  if (status) status.textContent = 'Calculando rota…';
  var coords = wp.map(function(p) { return (+p.lng).toFixed(6) + ',' + (+p.lat).toFixed(6); }).join(';');
  var url = 'https://router.project-osrm.org/route/v1/driving/' + coords + '?overview=full&geometries=geojson&continue_straight=false';
  fetch(url).then(function(r) { return r.ok ? r.json() : Promise.reject('http'); })
    .then(function(data) {
      if (!data || data.code !== 'Ok' || !data.routes || !data.routes[0]) return Promise.reject('no-route');
      var route = data.routes[0];
      var km  = Math.round(route.distance / 100) / 10;
      var min = Math.round(route.duration / 60);
      var geom = (route.geometry && route.geometry.coordinates) ? route.geometry.coordinates.map(function(c) { return [c[1], c[0]]; }) : [];
      _rotaResult = { km: km, min: min, geom: geom };
      _rotaDrawRoute(geom, wp);
      var kmEl = document.getElementById('ra_km');    if (kmEl) kmEl.value = km;
      var tEl  = document.getElementById('ra_tempo'); if (tEl)  tEl.value = _hhmmFromMin(min);
      if (status) status.textContent = km + ' km · ' + _fmtMin(min) + (_rotaVias.length ? (' · ' + _rotaVias.length + ' desvio(s)') : ' · rota direta');
      var cb = document.getElementById('rotaBtnClear'); if (cb) cb.style.display = _rotaVias.length ? '' : 'none';
    })
    .catch(function() { if (status) status.textContent = 'Não consegui rotear (OSRM). Informe km/tempo manualmente.'; });
}

function _hhmmFromMin(min) { min = Math.round(min || 0); var h = Math.floor(min / 60), m = min % 60; return h + ':' + ('0' + m).slice(-2); }

function _rotaDrawRoute(geom, wp) {
  if (!_rotaMap) return;
  if (_rotaLine)    { _rotaMap.removeLayer(_rotaLine);    _rotaLine    = null; }
  if (_rotaLineHit) { _rotaMap.removeLayer(_rotaLineHit); _rotaLineHit = null; }
  _rotaLine = L.polyline(geom, { color: '#f47920', weight: 5, opacity: 0.9, interactive: false }).addTo(_rotaMap);
  // Camada invisível bem mais espessa por cima, só pra facilitar pegar a
  // linha com o mouse (5px de traço é fácil de errar e acaba arrastando o
  // mapa inteiro em vez do traçado — no estilo Google Maps).
  _rotaLineHit = L.polyline(geom, { color: '#000', weight: 22, opacity: 0 }).addTo(_rotaMap);
  _rotaLineHit.on('mousedown', _rotaLineDragStart);
  _rotaLineHit.on('mouseover', function() { if (_rotaMap) _rotaMap.getContainer().style.cursor = 'grab'; });
  _rotaLineHit.on('mouseout',  function() { if (_rotaMap) _rotaMap.getContainer().style.cursor = ''; });

  _rotaABMarkers.forEach(function(m) { _rotaMap.removeLayer(m); });
  _rotaABMarkers = [];
  var aLL = wp[0], bLL = wp[wp.length - 1];
  _rotaABMarkers.push(L.circleMarker([aLL.lat, aLL.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#22c55e', fillOpacity: 1 }).addTo(_rotaMap).bindTooltip('A', { permanent: false }));
  _rotaABMarkers.push(L.circleMarker([bLL.lat, bLL.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#ef4444', fillOpacity: 1 }).addTo(_rotaMap).bindTooltip('B', { permanent: false }));

  _rotaViaMarkers.forEach(function(m) { _rotaMap.removeLayer(m); });
  _rotaViaMarkers = [];
  _rotaVias.forEach(function(v, idx) {
    var mk = L.marker([v.lat, v.lng], { draggable: true, icon: _rotaViaIcon() }).addTo(_rotaMap);
    mk.bindTooltip('Arraste para ajustar · clique-direito remove', { direction: 'top' });
    mk.on('drag', function(e) { var ll = e.target.getLatLng(); _rotaVias[idx] = { lat: ll.lat, lng: ll.lng }; });
    mk.on('dragend', function() { _rotaSortVias(); _rotaRoute(); });
    mk.on('contextmenu', function() { _rotaVias.splice(idx, 1); _rotaRoute(); });
    _rotaViaMarkers.push(mk);
  });

  if (_rotaVias.length === 0) {
    try { _rotaMap.fitBounds(_rotaLine.getBounds(), { padding: [30, 30], maxZoom: 12 }); } catch (e) {}
  }
}

function _rotaViaIcon() {
  return L.divIcon({ className: '', iconSize: [16, 16], iconAnchor: [8, 8],
    html: '<div style="width:14px;height:14px;border-radius:50%;background:#7c3aed;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);"></div>' });
}

function _rotaAddVia(latlng) {
  _rotaVias.push({ lat: latlng.lat, lng: latlng.lng });
  _rotaSortVias();
  _rotaRoute();
}

// Arrastar o traçado (igual Google Maps): mousedown na linha cria um ponto
// de desvio ali mesmo e o segue durante o arraste (preview em linha reta,
// leve); ao soltar, refaz a rota real pelo OSRM.
function _rotaLineDragStart(e) {
  if (!_rotaMap) return;
  L.DomEvent.stopPropagation(e);
  _rotaMap.dragging.disable();

  var pt = { lat: e.latlng.lat, lng: e.latlng.lng };
  _rotaVias.push(pt);
  _rotaSortVias();
  _rotaDrawPreview();

  function onMove(ev) {
    pt.lat = ev.latlng.lat; pt.lng = ev.latlng.lng;
    _rotaSortVias();
    _rotaDrawPreview();
  }
  function onUp() {
    _rotaMap.off('mousemove', onMove);
    _rotaMap.off('mouseup', onUp);
    if (_rotaMap) _rotaMap.dragging.enable();
    _rotaSortVias();
    _rotaRoute();
  }
  _rotaMap.on('mousemove', onMove);
  _rotaMap.on('mouseup', onUp);
}

// Prévia leve (linha reta pelos waypoints) durante o arraste — sem chamar o
// OSRM a cada pixel. A rota real (seguindo a via) é buscada só ao soltar.
function _rotaDrawPreview() {
  if (!_rotaLine) return;
  var wp = _rotaWaypoints();
  var lls = wp.map(function(p) { return [p.lat, p.lng]; });
  _rotaLine.setLatLngs(lls);
  if (_rotaLineHit) _rotaLineHit.setLatLngs(lls);
}

// Ordena os vias pela projeção no eixo A→B (mantém a ordem ao longo do trecho).
function _rotaSortVias() {
  var a = _massa.ra, b = _massa.rb;
  if (!_rotaHasCoords(a) || !_rotaHasCoords(b)) return;
  var ax = +a.lng, ay = +a.lat, dx = (+b.lng) - ax, dy = (+b.lat) - ay, len2 = dx * dx + dy * dy || 1;
  _rotaVias.sort(function(p, q) {
    var tp = ((p.lng - ax) * dx + (p.lat - ay) * dy) / len2;
    var tq = ((q.lng - ax) * dx + (q.lat - ay) * dy) / len2;
    return tp - tq;
  });
}

function _rotaClearVias() { _rotaVias = []; _rotaRoute(); }

// ── Modal de confirmação in-app (substitui o confirm() do navegador) ──
// opts: { titulo, mensagem, okLabel, okLoadingLabel, danger, onOk }
// Ao confirmar, o botão entra em estado de carregando NA HORA e o modal
// permanece até a operação chamar appConfirmClose() (no sucesso/erro).
function appConfirm(opts) {
  opts = opts || {};
  var ex = document.getElementById('appConfirmOverlay'); if (ex) ex.remove();
  var msgHtml = esc(String(opts.mensagem || '')).replace(/\n/g, '<br>');
  var html =
    '<div id="appConfirmOverlay" class="appc-overlay">'
    + '<div class="appc-card">'
      + '<div class="appc-title">' + esc(opts.titulo || 'Confirmar') + '</div>'
      + '<div class="appc-msg">' + msgHtml + '</div>'
      + '<div class="appc-foot">'
        + '<button class="btn btn-ghost" id="appcCancel">Cancelar</button>'
        + '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-dark') + '" id="appcOk">' + esc(opts.okLabel || 'Confirmar') + '</button>'
      + '</div>'
    + '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  var ov = document.getElementById('appConfirmOverlay');
  var busy = false;

  function cleanup() { document.removeEventListener('keydown', onKey); if (ov && ov.parentNode) ov.remove(); }
  // Exposto para a operação fechar o modal quando terminar (sucesso ou erro).
  window._appConfirmCleanup = cleanup;

  function fechar() { if (busy) return; cleanup(); }

  function confirmar() {
    if (busy) return;
    busy = true;
    var okb = document.getElementById('appcOk');
    var cb  = document.getElementById('appcCancel');
    if (cb)  cb.disabled = true;
    if (okb) { okb.disabled = true; okb.innerHTML = '<span class="appc-spin"></span>' + esc(opts.okLoadingLabel || 'Aplicando…'); }
    if (opts.onOk) opts.onOk();
  }

  function onKey(e) {
    if (e.key === 'Escape') fechar();
    else if (e.key === 'Enter') confirmar();
  }

  document.getElementById('appcCancel').addEventListener('click', fechar);
  ov.addEventListener('click', function(e) { if (e.target === ov && !busy) fechar(); });
  document.getElementById('appcOk').addEventListener('click', confirmar);
  document.addEventListener('keydown', onKey);
  setTimeout(function() { var b = document.getElementById('appcOk'); if (b) b.focus(); }, 30);
}

// Fecha o modal de confirmação aberto (chamado pela operação ao terminar).
function appConfirmClose() { if (window._appConfirmCleanup) { window._appConfirmCleanup(); window._appConfirmCleanup = null; } }

// ── Análise em grupo (esquemas selecionados) ──────────────────
// Esquemas já analisados nesta sessão (para o "próximo grupo" avançar mesmo
// antes de o usuário marcar como ajustado).
var _analiseVistos = {};

function analisarSelecionados() {
  _executarAnaliseGrupo(_selectedEsqList());
}

// Próximos N esquemas disponíveis: com pontos, não-ajustados e ainda não
// analisados nesta sessão. Segue a ordem da aba ESQUEMAS.
function _proximosDisponiveis(n) {
  var out = _esqs.filter(function(e) {
    return e.temPontos && !_isAjustado(e) && !_analiseVistos[e.id_esquema];
  });
  return n ? out.slice(0, n) : out;
}

function analisarProximoGrupo() {
  var prox = _proximosDisponiveis(MAX_ANALISE_IA_GRUPO);
  if (prox.length < 2) {
    toast('Não há mais esquemas disponíveis para analisar (todos ajustados ou já vistos).', 'info');
    return;
  }
  _executarAnaliseGrupo(prox);
}

function _executarAnaliseGrupo(lista) {
  if (lista.length < 2) { toast('Selecione ao menos 2 esquemas para comparar.', 'error'); return; }
  if (lista.length > MAX_ANALISE_IA_GRUPO) {
    toast('A IA compara no máximo ' + MAX_ANALISE_IA_GRUPO + ' esquemas por vez. Reduza a seleção (você tem ' + lista.length + ').', 'error');
    return;
  }
  var ids = lista.map(function(e) { return e.id_esquema; });
  ids.forEach(function(id) { _analiseVistos[id] = true; });

  var ex = document.getElementById('analiseOverlay'); if (ex) ex.remove();
  var modal =
    '<div id="analiseOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;">'
    + '<div style="background:#fff;border-radius:12px;width:640px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,0.25);overflow:hidden;">'
      + '<div style="background:#1a1d23;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">'
        + '<div style="font-size:14px;font-weight:800;color:#fff;">Análise do grupo</div>'
        + '<button onclick="fecharAnalise()" style="background:none;border:none;color:#9aa0ad;cursor:pointer;padding:4px;display:flex;">' + ico('x', 16) + '</button>'
      + '</div>'
      + '<div style="padding:10px 22px 0;font-size:12px;color:#7a8299;flex-shrink:0;font-weight:600;">' + lista.length + ' esquemas selecionados</div>'
      + '<div id="analiseBody" style="padding:14px 22px;overflow-y:auto;flex:1;"></div>'
    + '</div></div>';
  document.body.insertAdjacentHTML('beforeend', modal);

function _renderAnaliseGrupo(r) {
  var b = document.getElementById('analiseBody'); if (!b || !r) return;

  // IA combinada (foco da análise em grupo)
  var iaHtml;
  if (!r.ia) iaHtml = '<div class="an-muted">IA não consultada.</div>';
  else if (r.ia.erro) iaHtml = '<div class="massa-msg error" style="margin:0;">IA indisponível: ' + esc(r.ia.erro) + '</div>';

    + (r.ia.model ? '<div class="an-muted" style="margin-top:8px;">via Groq · ' + esc(r.ia.model) + '</div>' : '');

  // Regras determinísticas por esquema (só mostra os que têm achados)
  var comRegras = (r.regras || []).filter(function(g) { return g.regras && g.regras.length; });
  var regrasHtml = comRegras.length
    ? comRegras.map(function(g) {

        var btn = '<button type="button" class="an-fix-btn" onclick="_abrirEsqNovaAba(\'' + esc(String(g.idEsquema)) + '\')" title="Abrir o esquema numa nova aba para ajustar nome, cód. de linha, horário e demais campos.">' + ico('external-link', 12) + 'Corrigir</button>';
        return '<div style="margin-top:10px;">'
          + '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;">'
          +   '<div style="font-size:12px;font-weight:700;color:#3a3f52;">#' + esc(g.idEsquema) + ' — ' + esc(g.nomeLinha || '') + '</div>'
          +   '<div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">' + _ajustToggleBtn(g.idEsquema) + btn + '</div>'
          + '</div>' + itens + '</div>';

  var flat = [];

  // Avançar para o próximo grupo de disponíveis (não-ajustados e não-vistos).

    : '<div class="an-ok" style="margin-top:14px;">' + ico('check', 14) + ' Todos os esquemas disponíveis já foram analisados ou ajustados.</div>';

  b.innerHTML = _gravidadeResumo(flat)

// Resumo de gravidade dos achados (média ponderada: Alto=3, Médio=2, Baixo=1).
// 100% = todos os achados são Alto; ~33% = todos Baixo. Recebe a lista plana de
// achados ({nivel}). Retorna '' quando não há nenhum.
function _gravidadeResumo(itens) {
  var peso = { alto: 3, medio: 2, baixo: 1 };
  var c = { alto: 0, medio: 0, baixo: 0 };
  (itens || []).forEach(function(x) { if (c[x.nivel] !== undefined) c[x.nivel]++; });
  var total = c.alto + c.medio + c.baixo;
  if (!total) return '';
  var soma = c.alto * peso.alto + c.medio * peso.medio + c.baixo * peso.baixo;
  var pct  = Math.round((soma / (total * 3)) * 100);
  var cor  = pct >= 67 ? '#c62828' : (pct >= 34 ? '#c47f17' : '#2e7d32');
  var partes = [];
  if (c.alto)  partes.push(c.alto + ' alto');
  if (c.medio) partes.push(c.medio + ' médio');
  if (c.baixo) partes.push(c.baixo + ' baixo');
  return '<div class="an-grav">'
    + '<div class="an-grav-top"><span>Gravidade dos erros</span><strong style="color:' + cor + ';">' + pct + '%</strong></div>'
    + '<div class="an-grav-bar"><span style="width:' + pct + '%;background:' + cor + ';"></span></div>'
    + '<div class="an-grav-meta">' + total + ' achado' + (total > 1 ? 's' : '') + ' · ' + partes.join(' · ') + '</div>'
    + '</div>';
}

// Transforma referências "#N" (N = id de esquema existente) em links que abrem
// o esquema numa nova aba. Ignora "#N" que não corresponda a nenhum esquema.
function _linkifyEsq(html) {
  return html.replace(/#(\d+)\b/g, function(m, id) {
    var existe = _esqs && _esqs.some(function(e) { return String(e.id_esquema) === id; });
    if (!existe) return m;
    return '<a class="an-esqlink" onclick="_abrirEsqNovaAba(\'' + id + '\')" title="Abrir o esquema #' + id + ' numa nova aba para ajustar.">#' + id + '</a>';
  });
}

// Markdown leve: **negrito**, bullets (-, *, •), links de esquema e quebras de linha.
function _mdLite(s) {
  var t = _linkifyEsq(esc(String(s || '')).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'));
  return t.split('\n').map(function(l) {
    var x = l.trim();
    if (/^[-*•]\s+/.test(x)) return '<div class="an-bullet">' + x.replace(/^[-*•]\s+/, '') + '</div>';
    return x ? '<div>' + x + '</div>' : '<div style="height:6px;"></div>';
  }).join('');
}

function _processLote(esqList, pontosByEsq, cacheMap) {
  if (typeof PDFLib === 'undefined' || typeof JSZip === 'undefined') {
    doneLoading(); toast('Bibliotecas de PDF não carregaram. Recarregue a página.', 'error'); return;
  }
  // Monta o HTML de cada esquema no cliente (toda a lógica de cálculo continua
  // aqui). O servidor converte HTML → PDF (sem rodapé) e o cliente carimba o
  // rodapé em todas as páginas via pdf-lib e monta o zip.
  var snap  = _snapshotEsqState();
  var items = [], fail = 0;

  esqList.forEach(function(e) {
    var pts = pontosByEsq[e.id_esquema] || [];
    if (!pts.length) { fail++; return; }
    try {
      _setupEsqStateLote(e, pts);
      _pdfTitle = ''; _pdfSubtitle = '';
      _restoreHorConfig(e);
      _osrmLegs   = _legsFromCacheMap(cacheMap);
      _osrmStatus = (_osrmLegs && _osrmLegs.some(function(l) { return l; })) ? 'cache' : 'unavailable';
      var html = imprimirHorario(true, true);
      if (!html) { fail++; return; }
      items.push({ name: _loteFilename(e), html: html });
    } catch (err) { fail++; }
  });

  _restoreEsqState(snap);

  if (!items.length) { doneLoading(); toast('Nenhum PDF foi gerado.', 'error'); return; }

  loading('Gerando ' + items.length + ' PDFs no servidor…');
  google.script.run
    .withSuccessHandler(function(lista) {
      if (!lista || !lista.length) { doneLoading(); toast('O servidor não retornou os PDFs.', 'error'); return; }
      loading('Aplicando rodapé…');
      _finalizarLotePdfs(lista, fail).catch(function(err) {
        doneLoading(); toast('Erro ao finalizar os PDFs: ' + (err && err.message ? err.message : err), 'error');
      });
    })
    .withFailureHandler(function(e) {
      doneLoading();
      toast('Erro ao gerar PDFs: ' + (e && e.message ? e.message : e), 'error');
    })
    .gerarPdfsEsquemas(items);
}

// Carimba o rodapé em todas as páginas de cada PDF (pdf-lib) e monta o zip.
function _finalizarLotePdfs(lista, fail) {
  var zip = new JSZip();
  var genStr = new Date().toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  var i = 0;
  function passo() {
    if (i >= lista.length) {
      return zip.generateAsync({ type: 'blob' }).then(function(blob) {
        doneLoading();
        _baixarBlob(blob, 'esquemas_pdfs.zip');
        toast(lista.length + ' PDFs gerados' + (fail ? (' · ' + fail + ' sem pontos') : ''), 'success', 4500);
      });
    }
    loading('Aplicando rodapé… (' + (i + 1) + '/' + lista.length + ')');
    return _carimbarRodape(_base64ToBytes(lista[i].b64), genStr).then(function(bytes) {
      zip.file(lista[i].name, bytes);
      i++;
      return passo();
    });
  }
  return passo();
}

// Desenha empresa/CNPJ à esquerda e Pág. X/Y · data à direita, no pé de cada página.
function _carimbarRodape(bytes, genStr) {
  return PDFLib.PDFDocument.load(bytes).then(function(doc) {
    return Promise.all([
      doc.embedFont(PDFLib.StandardFonts.Helvetica),
      doc.embedFont(PDFLib.StandardFonts.HelveticaBold)
    ]).then(function(fonts) {
      var font = fonts[0], bold = fonts[1];
      var pages  = doc.getPages();
      var orange = PDFLib.rgb(0.957, 0.475, 0.125);
      var dark   = PDFLib.rgb(0.102, 0.114, 0.137);
      var gray   = PDFLib.rgb(0.533, 0.533, 0.533);
      var M = 34, sz = 7, comp = 'KANDANGO TRANSPORTE E TURISMO LTDA';
      var compW = bold.widthOfTextAtSize(comp, sz);
      pages.forEach(function(page, idx) {
        var w = page.getWidth();
        page.drawLine({ start: { x: M, y: 30 }, end: { x: w - M, y: 30 }, thickness: 1.4, color: orange });
        page.drawText(comp, { x: M, y: 16, size: sz, font: bold, color: dark });
        page.drawText(' · CNPJ: 03.233.439/0001-52', { x: M + compW, y: 16, size: sz, font: font, color: gray });
        var right = 'Pág. ' + (idx + 1) + ' / ' + pages.length + '   ·   Gerado em ' + genStr;
        var rW = font.widthOfTextAtSize(right, sz);
        page.drawText(right, { x: w - M - rW, y: 16, size: sz, font: font, color: gray });
      });
      return doc.save();
    });
  });
}

function _base64ToBytes(b64) {
  var bin   = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function _setupEsqStateLote(e, pts) {
  _sel = e;
  _seq = pts.map(function(p) {
    var l = _lMap[String(p.idPonto)] || {};
    return { idPonto: p.idPonto, nomePonto: p.nomePonto, tipo: p.tipo || '', lat: l.lat || null, lng: l.lng || null, isNew: false };
  });
  _comercialTimes = {};
  pts.forEach(function(p) { var t = _normalizeHHMM(p.horarioComercial); if (t) _comercialTimes[p.idPonto] = t; });
  _tiposParada = {};
  pts.forEach(function(p) { _tiposParada[p.idPonto] = { troca: !!p.troca, abastecimento: !!p.abastecimento, alimentacao: !!p.alimentacao }; });
  _customStopTimes = {};  // tempo_local não é mais fallback (aba → 30 min fixo)
  _legVia = {}; _legVelPers = {};
  pts.forEach(function(p) { _setLegViaRaw(p.idPonto, p.tipoTrecho); });
  _horStartIdx  = 0;
  _osrmGeometry = null;
}

function _legsFromCacheMap(cacheMap) {
  var pts = _seq.filter(function(p) { return p.lat && p.lng; });
  if (pts.length < 2) return null;
  function nk(a, b) { return a <= b ? a + ':' + b : b + ':' + a; }
  return pts.slice(0, -1).map(function(pt, i) {
    var ent = cacheMap[nk(pt.idPonto, pts[i + 1].idPonto)];
    var km  = ent && ent.km > 0 ? ent.km : 0;
    if (km > 0 && ent.tipoVia && !_legVia[pt.idPonto]) _legVia[pt.idPonto] = ent.tipoVia;
    return km > 0 ? { distKm: km, durationMin: 0 } : null;
  });
}

function _snapshotEsqState() {
  return {
    sel: _sel, seq: _seq, com: _comercialTimes, tp: _tiposParada, cst: _customStopTimes, lv: _legVia, lvp: _legVelPers,
    hsi: _horStartIdx, legs: _osrmLegs, st: _osrmStatus, geo: _osrmGeometry,
    partida: (document.getElementById('horHoraPartida') || {}).value,
    vel:     (document.getElementById('horVelMedia')   || {}).value
  };
}
function _restoreEsqState(s) {
  _sel = s.sel; _seq = s.seq; _comercialTimes = s.com; _tiposParada = s.tp || {}; _customStopTimes = s.cst; _legVia = s.lv; _legVelPers = s.lvp || {};
  _horStartIdx = s.hsi; _osrmLegs = s.legs; _osrmStatus = s.st; _osrmGeometry = s.geo;
  var hp = document.getElementById('horHoraPartida'); if (hp && s.partida != null) hp.value = s.partida;
  var hv = document.getElementById('horVelMedia');    if (hv && s.vel != null)     hv.value = s.vel;
}

// Sufixo "(COD_LINHA)" — só quando há código e ele ainda não está embutido no
// nome da linha (evita duplicar, ex.: "NATAL X SP (RNSP...) (RNSP...)").
function _codLinhaSuffix(nomeLinha, codLinha) {
  var cod = String(codLinha || '').trim();
  if (!cod) return '';
  if (String(nomeLinha || '').toUpperCase().indexOf(cod.toUpperCase()) !== -1) return '';
  return ' (' + cod + ')';
}

// Hora padronizada para o título: "HHhMM" (zero à esquerda). Aceita "21:00",
// "9:00", "21h00", "21:00:00". Retorna '' quando não há hora válida.
function _horaTitulo(h) {
  var m = String(h || '').match(/(\d{1,2})[:hH](\d{2})/);
  return m ? ('0' + m[1]).slice(-2) + 'h' + m[2] : '';
}

// Sentido com capitalização consistente: "VOLTA"/"volta" → "Volta".
function _sentidoTitulo(s) {
  s = String(s || '').trim();
  return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : '';
}

// Título padrão do esquema: "08h00 - NOME DA LINHA (COD_LINHA) (Sentido)".
// Usado tanto no título do PDF quanto no nome do arquivo.
function _tituloPadraoEsquema(e) {
  var hor  = _horaTitulo(e.horario);
  var nome = String(e.nome_linha || ('Esquema ' + e.id_esquema)).replace(/\s+/g, ' ').trim();
  var cod  = _codLinhaSuffix(e.nome_linha, e.cod_linha);
  var sent = _sentidoTitulo(e.sentido);
  return (hor ? hor + ' - ' : '') + nome + cod + (sent ? ' (' + sent + ')' : '');
}

function _loteFilename(e) {
  var base = _tituloPadraoEsquema(e).replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ').trim();
  return (base || ('esquema_' + e.id_esquema)) + '.pdf';
}

// Código da linha em texto curto (ou '' se ausente).
function _codLinhaTxt(e) {
  return e && e.cod_linha ? String(e.cod_linha).trim() : '';
}
// Badge HTML do código da linha para listas, cards e cabeçalhos (ou '' se ausente).
function _codLinhaBadge(e) {
  var c = _codLinhaTxt(e);
  return c ? '<span class="cod-linha-badge">' + esc(c) + '</span>' : '';
}

function _baixarBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}

// ── Viagem de Volta ──────────────────────────────────────────
function iniciarViagemVolta() {
  if (!_sel) { toast('Nenhum esquema selecionado.', 'error'); return; }
  if (!_seq.length) { toast('Adicione pontos antes de criar a viagem de volta.', 'info'); return; }

  // Guarda snapshot do estado atual (sem horários comerciais — usuário preencherá na volta)
  _voltaSnapshot = {
    seq:             _seq.map(function(p){ return Object.assign({}, p); }),
    legVia:          Object.assign({}, _legVia),
    legVelPers:      Object.assign({}, _legVelPers),
    customStopTimes: Object.assign({}, _customStopTimes)
  };
  _voltaMode = true;
  _isNovo    = true;  // força caminho de criação em salvarEsquema()

  // Pré-preenche o modal
  var sentAtual = _sel.sentido || 'Ida';

  document.getElementById('fCod').value   = _codLinhaTxt(_sel);

  document.getElementById('fSent').value  = sentVolta;

  document.getElementById('esqBadge').style.display  = 'none';
  document.getElementById('esqForm').style.display   = '';
  document.getElementById('btnSalvEsq').textContent  = 'Criar Viagem de Volta';
  document.getElementById('btnAjustado').style.display = 'none';
  document.getElementById('btnNovo').style.display   = 'none'; // oculta durante o fluxo
  document.getElementById('btnFecharModalEsq').style.display = '';
  abrirModalEsquema();
}

/**
 * Após criar o novo esquema, inverte a sequência do snapshot e salva via
 * salvarSequenciaPontos, preservando tipos de trecho e tempos locais.
 * Horários comerciais são omitidos (usuário preencherá na nova rota).
 */
function _aplicarVoltaESpelhar(novoEsq, snapshot) {
  loading('Espelhando sequência…');

  var orig    = snapshot.seq;              // [A, B, C, …, Z]
  var reversed = orig.slice().reverse();   // [Z, …, C, B, A]

  // Mapeia tipo de trecho para a rota inversa:
  // Trecho X→Y (orig) = mesmo trecho físico Y→X (volta), tipo = snapshot.legVia[X]
  // Logo: voltaLegVia[Y] = snapshot.legVia[X]  (onde Y vem após X na original)
  // Serializa o tipo do trecho preservando a velocidade dos trechos personalizados
  function _viaSerial(idPt) {
    var v = snapshot.legVia[idPt];
    if (!v) return '';
    if (v === 'Pers') { var vel = (snapshot.legVelPers || {})[idPt]; return vel > 0 ? 'Pers:' + vel : ''; }
    return v;
  }
  var voltaLegVia = {};
  for (var i = 0; i < orig.length - 1; i++) {
    voltaLegVia[orig[i + 1].idPonto] = _viaSerial(orig[i].idPonto) || 'BR';
  }

  var payload = reversed.map(function(p) {
    return {
      idPonto:         p.idPonto,
      nomePonto:       p.nomePonto,
      tipo:            p.tipo || '',
      horarioComercial: '',
      tempoLocal:      snapshot.customStopTimes[p.idPonto] != null
                         ? snapshot.customStopTimes[p.idPonto] : '',
      tipoTrecho:      voltaLegVia[p.idPonto] || _viaSerial(p.idPonto) || ''
    };
  });

  google.script.run
    .withSuccessHandler(function() {
      selecionarEsq(novoEsq);
      toast('Viagem de volta criada — ' + reversed.length + ' pontos espelhados!', 'success');
    })
    .withFailureHandler(function(e) {
      doneLoading();
      toast('Esquema criado, mas erro ao salvar pontos: ' + (e.message || e), 'error');
      selecionarEsq(novoEsq); // abre mesmo assim
    })
    .salvarSequenciaPontos(novoEsq.id_esquema, payload);
}
