      + '<td style="text-align:center;">' + tpCel + '</td>'
      + '<td style="text-align:center;font-weight:600;">' + saidStr + '</td>'
      + '<td class="hor-via-td">' + tvCel + '</td>'
      + '<td style="text-align:center;">' + comCell + '</td>'
      + '<td id="horDelta' + i + '" style="text-align:center;">' + deltaCell + '</td>'
      + '</tr>';
  }).join('');

  var table = '<div class="hor-table-wrap"><table class="hor-table" style="min-width:560px;">'
    + '<thead><tr>'
    + '<th>Cidade</th>'
    + '<th style="text-align:center;">Chegada</th>'
    + '<th style="text-align:center;">Parada</th>'
    + '<th style="text-align:center;">Saída</th>'
    + '<th style="text-align:right;" title="Tempo até o próximo ponto — passe o mouse para configurar o tipo de via do trecho">Temp. Desl. ' + ico('arrow-down',11) + '</th>'
    + '<th style="text-align:center;">Comercial</th>'
    + '<th style="text-align:center;" title="Diferença: Comercial − Calculado (+folga / −estouro)">Dif.</th>'
    + '</tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table></div>';

  var main = '<div class="hor-main">' + stats + table + _buildComAnalysis(c) + '</div>';
  var _prevMain = body.querySelector('.hor-main');
  var _savedScroll = _prevMain ? _prevMain.scrollTop : 0;
  body.innerHTML = sidebar + main;
  requestAnimationFrame(function() {
    var nm = body.querySelector('.hor-main');
    var focusIdx = _pendingSelectIdx !== null ? _pendingSelectIdx : _activeHorRow;
    if (focusIdx !== null) {
      if (_pendingSelectIdx !== null) _pendingSelectIdx = null;
      selectHorRow(focusIdx);
      var targetRow = document.getElementById('horRow' + focusIdx);
      if (nm && targetRow) {
        var nmRect  = nm.getBoundingClientRect();
        var rowRect = targetRow.getBoundingClientRect();
        var offset  = nm.scrollTop + rowRect.top - nmRect.top
                    - Math.floor((nm.clientHeight - rowRect.height) / 2);
        nm.scrollTop = Math.max(0, offset);
      }
    } else if (nm && _savedScroll > 0) {
      nm.scrollTop = _savedScroll;
    }
  });
}

// ============================================================
//  Operação no ponto — Troca de motorista / Abastecimento / Alimentação
//  Embarque/Desemb. é implícito (qualquer ponto com horário comercial);
//  só estas 3 tags são marcadas manualmente aqui.
// ============================================================
var _TIPO_PARADA_DEFS = [
  { key: 'troca',         icon: 'user-swap', color: '#2563EB', label: 'Troca de motorista' },
  { key: 'abastecimento', icon: 'fuel',     color: '#16A34A', label: 'Abastecimento' },
  { key: 'alimentacao',   icon: 'utensils', color: '#CA8A04', label: 'Alimentação' }
];

function _tiposParadaBtnsHtml(i) {
  var idPonto = _seq[i].idPonto;
  var flags   = _tiposParada[idPonto] || {};
  return _TIPO_PARADA_DEFS.map(function(def) {
    var active = !!flags[def.key];
    var style = 'display:inline-flex;align-items:center;justify-content:center;'
      + 'width:28px;height:28px;border-radius:7px;cursor:pointer;line-height:1;'

          ? 'background:' + def.color + ';border:1px solid ' + def.color + ';color:#fff;opacity:1;'

    return '<button type="button" title="' + esc(def.label) + (active ? ' (marcado)' : '') + '" '
      + 'onclick="event.stopPropagation();toggleTipoParada(' + i + ',\'' + def.key + '\')" '
      + 'style="' + style + '">' + ico(def.icon, 15) + '</button>';

function _tiposParadaCellHtml(i) {
  return '<span id="tpBadges' + i + '" style="display:inline-flex;align-items:center;gap:6px;vertical-align:middle;margin-left:14px;padding-left:14px;border-left:1px solid #e2e5eb;">'
    + _tiposParadaBtnsHtml(i) + '</span>';
}

// Monta o <select> de tempo de parada — compartilhado entre o render inicial
// da linha e a atualização parcial depois de mudar uma tag de operação.
function _tpSelectHtml(i, tp) {
  var tpVals = [2,5,10,15,20,30,40,45,50,60,75,90];
  var tpMatch = tpVals.indexOf(tp) !== -1 ? tp : null;
  var tpOpts = (tpMatch === null ? '<option value="' + tp + '" selected>' + _hhmm(tp) + '</option>' : '')
    + tpVals.map(function(v){
        return '<option value="' + v + '"' + (tp === v ? ' selected' : '') + '>' + _hhmm(v) + '</option>';
      }).join('');
  return '<select class="hor-tp-input" onchange="onStopTimeChange(' + i + ',this.value)">' + tpOpts + '</select>';
}

function toggleTipoParada(idx, tag) {
  var idPonto = _seq[idx].idPonto;
  var flags = _tiposParada[idPonto] || (_tiposParada[idPonto] = {});
  // Acumulável: um ponto pode ser Troca + Alimentação ao mesmo tempo, etc.
  flags[tag] = !flags[tag];
  _markDirty();

  var wrap = document.getElementById('tpBadges' + idx);
  if (wrap) wrap.innerHTML = _tiposParadaBtnsHtml(idx);

  // Recalcula o horário (o tempo de parada deste ponto mudou com a tag) e
  // atualiza o select de "Parada" da linha — só quando não há edição manual
  // guardada na sessão, que sempre tem prioridade sobre o cálculo automático.
  _partialUpdateSchedule();
  if (_customStopTimes[idPonto] === undefined && _lastCalc && _lastCalc.pontos[idx]) {
    var row = document.getElementById('horRow' + idx);
    var tds = row ? row.querySelectorAll('td') : null;
    if (tds && tds[2]) tds[2].innerHTML = _tpSelectHtml(idx, _lastCalc.pontos[idx].tp);
  }
}

// ============================================================
//  Análise comparativa OSM vs. Horário Comercial por trecho
// ============================================================
function _buildComAnalysis(c) {
  var segs = [];
  for (var i = 1; i < c.pontos.length; i++) {
    var p     = c.pontos[i];
    var pPrev = c.pontos[i - 1];
    if (p.preDep || pPrev.preDep || !p.hasCoords) continue;
    var comVal  = _comercialTimes[_seq[i].idPonto]     || '';
    var comPrev = _comercialTimes[_seq[i - 1].idPonto] || '';
    if (!comVal || !comPrev) continue;

    var comSeg = _p(comVal) - _p(comPrev);
    if (comSeg < 0) comSeg += 1440;
    segs.push({
      from:   pPrev.nomePonto,
      to:     p.nomePonto,
      osrm:   p.tv,
      com:    comSeg,
      diff:   comSeg - p.tv,
      isOsrm: p.distSource === 'osrm'
    });
  }
  if (segs.length === 0) return '';

  var totalOsrm = 0, totalCom = 0;
  segs.forEach(function(s) { totalOsrm += s.osrm; totalCom += s.com; });
  var totalDiff = totalCom - totalOsrm;

  var rows = segs.map(function(s) {
    var abs = Math.abs(s.diff);
    var cls = s.diff > 2 ? 'delta-ok' : s.diff < -2 ? 'delta-late' : 'delta-warn';
    var sgn = s.diff > 2 ? '+' : s.diff < -2 ? '−' : '≈';
    var osrmStr = _hhmm(s.osrm) + (s.isOsrm ? '' : '<span style="color:#ccc;font-size:9px;"> ~</span>');
    return '<tr>'
      + '<td>' + esc(s.from) + '</td>'
      + '<td>' + esc(s.to)   + '</td>'
      + '<td style="text-align:center;">' + osrmStr + '</td>'
      + '<td style="text-align:center;">' + _hhmm(s.com) + '</td>'
      + '<td style="text-align:center;"><span class="' + cls + '">'
        + sgn + (abs > 1 ? _dur(abs) : '') + '</span></td>'
      + '</tr>';
  }).join('');

  var tAbs = Math.abs(totalDiff);
  var tCls = totalDiff > 5 ? 'delta-ok' : totalDiff < -5 ? 'delta-late' : 'delta-warn';
  var tSgn = totalDiff > 0 ? '+' : totalDiff < 0 ? '−' : '≈';

  return '<div class="hor-osm-analysis" id="horOsmWrap"' + (_horOsmHidden ? ' style="display:none;"' : '') + '>'
    + '<div class="hor-osm-title">' + ico('bar-chart',13) + ' OSM vs. Comercial — Comparativo por trecho'
    + '<button class="hor-panel-close" onclick="toggleHorOsm()" title="Ocultar">×</button>'
    + '</div>'
    + '<div class="hor-osm-legend">'
    + '<span class="delta-ok">+ folga</span> = comercial concede mais tempo que o OSM &nbsp;·&nbsp; '
    + '<span class="delta-late">− estouro</span> = comercial exige mais que o OSM permite'
    + '</div>'
    + '<table class="hor-table" style="min-width:480px;">'
    + '<thead><tr><th>De</th><th>Até</th>'
    + '<th style="text-align:center;">OSM</th>'
    + '<th style="text-align:center;">Comercial</th>'
    + '<th style="text-align:center;" title="Comercial − OSM">Dif.</th>'
    + '</tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '<tfoot><tr>'
    + '<td colspan="2" style="font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:#7a8299;">Total</td>'
    + '<td style="text-align:center;font-weight:700;">' + _hhmm(totalOsrm) + '</td>'
    + '<td style="text-align:center;font-weight:700;">' + _hhmm(totalCom)  + '</td>'
    + '<td style="text-align:center;"><span class="' + tCls + '" style="font-size:12px;">'
      + tSgn + (tAbs > 1 ? _dur(tAbs) : '') + '</span></td>'
    + '</tr></tfoot>'
    + '</table></div>';
}

// ============================================================
//  Célula Temp. Desl. com seletor de via por trecho
// ============================================================
var _LEG_LABEL = { BR:'Rodovia federal', Est:'Estadual', Mun:'Municipal', Urb:'Urbana', Pers:'Personalizado — velocidade própria deste trecho' };

function _buildLegViaCell(i, c) {
  var isLast = (i >= c.pontos.length - 1);
  var next   = isLast ? null : c.pontos[i + 1];

  if (!next || next.preDep || !next.hasCoords) {
    return '<span style="color:#ccc;">—</span>';
  }

  var isApprox = (next.distSource !== 'osrm');
  var distStr  = next.dist > 0
    ? (isApprox ? '~' : '') + next.dist.toFixed(1) + ' km'
    : '';
  var approxMark = isApprox
    ? '<span style="color:#bbb;font-size:9px;" title="Sem dados de rota — tempo mínimo aplicado"> ~</span>'
    : '';

  // Recalcular: refaz a consulta de rota só deste trecho (ignorando o cache
  // de DISTANCIAS), pra conferir contra outra fonte (ex.: Google Maps).
  var recalcBtn = (next.dist > 0)
    ? '<button type="button" class="hor-via-recalc-btn" onclick="event.stopPropagation();_recalcularTrechoKm(' + i + ')" title="Recalcular esta distância (confere contra o cache salvo)">' + ico('refresh', 9) + '</button>'
    : '';

  var tvHtml = '<span class="hor-via-time">' + _hhmm(next.tv) + approxMark + '</span>'
    + (distStr ? '<span class="hor-via-dist">' + distStr + recalcBtn + '</span>' : '');

  var idPt   = _seq[i].idPonto;
  var viaKey = _legVia[idPt];
  var persV  = _legVelPers[idPt];
  var badgeTxt = (viaKey === 'Pers') ? ((persV > 0 ? persV : '?') + '') : viaKey;
  var badgeTit = (viaKey === 'Pers' && persV > 0) ? 'Personalizado — ' + persV + ' km/h' : (_LEG_LABEL[viaKey] || '');
  var badge  = viaKey
    ? '<span class="hor-via-badge" data-via="' + viaKey + '" title="' + badgeTit + '">' + badgeTxt + '</span>'
    : '';

  var btns = ['BR','Est','Mun','Urb','Pers'].map(function(t) {
    return '<button class="hor-via-btn' + (viaKey === t ? ' active' : '') + '" '
      + 'data-via="' + t + '" '
      + 'onclick="setLegVia(' + i + ',\'' + t + '\',event)" '
      + 'title="' + _LEG_LABEL[t] + '">' + t + '</button>';
  }).join('');

  // Campo inline de km/h — visível só quando o trecho é personalizado
  var persInput = '<span class="hor-via-pers' + (viaKey === 'Pers' ? ' show' : '') + '">'
    + '<input class="hor-via-pers-input" type="number" min="1" max="200" step="1" '
    + 'value="' + (persV > 0 ? persV : '') + '" placeholder="km/h" '
    + 'onclick="event.stopPropagation();" '
    + 'onfocus="_pinPersEdit(' + i + ')" '
    + 'onkeydown="_persInputKey(' + i + ',event)" '
    + 'onblur="_commitPersVel(' + i + ',this.value,event)">'
    + '<span class="hor-via-pers-unit">km/h</span>'
    + '</span>';

  return '<div class="hor-via-wrap">'
    + tvHtml + badge
    + '<div class="hor-via-overlay">' + btns + persInput + '</div>'
    + '</div>';
}

// ── Recalcular distância de um trecho (confere contra o cache salvo) ─────
// A distância exibida normalmente vem do cache persistente (aba DISTANCIAS) —
// que só é atualizado para pares NOVOS, nunca sobrescrito depois. Se a via
// mudou, o ponto foi recadastrado, ou o valor salvo está simplesmente errado,
// o cache pode ficar desatualizado. Este botão refaz a consulta de rota só
// deste trecho (direto na API, sem cache) e deixa o usuário decidir se
// atualiza o valor salvo.
function _recalcularTrechoKm(i) {
  var A = _seq[i], B = _seq[i + 1];
  if (!A || !B || !A.lat || !A.lng || !B.lat || !B.lng) { toast('Pontos sem coordenadas para recalcular.', 'error'); return; }

  var coords = (+A.lng).toFixed(6) + ',' + (+A.lat).toFixed(6) + ';' + (+B.lng).toFixed(6) + ',' + (+B.lat).toFixed(6);
  var url = 'https://router.project-osrm.org/route/v1/driving/' + coords + '?overview=false&annotations=false';

  loading('Recalculando distância do trecho…');
  fetch(url)
    .then(function(r) { return r.ok ? r.json() : Promise.reject('http'); })
    .then(function(data) {
      doneLoading();
      if (!data || data.code !== 'Ok' || !data.routes || !data.routes[0]) { toast('Rota indisponível no momento — tente de novo em instantes.', 'error'); return; }
      var kmNovo  = Math.round(data.routes[0].distance / 100) / 10;
      var kmAtual = (_lastCalc && _lastCalc.pontos[i + 1]) ? _lastCalc.pontos[i + 1].dist : null;
      _abrirModalRecalcKm(A, B, kmAtual, kmNovo);
    })
    .catch(function() { doneLoading(); toast('Erro ao recalcular: rota indisponível no momento.', 'error'); });
}

function _abrirModalRecalcKm(A, B, kmAtual, kmNovo) {
  var ex = document.getElementById('recalcKmOverlay');
  if (ex) ex.remove();

  var diffKm  = (kmAtual != null) ? Math.round((kmNovo - kmAtual) * 10) / 10 : null;
  var diffPct = (kmAtual != null && kmAtual > 0) ? Math.round((diffKm / kmAtual) * 1000) / 10 : null;
  var diffTxt = diffKm !== null
    ? '<div style="font-size:12px;color:#5a6070;margin-top:8px;">Diferença: <strong>' + (diffKm >= 0 ? '+' : '') + diffKm.toFixed(1).replace('.', ',') + ' km</strong>'
        + (diffPct !== null ? ' (' + (diffPct >= 0 ? '+' : '') + diffPct.toFixed(1).replace('.', ',') + '%)' : '') + '</div>'
    : '';

  var modal =
    '<div id="recalcKmOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;">'
    + '<div style="background:#fff;border-radius:12px;width:380px;max-width:92vw;box-shadow:0 8px 40px rgba(0,0,0,0.25);overflow:hidden;">'
      + '<div style="background:#1a1d23;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;">'
        + '<div style="font-size:14px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px;">' + ico('refresh', 15) + ' Recalcular distância</div>'
        + '<button onclick="_fecharModalRecalcKm()" style="background:none;border:none;color:#9aa0ad;cursor:pointer;padding:4px;display:flex;">' + ico('x', 15) + '</button>'
      + '</div>'
      + '<div style="padding:18px 20px;">'
        + '<div style="font-size:12px;color:#9aa0ad;margin-bottom:10px;">' + esc(A.nomePonto || '') + ' &rarr; ' + esc(B.nomePonto || '') + '</div>'
        + '<div style="display:flex;gap:14px;">'
        +   '<div style="flex:1;background:#f7f8fb;border-radius:8px;padding:10px;text-align:center;">'
        +     '<div style="font-size:10px;font-weight:700;color:#9aa0ad;text-transform:uppercase;margin-bottom:3px;">Salvo (cache)</div>'
        +     '<div style="font-size:17px;font-weight:800;color:#1a1d23;">' + (kmAtual != null ? kmAtual.toFixed(1).replace('.', ',') : '—') + ' km</div>'
        +   '</div>'
        +   '<div style="flex:1;background:#fff8f0;border-radius:8px;padding:10px;text-align:center;">'
        +     '<div style="font-size:10px;font-weight:700;color:#f47920;text-transform:uppercase;margin-bottom:3px;">Recalculado agora</div>'
        +     '<div style="font-size:17px;font-weight:800;color:#f47920;">' + kmNovo.toFixed(1).replace('.', ',') + ' km</div>'
        +   '</div>'
        + '</div>'
        + diffTxt
        + '<p style="font-size:11.5px;color:#9aa0ad;margin:12px 0 0;line-height:1.5;">Ambos os valores vêm do mesmo motor de rota (OSRM/OpenStreetMap) — divergências grandes de outras fontes (ex.: Google Maps) costumam ser diferença de trajeto escolhido, não erro. Atualize só se tiver certeza de que este valor está mais correto.</p>'
      + '</div>'
      + '<div style="padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid #eef0f6;">'
        + '<button onclick="_fecharModalRecalcKm()" style="padding:8px 16px;border:1px solid #d4d8e8;border-radius:6px;background:#fff;font-size:12px;cursor:pointer;color:#5a6070;">Cancelar</button>'
        + '<button onclick="_confirmarAtualizarKm(\'' + esc(A.idPonto) + '\',\'' + esc(B.idPonto) + '\',' + kmNovo + ')" style="padding:8px 18px;border:none;border-radius:6px;background:#f47920;color:#fff;font-size:12px;font-weight:700;cursor:pointer;">Atualizar cache</button>'
      + '</div>'
    + '</div></div>';
  document.body.insertAdjacentHTML('beforeend', modal);
  document.getElementById('recalcKmOverlay').addEventListener('click', function(e) { if (e.target === this) _fecharModalRecalcKm(); });
}

function _fecharModalRecalcKm() {
  var m = document.getElementById('recalcKmOverlay');
  if (m) m.remove();
}

function _confirmarAtualizarKm(idA, idB, kmNovo) {
  loading('Atualizando cache…');
  google.script.run
    .withSuccessHandler(function(res) {
      doneLoading();
      _fecharModalRecalcKm();
      if (!res || !res.ok) { toast('Erro ao atualizar: ' + (res && res.erro || 'falha desconhecida'), 'error'); return; }
      toast('Distância atualizada — recalculando horário…', 'success');
      // Força reconsulta (a leitura de cache agora vai trazer o valor novo).
      _osrmSeqKey = ''; _osrmLegs = undefined; _osrmGeometry = null; _osrmLegGeoms = null;
      if (_view === 'horario') renderHorario(); else updateMap();
    })
    .withFailureHandler(function(e) {
      doneLoading();
      toast('Erro ao atualizar: ' + (e.message || e), 'error');
    })
    .atualizarDistanciaCache(idA, idB, kmNovo);
}

function setLegVia(i, type, evt) {
  if (evt) { evt.stopPropagation(); evt.preventDefault(); }
  var key = _seq[i].idPonto;

  // Personalizado: aplica já (como os outros tipos) usando a velocidade atual ou a base,
  // e abre o campo inline para ajuste fino. Recalcular na hora evita a sensação de "travado".
  if (type === 'Pers') {
    if (!(_legVelPers[key] > 0)) {
      var base = parseFloat((document.getElementById('horVelMedia') || {}).value);
      _legVelPers[key] = (!isNaN(base) && base > 0) ? Math.round(base) : 85;
    }
    _legVia[key] = 'Pers';
    _persistLegVia();
    _markDirty();
    _partialUpdateSchedule();
    _focusPersInput(i);   // após o re-render, foca o input recém-criado
    return;
  }

  if (_legVia[key] === type) delete _legVia[key]; else _legVia[key] = type;
  delete _legVelPers[key];   // troca para um tipo padrão descarta a velocidade personalizada
  _persistLegVia();
  _markDirty();
  _partialUpdateSchedule();
  _closeViaOverlay(i);
}

// Fecha o overlay após o clique para evitar re-clique acidental (o rebuild via CSS hover
// manteria o overlay aberto, causando toggle indesejado se o cursor ficasse sobre ele)
function _closeViaOverlay(i) {
  var row = document.getElementById('horRow' + i);
  if (!row) return;
  var td = row.querySelectorAll('td')[4];
  if (td) {
    td.classList.add('hor-via-done');
    setTimeout(function() { td.classList.remove('hor-via-done'); }, 500);
  }
}

// Fixa o overlay aberto enquanto o campo de km/h está em edição. A classe
// 'hor-via-editing' força o overlay visível (sem depender do :hover), então o
// campo não "trava" se o cursor sair da célula durante a digitação.
function _pinPersEdit(i) {
  var row = document.getElementById('horRow' + i);
  if (!row) return;
  var td = row.querySelectorAll('td')[4];
  if (td) td.classList.add('hor-via-editing');
}

// Fixa e foca o campo (usado logo após aplicar 'Pers' pelo botão).
function _focusPersInput(i) {
  _pinPersEdit(i);
  var row = document.getElementById('horRow' + i);
  var td  = row ? row.querySelectorAll('td')[4] : null;
  var input = td ? td.querySelector('.hor-via-pers-input') : null;
  if (input) { input.focus(); input.select(); }
}

function _persInputKey(i, evt) {
  if (evt.key === 'Enter')       { evt.preventDefault(); _commitPersVel(i, evt.target.value); }
  else if (evt.key === 'Escape') { evt.preventDefault(); evt.target.blur(); }
}

// Confirma a velocidade digitada e recalcula o horário. O trecho já está em 'Pers'
// desde o clique (aplicação imediata), então valor inválido apenas mantém o atual.
function _commitPersVel(i, rawVal, evt) {
  if (!_seq[i]) return;
  // Se o foco saiu para outro botão de tipo, deixa aquele clique decidir o tipo.
  var rt = evt && evt.relatedTarget;
  if (rt && rt.classList && rt.classList.contains('hor-via-btn')
      && rt.getAttribute('data-via') !== 'Pers') return;

  var key = _seq[i].idPonto;
  var row = document.getElementById('horRow' + i);
  var td  = row ? row.querySelectorAll('td')[4] : null;
  if (td) td.classList.remove('hor-via-editing');
  var input = td ? td.querySelector('.hor-via-pers-input') : null;
  if (input) input.onblur = null;   // evita re-entrância do blur durante o re-render

  var vel = parseFloat(rawVal);
  if (!isNaN(vel) && vel > 0) {
    _legVelPers[key] = Math.min(200, Math.max(1, Math.round(vel)));
    _legVia[key]     = 'Pers';
  }
  _persistLegVia();
  _markDirty();
  _partialUpdateSchedule();
  _closeViaOverlay(i);
}

function _deltaCellHtml(comVal, chegadaMin, idPonto, idx) {
  if (!comVal) return '<span style="color:#dde1ee;font-size:14px;">—</span>';
  var diff    = _diffMin(comVal, chegadaMin, idPonto);
  var diffAbs = Math.abs(diff);
  var cls, sign;
  if      (diff >  2) { cls = 'delta-ok';   sign = '+'; }
  else if (diff < -2) { cls = 'delta-late';  sign = '−'; }
  else                { cls = 'delta-warn';  sign = '≈'; }
  var txt = sign + (diffAbs > 1 ? _dur(diffAbs) : '');
  // Destaque + botão "Investigar" quando a divergência acumulada passa de 2h.
  if (diffAbs > 120 && idx !== undefined) {
    return '<div style="display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;">'
      + '<div class="' + cls + ' delta-critical">' + txt + '</div>'
      + '<button type="button" class="delta-investigar-btn" onclick="event.stopPropagation();investigarDivergencia(' + idx + ')">' + ico('info', 10) + ' Investigar</button>'
      + '</div>';
  }
  return '<div class="' + cls + '">' + txt + '</div>';
}

function _autoFormatTime(input) {
  var pos  = input.selectionStart;
  var raw  = input.value.replace(/\D/g, '').slice(0, 4);
  var fmt  = raw.length >= 3 ? raw.slice(0, 2) + ':' + raw.slice(2) : raw;
  input.value = fmt;
  // mantém cursor após o caractere recém digitado
  var newPos = fmt.length >= 3 && pos >= 2 ? pos + 1 : pos;
  try { input.setSelectionRange(newPos, newPos); } catch(e) {}
}

function _validateHHMM(s) {
  var m = String(s || '').trim().match(/^([01]?\d|2[0-3]):([0-5]\d)$/);
  if (!m) return null;
  return ('0' + m[1]).slice(-2) + ':' + m[2];
}

function _confirmComercial(idx, inputEl, moveNext) {
  var raw = inputEl.value.trim();
  if (raw === '') {
    inputEl.classList.remove('hor-com-error');
    onComercialTimeChange(idx, '', inputEl);
    if (moveNext) _focusNextComercial(idx);
    return;
  }
  var val = _validateHHMM(raw);
  if (!val) {
    inputEl.classList.add('hor-com-error');
    inputEl.focus();
    return;
  }
  inputEl.classList.remove('hor-com-error');
  onComercialTimeChange(idx, val, inputEl);
  if (moveNext) _focusNextComercial(idx);
}

function onComercialTimeChange(idx, val, inputEl) {
  var key = _seq[idx].idPonto;
  if (val) { _comercialTimes[key] = val; } else { delete _comercialTimes[key]; }
  _markDirty();

  if (inputEl) {
    // Zera onblur ANTES de manipular o DOM para evitar chamada re-entrante
    // quando o browser dispara blur sincronamente ao remover o elemento via innerHTML
    inputEl.onblur = null;
    var td = inputEl.parentNode;
    if (td && val) {
      td.innerHTML = '<span class="hor-com-display" onclick="editComercial(' + idx + ',this)">'
        + esc(val) + '<span class="hor-com-edit-icon">' + ico('pencil',10) + '</span></span>';
    }
  }

  unhighlightRow(idx);
  _partialUpdateComercial();
}

function _focusNextComercial(fromIdx) {
  var nextRow = document.getElementById('horRow' + (fromIdx + 1));
  if (!nextRow) return;
  var input = nextRow.querySelector('.hor-com-input');
  if (input) { input.focus(); return; }
  var display = nextRow.querySelector('.hor-com-display');
  if (display) { editComercial(fromIdx + 1, display); }
}

function editComercial(idx, el) {
  var key    = _seq[idx].idPonto;
  var curVal = _comercialTimes[key] || '';
  var input  = document.createElement('input');
  input.type = 'text';
  input.className = 'hor-com-input';
  input.placeholder = 'HH:MM';
  input.value = curVal;
  input.oninput = function() { _autoFormatTime(this); };
  input.onkeydown = function(e) {
    if (e.key === 'Enter')  { e.preventDefault(); _confirmComercial(idx, this, true); }
    if (e.key === 'Escape') {
      this.classList.remove('hor-com-error');
      unhighlightRow(idx);
      this.parentNode && this.parentNode.replaceChild(el, this);
    }
  };
  input.onblur = function() { _confirmComercial(idx, this); };
  highlightRow(idx);
  el.parentNode.replaceChild(input, el);
  input.focus();
  input.select();
}

function selectHorRow(idx) {
  _activeHorRow = idx;
  document.querySelectorAll('#horBody tr').forEach(function(r) { r.classList.remove('row-editing'); });
  var row = document.getElementById('horRow' + idx);
  if (row) row.classList.add('row-editing');
}
function highlightRow(idx) {
  var row = document.getElementById('horRow' + idx);
  if (row) row.classList.add('row-editing');
}
function unhighlightRow(idx) {
  var row = document.getElementById('horRow' + idx);
  if (row) row.classList.remove('row-editing');
}

// Atualização parcial: recalcula deltas sem re-renderizar a tabela
function _partialUpdateComercial() {
  if (!_lastCalc) { _renderHorarioWith(Array.isArray(_osrmLegs) ? _osrmLegs : null); return; }
  var c = _lastCalc;
  _recomputeComercialBase(c);
  var partida  = (document.getElementById('horHoraPartida') || {}).value || '00:00';
  var startIdx = Math.min(_horStartIdx, _seq.length - 1);

  for (var i = 0; i < c.pontos.length; i++) {
    var p = c.pontos[i];
    var deltaEl = document.getElementById('horDelta' + i);
    if (!deltaEl) continue;
    var comVal = _comercialTimes[_seq[i].idPonto] || '';
    deltaEl.innerHTML = p.chegadaMin !== null ? _deltaCellHtml(comVal, p.chegadaMin, _seq[i].idPonto, i) : '—';
  }

  for (var i = 0; i < c.pontos.length; i++) {
    var p = c.pontos[i];
    var sbarEl = document.getElementById('horSbar' + i);
    if (!sbarEl) continue;
    var timeEl = sbarEl.querySelector('.hor-sidebar-time');
    if (!timeEl) continue;
    var comVal   = _comercialTimes[_seq[i].idPonto] || '';
    var chegaStr = p.preDep ? '—' : (p.chegadaMin !== null ? _ms(p.chegadaMin) : partida);
    if (i === startIdx) chegaStr = partida;
    var deltaHtml = '';
    if (!p.preDep && comVal && p.chegadaMin !== null) {
      var diff = _diffMin(comVal, p.chegadaMin, _seq[i].idPonto);
      var cls3 = diff > 2 ? 'delta-ok' : diff < -2 ? 'delta-late' : 'delta-warn';
      var sgn3 = diff > 2 ? '+' : diff < -2 ? '−' : '≈';
      deltaHtml = '<span class="hor-sidebar-delta ' + cls3 + '">'
        + sgn3 + (Math.abs(diff) > 1 ? _dur(Math.abs(diff)) : '') + '</span>';
    }
    timeEl.innerHTML = chegaStr + deltaHtml;
  }

  _applyAnttToRows(c);

  var horMain   = document.querySelector('#horBody .hor-main');
  if (!horMain) return;
  var analysisEl = horMain.querySelector('.hor-osm-analysis');
  var newHtml    = _buildComAnalysis(c);
  if (newHtml) {
    if (analysisEl) { analysisEl.outerHTML = newHtml; }
    else            { horMain.insertAdjacentHTML('beforeend', newHtml); }
  } else if (analysisEl) {
    analysisEl.remove();
  }
}

function _updateStartPtSelect() {
  var drop = document.getElementById('horStartDrop');
  if (!drop) return;
  if (_horStartIdx >= _seq.length) _horStartIdx = 0;
  if (_seq.length) {
    drop.innerHTML = _seq.map(function(p, i) {
      return '<div class="cs-opt' + (i === _horStartIdx ? ' sel' : '') + '" role="option" data-idx="' + i + '" onclick="_selectStartPt(' + i + ')">'
        + '<span class="cs-opt-num">' + (i + 1) + '</span>' + esc(p.nomePonto) + '</div>';
    }).join('');
  } else {
    drop.innerHTML = '<div class="cs-empty">Nenhum ponto</div>';
  }
  _setStartTxt();
}

// Texto exibido no botão do dropdown de ponto de partida.
function _setStartTxt() {
  var txt = document.getElementById('horStartTxt');
  if (!txt) return;
  txt.textContent = (_seq.length && _seq[_horStartIdx])
    ? (_horStartIdx + 1) + ' — ' + _seq[_horStartIdx].nomePonto
    : '—';
}

// Abre/fecha o dropdown de ponto de partida.
function _toggleStartDrop(ev) {
  ev.stopPropagation();
  var wrap = document.getElementById('horStartWrap');
  if (!wrap) return;
  if (wrap.classList.toggle('open')) {
    var sel = wrap.querySelector('.cs-opt.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }
}

// Seleciona um ponto de partida e recalcula o horário.
function _selectStartPt(i) {
  _horStartIdx = +i;
  var wrap = document.getElementById('horStartWrap');
  if (wrap) {
    wrap.classList.remove('open');
    wrap.querySelectorAll('.cs-opt').forEach(function(el) {
      el.classList.toggle('sel', +el.getAttribute('data-idx') === _horStartIdx);
    });
  }
  _setStartTxt();
  renderHorario();
}

// Atualização parcial do schedule sem reconstruir a tabela
function _partialUpdateSchedule() {
  if (!_lastCalc) { _renderHorarioWith(Array.isArray(_osrmLegs) ? _osrmLegs : null); return; }
  var osrmLegs = Array.isArray(_osrmLegs) ? _osrmLegs : null;
  var c        = _calcHorario(osrmLegs);
  _lastCalc    = c;
  _recomputeComercialBase(c);
  var partida  = (document.getElementById('horHoraPartida') || {}).value || '00:00';
  var startIdx = Math.min(_horStartIdx, _seq.length - 1);

  var statsEl = document.getElementById('horStatsPanel');
  if (statsEl) statsEl.innerHTML = _buildStatsHtml(c, osrmLegs);

  for (var i = 0; i < c.pontos.length; i++) {
    var p   = c.pontos[i];
    var row = document.getElementById('horRow' + i);
    if (!row || p.preDep) continue;
    var isStart = (i === startIdx);
    var tds     = row.querySelectorAll('td');
    if (tds.length < 7) continue;

    var chegStr = (isStart || p.chegadaMin === null) ? partida : _ms(p.chegadaMin);
    tds[1].textContent = chegStr;

    if (p.saidaMin !== null) {
      tds[3].textContent = _ms(p.saidaMin);
    } else if (p.chegadaMin !== null) {
      tds[3].innerHTML = '<strong style="color:#f47920;">' + ico('star',11) + ' ' + _ms(p.chegadaMin) + '</strong>';
    } else {
      tds[3].textContent = '—';
    }

    tds[4].className = 'hor-via-td';
    tds[4].innerHTML = _buildLegViaCell(i, c);

    var comVal = _comercialTimes[_seq[i].idPonto] || '';
    tds[6].innerHTML = p.chegadaMin !== null ? _deltaCellHtml(comVal, p.chegadaMin, _seq[i].idPonto, i) : '—';
  }

  for (var i = 0; i < c.pontos.length; i++) {
    var p      = c.pontos[i];
    var sbarEl = document.getElementById('horSbar' + i);
    if (!sbarEl) continue;
    var timeEl = sbarEl.querySelector('.hor-sidebar-time');
    if (!timeEl) continue;
    var comVal    = _comercialTimes[_seq[i].idPonto] || '';
    var chegaStr  = p.preDep ? '—' : (p.chegadaMin !== null ? _ms(p.chegadaMin) : partida);
    if (i === startIdx) chegaStr = partida;
    var dHtml = '';
    if (!p.preDep && comVal && p.chegadaMin !== null) {
      var diff = _diffMin(comVal, p.chegadaMin, _seq[i].idPonto);
      var dc   = diff > 2 ? 'delta-ok' : diff < -2 ? 'delta-late' : 'delta-warn';
      var ds   = diff > 2 ? '+' : diff < -2 ? '−' : '≈';
      dHtml = '<span class="hor-sidebar-delta ' + dc + '">'
        + ds + (Math.abs(diff) > 1 ? _dur(Math.abs(diff)) : '') + '</span>';
    }
    timeEl.innerHTML = chegaStr + dHtml;
  }

  _applyAnttToRows(c);

  var horMain    = document.querySelector('#horBody .hor-main');
  if (!horMain) return;
  var analysisEl = horMain.querySelector('.hor-osm-analysis');
  var newHtml    = _buildComAnalysis(c);
  if (newHtml) {
    if (analysisEl) { analysisEl.outerHTML = newHtml; }
    else            { horMain.insertAdjacentHTML('beforeend', newHtml); }
  } else if (analysisEl) {
    analysisEl.remove();
  }
}

function onStopTimeChange(idx, val) {
  _customStopTimes[_seq[idx].idPonto] = Math.max(0, Math.round(+val || 0));
  _markDirty();
  highlightRow(idx);
  _partialUpdateSchedule();
  setTimeout(function() { unhighlightRow(idx); }, 600);
}

// ============================================================
//  Modal de configuração do PDF
// ============================================================
function abrirModalPdf() {

  var ex = document.getElementById('pdfModalOverlay');

    { key:'chegada',   label:'Chegada'           },
    { key:'parada',    label:'Parada'             },
    { key:'saida',     label:'Saída'              },

    { key:'comercial', label:'Comercial'          },
    { key:'dif',       label:'Dif.'               }
  ];

  var comDisabled  = (_pdfMode === 'comercial');

      + c.label + '</label>';
  }).join('');

  // Seção "Personalizado": formato de horário + lista de pontos
  var personPontosHtml = _seq.map(function(p, i) {

      + (sel ? ' checked' : '') + ' style="width:13px;height:13px;accent-color:#f47920;cursor:pointer;" onchange="_pdfPersonSyncAll()">'
      + esc(p.nomePonto)
      + '</label>';
  }).join('');
  var personSection =
    '<div id="pdfPersonConfig" style="' + (isPersonMode ? '' : 'display:none;') + 'margin-top:14px;padding-top:14px;border-top:1px solid #f0f2f8;">'
    + '<div style="margin-bottom:12px;">'
      + '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#7a8299;margin-bottom:8px;">Formato de horário</div>'
      + '<div style="display:flex;gap:8px;">'
        + '<label id="pdfPersonFmtHhmmLabel" onclick="pdfPersonFormatoSelect(\'hhmm\')" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border:1px solid ' + (_pdfPersonConfig.formato !== 'min' ? '#f47920' : '#d4d8e8') + ';border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;background:' + (_pdfPersonConfig.formato !== 'min' ? '#fff8f0' : '#fff') + ';">'

        + '</label>'

        + personPontosHtml

  var modal =
    '<div id="pdfModalOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;">'

      + '</div>'

        + '<div style="margin-bottom:12px;">'

        + '</div>'
        + '<div style="margin-bottom:16px;">'
          + '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#7a8299;margin-bottom:8px;">Modo</div>'
          + '<div style="display:flex;gap:8px;">'
            + '<label id="pdfModeNormalLabel" onclick="pdfModeSelect(\'normal\')" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border:1px solid ' + (_pdfMode === 'normal' ? '#f47920' : '#d4d8e8') + ';border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;background:' + (_pdfMode === 'normal' ? '#fff8f0' : '#fff') + ';">'
              + '<input type="radio" name="pdfMode" id="pdfModeNormal" value="normal"' + (_pdfMode === 'normal' ? ' checked' : '') + ' style="accent-color:#f47920;cursor:pointer;"> Normal'
            + '</label>'

            + '</label>'

              + '<input type="radio" name="pdfMode" id="pdfModePersonalizado" value="personalizado"' + (_pdfMode === 'personalizado' ? ' checked' : '') + ' style="accent-color:#f47920;cursor:pointer;"> Personalizado'

        + '<button onclick="gerarPdfComOpcoes()" style="padding:8px 20px;border:none;border-radius:6px;background:#f47920;color:#fff;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;">' + ico('arrow-down',13) + ' Gerar PDF</button>'

  document.body.insertAdjacentHTML('beforeend', modal);

function fecharModalPdf() {
  var m = document.getElementById('pdfModalOverlay');
  if (m) m.remove();
}

function pdfModeSelect(mode) {
  var nLbl = document.getElementById('pdfModeNormalLabel');
  var cLbl = document.getElementById('pdfModeComercialLabel');
  var pLbl = document.getElementById('pdfModePersonalizadoLabel');
  var nRad = document.getElementById('pdfModeNormal');
  var cRad = document.getElementById('pdfModeComercial');
  var pRad = document.getElementById('pdfModePersonalizado');
  var isCom  = (mode === 'comercial');
  var isPers = (mode === 'personalizado');
  if (nLbl) { nLbl.style.borderColor = (!isCom && !isPers) ? '#f47920' : '#d4d8e8'; nLbl.style.background = (!isCom && !isPers) ? '#fff8f0' : '#fff'; }
  if (cLbl) { cLbl.style.borderColor = isCom  ? '#f47920' : '#d4d8e8'; cLbl.style.background = isCom  ? '#fff8f0' : '#fff'; }
  if (pLbl) { pLbl.style.borderColor = isPers ? '#f47920' : '#d4d8e8'; pLbl.style.background = isPers ? '#fff8f0' : '#fff'; }
  if (nRad) nRad.checked = (!isCom && !isPers);
  if (cRad) cRad.checked = isCom;
  if (pRad) pRad.checked = isPers;
  // Colunas comercial/dif: desabilitadas somente no modo comercial
  ['comercial','dif'].forEach(function(k) {
    var lbl = document.getElementById('pdfColLabel_' + k);
    if (lbl) { lbl.style.opacity = isCom ? '0.4' : ''; lbl.style.pointerEvents = isCom ? 'none' : ''; }
  });
  // Seção personalizado: mostra/oculta
  var sec = document.getElementById('pdfPersonConfig');
  if (sec) sec.style.display = isPers ? '' : 'none';
}

function pdfPersonFormatoSelect(fmt) {
  _pdfPersonConfig.formato = fmt;
  var hLbl = document.getElementById('pdfPersonFmtHhmmLabel');
  var mLbl = document.getElementById('pdfPersonFmtMinLabel');
  var hRad = document.getElementById('pdfPersonFmtHhmm');
  var mRad = document.getElementById('pdfPersonFmtMin');
  var isMin = (fmt === 'min');
  if (hLbl) { hLbl.style.borderColor = isMin ? '#d4d8e8' : '#f47920'; hLbl.style.background = isMin ? '#fff' : '#fff8f0'; }
  if (mLbl) { mLbl.style.borderColor = isMin ? '#f47920' : '#d4d8e8'; mLbl.style.background = isMin ? '#fff8f0' : '#fff'; }
  if (hRad) hRad.checked = !isMin;
  if (mRad) mRad.checked =  isMin;
}

function pdfPersonToggleAll(cb) {
  document.querySelectorAll('.pdf-person-ponto').forEach(function(el) { el.checked = cb.checked; });
}

function _pdfPersonSyncAll() {
  var all  = document.querySelectorAll('.pdf-person-ponto');
  var allC = Array.from(all).every(function(el) { return el.checked; });
  var sa   = document.getElementById('pdfPersonSelectAll');

}

function gerarPdfComOpcoes() {
  ['chegada','parada','saida','desl','comercial','dif'].forEach(function(k) {
    var el = document.getElementById('pdfCol_' + k);
    if (el) _pdfCols[k] = el.checked;
  });
  var mEl = document.querySelector('input[name="pdfMode"]:checked');
  _pdfMode = mEl ? mEl.value : 'normal';
  var tEl = document.getElementById('pdfTitleInput');
  var sEl = document.getElementById('pdfSubtitleInput');
  _pdfTitle    = tEl ? tEl.value.trim() : '';
  _pdfSubtitle = sEl ? sEl.value.trim() : '';
  // Captura config personalizado
  if (_pdfMode === 'personalizado') {
    var fEl = document.querySelector('input[name="pdfPersonFormato"]:checked');
    _pdfPersonConfig.formato = fEl ? fEl.value : 'hhmm';
    var pontos = {};
    document.querySelectorAll('.pdf-person-ponto').forEach(function(cb) {
      pontos[cb.dataset.id] = cb.checked;
    });
    _pdfPersonConfig.pontos = pontos;
  }
  _savePdfPrefs();
  fecharModalPdf();
  imprimirHorario();
}

// ============================================================

function imprimirHorario(returnHtml, forServer) {
  if (!_sel || !_seq.length) return;
  var osrmLegs = Array.isArray(_osrmLegs) ? _osrmLegs : null;
  var c        = _calcHorario(osrmLegs);
  _recomputeComercialBase(c);
  var partida  = document.getElementById('horHoraPartida').value || '00:00';
  var vel      = document.getElementById('horVelMedia').value || '85';
  var tipoVia  = '';
  document.querySelectorAll('.hor-preset-btn').forEach(function(b){ if (b.classList.contains('active')) tipoVia = b.textContent; });
  var fonteDist = _osrmStatus === 'ok' ? 'Traçado real (OSM)' : _osrmStatus === 'cache' ? 'Cache de distâncias' : 'Mín. 30 min (sem rota)';
  var startIdx  = Math.min(_horStartIdx, c.pontos.length - 1);
  var cols      = _pdfCols;
  // Título padrão: "HORARIO - NOME (COD_LINHA) (Sentido)".
  var title     = _pdfTitle    || _tituloPadraoEsquema(_sel);
  var subtitle  = _pdfSubtitle || '';

  function pe(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hhmm(m){ m=Math.round(m||0); var h=Math.floor(m/60),mm=m%60; return ('0'+h).slice(-2)+':'+('0'+mm).slice(-2); }
  function ms(m){ m=Math.round(m); return ('0'+Math.floor(m/60)%24).slice(-2)+':'+('0'+(m%60)).slice(-2); }
  // Arredonda minutos para múltiplo de 5 — somente para exibição no PDF
  function r5(m){ return Math.round(m / 5) * 5; }
  function msR(m){ return ms(r5(m)); }
  function partidaR(s){ var p=(s||'00:00').split(':'); return ms(r5(+p[0]*60+(+p[1]||0))); }
  function comR(s){ if(!s) return s; var p=s.split(':'); return p.length<2 ? s : ms(r5(+p[0]*60+(+p[1]||0))); }

  var pdfMode = _pdfMode || 'normal';
  // Formato adaptável: modo personalizado com "min" → tempo decorrido desde o ponto de partida
  var _useMin = (pdfMode === 'personalizado' && _pdfPersonConfig.formato === 'min');
  // Base = minuto de saída do ponto de partida (o ponto "startIdx")
  var _baseMin = (function() {
    var sp = c.pontos[startIdx];
    if (!sp) return 0;
    return sp.saidaMin !== null ? sp.saidaMin : (sp.chegadaMin !== null ? sp.chegadaMin : 0);
  })();
  function timeFmt(m){ return _useMin ? String(r5(Math.max(0, Math.round((m || 0) - _baseMin)))) : msR(m); }
  function durFmt(m){  return _useMin ? String(r5(Math.round(m || 0))) : hhmm(m); }

  var activeCols = [{ key:'cidade', label:'Cidade', align:'left' }];
  if (cols.chegada) activeCols.push({ key:'chegada', label:'Chegada', align:'center' });
  if (cols.parada)  activeCols.push({ key:'parada',  label:'Parada',  align:'center' });
  if (cols.saida)   activeCols.push({ key:'saida',   label:'Saída',   align:'center' });
  if (cols.desl) activeCols.push({ key:'desl', label:'Desl.', align:'left' });
  if (pdfMode !== 'comercial') {
    if (cols.comercial) activeCols.push({ key:'comercial', label:'Comercial', align:'center' });
    if (cols.dif)       activeCols.push({ key:'dif',       label:'Dif.',      align:'center' });
  }

  var thead = activeCols.map(function(col) {
    return '<th bgcolor="#f0f2f8" style="text-align:' + col.align + ';">' + col.label + '</th>';
  }).join('');

  // Badge de partida: o conversor de PDF do servidor não renderiza SVG inline,
  // então no modo forServer usamos um símbolo de texto no lugar do ícone.
  var startBadge = forServer
    ? '<span style="background:#f47920;color:#fff;border-radius:3px;padding:0 5px;margin-left:4px;font-size:9px;font-weight:700;">&#9658;</span>'
    : '<span style="display:inline-flex;align-items:center;background:#f47920;color:#fff;border-radius:3px;padding:1px 5px;margin-left:3px;">' + ico('send',9) + '</span>';

  var tbody = '';
  var accumTv = 0, accumDist = 0, accumAllOsrm = true;
  c.pontos.forEach(function(p, i) {
    var isStart = (i === startIdx);
    var isLast  = (i === c.pontos.length - 1);
    // Modo personalizado: filtra pontos desmarcados pelo usuário
    if (pdfMode === 'personalizado' && _pdfPersonConfig.pontos) {
      if (_pdfPersonConfig.pontos[_seq[i].idPonto] === false) return;
    }
    if (p.preDep) {
      tbody += '<tr style="opacity:0.32;">'
        + '<td><strong>' + pe(p.nomePonto) + '</strong></td>'
        + '<td colspan="' + (activeCols.length - 1) + '" style="text-align:center;color:#aaa;font-style:italic;font-size:10px;">pré-partida</td>'
        + '</tr>';
      return;
    }
    var comVal = _comercialTimes[_seq[i].idPonto] || '';
    if (pdfMode === 'comercial' && !isStart) {
      accumTv   += (p.tv   || 0);
      accumDist += (p.dist || 0);
      if (p.distSource !== 'osrm') accumAllOsrm = false;
    }
    if (pdfMode === 'comercial' && !comVal) return;
    var cells  = {};

    cells.cidade = '<strong>' + pe(p.nomePonto) + '</strong>'
      + (isStart ? ' ' + startBadge : '');

    if (pdfMode === 'comercial') {
      cells.chegada = isStart
        ? '<span style="color:#bbb;">—</span>'
        : (comVal ? '<strong>' + pe(comR(comVal)) + '</strong>' : '<span style="color:#ccc;">—</span>');
      cells.parada = (!isStart && !isLast && p.tp) ? hhmm(p.tp) : '—';
      if (isStart) {
        cells.saida = comVal ? '<strong>' + pe(comR(comVal)) + '</strong>' : '—';
      } else if (isLast) {
        cells.saida = '<span style="color:#bbb;">—</span>';
      } else if (comVal) {
        cells.saida = '<strong>' + msR(_p(comVal) + (p.tp || 0)) + '</strong>';
      } else {
        cells.saida = '—';
      }
      if (isStart || (accumDist === 0 && accumTv === 0)) {
        cells.desl = '—';
      } else {
        var tvStr2   = hhmm(accumTv) + (!accumAllOsrm ? '<span style="color:#ccc;font-size:9px;"> ~</span>' : '');
        var distStr2 = accumDist.toFixed(1) + ' km' + (!accumAllOsrm ? '<span style="color:#ccc;font-size:9px;"> ~</span>' : '');
        cells.desl   = tvStr2 + ' <span style="color:#d4d8e8;margin:0 2px;">|</span> ' + distStr2;
      }
      accumTv = 0; accumDist = 0; accumAllOsrm = true;
    } else {
      cells.chegada = isStart
        ? '<span style="color:#bbb;">—</span>'
        : '<strong>' + (p.chegadaMin === null ? '—' : timeFmt(p.chegadaMin)) + '</strong>';
      cells.parada  = (!isStart && !isLast && p.saidaMin !== null) ? durFmt(p.tp) : '—';
      cells.saida   = p.saidaMin !== null
        ? '<strong>' + timeFmt(p.saidaMin) + '</strong>'
        : (p.chegadaMin !== null ? '<strong style="color:#f47920;">' + (forServer ? '&#9733;' : ico('star',11)) + ' ' + timeFmt(p.chegadaMin) + '</strong>' : '—');

      if (isStart || !p.hasCoords || _useMin) {
        cells.desl = '—';
      } else {
        var tvStr   = hhmm(p.tv)   + (p.distSource !== 'osrm' ? '<span style="color:#ccc;font-size:9px;"> ~</span>' : '');
        var distStr = p.dist.toFixed(1) + ' km' + (p.distSource !== 'osrm' ? '<span style="color:#ccc;font-size:9px;"> ~</span>' : '');
        cells.desl  = tvStr + ' <span style="color:#d4d8e8;margin:0 2px;">|</span> ' + distStr;
      }

      cells.comercial = comVal
        ? '<strong style="color:#1565c0;">' + pe(comR(comVal)) + '</strong>'
        : '<span style="color:#ccc;">—</span>';

      cells.dif = '—';
      if (comVal && p.chegadaMin !== null) {
        var d2 = _diffMin(comVal, p.chegadaMin, _seq[i].idPonto), a2 = Math.abs(d2);
        var c2 = d2 > 2 ? '#22c97a' : d2 < -2 ? '#e53935' : '#f47920';
        var s2 = d2 > 2 ? '+' : d2 < -2 ? '−' : '≈';
        cells.dif = '<strong style="color:' + c2 + ';">' + s2 + (a2 > 1 ? hhmm(a2) : '') + '</strong>';
      }
    }

    var rowBgColor = isStart ? '#f0fff8' : isLast ? '#fff8f0' : (!comVal ? '#fff8f2' : '');
    tbody += '<tr' + (rowBgColor ? ' bgcolor="' + rowBgColor + '" style="background-color:' + rowBgColor + ';"' : '') + '>';
    activeCols.forEach(function(col) {
      tbody += '<td style="text-align:' + col.align + ';">' + (cells[col.key] || '—') + '</td>';
    });
    tbody += '</tr>';
  });

  // ── Modo servidor: HTML enxuto para o conversor do Google (getAs PDF).
  // O conversor não suporta grid/flex/position:fixed/SVG, então stats viram
  // <table> e os ícones viram texto. O rodapé NÃO vai no HTML: é carimbado
  // depois em todas as páginas via pdf-lib (o conversor não fixa rodapé por
  // página); o @page reserva 14mm no pé para o carimbo não cobrir as linhas.
  if (forServer) {
    var sMeta = [_sel.sentido, 'Partida ' + partidaR(partida), (tipoVia || 'BR'), vel + ' km/h', fonteDist]
                  .filter(Boolean).map(pe).join(' &nbsp;·&nbsp; ');
    // table-layout:fixed + larguras explícitas: as colunas de tempo/valor ficam
    // estreitas e a Cidade fica com o restante, para nomes longos caberem em 1
    // linha (evita linhas altas e baixas alternadas). Garante também que a tabela
    // nunca exceda a página (o conversor do Google cortava colunas ao transbordar).
    var colW     = { chegada: 13, parada: 11, saida: 13, comercial: 13, dif: 11, desl: 18 };
    var usadas   = activeCols.slice(1).reduce(function(s, col) { return s + (colW[col.key] || 14); }, 0);
    var firstW   = Math.max(28, 100 - usadas);
    var colgroup = '<colgroup><col style="width:' + firstW + '%;">'
      + activeCols.slice(1).map(function(col) { return '<col style="width:' + (colW[col.key] || 14) + '%;">'; }).join('')
      + '</colgroup>';
    var s = '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>' + pe(title) + '</title><style>'
      + '@page{size:A4 portrait;margin:0 0 14mm 0;}'
      // print-color-adjust:exact → o conversor do Google preserva as cores de
      // fundo (barra escura do cabeçalho, realce dos stats, fundo do thead);
      // sem isso ele descarta backgrounds ao renderizar como impressão.
      + '*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}'
      + 'html,body{width:210mm;}'
      + 'body{font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#1a1d23;}'
      + '.hdr{background:#1a1d23;color:#fff;padding:22px 12mm 18px;}'
      + '.hdr-title{font-size:22px;font-weight:900;letter-spacing:.01em;line-height:1.1;}'
      + '.hdr-sub{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#f47920;margin-top:5px;}'
      + '.hdr-meta{font-size:10px;color:#9aa0ad;margin-top:7px;}'
      + '.body{padding:7mm 12mm 8mm;}'
      + 'table.stats{width:100%;border-collapse:separate;border-spacing:6px 0;margin-bottom:14px;}'
      + 'table.stats td{border:1px solid #dde1ee;border-radius:6px;padding:10px 12px;text-align:center;width:25%;}'
      + 'table.stats td.hi{background:#fff8f0;border-color:#fddcb3;}'
      + '.sv{font-size:16px;font-weight:800;color:#1a1d23;}'
      + 'table.stats td.hi .sv{color:#f47920;}'
      + '.sl{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#888;margin-top:2px;}'
      + 'table.sched{width:100%;table-layout:fixed;border-collapse:collapse;font-size:11px;border:1px solid #cdd2e5;}'
      + 'table.sched th{background:#f0f2f8;padding:6px 10px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#5a6070;border:1px solid #cdd2e5;white-space:normal;}'

function _updateImportBtn() {

  });
  row.style.display = outros.length ? '' : 'none';
}

function abrirImportarPontos() {
  if (!_sel) return;
  var outros = _esqs.filter(function(e) {
    return e.id_esquema !== _sel.id_esquema && e.nome_linha === _sel.nome_linha;
  });
  if (!outros.length) {
    toast('Nenhum outro horário encontrado para esta linha.', 'info');
    return;
  }
  var list = document.getElementById('importEsqList');
  list.innerHTML = '<div style="text-align:center;padding:16px;color:#aaa;font-size:12px;">Carregando horários…</div>';
  document.getElementById('importModalOverlay').style.display = 'flex';

  function _renderImportList(contagem) {
    list.innerHTML = outros.map(function(e) {
      var cnt = contagem ? (contagem[String(e.id_esquema)] || 0) : null;
      var vazio = cnt !== null && cnt === 0;
      var cntHtml = cnt !== null
        ? '<span style="margin-left:6px;font-size:10px;color:' + (vazio ? '#f87171' : '#6ee7b7') + ';">'
          + (vazio ? '(sem pontos)' : cnt + ' pto' + (cnt !== 1 ? 's' : '')) + '</span>'
        : '';
      return '<div class="sdi" data-id="' + esc(e.id_esquema) + '"'
        + (vazio ? ' style="opacity:.45;pointer-events:none;cursor:default;"' : ' style="cursor:pointer;"')
        + '>'
        + '<div class="sdi-main">' + esc(e.id_esquema) + ' — ' + esc(e.nome_linha) + cntHtml + '</div>'
        + '<div class="sdi-meta">'
        + (e.horario ? '<span style="background:#fff8e1;color:#f47920;border:1px solid #ffe082;border-radius:3px;padding:0 5px;margin-right:4px;font-size:10px;">' + esc(e.horario) + '</span>' : '')
        + _codLinhaBadge(e)
        + esc(e.sentido || '')
        + '</div></div>';
    }).join('');
    list.querySelectorAll('.sdi:not([style*="pointer-events:none"])').forEach(function(el) {
      el.addEventListener('click', function() {
        importarDeEsquema(el.getAttribute('data-id'));
      });
    });
  }

  if (typeof google !== 'undefined' && google.script) {
    var ids = outros.map(function(e){ return e.id_esquema; });
    google.script.run
      .withSuccessHandler(function(contagem) { _renderImportList(contagem); })
      .withFailureHandler(function()         { _renderImportList(null);     })
      .getContagemPontosEsquemas(ids);
  } else {
    _renderImportList(null);
  }
}

function fecharImportModal() {
  document.getElementById('importModalOverlay').style.display = 'none';
}

function importarDeEsquema(idEsq) {
  if (_seq.length > 0) {
    if (!confirm('A sequência atual será substituída pelos pontos importados. Continuar?')) return;
  }
  fecharImportModal();
  loading('Importando pontos…');
  google.script.run
    .withSuccessHandler(function(pontos) {
      doneLoading();
      if (!pontos || !pontos.length) {
        toast('O horário de origem não possui pontos cadastrados.', 'error');
        return;
      }
      // Monta sequência com dados de local do _lMap
      _seq = pontos.map(function(p) {
        var l = _lMap[String(p.idPonto)] || {};
        return { idPonto: p.idPonto, nomePonto: p.nomePonto, tipo: p.tipo || '',
                 lat: l.lat || null, lng: l.lng || null, isNew: true };
      });
      // Importa dados específicos da ROTA (não do horário)
      _legVia = {}; _legVelPers = {};
      pontos.forEach(function(p) { _setLegViaRaw(p.idPonto, p.tipoTrecho); });
      // tempo_local não é mais usado: parada vem da aba TEMPO_PERMANENCIA e,
      // fora dela, do padrão fixo de 30 min. _customStopTimes só guarda edições
      // feitas na sessão.
      _customStopTimes = {};
      // Horários comerciais são específicos de cada horário — não importar
      _comercialTimes  = {};
      _osrmLegs        = undefined;
      _osrmSeqKey      = '';
      _osrmGeometry    = null;
      _osrmLegGeoms    = null;
      _horStartIdx     = 0;
      _osrmStatus      = 'pending';
      renderSeq();
      updateInsAfter();
      updateMap();
      dirtySeq();
      var srcEsq = _esqs.find(function(e) { return e.id_esquema === idEsq; });
      var srcLabel = srcEsq ? (srcEsq.horario ? srcEsq.horario + ' (' + srcEsq.sentido + ')' : srcEsq.id_esquema) : idEsq;
      toast(pontos.length + ' pontos importados de ' + srcLabel + '. Salve para confirmar.', 'success', 5000);
    })
    .withFailureHandler(function(e) {
      doneLoading();
      toast('Erro ao importar: ' + (e.message || e), 'error');
    })
    .getPontosEsquemaParaFormulario(idEsq);
}

// ============================================================
//  Map
// ============================================================
function initMap() {
  _map = L.map('map', { zoomControl: true }).setView([-14.235, -51.9253], 4);
  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution: '&copy; Esri', maxZoom: 19, crossOrigin: true }
  ).addTo(_map);
  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',
    { subdomains: 'abcd', maxZoom: 19, opacity: 0.85, crossOrigin: true }
  ).addTo(_map);

  document.querySelectorAll('.map-mode-btn').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-mode') === _mapMode);
  });
}

function updateMap() {
  if (_view === 'horario') { renderHorario(); return; }
  if (!_map) return;
  _markers.forEach(function(m) { m.remove(); });
  _markers = [];
  if (_poly) { _poly.remove(); _poly = null; }
  _clearAnttMapLayers();
  _clearComercialMapLayers();
  _clearLegHoverLayers();

  var pts = _seq.filter(function(p) { return p.lat && p.lng; });
  if (!pts.length) {
    document.getElementById('map').style.display = 'none';
    document.getElementById('mapPh').style.display = '';
    document.getElementById('mapLegend').classList.remove('show');
    document.getElementById('mapModeToggle').style.display = 'none';
    return;
  }

  document.getElementById('map').style.display = 'block';
  document.getElementById('mapPh').style.display = 'none';
  document.getElementById('mapLegend').classList.add('show');
  document.getElementById('mapModeToggle').style.display = 'flex';

  var seqCoordIdxs = [];
  _seq.forEach(function(p, i) { if (p.lat && p.lng) seqCoordIdxs.push(i); });
  var firstCoordIdx = seqCoordIdxs[0];
  var lastCoordIdx  = seqCoordIdxs[seqCoordIdxs.length - 1];
  var lls = pts.map(function(p) { return [+p.lat, +p.lng]; });

  var mapSeqKey = _seqCoordsKey();
  setTimeout(function() {
    _map.invalidateSize();

    // 1. Desenha overlay do modo ativo PRIMEIRO (fica abaixo da rota laranja)
    if (_mapMode === 'comercial') _drawComercialOnMap(); else _drawAnttOnMap();

    // 2. Rota principal por cima
    _poly = L.polyline(lls, { color: '#f47920', weight: 5, opacity: 0.9 }).addTo(_map);

    // 3. Camada de hover/click por trecho (tempo+km+vel), por cima de tudo
    _drawLegHoverOnMap();

    if (_osrmGeometry && _osrmSeqKey === mapSeqKey) {
      _poly.setLatLngs(_osrmGeometry);
    } else if (!_osrmGeometry || _osrmSeqKey !== mapSeqKey) {
      _fetchOsrmDistances(function(legs, geom, legGeoms) {
        if (_seqCoordsKey() !== mapSeqKey) return;
        _osrmLegs     = _osrmLegs !== undefined ? _osrmLegs : legs;
        _osrmSeqKey   = mapSeqKey;
        _osrmGeometry = geom;
        _osrmLegGeoms = legGeoms;
        if (_poly && geom) _poly.setLatLngs(geom);
        // Redesenha o overlay ativo com distâncias reais e garante que a rota fica por cima
        if (_mapMode === 'comercial') _drawComercialOnMap(); else _drawAnttOnMap();
        if (_poly) _poly.bringToFront();
        // Recalcula tempo/km/vel dos trechos com os dados reais do OSRM
        _drawLegHoverOnMap();
      });
    }

    // 3. Marcadores de sequência (DOM elements — sempre acima do SVG)
    var visibleSeqNum = 0;
    _seq.forEach(function(p, i) {
      if (!p.lat || !p.lng) return;
      var first = (i === firstCoordIdx), last = (i === lastCoordIdx);
      // Modo Comercial: some os pontos de apoio (sem horário comercial) do mapa,
      // deixando visíveis só início, fim e pontos comerciais.
      if (_mapMode === 'comercial' && !first && !last && _isApoioAntt(i)) return;
      visibleSeqNum++;
      // Destaque de apoio ANTT apenas quando há alertas ativos na rota
      var isApoio = _anttMapActive && !first && !last && _isApoioAntt(i);
      var bg  = first ? '#22c97a' : last ? '#e05050' : '#f47920';
      var sz  = (first || last) ? 28 : 22;
      // Modo Comercial renumera sequencialmente os pontos visíveis (sem os
      // "buracos" deixados pelos apoios ocultos); Modo ANTT mantém o índice real.
      var lbl = first ? 'I' : last ? 'F' : String(_mapMode === 'comercial' ? visibleSeqNum : i + 1);
      var icon = L.divIcon({
        className: '',
        html: '<div style="width:' + sz + 'px;height:' + sz + 'px;border-radius:50%;' +
              'background:' + bg + ';border:2.5px solid rgba(255,255,255,0.85);' +
              (isApoio ? 'outline:2px solid rgba(34,197,90,0.75);outline-offset:1px;' : '') +
              'display:flex;align-items:center;justify-content:center;' +
              'font-size:' + (sz > 24 ? '11px' : '10px') + ';font-weight:800;color:#fff;' +
              'box-shadow:0 2px 8px rgba(0,0,0,0.55);">' + lbl + '</div>',
        iconSize: [sz, sz], iconAnchor: [sz/2, sz/2]
      });
      var m = L.marker([+p.lat, +p.lng], { icon: icon });
      m.bindTooltip(
        '<strong>' + esc(p.nomePonto) + '</strong>' +
        '<br><span style="font-size:10px;color:#888;">#' + (_mapMode === 'comercial' ? visibleSeqNum : i + 1) + (p.tipo ? ' · ' + esc(p.tipo) : '') +
        (isApoio ? ' · <span style="color:#4ade80">apoio ANTT</span>' : '') + '</span>',
        { direction: 'top', offset: [0, -(sz/2) - 4] }
      );
      m.addTo(_map);
      _markers.push(m);
    });

    _map.fitBounds(lls, { padding: [44, 44], maxZoom: 13 });
  }, 80);
}

// ============================================================
//  Esquema search
// ============================================================
function setupEsqSearch() {
  var inp  = document.getElementById('esqSearch');
  var drop = document.getElementById('esqDrop');

  // Lista persistente agrupada por terminal de partida — sempre visível no
  // modal e filtrada conforme o usuário digita.
  inp.addEventListener('focus', function() { renderEsqs(this.value); });
  inp.addEventListener('click', function() { renderEsqs(this.value); });
  inp.addEventListener('input', function() { renderEsqs(this.value); });

  // mousedown no item previne o blur do input, mantendo a seleção funcionando
  drop.addEventListener('mousedown', function(e) { e.preventDefault(); });

  document.getElementById('btnNovo').addEventListener('click', novoEsquema);
  document.getElementById('btnSalvEsq').addEventListener('click', salvarEsquema);
}

function renderEsqs(q) {
  var drop = document.getElementById('esqDrop');
  var nq   = norm(q);
  // "1845" ou "845" → "18:45" / "08:45" para casar com horários
  var timeQ = null;
  var digits = (q || '').trim().replace(/\D/g, '');
  if (digits.length === 4) timeQ = digits.slice(0, 2) + ':' + digits.slice(2);
  else if (digits.length === 3) timeQ = '0' + digits[0] + ':' + digits.slice(1);

  var list = _esqs.filter(function(e) {
    return !nq
      || norm(e.id_esquema).includes(nq)
      || norm(e.nome_linha).includes(nq)
      || norm(e.cod_linha || '').includes(nq)
      || norm(e.horario || '').includes(nq)
      || norm(e.sentido || '').includes(nq)
      || norm(e.partida || '').includes(nq)
      || (timeQ && (e.horario || '').startsWith(timeQ));
  });

  if (!list.length) {
    drop.innerHTML = '<div class="sd-empty">Nenhum resultado</div>';
    drop.classList.add('open');
    return;
  }

  // Agrupa por terminal de partida (1º ponto do esquema)
  var groups = {};
  list.forEach(function(e) {
    var key = (e.partida && e.partida.trim()) ? e.partida.trim() : 'Sem partida definida';
    (groups[key] = groups[key] || []).push(e);
  });
  var keys = Object.keys(groups).sort(function(a, b) { return a.localeCompare(b, 'pt-BR'); });

  drop.innerHTML = keys.map(function(gk) {
    var items = groups[gk].sort(function(a, b) {
      return norm(a.nome_linha).localeCompare(norm(b.nome_linha))
          || String(a.horario || '').localeCompare(String(b.horario || ''));
    });
    return '<div class="esq-group-h">' + esc(gk)

    return String(a.id_esquema).localeCompare(String(b.id_esquema), undefined, { numeric: true });
  });

// ── Sugestões de cód. da linha ───────────────────────────────
// Monta { cod, nomes[] } a partir dos esquemas já cadastrados (fonte do código).
function _codCandidatos() {
  var m = {};
  _esqs.forEach(function(e) {
    var c = (e.cod_linha || '').trim();
    if (!c) return;
    if (!m[c]) m[c] = { cod: c, nomes: {} };
    if (e.nome_linha) m[c].nomes[String(e.nome_linha).trim()] = true;
  });
  return Object.keys(m).map(function(c) { return { cod: m[c].cod, nomes: Object.keys(m[c].nomes) }; });
}

// Tokens significativos (≥3 letras) de um nome de linha, para casar por similaridade.
function _codTokens(s) {
  return norm(s).split(/[^a-z0-9]+/).filter(function(t) { return t.length >= 3; });
}

// Renderiza as sugestões: campo vazio → puxa códigos de linhas com nome igual/parecido;
// com texto digitado → filtra por código ou nome.
function _codSugRender() {
  var drop = document.getElementById('fCodDrop');
  if (!drop) return;
  var fc   = document.getElementById('fCod');
  var q    = (fc ? fc.value : '').trim();
  var nq   = norm(q);
  var nome = (document.getElementById('fNome').value || '').trim();
  var nomeN = norm(nome);
  var nomeTokens = _codTokens(nome);

  var cand = _codCandidatos().filter(function(c) { return c.cod !== q; });
  cand.forEach(function(c) {
    var best = 0;
    c.nomes.forEach(function(nm) {
      var nmN = norm(nm);
      if (nomeN && nmN === nomeN) { best = Math.max(best, 100); return; }
      var t = _codTokens(nm), shared = 0;
      nomeTokens.forEach(function(tk) { if (t.indexOf(tk) !== -1) shared++; });
      if (shared) best = Math.max(best, shared);
    });
    c._score  = best;
    c._matchQ = nq && (norm(c.cod).indexOf(nq) !== -1 || c.nomes.some(function(nm) { return norm(nm).indexOf(nq) !== -1; }));
  });

  var list = nq ? cand.filter(function(c) { return c._matchQ; })
                : cand.filter(function(c) { return c._score > 0; });
  list.sort(function(a, b) { return (b._score - a._score) || a.cod.localeCompare(b.cod); });
  list = list.slice(0, 8);

  if (!list.length) {
    if (!nq && !nomeTokens.length) { drop.classList.remove('open'); return; }
    drop.innerHTML = '<div class="codsug-empty">Nenhuma sugestão' + (nome ? ' para esta linha' : '') + '</div>';
    drop.classList.add('open');
    return;
  }

  drop.innerHTML = '<div class="codsug-h">' + (nq ? 'Códigos que combinam' : 'Códigos desta linha') + '</div>'
    + list.map(function(c) {
        var nomeTxt = c.nomes.length ? c.nomes[0] + (c.nomes.length > 1 ? ' +' + (c.nomes.length - 1) : '') : '';
        var right = c._score >= 100 ? '<span class="codsug-tag">mesma linha</span>'
                                    : '<span class="codsug-nome">' + esc(nomeTxt) + '</span>';
        return '<div class="codsug-i" data-cod="' + esc(c.cod) + '"><span class="codsug-cod">' + hl(c.cod, q) + '</span>' + right + '</div>';
      }).join('');
  drop.classList.add('open');
  drop.querySelectorAll('.codsug-i').forEach(function(el) {
    el.addEventListener('mousedown', function(ev) {
      ev.preventDefault();
      document.getElementById('fCod').value = el.getAttribute('data-cod');
      drop.classList.remove('open');
    });
  });
}

function salvarEsquema() {
  var nome  = document.getElementById('fNome').value.trim();
  var cod   = document.getElementById('fCod').value.trim();
  var hor   = document.getElementById('fHor').value.trim();
  var sent  = document.getElementById('fSent').value;
  if (!nome) { toast('Nome da linha é obrigatório.', 'error'); return; }

  var btn = document.getElementById('btnSalvEsq');
  btn.disabled = true;
  var dados = { nomeLinha: nome, horario: hor, sentido: sent, codLinha: cod };

  if (_isNovo) {
    loading('Criando esquema…');
    google.script.run
      .withSuccessHandler(function(r) {
        doneLoading();
        btn.disabled = false;
        var novoEsq = { id_esquema: String(r.id), nome_linha: nome, horario: hor, sentido: sent, cod_linha: cod };
        _esqs.push(novoEsq);
        _isNovo = false;
        document.getElementById('btnNovo').style.display = ''; // restaura sempre
        if (_voltaMode && _voltaSnapshot) {
          _voltaMode = false;
          var snap = _voltaSnapshot;
          _voltaSnapshot = null;
          _aplicarVoltaESpelhar(novoEsq, snap);
        } else {
          selecionarEsq(novoEsq);
          toast('Esquema #' + r.id + ' criado!', 'success');
        }
      })
      .withFailureHandler(function(e) {
        doneLoading(); btn.disabled = false;
        toast('Erro: ' + (e.message || e), 'error');
      })
      .criarEsquema(dados);
  } else {
    loading('Atualizando esquema…');
    google.script.run
      .withSuccessHandler(function() {
        doneLoading();
        btn.disabled = false;
        _sel.nome_linha = nome; _sel.horario = hor; _sel.sentido = sent; _sel.cod_linha = cod;
        renderBadge(_sel);
        _updateHdrEsq(_sel);
        var _c = _codLinhaTxt(_sel);
        document.getElementById('esqSearch').value = _sel.id_esquema + ' — ' + _sel.nome_linha + (_c ? ' (' + _c + ')' : '');
        toast('Esquema atualizado!', 'success');
      })
      .withFailureHandler(function(e) {
        doneLoading(); btn.disabled = false;
        toast('Erro: ' + (e.message || e), 'error');
      })
      .atualizarEsquema(_sel.id_esquema, dados);
  }
}

function carregarPontos(idEsq) {
  loading('Carregando pontos…');

    .withSuccessHandler(function(pontos) {
      doneLoading();
      _seq = pontos.map(function(p) {
        var l = _lMap[String(p.idPonto)] || {};
        // Nome exibido = o guardado no esquema (nomePonto); LOCAIS é só fallback.
        return { idPonto: p.idPonto, nomePonto: (p.nomePonto || l.descricao), tipo: p.tipo || '', lat: l.lat || null, lng: l.lng || null, isNew: false };
      });
      _seqDirt        = false;
      _osrmLegs       = undefined;
      _osrmSeqKey     = '';
      _osrmGeometry   = null;
      _osrmLegGeoms   = null;
      _comercialTimes = {};
      pontos.forEach(function(p) {
        var t = _normalizeHHMM(p.horarioComercial);
        if (t) _comercialTimes[p.idPonto] = t;
      });
      _tiposParada = {};
      pontos.forEach(function(p) {
        _tiposParada[p.idPonto] = { troca: !!p.troca, abastecimento: !!p.abastecimento, alimentacao: !!p.alimentacao };
      });
      // tempo_local não é mais usado como fallback: parada vem da aba e, fora
      // dela, do padrão fixo de 30 min. _customStopTimes só guarda edições da sessão.
      _customStopTimes = {};
      _legVia = {}; _legVelPers = {};
      pontos.forEach(function(p) { _setLegViaRaw(p.idPonto, p.tipoTrecho); });
      try {
        var lsVia = JSON.parse(localStorage.getItem('vc_legVia_' + _sel.id_esquema) || '{}');
        Object.keys(lsVia).forEach(function(k) { if (!_legVia[k]) _setLegViaRaw(k, lsVia[k]); });
      } catch(e) {}
      _horStartIdx    = 0;
      _seqHintPending = true;
      renderSeq();
      updateInsAfter();
      updateMap();
      _updateImportBtn();
      document.getElementById('ptCard').style.display = '';
      document.getElementById('ptUnsaved').style.display = 'none';
      document.getElementById('btnSalvSeq').disabled = true;
      document.getElementById('hdrViewToggle').style.display = 'flex';

      document.getElementById('btnVolta').style.display  = '';
      document.getElementById('btnAnalisar').style.display = 'inline-flex';
      fecharModalEsquema();
      // Restaura config imediatamente (com _tipoViaVel padrão) para renderHorario ter os valores certos
      _restoreHorConfig(_sel);
      var savedView = 'mapa';
      try { savedView = localStorage.getItem('vc_view') || 'mapa'; } catch(e) {}
      toggleView(savedView);
      // Após carregar velocidades da planilha, atualiza e re-renderiza se necessário
      var _selSnap = _sel;
      google.script.run
        .withSuccessHandler(function(v) {
          if (!v || _sel !== _selSnap) return;
          _tipoViaVel = v;
          // Re-aplica customizações do usuário salvas no localStorage (prioridade sobre backend)
          try {
            var _lsCfg = JSON.parse(localStorage.getItem('vc_horcfg_' + _selSnap.id_esquema) || 'null');
            if (_lsCfg && _lsCfg.viaVel) {
              Object.keys(_lsCfg.viaVel).forEach(function(k) { _tipoViaVel[k] = _lsCfg.viaVel[k]; });
            }
          } catch(e) {}
          // Atualiza o campo de velocidade para o tipo ativo
          var via = '';
          document.querySelectorAll('.hor-preset-btn').forEach(function(b) {
            if (b.classList.contains('active')) via = b.textContent.trim();
          });
          var viaKey = _VIA_LABEL_TO_KEY[via] || via;
          if (via && _tipoViaVel[viaKey]) {
            document.getElementById('horVelMedia').value = _tipoViaVel[viaKey];
          }
          if (_view === 'horario') _lastCalc ? _partialUpdateSchedule() : renderHorario();
        })
        .getTipoViaVelocidades(_selSnap.id_esquema);
    })
    .withFailureHandler(function(e) {
      doneLoading();
      toast('Erro ao carregar pontos: ' + (e.message || e), 'error');
    })
    .getPontosEsquemaParaFormulario(idEsq);
}

// ============================================================
//  Sequence
// ============================================================
var _seqHintPending = false; // dispara a dica de arraste uma vez ao abrir o esquema
function renderSeq() {
  var list = document.getElementById('seqList');
  var savedScroll = list ? list.scrollTop : 0;
  document.getElementById('ptCount').textContent = _seq.length;

  if (!_seq.length) {
    list.innerHTML = '<div class="seq-empty">Nenhum ponto. Busque acima para adicionar.</div>';
    return;
  }

  function dividerHtml(afterIdx) {
    return '<div class="seq-insert" data-after="' + afterIdx + '">'
      + '<div class="seq-insert-line"></div>'
      + '<span class="seq-insert-btn">+ inserir</span>'
      + '<div class="seq-insert-line"></div>'
      + '</div>';
  }

  var parts = [dividerHtml(-1)];
  _seq.forEach(function(p, i) {
    parts.push(
      '<div class="seq-item' + (p.isNew ? ' is-new' : '') + '" draggable="true" data-idx="' + i + '">'
      + '<span class="seq-drag" title="Arrastar para reordenar">⠿</span>'
      + '<span class="seq-num">' + (i + 1) + '</span>'
      + '<div class="seq-info">'
        + '<div class="seq-name" title="' + esc(p.nomePonto) + '">' + esc(p.nomePonto) + '</div>'
        + (p.tipo ? '<div class="seq-tipo">' + esc(p.tipo) + '</div>' : '')
      + '</div>'
      + (p.isNew ? '<span class="seq-new">novo</span>' : '')
      + '<button class="btn-icon rm" data-idx="' + i + '" title="Remover">' + ico('x',13) + '</button>'
      + '</div>'
    );
    parts.push(dividerHtml(i));
  });
  list.innerHTML = parts.join('');
  list.scrollTop = savedScroll;

  // Dica de arraste: roda só uma vez ao abrir o esquema (não a cada reorder).
  if (_seqHintPending && _seq.length) {
    _seqHintPending = false;
    list.classList.add('seq-hint');
    setTimeout(function() { var l = document.getElementById('seqList'); if (l) l.classList.remove('seq-hint'); }, 2600);
  }

  list.querySelectorAll('.seq-insert').forEach(function(el) {
    el.addEventListener('click', function() {
      _setInsAfter(el.getAttribute('data-after'));
      document.getElementById('ptSearch').focus();
    });
  });

  list.querySelectorAll('.btn-icon.rm').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      _seq.splice(parseInt(btn.getAttribute('data-idx')), 1);
      _activeHorRow = null;
      dirtySeq(); renderSeq(); updateInsAfter(); updateMap();
    });
  });

  var dragIdx = null;
  list.querySelectorAll('.seq-item').forEach(function(item) {
    item.addEventListener('dragstart', function(e) {
      dragIdx = parseInt(item.getAttribute('data-idx'));
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(function() { item.classList.add('dragging'); }, 0);
    });
    item.addEventListener('dragend', function() {
      item.classList.remove('dragging');
      list.querySelectorAll('.seq-item').forEach(function(el) { el.classList.remove('drag-over'); });
      dragIdx = null;
    });
    item.addEventListener('dragover', function(e) {
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      list.querySelectorAll('.seq-item').forEach(function(el) { el.classList.remove('drag-over'); });
      item.classList.add('drag-over');
    });
    item.addEventListener('drop', function(e) {
      e.preventDefault();
      var toIdx = parseInt(item.getAttribute('data-idx'));
      if (dragIdx === null || dragIdx === toIdx) return;
      var moved = _seq.splice(dragIdx, 1)[0];
      _seq.splice(toIdx, 0, moved);
      _pendingSelectIdx = toIdx;
      dirtySeq(); renderSeq(); updateInsAfter(); updateMap();
    });
  });
}

// Valor atual do "Inserir após" ('-1' = início; senão índice do ponto). Fonte
// de verdade do dropdown customizado (substitui o antigo <select>.value).
var _insAfterVal = '-1';
function _getInsAfter() { return parseInt(_insAfterVal, 10); }

function _setInsAfter(v) {
  _insAfterVal = String(v);
  _setInsAfterTxt();
  var wrap = document.getElementById('insAfterWrap');
  if (wrap) wrap.querySelectorAll('.cs-opt').forEach(function(el) {

function _setInsAfterTxt() {

function _toggleInsAfterDrop(ev) {

function _selectInsAfter(v) {

function updateInsAfter() {
  var drop = document.getElementById('insAfterDrop');

  drop.innerHTML = '<div class="cs-opt" role="option" data-idx="-1" onclick="_selectInsAfter(\'-1\')"><span class="cs-opt-num">↑</span>No início da sequência</div>'
    + _seq.map(function(p, i) {
        return '<div class="cs-opt" role="option" data-idx="' + i + '" onclick="_selectInsAfter(\'' + i + '\')"><span class="cs-opt-num">' + (i + 1) + '</span>' + esc(p.nomePonto) + '</div>';
      }).join('');
  var novo = (prev !== '-1' && parseInt(prev, 10) < _seq.length) ? prev : (_seq.length > 0 ? String(_seq.length - 1) : '-1');
  _setInsAfter(novo);
}
