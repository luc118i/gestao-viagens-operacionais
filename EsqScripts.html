function salvarTudo() {
  var salvouEsq = false;
  var nomeVal = (document.getElementById('fNome').value || '').trim();
  var formVis = document.getElementById('esqForm').style.display !== 'none';
  if (formVis && nomeVal) {
    salvouEsq = true;
    salvarEsquema();
  }
  if (_seqDirt) {
    salvarSeq();
  }
  if (!salvouEsq && !_seqDirt) {
    toast('Nenhuma alteração pendente.', 'info');
  }
}

// ============================================================
//  Point search
// ============================================================
function setupPtSearch() {
  var inp  = document.getElementById('ptSearch');
  var drop = document.getElementById('ptDrop');
  inp.addEventListener('focus', function() { renderPts(this.value); });
  inp.addEventListener('input', function() { renderPts(this.value); });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('#ptSearch') && !e.target.closest('#ptDrop'))
      drop.classList.remove('open');
  });
  document.getElementById('btnSalvSeq').addEventListener('click', salvarSeq);
}

function renderPts(q) {
  var drop = document.getElementById('ptDrop');
  var nq   = norm(q);
  var list = _locais.filter(function(l) {
    return !nq
      || norm(l.descricao).includes(nq)
      || norm(l.tipo || '').includes(nq)
      || norm(l.codigo).includes(nq);
  }).slice(0, 80);

  // ── ANTT context ──────────────────────────────────────────────
  _updateAnttWarnBar();
  var nearLimit = _anttStatus && _anttStatus.accumKm > ANTT_WARN_KM;
  var insertIdx = _getInsAfter() || 0;
  var refPt     = _seq[insertIdx] || null; // último ponto antes da inserção

  // Fase 3 — Ordena apoio para o topo quando próximo do limite
  if (nearLimit) {
    list.sort(function(a, b) {
      var aA = _isApoioCandidate(a.descricao), bA = _isApoioCandidate(b.descricao);
      return (aA === bA) ? 0 : aA ? -1 : 1;
    });
  }

  if (!list.length) {
    drop.innerHTML = '<div class="sd-empty">Nenhum resultado</div>';
  } else {
    var seqIdx = {};
    _seq.forEach(function(p, i) { seqIdx[p.idPonto] = i + 1; });

    drop.innerHTML = list.map(function(l) {
      var pos       = seqIdx[l.codigo];
      var jaNo      = pos !== undefined;
      var isApoioT  = _isApoioCandidate(l.descricao);
      var apoioBadge = isApoioT
        ? '<span class="sdi-apoio-badge">apoio</span>'
        : '';

      // Fase 4 — Estimativa de distância (straight-line × 1.3)
      var distChip = '';
      if (nearLimit && isApoioT && l.lat && l.lng && refPt && refPt.lat && refPt.lng) {
        var linKm  = _haversinKm(refPt.lat, refPt.lng, l.lat, l.lng);
        var estKm  = Math.round(linKm * 1.3);
        var total  = _anttStatus.accumKm + estKm;
        distChip = total <= ANTT_MAX_KM
          ? '<span class="antt-dist-ok">~' + estKm + 'km · cabe</span>'
          : '<span class="antt-dist-warn">~' + estKm + 'km · passa</span>';
      }

      return '<div class="sdi' + (jaNo ? ' off' : '') + '" data-cod="' + esc(l.codigo) + '">'
        + '<div class="sdi-main">'
          + hl(l.descricao, q)
          + (jaNo ? ' <span style="font-size:9px;background:#e3f2fd;color:#1565c0;border:1px solid #90caf9;border-radius:3px;padding:0 5px;">pos. ' + pos + '</span>' : '')
          + apoioBadge
        + '</div>'
        + '<div class="sdi-meta">'
          + hl(l.codigo, q) + (l.tipo ? ' · ' + esc(l.tipo) : '')
          + (l.lat ? '' : ' <span style="color:#f87171;font-size:10px;">sem coord.</span>')
          + distChip
        + '</div>'
        + '</div>';
    }).join('');
  }

  drop.classList.add('open');
  drop.querySelectorAll('.sdi:not(.off)').forEach(function(el) {
    el.addEventListener('mousedown', function(ev) {
      ev.preventDefault();
      var cod   = el.getAttribute('data-cod');
      var found = _locais.find(function(l) { return l.codigo === cod; });
      if (found) addPonto(found);
    });
  });
}

// ============================================================
//  Preencher esquema a partir de um print do itinerário comercial
//  (lê a imagem via IA de visão, casa com os locais e pede revisão)
// ============================================================
// HTML da zona de colar exibida no centro quando o esquema está vazio.
function _itinPasteZoneHtml() {
  return '<div class="itin-paste" id="itinPasteZone" tabindex="0">'
    + '<div class="itin-paste-ico">'
    +   '<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>'
    + '</div>'
    + '<div class="itin-paste-title">Cole aqui o print do itinerário</div>'
    + '<div class="itin-paste-sub">Tire um print do <strong>Mapa de Viagem</strong> e pressione <kbd>Ctrl</kbd> + <kbd>V</kbd> &nbsp;·&nbsp; ou arraste a imagem para esta área.</div>'
    + '</div>';
}

// Liga o arrastar-e-soltar na zona (o Ctrl+V é tratado por um listener global).
function _bindItinDropZone() {
  var zone = document.getElementById('itinPasteZone');
  if (!zone) return;
  ['dragenter', 'dragover'].forEach(function(ev) {
    zone.addEventListener(ev, function(e) { e.preventDefault(); zone.classList.add('dragging'); });
  });
  ['dragleave', 'dragend'].forEach(function(ev) {
    zone.addEventListener(ev, function() { zone.classList.remove('dragging'); });
  });
  zone.addEventListener('drop', function(e) {
    e.preventDefault();
    zone.classList.remove('dragging');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) _processarImagemItinerario(f);
  });
}

// Lê a imagem (de paste ou drop), reduz e envia para a extração.
function _processarImagemItinerario(file) {
  if (!file || !/^image\//.test(file.type)) { toast('O conteúdo colado não é uma imagem.', 'error'); return; }
  var reader = new FileReader();
  reader.onload = function(ev) {
    _downscaleDataUrl(ev.target.result, 1600, function(small) { _enviarPrintItinerario(small); });
  };
  reader.onerror = function() { toast('Não foi possível ler a imagem.', 'error'); };
  reader.readAsDataURL(file);
}

// Ctrl+V em qualquer lugar do editor, com o esquema vazio, cola o print.
document.addEventListener('paste', function(e) {
  if (!_sel || _seq.length) return;                    // só com esquema selecionado e vazio
  var home = document.getElementById('homeScreen');
  if (home && home.classList.contains('open')) return; // não interfere na home
  if (document.getElementById('itinOverlay')) return;  // modal de revisão já aberto
  var items = (e.clipboardData && e.clipboardData.items) || [];
  for (var i = 0; i < items.length; i++) {
    if (items[i].type && items[i].type.indexOf('image') === 0) {
      var file = items[i].getAsFile();
      if (file) { e.preventDefault(); _processarImagemItinerario(file); return; }
    }
  }
});

// Reduz a imagem antes de enviar (limita custo/payload sem perder legibilidade).
function _downscaleDataUrl(dataUrl, maxDim, cb) {
  var img = new Image();
  img.onload = function() {
    var w = img.width, h = img.height, scale = Math.min(1, maxDim / Math.max(w, h));
    var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    var c = document.createElement('canvas'); c.width = cw; c.height = ch;
    c.getContext('2d').drawImage(img, 0, 0, cw, ch);
    try { cb(c.toDataURL('image/jpeg', 0.85)); } catch (e) { cb(dataUrl); }
  };
  img.onerror = function() { cb(dataUrl); };
  img.src = dataUrl;
}

function _enviarPrintItinerario(dataUrl) {
  loading('Lendo o print do itinerário…');
  google.script.run
    .withSuccessHandler(function(r) {
      doneLoading();
      if (!r || r.erro) { toast(r && r.erro ? r.erro : 'Falha ao ler a imagem.', 'error'); return; }
      if (!r.paradas || !r.paradas.length) { toast('Nenhuma parada encontrada na imagem.', 'error'); return; }
      _abrirRevisaoItinerario(r.paradas);
    })
    .withFailureHandler(function(e) { doneLoading(); toast('Erro: ' + (e.message || e), 'error'); })
    .extrairItinerarioDeImagem(dataUrl);
}

// Casa uma parada (cidade + UF) com os locais cadastrados. Devolve os melhores
// candidatos (até 8), o primeiro sendo o mais provável.
function _matchLocalParaParada(cidade, uf) {
  var nc = norm(cidade), nu = norm(uf);
  var words = nc.split(/\s+/).filter(function(w) { return w.length > 2; });
  return _locais.map(function(l) {
    var nd = norm(l.descricao);
    var score = 0;
    if (nc && nd.indexOf(nc) !== -1) score += 12;                 // cidade inteira como substring
    words.forEach(function(w) { if (nd.indexOf(w) !== -1) score += 3; });
    if (nu && new RegExp('(^|[^a-z])' + nu + '([^a-z]|$)').test(nd)) score += 5;   // UF presente
    if (/rodoviari/.test(nd)) score += 1;                         // leve preferência por rodoviárias
    return { l: l, score: score };
  }).filter(function(x) { return x.score >= 8; })
    .sort(function(a, b) { return b.score - a.score; })
    .slice(0, 8)
    .map(function(x) { return x.l; });
}

function _abrirRevisaoItinerario(paradas) {
  _fecharRevisaoItinerario();

  var rows = paradas.map(function(p, i) {
    var cands = _matchLocalParaParada(p.cidade, p.uf);
    var best  = cands.length ? cands[0] : null;
    // Campo de busca (combobox) por linha: input mostra o local escolhido, o
    // código real fica em data-cod; o dropdown é compartilhado (position fixed).
    var pick = '<div class="itin-pick" data-cod="' + (best ? esc(best.codigo) : '') + '">'
      + '<input class="itin-pick-input" type="text" autocomplete="off" placeholder="Buscar local…" '
      +   'value="' + (best ? esc(best.descricao) : '') + '" />'
      + '</div>';
    return '<div class="itin-row' + (best ? '' : ' unmatched') + '">'
      + '<span class="itin-rownum">' + (i + 1) + '</span>'
      + '<div class="itin-detected">'
      +   '<div class="itin-cidade">' + esc(p.cidade) + (p.uf ? ' - ' + esc(p.uf) : '') + '</div>'
      +   '<div class="itin-orig">' + (best ? 'detectado no print' : '⚠ sem correspondência — escolha o local') + '</div>'
      + '</div>'
      + pick
      + '<input class="itin-hora" type="text" value="' + esc(p.hora || '') + '" placeholder="HH:MM" maxlength="5" />'
      + '</div>';
  }).join('');

  var html = '<div id="itinOverlay" class="itin-overlay">'
    + '<div class="itin-modal">'
    +   '<div class="itin-head">'
    +     '<div class="itin-title">' + ico('map-pin', 16) + ' Revisar itinerário detectado</div>'
    +     '<button class="itin-x" onclick="_fecharRevisaoItinerario()">' + ico('x', 16) + '</button>'
    +   '</div>'
    +   '<div class="itin-sub">Confira cada parada e o local correspondente. Ajuste o que precisar; o que ficar sem local não entra na sequência.</div>'
    +   '<div class="itin-list" id="itinRevList">' + rows + '</div>'
    +   '<div class="itin-foot">'
    +     '<span class="itin-count">' + paradas.length + ' paradas detectadas</span>'
    +     '<div style="display:flex;gap:8px;">'
    +       '<button class="btn btn-ghost" onclick="_fecharRevisaoItinerario()">Cancelar</button>'
    +       '<button class="btn btn-dark" onclick="_aplicarItinerario()">Preencher esquema</button>'
    +     '</div>'
    +   '</div>'
    + '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  var ov = document.getElementById('itinOverlay');
  ov.addEventListener('click', function(e) { if (e.target === ov) _fecharRevisaoItinerario(); });

  // Dropdown compartilhado (fora do modal para não ser cortado pelo overflow).
  var drop = document.createElement('div');
  drop.id = 'itinPickDrop';
  drop.className = 'sd itin-pick-drop';
  document.body.appendChild(drop);

  _bindItinPicks(ov);
}

// ── Combobox de local (busca) na revisão do itinerário ──────────
var _itinActivePick = null;     // .itin-pick em edição no momento

function _bindItinPicks(modal) {
  modal.querySelectorAll('.itin-pick-input').forEach(function(inp) {
    inp.addEventListener('focus', function() {
      var wrap = inp.closest('.itin-pick');
      if (_itinActivePick && _itinActivePick !== wrap) _revertItinPick(_itinActivePick);
      _itinActivePick = wrap;
      _positionItinDrop(inp);
      _renderItinPick('');        // ao focar, mostra todos
      inp.select();
    });
    inp.addEventListener('input', function() {
      _itinActivePick = inp.closest('.itin-pick');
      _positionItinDrop(inp);
      _renderItinPick(inp.value);
    });
    // Reabre ao clicar num input já focado (após uma seleção que fechou o drop).
    inp.addEventListener('click', function() {
      var drop = document.getElementById('itinPickDrop');
      if (drop && !drop.classList.contains('open')) {
        _itinActivePick = inp.closest('.itin-pick');
        _positionItinDrop(inp);
        _renderItinPick('');
        inp.select();
      }
    });
  });
  var listEl = modal.querySelector('.itin-list');
  if (listEl) listEl.addEventListener('scroll', _closeItinPickDrop);
}

function _renderItinPick(q) {
  var drop = document.getElementById('itinPickDrop');
  if (!drop) return;
  var nq = norm(q);
  var list = _locais.filter(function(l) {
    return !nq || norm(l.descricao).includes(nq) || norm(l.codigo).includes(nq) || norm(l.tipo || '').includes(nq);
  }).slice(0, 60);

  var items = '<div class="sdi itin-pick-ignore" data-cod="">— Ignorar esta parada —</div>';
  if (!list.length && nq) {
    items += '<div class="sd-empty">Nenhum local encontrado</div>';
  } else {
    items += list.map(function(l) {
      return '<div class="sdi" data-cod="' + esc(l.codigo) + '">'
        + '<div class="sdi-main">' + hl(l.descricao, q) + '</div>'
        + '<div class="sdi-meta">' + hl(l.codigo, q) + (l.tipo ? ' · ' + esc(l.tipo) : '') + '</div>'
        + '</div>';
    }).join('');
  }
  drop.innerHTML = items;
  drop.classList.add('open');
}

function _positionItinDrop(input) {
  var d = document.getElementById('itinPickDrop');
  if (!d) return;
  var r = input.getBoundingClientRect();
  var below = window.innerHeight - r.bottom - 8;
  d.style.left  = r.left + 'px';
  d.style.width = r.width + 'px';
  if (below < 180 && r.top > below) {            // não cabe abaixo → abre acima
    d.style.top = 'auto';
    d.style.bottom = (window.innerHeight - r.top + 4) + 'px';
  } else {
    d.style.bottom = 'auto';
    d.style.top = (r.bottom + 4) + 'px';
  }
}

function _setItinPick(wrap, cod) {
  wrap.dataset.cod = cod || '';
  var input = wrap.querySelector('.itin-pick-input');
  var row   = wrap.closest('.itin-row');
  if (cod) {
    var l = _locais.find(function(x) { return x.codigo === cod; });
    input.value = l ? l.descricao : '';
    if (row) row.classList.remove('unmatched', 'ignored');
  } else {
    input.value = '';
    if (row) { row.classList.add('ignored'); row.classList.remove('unmatched'); }
  }
}

// Texto do input volta a refletir o código já escolhido (descarta busca não confirmada).
function _revertItinPick(wrap) {
  var cod = wrap.dataset.cod;
  var l   = cod ? _locais.find(function(x) { return x.codigo === cod; }) : null;
  wrap.querySelector('.itin-pick-input').value = l ? l.descricao : '';
}

function _closeItinPickDrop() {
  var d = document.getElementById('itinPickDrop');
  if (d) d.classList.remove('open');
  _itinActivePick = null;
}

// Seleção/fechamento do combobox (um listener global, ativo só com o modal aberto).
document.addEventListener('mousedown', function(e) {
  if (!document.getElementById('itinOverlay')) return;
  var drop = document.getElementById('itinPickDrop');
  if (drop && drop.contains(e.target)) {
    var it = e.target.closest('.sdi');
    if (it && _itinActivePick) {
      e.preventDefault();                         // mantém o foco no input
      _setItinPick(_itinActivePick, it.getAttribute('data-cod'));
      _closeItinPickDrop();
    }
    return;
  }
  if (_itinActivePick && _itinActivePick.contains(e.target)) return;  // clicou no próprio input
  if (_itinActivePick) { _revertItinPick(_itinActivePick); _closeItinPickDrop(); }
});

function _fecharRevisaoItinerario() {
  var ov = document.getElementById('itinOverlay');
  if (ov) ov.remove();
  var drop = document.getElementById('itinPickDrop');
  if (drop) drop.remove();
  _itinActivePick = null;
}

function _aplicarItinerario() {
  var rows  = document.querySelectorAll('#itinRevList .itin-row');
  var novos = [], times = {};
  rows.forEach(function(r) {
    var cod = r.querySelector('.itin-pick').dataset.cod;
    if (!cod) return;                                   // sem local → ignorada
    var l = _locais.find(function(x) { return x.codigo === cod; });
    if (!l) return;
    novos.push({ idPonto: l.codigo, nomePonto: l.descricao, tipo: l.tipo || '',
                 lat: l.lat || null, lng: l.lng || null, isNew: true });
    var hm = (r.querySelector('.itin-hora').value || '').match(/(\d{1,2}):(\d{2})/);
    if (hm) times[l.codigo] = ('0' + hm[1]).slice(-2) + ':' + hm[2];
  });
  if (!novos.length) { toast('Selecione ao menos uma parada para preencher.', 'info'); return; }

  _seq = novos;
  Object.keys(times).forEach(function(k) { _comercialTimes[k] = times[k]; });
  _fecharRevisaoItinerario();
  dirtySeq(); renderSeq(); updateInsAfter(); updateMap();
  toast(novos.length + ' paradas preenchidas. Revise os horários e salve.', 'success', 4000);
}

function addPonto(local) {
  document.getElementById('ptDrop').classList.remove('open');
  document.getElementById('ptSearch').value = '';
  var after = _getInsAfter();
  _seq.splice(after + 1, 0, {
    idPonto: local.codigo, nomePonto: local.descricao,
    tipo: local.tipo || '', lat: local.lat || null, lng: local.lng || null, isNew: true
  });
  _pendingSelectIdx = after + 1;
  dirtySeq(); renderSeq(); updateInsAfter(); updateMap();
  _setInsAfter(after + 1);
}

/** Adiciona ponto sempre no final da sequência (usado pelas sugestões ANTT no painel lateral). */
function addPontoNoFim(local) {
  var insertAt = _seq.length; // índice após o último
  _seq.push({
    idPonto: local.codigo, nomePonto: local.descricao,
    tipo: local.tipo || '', lat: local.lat || null, lng: local.lng || null, isNew: true
  });
  _pendingSelectIdx = insertAt;
  dirtySeq(); renderSeq(); updateInsAfter(); updateMap();
  _setInsAfter(insertAt);
  var list = document.getElementById('seqList');
  if (list) list.scrollTop = list.scrollHeight;
}

/**
 * Para cada par consecutivo (A, B) da sequência, calcula o "desvio extra"
 * que X causaria: dist(A,X) + dist(X,B) − dist(A,B).
 * Retorna o índice i tal que X deve ser inserido APÓS _seq[i].
 */
function _findBestInsertIdx(lat, lng) {
  if (_seq.length <= 1) return 0;
  var best = 0, bestScore = Infinity;
  for (var i = 0; i < _seq.length - 1; i++) {
    var a = _seq[i], b = _seq[i + 1];
    if (!a.lat || !a.lng || !b.lat || !b.lng) continue;
    var dAX = _haversinKm(+a.lat, +a.lng, lat, lng);
    var dXB = _haversinKm(lat, lng, +b.lat, +b.lng);
    var dAB = _haversinKm(+a.lat, +a.lng, +b.lat, +b.lng);
    var score = dAX + dXB - dAB;
    if (score < bestScore) { bestScore = score; best = i; }
  }
  return best;
}

/**
 * Adiciona ponto na posição geográfica correta da sequência
 * (critério de mínimo desvio). Usado pelos pins de sugestão ANTT no mapa.
 */
function addPontoNoMapa(local) {
  if (!local.lat || !local.lng) { addPontoNoFim(local); return; }
  var afterIdx = _findBestInsertIdx(+local.lat, +local.lng);
  _seq.splice(afterIdx + 1, 0, {
    idPonto: local.codigo, nomePonto: local.descricao,
    tipo: local.tipo || '', lat: local.lat || null, lng: local.lng || null, isNew: true
  });
  _pendingSelectIdx = afterIdx + 1;
  dirtySeq(); renderSeq(); updateInsAfter(); updateMap();
  _setInsAfter(afterIdx + 1);
  // Rola a lista até o item inserido
  var list = document.getElementById('seqList');
  if (list) {
    var item = list.querySelector('[data-idx="' + (afterIdx + 1) + '"]');
    if (item) item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    else list.scrollTop = (afterIdx + 1) * 48;
  }
}

// ============================================================
//  Save sequence
// ============================================================
function salvarSeq() {
  if (!_sel) { toast('Selecione um esquema.', 'error'); return; }
  var btn = document.getElementById('btnSalvSeq');
  btn.disabled = true; btn.textContent = 'Salvando…';

  loading('Salvando sequência…');
  google.script.run
    .withSuccessHandler(function() {
      doneLoading();
      _seq.forEach(function(p) { p.isNew = false; });
      _seqDirt = false;
      document.getElementById('ptUnsaved').style.display = 'none';
      btn.textContent = 'Salvar Sequência';
      btn.disabled = true;
      var formVis = document.getElementById('esqForm').style.display !== 'none';
      var nomeVal = document.getElementById('fNome').value.trim();
      if (!formVis || !nomeVal) {
        var s = document.getElementById('btnSalvar');
        if (s) s.disabled = true;
      }
      renderSeq();
      toast('Sequência salva! (' + _seq.length + ' pontos)', 'success');
    })
    .withFailureHandler(function(e) {
      doneLoading();
      btn.disabled = false; btn.textContent = 'Salvar Sequência';
      toast('Erro ao salvar: ' + (e.message || e), 'error');
    })
    .salvarSequenciaPontos(_sel.id_esquema, _seq.map(function(p, idx) {
      var flags = _tiposParada[p.idPonto] || {};
      return {
        idPonto: p.idPonto, nomePonto: p.nomePonto, tipo: p.tipo || '',
        horarioComercial: _comercialTimes[p.idPonto] || '',
        // Sempre grava o tempo efetivo (edição manual ou calculado pela regra
        // TEMPO_PERMANENCIA + bônus) — não deixa mais tempo_local vazio quando
        // não há override, pra downstream (app de consulta, relatórios) ler
        // direto sem duplicar a regra.
        tempoLocal: _getStopTime(idx, p.tipo),
        tipoTrecho: _legViaSerialized(p.idPonto),
        troca: !!flags.troca, abastecimento: !!flags.abastecimento, alimentacao: !!flags.alimentacao
      };
    }));
}

// ============================================================
//  Utils
// ============================================================
function norm(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
}
function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function hl(text, q) {
  if (!q) return esc(text);
  var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return esc(text).replace(re, '<mark>$1</mark>');
}
function loading(msg) {
  document.getElementById('ovlMsg').textContent = msg || 'Aguarde…';
  document.getElementById('ovl').classList.add('on');
}
function doneLoading() { document.getElementById('ovl').classList.remove('on'); }
function toast(msg, type, dur) {
  var w = document.getElementById('toastWrap');
  var t = document.createElement('div');
  t.className = 'toast ' + (type || 'info');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(function() {
    t.style.opacity = '0'; t.style.transition = 'opacity 0.3s';
    setTimeout(function() { t.remove(); }, 360);
  }, dur || 4000);
}
</script>
