<script>
// ============================================================
//  Estado
// ============================================================
var _esqs    = [];
var _locais  = [];
var _lMap    = {};
var _sel     = null;
var _seq     = [];
var _isNovo        = false;
var _seqDirt       = false;
var _voltaMode     = false;  // true quando criando viagem de volta
var _voltaSnapshot = null;   // { seq, legVia, customStopTimes } da viagem original

var _map     = null;
var _markers = [];
var _poly    = null;

// ============================================================
//  Horário — estado persistente
// ============================================================
var _view            = 'mapa';
var _comercialBase   = null;
var _comercialAbsMap = {};
var _lastCalc        = null;
var _pendingSelectIdx = null;
var _activeHorRow    = null;
var _pdfCols     = { chegada:true, parada:true, saida:true, desl:true, comercial:true, dif:true };
var _pdfMode     = 'normal';
var _pdfTitle    = '';
var _pdfSubtitle = '';
var _pdfPersonConfig = { formato: 'hhmm', pontos: null }; // pontos: null = todos; { idPonto: bool } = seleção manual
var _osrmLegs        = undefined;
var _osrmSeqKey      = '';
var _osrmGeometry    = null;
var _osrmLegGeoms    = null;   // geometria real (curva) de cada leg — [[lat,lng],...] por leg, ou null
var _comercialTimes  = {};
var _tiposParada     = {};   // { idPonto: { troca:bool, abastecimento:bool, alimentacao:bool } }
var _horStartIdx     = 0;
var _customStopTimes = {};
var _temposPermanencia = {};   // { codigoLocal: minutos } — vindo da aba TEMPO_PERMANENCIA
var _rotasAjust      = {};     // { "codA|codB": {km,min,motivo} } — ajustes de rota (2 sentidos)
var _rotasAjustList  = [];     // lista crua de ajustes (para a aba de gestão)
var _legVia          = {};
var _legVelPers      = {};     // { idPonto: km/h } — velocidade do trecho quando _legVia === 'Pers'
var _tipoViaVel      = { BR: 85, Est: 75, Mun: 60, Urb: 45 };
var _VIA_LABEL_TO_KEY = { 'BR': 'BR', 'Estadual': 'Est', 'Municipal': 'Mun', 'Urbana': 'Urb' };

// Trechos personalizados guardam a velocidade embutida no valor de tipo_trecho
// (ex.: "Pers:72"), reaproveitando a coluna existente sem mexer no esquema da planilha.
var _PERS_RE = /^Pers:(\d+(?:\.\d+)?)$/i;

// Aplica um valor bruto de tipo_trecho (ex.: 'BR' ou 'Pers:72') aos mapas de trecho.
function _setLegViaRaw(idPonto, raw) {
  raw = String(raw || '').trim();
  if (!raw) return;
  var m = _PERS_RE.exec(raw);
  if (m) { _legVia[idPonto] = 'Pers'; _legVelPers[idPonto] = parseFloat(m[1]); }
  else   { _legVia[idPonto] = raw; }
}

// Serializa o tipo de trecho de um ponto para persistência (ex.: 'Pers:72').
function _legViaSerialized(idPonto) {
  var v = _legVia[idPonto];
  if (!v) return '';
  if (v === 'Pers') {
    var vel = _legVelPers[idPonto];
    return (vel > 0) ? 'Pers:' + vel : '';
  }
  return v;
}

// Persiste o estado de vias (incluindo velocidade personalizada) no localStorage.
function _persistLegVia() {
  if (!_sel) return;
  try {
    var out = {};
    Object.keys(_legVia).forEach(function(k){ var s = _legViaSerialized(k); if (s) out[k] = s; });
    localStorage.setItem('vc_legVia_' + _sel.id_esquema, JSON.stringify(out));
  } catch(e) {}
}
var _osrmStatus      = 'pending';
var _horSidebarHidden = (function(){ try { return localStorage.getItem('vc_hor_sidebar') === 'hidden'; } catch(e){ return false; } })();
var _horOsmHidden     = (function(){ try { return localStorage.getItem('vc_hor_osm')     === 'hidden'; } catch(e){ return false; } })();

// ── ANTT ──────────────────────────────────────────────────────
var ANTT_MAX_KM  = 495; // km — máximo entre pontos de apoio consecutivos (ANTT)
var ANTT_WARN_KM = 395; // km — aviso de proximidade ao limite
var ANTT_MIN_KM  = 30;  // km — pontos de apoio desnecessariamente próximos
var ANTT_TROCA_MAX_KM  = 660; // km — máximo entre pontos de Troca de Motorista (ANTT)
var ANTT_TROCA_WARN_KM = 560; // km — aviso de proximidade ao limite de troca
var _anttMap          = {};   // { rowIdx → { type, dist, fromNome } }
var _anttStatus       = null; // estado do fim da rota
var _anttTrocaMap     = {};   // { rowIdx → { type, dist, fromNome } } — limite de Troca de Motorista
var _anttTrocaStatus  = null;
var _anttWarnIdx      = -1;   // índice da linha com badge warn atual (para substituição por error)
var _anttSuggCands    = [];   // candidatos de sugestão calculados
var _anttSuggCacheKey = '';   // chave do último batch de cache consultado
var _stretchPolys     = [];   // Leaflet polylines para coloração de trechos ANTT (map view)
var _suggMapMarkers   = [];   // Leaflet markers para sugestões de apoio (map view)
var _anttMapActive    = false; // true quando overlays ANTT estão desenhados no mapa
var _legHoverPolys    = [];   // Leaflet polylines invisíveis (hover/click) com tempo+km+vel de cada trecho
var _mapMode          = (function(){ try { return localStorage.getItem('vc_mapMode') || 'antt'; } catch(e) { return 'antt'; } })();
var _comercialPolys       = [];   // Leaflet polylines de coloração do Modo Comercial (map view)
var _comercialWarnMarkers = [];   // Leaflet markers ⚠ (velocidade irreal) do Modo Comercial

// Tempo de parada (minutos) por tipo de ponto
var STOP_TIMES = {
  RODOVIARIA: 15, TERMINAL: 15, RODOVIARIO: 15,
  GARAGEM: 20,
  POSTO: 20, POSTO_COMBUSTIVEL: 20, ABASTECIMENTO: 20,
  PEDAGIO: 2, PEDAGIO_PARADA: 2,
  PONTO: 5, PARADA: 5
};
var STOP_DEFAULT = 5;
var MIN_LEG_TV   = 30;  // fallback de tempo só quando NÃO há distância real nenhuma (sem rota)
var MIN_LEG_KM   = 15;  // piso de distância p/ legs curtos com dado real — o tempo sai de km/vel, proporcional à velocidade configurada

function _stopTime(tipo) {
  if (!tipo) return STOP_DEFAULT;
  var t = tipo.trim().toUpperCase().replace(/\s+/g, '_').replace(/[^A-Z_]/g, '');
  for (var k in STOP_TIMES) {
    if (t.indexOf(k) !== -1) return STOP_TIMES[k];
  }
  return STOP_DEFAULT;
}

var STOP_PADRAO_MIN = 30;  // padrão para pontos fora da aba TEMPO_PERMANENCIA

// Minutos extras quando o ponto acumula operação além de Embarque/Desemb.
// (que já está embutido no tempo-base de TEMPO_PERMANENCIA/padrão).
var TIPO_PARADA_BONUS_MIN = { alimentacao: 30, troca: 15, abastecimento: 15 };

function _tiposParadaBonusMin(idPonto) {
  var flags = _tiposParada[idPonto];
  if (!flags) return 0;
  var bonus = 0;
  for (var k in TIPO_PARADA_BONUS_MIN) { if (flags[k]) bonus += TIPO_PARADA_BONUS_MIN[k]; }
  return bonus;
}

function _getStopTime(idx, tipo) {
  var key = _seq[idx] ? _seq[idx].idPonto : idx;
  if (_customStopTimes[key] !== undefined) return _customStopTimes[key];  // 1º edição manual — valor final, sem bônus

  var temComercial = !!_comercialTimes[key];
  var tagBonus = _tiposParadaBonusMin(key);

  // 2º TEMPO_PERMANENCIA (aba): tempo oficial do local; soma bônus só quando
  // o ponto também é embarque/desembarque (função a mais em cima da já existente).
  if (_temposPermanencia[key] !== undefined) {
    return _temposPermanencia[key] + (temComercial ? tagBonus : 0);
  }

  // 3º sem registro na aba:
  //    - é embarque/desembarque → 30 min padrão (baseline do embarque) + bônus das tags.
  //    - ponto de apoio puro (sem comercial) → o tempo vem só da soma das tags
  //      marcadas (zera o padrão fixo); sem tag nenhuma, cai nos 30 min padrão.
  if (temComercial) return STOP_PADRAO_MIN + tagBonus;
  return tagBonus > 0 ? tagBonus : STOP_PADRAO_MIN;
}

// Haversine client-side (km) — mantido para uso eventual no mapa
function _hvs(lat1, lng1, lat2, lng2) {
  var R = 6371, tr = function(d){ return d * Math.PI / 180; };
  var dLat = tr(lat2 - lat1), dLng = tr(lng2 - lng1);
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(tr(lat1))*Math.cos(tr(lat2))*
          Math.sin(dLng/2)*Math.sin(dLng/2);
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 10) / 10;
}

// Normaliza qualquer valor de horário para "HH:MM"
function _normalizeHHMM(val) {
  if (!val) return '';
  var s = String(val).trim();
  var m = s.match(/^(\d{1,2}):(\d{2})/);
  if (m) return ('0' + m[1]).slice(-2) + ':' + m[2];
  var dm = s.match(/\b(\d{1,2}):(\d{2}):\d{2}\b/);
  if (dm) return ('0' + dm[1]).slice(-2) + ':' + dm[2];
  return '';
}

// "HH:MM" → total minutos
function _p(s) {
  if (!s) return 0;
  var p = s.split(':'); return (+p[0] || 0) * 60 + (+p[1] || 0);
}
// total minutos → "HH:MM"
function _ms(m) {
  m = Math.round(m);
  var h = Math.floor(m / 60) % 24, mm = m % 60;
  return ('0' + h).slice(-2) + ':' + ('0' + mm).slice(-2);
}

// Diferença entre horário comercial e chegada calculada.
// Usa _comercialAbsMap quando disponível para rotas multi-dia.
function _diffMin(comVal, chegadaMin, idPonto) {
  if (idPonto !== undefined && _comercialAbsMap[idPonto] !== undefined) {
    return _comercialAbsMap[idPonto] - chegadaMin;
  }
  if (_comercialBase !== null) {
    var comElapsed = _p(comVal) - _comercialBase.comMin;
    while (comElapsed < 0) comElapsed += 1440;
    var calcElapsed = chegadaMin - _comercialBase.calcMin;
    return comElapsed - calcElapsed;
  }
  var base = chegadaMin % 1440;
  var diff = _p(comVal) - base;
  if (diff < -720) diff += 1440;
  if (diff >  720) diff -= 1440;
  return diff;
}

// Reconstrói _comercialBase e _comercialAbsMap incrementalmente.
function _recomputeComercialBase(c) {
  _comercialBase   = null;
  _comercialAbsMap = {};
  if (!c) return;
  var absMin    = null;
  var prevClock = null;
  for (var i = 0; i < c.pontos.length; i++) {
    var p = c.pontos[i];
    if (p.preDep || p.chegadaMin === null) continue;
    var idPonto = _seq[i].idPonto;
    var comVal  = _comercialTimes[idPonto] || '';
    if (!comVal) continue;
    var clock = _p(comVal);
    if (absMin === null) {
      absMin = clock;
      _comercialBase = { comMin: clock, calcMin: p.chegadaMin };
    } else {
      var delta = clock - prevClock;
      if (delta < 0) delta += 1440;
      absMin = absMin + delta;
    }
    prevClock = clock;
    _comercialAbsMap[idPonto] = absMin;
  }
}

// minutos → "Xh YYmin"
function _dur(m) {
  m = Math.round(m);
  if (!m || m < 1) return '—';
  var h = Math.floor(m / 60), mm = m % 60;
  if (h && mm) return h + 'h ' + ('0' + mm).slice(-2) + 'min';
  if (h)        return h + 'h';
  return mm + 'min';
}
// minutos → "HH:MM" (duração)
function _hhmm(m) {
  m = Math.round(m || 0);
  var h = Math.floor(m / 60), mm = m % 60;
  return ('0' + h).slice(-2) + ':' + ('0' + mm).slice(-2);
}

// ============================================================
//  OSRM — distâncias reais de rota
// ============================================================
function _seqCoordsKey() {
  return _seq
    .filter(function(p){ return p.lat && p.lng; })
    .map(function(p){ return (+p.lat).toFixed(5) + ',' + (+p.lng).toFixed(5); })
    .join('|');
}

function _fetchOsrmDistances(callback) {
  var pts = _seq.filter(function(p){ return p.lat && p.lng; });
  if (pts.length < 2) { callback(null, null, null); return; }

  function normKey(a, b) { return a <= b ? (a+':'+b) : (b+':'+a); }

  var pairs = pts.slice(0, -1).map(function(pt, i) {
    return { a: pt.idPonto, b: pts[i+1].idPonto };
  });

  function legsFromCache(cached) {
    return pts.slice(0, -1).map(function(pt, i) {
      var entry = cached[normKey(pt.idPonto, pts[i+1].idPonto)];
      var km = entry && entry.km > 0 ? entry.km : 0;
      if (km > 0 && entry.tipoVia && !_legVia[pt.idPonto]) {
        _legVia[pt.idPonto] = entry.tipoVia;
      }
      return km > 0 ? { distKm: km, durationMin: 0 } : null;
    });
  }

  // Concatena as coordenadas de todos os steps de uma leg (dedup do ponto de junção).
  function _legGeomFromSteps(leg) {
    var latlngs = [];
    (leg.steps || []).forEach(function(step) {
      var coords = step.geometry && step.geometry.coordinates;
      if (!coords) return;
      coords.forEach(function(c) {
        var ll = [c[1], c[0]];
        var last = latlngs[latlngs.length - 1];
        if (!last || last[0] !== ll[0] || last[1] !== ll[1]) latlngs.push(ll);
      });
    });
    return latlngs.length >= 2 ? latlngs : null;
  }

  function callOsrm(cached) {
    // Insere os pontos de desvio de ajustes de rota salvos como waypoints
    // extras entre A e B, pra o traçado seguir o mesmo caminho puxado no
    // mapa de "Ajuste de rota". segCounts guarda quantas sub-legs do OSRM
    // pertencem a cada par original, pra regrupar a resposta depois.
    var coordParts = [(+pts[0].lng).toFixed(6) + ',' + (+pts[0].lat).toFixed(6)];
    var segCounts = [];
    for (var i = 0; i < pts.length - 1; i++) {
      var vias = _rotaViaCoords(pts[i].idPonto, pts[i+1].idPonto);
      vias.forEach(function(v) { coordParts.push((+v.lng).toFixed(6) + ',' + (+v.lat).toFixed(6)); });
      coordParts.push((+pts[i+1].lng).toFixed(6) + ',' + (+pts[i+1].lat).toFixed(6));
      segCounts.push(1 + vias.length);
    }
    var coords = coordParts.join(';');
    var url = 'https://router.project-osrm.org/route/v1/driving/' + coords
            + '?overview=full&geometries=geojson&steps=true&annotations=false&continue_straight=false';

    fetch(url)
      .then(function(r){ return r.ok ? r.json() : Promise.reject('http'); })
      .then(function(data) {
        if (!data || data.code !== 'Ok' || !data.routes || !data.routes[0])
          return Promise.reject('no-route');

        var route = data.routes[0];
        // Regrupa as sub-legs (inseridas pelos desvios) de volta em uma leg
        // por par original de pontos consecutivos, somando dist/tempo e
        // concatenando a geometria (curva real, seguindo a via).
        var rawLegs = route.legs, legs = [], legGeoms = [], idx = 0;
        segCounts.forEach(function(cnt) {
          var distM = 0, durS = 0, geom = [];
          for (var k = 0; k < cnt; k++) {
            var l = rawLegs[idx + k]; if (!l) continue;
            distM += l.distance; durS += l.duration;
            var lg = _legGeomFromSteps(l);
            if (lg) geom = geom.concat(geom.length ? lg.slice(1) : lg);
          }
          idx += cnt;
          legs.push({ distKm: Math.round(distM / 100) / 10, durationMin: Math.round(durS / 6) / 10 });
          legGeoms.push(geom.length >= 2 ? geom : null);
        });

        var toSave = [];
        legs.forEach(function(leg, i) {
          // Trecho com desvio de ajuste: a distância aqui é a do desvio, não a
          // rota direta — não sobrescreve o cache geral de distâncias.
          if (!pts[i] || !pts[i+1] || segCounts[i] > 1) return;
          var key    = normKey(pts[i].idPonto, pts[i+1].idPonto);
          var isNew  = leg.distKm > 0 && !((cached[key] || {}).km > 0);
          var via    = _legVia[pts[i].idPonto] || 'BR';
          // Personalizado é específico do esquema: nunca vai para o cache global
          if (via === 'Pers') via = 'BR';
          // Envia TODOS os pares: km > 0 apenas nos novos; existentes recebem km=0
          // para que o backend só atualize tipo_via sem criar linha duplicada
          toSave.push({ a: pts[i].idPonto, b: pts[i+1].idPonto, km: isNew ? leg.distKm : 0, tipoVia: via });
        });
        if (toSave.length && typeof google !== 'undefined' && google.script)
          google.script.run.saveDistanciasCached(toSave);

        _osrmStatus = 'ok';
        var geom = route.geometry && route.geometry.coordinates
          ? route.geometry.coordinates.map(function(c){ return [c[1], c[0]]; })
          : null;
        callback(legs, geom, legGeoms);
      })
      .catch(function() {
        var fallback = legsFromCache(cached || {});
        var hasAny   = fallback.some(function(l){ return l !== null; });
        _osrmStatus  = hasAny ? 'cache' : 'unavailable';
        callback(hasAny ? fallback : null, null, null);
      });
  }

  if (typeof google !== 'undefined' && google.script) {
    google.script.run
      .withSuccessHandler(function(cached) {
        var allHit = pairs.every(function(p){ return (cached[normKey(p.a, p.b)] || {}).km > 0; });
        // Se algum trecho tem desvio de ajuste de rota salvo, precisa chamar o
        // OSRM mesmo com cache cheio, pra buscar a geometria real do desvio.
        var temDesvio = pairs.some(function(p){ return _rotaViaCoords(p.a, p.b).length > 0; });
        if (allHit && !temDesvio) {
          _osrmStatus = 'cache';
          callback(legsFromCache(cached), null, null);
        } else {
          callOsrm(cached);
        }
      })
      .withFailureHandler(function(){ callOsrm({}); })
      .getDistanciasCached(pairs);
  } else {
    callOsrm({});
  }
}

// ============================================================
//  Preset de velocidade
// ============================================================
function setPreset(btn, defaultVel) {
  document.querySelectorAll('.hor-preset-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  var tipo = btn.textContent.trim();
  var key  = _VIA_LABEL_TO_KEY[tipo] || tipo;
  document.getElementById('horVelMedia').value = (_tipoViaVel[key] || defaultVel);
  saveHorConfig();
  renderHorario();
}

function saveHorConfig() {
  if (!_sel) return;
  var partida = document.getElementById('horHoraPartida').value || '';
  var via = '', vel = parseFloat(document.getElementById('horVelMedia').value);
  document.querySelectorAll('.hor-preset-btn').forEach(function(b) {
    if (b.classList.contains('active')) via = b.textContent.trim();
  });
  if (via && !isNaN(vel) && vel > 0) {
    _tipoViaVel[_VIA_LABEL_TO_KEY[via] || via] = vel;
  }
  try { localStorage.setItem('vc_horcfg_' + _sel.id_esquema, JSON.stringify({ partida: partida, via: via, viaVel: _tipoViaVel })); } catch(e) {}
}

function _restoreHorConfig(esq) {
  var cfg = null;
  try { cfg = JSON.parse(localStorage.getItem('vc_horcfg_' + esq.id_esquema) || 'null'); } catch(e) {}
  // Prioriza o horário real do esquema; o partida salvo no navegador é só fallback
  // (evita abrir a linha com uma hora antiga e divergente guardada no localStorage).
  var partida = (esq.horario && String(esq.horario).trim()) ? esq.horario : ((cfg && cfg.partida) || '00:00');
  var via     = (cfg && cfg.via)     ? cfg.via     : 'BR';
  if (cfg && cfg.viaVel) {
    Object.keys(cfg.viaVel).forEach(function(k) { _tipoViaVel[k] = cfg.viaVel[k]; });
  }
  document.getElementById('horHoraPartida').value = partida;
  var viaKey = _VIA_LABEL_TO_KEY[via] || via;
  document.getElementById('horVelMedia').value = _tipoViaVel[viaKey] || 85;
  document.querySelectorAll('.hor-preset-btn').forEach(function(b) {
    b.classList.toggle('active', b.textContent.trim() === via);
  });
}

function _salvarVelAtiva() {
  if (!_sel) return;
  var vel = parseFloat(document.getElementById('horVelMedia').value);
  if (isNaN(vel) || vel <= 0) return;
  var tipo = '';
  document.querySelectorAll('.hor-preset-btn').forEach(function(b) {
    if (b.classList.contains('active')) tipo = b.textContent.trim();
  });
  if (!tipo) return;
  var tipoKey = _VIA_LABEL_TO_KEY[tipo] || tipo;
  _tipoViaVel[tipoKey] = vel;
  google.script.run
    .withSuccessHandler(function() { toast(tipo + ' → ' + vel + ' km/h salvo', 'success'); })
    .withFailureHandler(function(e) { toast('Erro: ' + (e.message || e), 'error'); })
    .salvarTipoViaVelocidade(_sel.id_esquema, tipoKey, vel);
}

// ============================================================
//  Toggle painéis do horário
// ============================================================
function toggleHorSidebar() {
  _horSidebarHidden = !_horSidebarHidden;
  try { localStorage.setItem('vc_hor_sidebar', _horSidebarHidden ? 'hidden' : 'visible'); } catch(e) {}
  var el = document.getElementById('horSidebarWrap');
  if (!el) return;
  el.classList.toggle('hor-sidebar-collapsed', _horSidebarHidden);
  el.querySelector('.hor-panel-close').title = _horSidebarHidden ? 'Mostrar' : 'Ocultar';
}

function toggleHorOsm() {
  _horOsmHidden = !_horOsmHidden;
  try { localStorage.setItem('vc_hor_osm', _horOsmHidden ? 'hidden' : 'visible'); } catch(e) {}
  var el = document.getElementById('horOsmWrap');
  if (el) el.style.display = _horOsmHidden ? 'none' : '';
}

// ============================================================
//  Toggle Mapa / Horário
// ============================================================
function toggleView(v) {
  _view = v;
  try { localStorage.setItem('vc_view', v); } catch(e) {}
  var mapEl  = document.getElementById('map');
  var mapPh  = document.getElementById('mapPh');
  var mapLeg = document.getElementById('mapLegend');
  var mapTgl = document.getElementById('mapModeToggle');
  var horPan = document.getElementById('horPanel');
  var btnM   = document.getElementById('btnViewMapa');
  var btnH   = document.getElementById('btnViewHorario');

  if (v === 'horario') {
    mapEl.style.display  = 'none';
    mapPh.style.display  = 'none';
    mapLeg.classList.remove('show');
    mapTgl.style.display = 'none';
    horPan.style.display = 'flex';
    btnM.classList.remove('active'); btnH.classList.add('active');
    renderHorario();
  } else {
    horPan.style.display = 'none';
    btnM.classList.add('active'); btnH.classList.remove('active');
    updateMap();
  }
}

// ============================================================
//  Cálculo de horário
// ============================================================
// ── Ajustes de rota (sobreposição de km/tempo por trecho) ────
function _setRotasAjust(list) {
  _rotasAjustList = list || [];
  _rotasAjust = {};
  _rotasAjustList.forEach(function(a) {
    var rec = { km: a.km || 0, min: a.min || 0, motivo: a.motivo || '' };
    // Vale nos dois sentidos (ida e volta) com o mesmo km/tempo.
    _rotasAjust[a.codA + '|' + a.codB] = rec;
    _rotasAjust[a.codB + '|' + a.codA] = rec;
  });
}
// Retorna o ajuste do trecho codA→codB (ou null).
function _rotaAjustada(codA, codB) {
  return _rotasAjust[String(codA) + '|' + String(codB)] || null;
}

// Localiza o ajuste cru (com viaCoords) do par, em qualquer sentido.
function _findRotaAjusteEntry(codA, codB) {
  var list = _rotasAjustList || [];
  for (var i = 0; i < list.length; i++) {
    var e = list[i];
    if (e.codA === codA && e.codB === codB) return { entry: e, reversed: false };
    if (e.codA === codB && e.codB === codA) return { entry: e, reversed: true };
  }
  return null;
}
function _parseViaCoords(s) {
  try {
    var arr = JSON.parse(s || '[]');
    return Array.isArray(arr) ? arr.filter(function(p) { return p && p.lat != null && p.lng != null; }) : [];
  } catch (e) { return []; }
}
function _viasFromEntry(m) {
  var vias = _parseViaCoords(m.entry.viaCoords);
  return m.reversed ? vias.slice().reverse() : vias;
}
// Pontos de desvio salvos para o trecho codA→codB (respeitando o sentido), ou [].
function _rotaViaCoords(codA, codB) {
  var m = _findRotaAjusteEntry(String(codA), String(codB));
  return m ? _viasFromEntry(m) : [];
}

function _calcHorario(osrmLegs) {
  var vel      = parseFloat(document.getElementById('horVelMedia').value) || 80;
  var partida  = document.getElementById('horHoraPartida').value || '00:00';
  var startIdx = Math.min(_horStartIdx, _seq.length - 1);
  var cur      = _p(partida);
  var res = [], distTotal = 0, tvTotal = 0, tpTotal = 0;
  var osrmOk   = Array.isArray(osrmLegs) && osrmLegs.length > 0;

  var coordRank = {};
  if (osrmOk) {
    var r = 0;
    _seq.forEach(function(p, i){ if (p.lat && p.lng) coordRank[i] = r++; });
  }

  _seq.forEach(function(p, i) {
    var preDep  = (i < startIdx);
    var isStart = (i === startIdx);
    var isLast  = (i === _seq.length - 1);

    var dist = 0, distReal = 0, tv = 0, distSource = 'none', timeSource = 'none', pisoKm = false;
    if (!preDep && !isStart) {
      var prev = _seq[i - 1];
      var legViaType = _legVia[prev.idPonto];
      var legVel = vel;
      if (legViaType === 'Pers')  legVel = _legVelPers[prev.idPonto] || vel;
      else if (legViaType)        legVel = _tipoViaVel[legViaType] || vel;
      // Ajuste de rota tem prioridade: sobrepõe km/tempo do trecho (ex.: desvio).
      var adj = _rotaAjustada(prev.idPonto, p.idPonto);
      if (adj) {
        dist = adj.km > 0 ? adj.km : 0;
        distReal = dist;
        distSource = 'ajuste';
        // Ajuste manual em minutos tem prioridade total (sem piso). Sem tempo
        // manual, o tempo sai de km/vel — mas com um piso de KM (não de tempo)
        // pra trechos curtos, que escala com a velocidade configurada em vez
        // de forçar sempre o mesmo tempo fixo.
        if (adj.min > 0) {
          tv = Math.round(adj.min);
        } else if (dist > 0) {
          pisoKm = dist < MIN_LEG_KM;
          dist = Math.max(dist, MIN_LEG_KM);
          tv   = Math.round((dist / legVel) * 60);
        } else {
          tv = MIN_LEG_TV;
        }
        timeSource = 'ajuste';
      } else {
        var pRank = osrmOk ? coordRank[i - 1] : undefined;
        var cRank = osrmOk ? coordRank[i]     : undefined;
        var leg   = (osrmOk && pRank !== undefined && cRank !== undefined
                     && cRank === pRank + 1) ? osrmLegs[pRank] : null;
        if (leg) {
          distReal = leg.distKm;
          pisoKm = leg.distKm < MIN_LEG_KM;
          dist = Math.max(leg.distKm, MIN_LEG_KM); distSource = 'osrm';
          tv   = Math.round((dist / legVel) * 60);
          timeSource = 'vel';
        } else {
          dist = 0; distSource = 'none';
          tv   = MIN_LEG_TV; timeSource = 'min';
        }
      }
    }

    var tp = (preDep || isStart) ? 0 : _getStopTime(i, p.tipo);

    var chegada, saida;
    if (preDep) {
      chegada = null; saida = null;
    } else if (isStart) {
      chegada = cur; saida = cur;
    } else {
      chegada = cur + tv; saida = chegada + tp;
    }

    if (!preDep) {
      distTotal += dist; tvTotal += tv; tpTotal += tp;
      if (saida !== null) cur = isLast ? chegada : saida;
    }

    res.push({
      idx: i, nomePonto: p.nomePonto, tipo: p.tipo || '',
      preDep: preDep,
      dist: Math.round(dist * 10) / 10,
      distReal: Math.round(distReal * 10) / 10,
      tv: tv, tp: tp,
      chegadaMin: chegada !== null ? Math.round(chegada) : null,
      saidaMin:   (!preDep && !isLast && saida !== null) ? Math.round(saida) : null,
      hasCoords:  !!(p.lat && p.lng),
      distSource: distSource,
      timeSource: timeSource,
      pisoKm:     pisoKm
    });
  });

  var anyOsrm  = res.some(function(p){ return p.distSource === 'osrm'; });
  var lastCalc = res.slice().reverse().find(function(p){ return p.chegadaMin !== null; });
  return {
    pontos:       res,
    distTotal:    Math.round(distTotal * 10) / 10,
    tvTotal:      Math.round(tvTotal),
    tpTotal:      Math.round(tpTotal),
    totalMin:     Math.round(tvTotal + tpTotal),
    chegadaFinal: lastCalc ? lastCalc.chegadaMin : _p(partida),
    usedOsrm:     anyOsrm,
    vel:          vel
  };
}

// ============================================================
//  Renderiza painel de horário

function renderHorario() {
  var body = document.getElementById('horBody');
  if (!body) return;

  if (!_sel || !_seq.length) {
    if (_sel && !_seq.length) {
      // Esquema vazio: oferece o preenchimento por print (colar/arrastar).
      body.innerHTML = _itinPasteZoneHtml();
      _bindItinDropZone();
    } else {
      body.innerHTML = '<div style="text-align:center;color:#9aa0ad;padding:40px 20px;">'
        + 'Selecione um esquema para calcular o horário.'
        + '</div>';
    }
    return;
  }

  var key = _seqCoordsKey();

  if (_osrmSeqKey === key && _osrmLegs !== undefined) {
    _renderHorarioWith(_osrmLegs);
    return;
  }

  _osrmSeqKey  = key;
  _osrmLegs    = undefined;
  _osrmStatus  = 'pending';
  _renderHorarioWith(null);

  _fetchOsrmDistances(function(legs, geom, legGeoms) {
    if (_osrmSeqKey !== key) return;
    _osrmLegs     = legs;
    _osrmGeometry = geom;
    _osrmLegGeoms = legGeoms;
    if (_view === 'horario') {
      _renderHorarioWith(legs);
    } else if (geom && _poly) {
      _poly.setLatLngs(geom);
      _drawLegHoverOnMap();
    }
  });
}

// ============================================================
//  ANTT — Verificação de Pontos de Apoio
// ============================================================

/**
 * Ponto de apoio ANTT = qualquer ponto da sequência SEM horário comercial definido.
 * Independe de tipo ou nome — o critério único é a ausência de saída comercial.
 */
function _isApoioAntt(idx) {
  var p = _seq[idx];
  if (!p) return false;
  return !_comercialTimes[p.idPonto];
}

/** Ponto de Troca de Motorista ANTT = ponto marcado com a tag "troca" no Operação. */
function _isTrocaAntt(idx) {
  var p = _seq[idx];
  if (!p) return false;
  var flags = _tiposParada[p.idPonto];
  return !!(flags && flags.troca);
}

// ============================================================
//  Investigação de Divergência — Model + View + Controller
//  Fase 1 (atual): só evidências determinísticas, sem IA — hipóteses por
//  heurística local. A camada de IA (DiagnosticoService no backend) entra
//  depois, sem mudar esta estrutura: o Controller troca a renderização direta
//  por uma chamada a google.script.run quando o serviço estiver pronto.
// ============================================================

var DivergenceInvestigationModel = (function() {

  function _sevOf(diffAbsMin) { return diffAbsMin >= 180 ? 'critica' : 'alta'; }

  // Último ponto ANTES de idx com horário comercial + chegada calculada —
  // a "baseline" da qual a divergência deste ponto evoluiu.
  function _prevComercialIdx(idx, seq, calc) {
    for (var k = idx - 1; k >= 0; k--) {
      if (seq[k] && _comercialTimes[seq[k].idPonto] && calc.pontos[k] && calc.pontos[k].chegadaMin !== null) return k;
    }
    return -1;
  }

  function _qualidadeDados(fromIdx, toIdx, calc) {
    var semDados = false, comAjusteOuMin = false;
    for (var k = fromIdx + 1; k <= toIdx; k++) {
      var p = calc.pontos[k];
      if (!p) continue;
      if (p.distSource === 'none') semDados = true;
      else if (p.distSource === 'ajuste' || p.timeSource === 'min') comAjusteOuMin = true;
    }
    if (semDados) return 'baixa';
    if (comAjusteOuMin) return 'media';
    return 'alta';
  }

  /**
   * Monta o pacote de evidências para o ponto idx.
   * @param {number} idx    — índice em _seq / calc.pontos
   * @param {Array}  seq    — _seq
   * @param {Object} calc   — retorno de _calcHorario (com _recomputeComercialBase já aplicado)
   * @param {Object} comercialTimes — _comercialTimes
   * @returns {Object|null} pacote estruturado, ou null se faltar dado essencial
   */
  function buildContext(idx, seq, calc, comercialTimes) {
    var p = seq[idx], cp = calc.pontos[idx];
    if (!p || !cp || cp.chegadaMin === null) return null;
    var comVal = comercialTimes[p.idPonto];
    if (!comVal) return null;

    var diffMin  = _diffMin(comVal, cp.chegadaMin, p.idPonto);
    var prevIdx  = _prevComercialIdx(idx, seq, calc);
    var diffAntesMin = prevIdx >= 0
      ? _diffMin(comercialTimes[seq[prevIdx].idPonto], calc.pontos[prevIdx].chegadaMin, seq[prevIdx].idPonto)
      : 0;
    var diffIntervaloMin = diffMin - diffAntesMin;
    var fromIdx = prevIdx >= 0 ? prevIdx : 0;

    // Maior parada, maior trecho, km/tempo somados, pontos de apoio sem
    // horário e trechos muito curtos que bateram no "tempo mínimo por trecho"
    // (MIN_LEG_TV) no intervalo (do último ponto comercial anterior até idx).
    var maiorParada = null, maiorTrecho = null, apoioSemHorario = [], pisoTrechos = [];
    var distIntervaloKm = 0, tvIntervaloMin = 0, tpIntervaloMin = 0;
    for (var k = fromIdx + 1; k <= idx; k++) {
      var kp = calc.pontos[k], ks = seq[k];
      if (!kp || !ks) continue;
      distIntervaloKm += kp.dist || 0;
      tvIntervaloMin  += kp.tv   || 0;
      tpIntervaloMin  += kp.tp   || 0;
      if (kp.tp > 0 && (!maiorParada || kp.tp > maiorParada.minutos)) {
        maiorParada = { ponto: ks.nomePonto || '', minutos: kp.tp };
      }
      if (kp.tv > 0 && (!maiorTrecho || kp.tv > maiorTrecho.tempoMin)) {
        maiorTrecho = { de: (seq[k - 1] || {}).nomePonto || '', para: ks.nomePonto || '', tempoMin: kp.tv, km: kp.dist || 0 };
      }
      // MIN_LEG_KM é um piso de distância (Math.max) aplicado a trechos curtos
      // — o tempo então sai de km/vel normalmente, então não infla tanto
      // quanto o antigo piso de tempo fixo, mas ainda vale sinalizar quando
      // ocorreu (o "km" mostrado não é 100% real nesse trecho).
      if (kp.pisoKm) {
        pisoTrechos.push({ de: (seq[k - 1] || {}).nomePonto || '', para: ks.nomePonto || '', kmReal: kp.distReal, kmUsado: kp.dist });
      }
      if (k !== idx && !comercialTimes[ks.idPonto]) apoioSemHorario.push(ks.nomePonto || '');
    }

    // Velocidade de condução (sem contar paradas) exigida pelo horário
    // comercial pra cobrir a mesma distância no intervalo — só é possível
    // quando há um ponto comercial anterior real (prevIdx) como referência,
    // e descontando o tempo de parada já conhecido (tpIntervaloMin) pra
    // comparar em pé de igualdade com a velocidade calculada (que também é
    // só condução, sem parada).
    var nomeOrigemIntervalo = prevIdx >= 0 ? (seq[prevIdx].nomePonto || '') : '';
    var velComercialIntervalo = null;
    if (prevIdx >= 0) {
      var absA = _comercialAbsMap[seq[prevIdx].idPonto], absB = _comercialAbsMap[p.idPonto];
      if (absA !== undefined && absB !== undefined && absB > absA && distIntervaloKm > 0) {
        var condMinComercial = (absB - absA) - tpIntervaloMin;
        if (condMinComercial > 0) velComercialIntervalo = distIntervaloKm / (condMinComercial / 60);
      }
    }
    var velCalculadaIntervalo = tvIntervaloMin > 0 ? (distIntervaloKm / tvIntervaloMin) * 60 : null;

    var hipoteses = [];
    var ratioAntes = diffMin !== 0 ? Math.abs(diffAntesMin) / Math.abs(diffMin) : 0;
    if (prevIdx >= 0 && ratioAntes >= 0.6) {
      hipoteses.push({
        tipo: 'folga_operacional',
        probabilidade: ratioAntes >= 0.8 ? 'alta' : 'media',
        evidencia: 'A maior parte da diferença (' + _dur(Math.abs(diffAntesMin)) + ' de ' + _dur(Math.abs(diffMin)) + ') já vinha acumulada antes deste ponto.'
      });
    }
    if (maiorTrecho && Math.abs(diffIntervaloMin) > 15 && maiorTrecho.tempoMin >= Math.abs(diffIntervaloMin) * 0.5) {
      hipoteses.push({
        tipo: 'trecho_lento',
        probabilidade: maiorTrecho.tempoMin >= Math.abs(diffIntervaloMin) * 0.8 ? 'alta' : 'media',
        evidencia: 'O trecho ' + maiorTrecho.de + ' → ' + maiorTrecho.para + ' (' + maiorTrecho.km + ' km, ' + _dur(maiorTrecho.tempoMin) + ') concentra boa parte da divergência gerada neste intervalo.'
      });
    }
    if (maiorParada && maiorParada.minutos >= 30) {
      hipoteses.push({
        tipo: 'parada_longa',
        probabilidade: maiorParada.minutos >= 45 ? 'alta' : 'media',
        evidencia: 'Parada de ' + _dur(maiorParada.minutos) + ' em "' + maiorParada.ponto + '" no intervalo.'
      });
    }
    if (apoioSemHorario.length) {
      hipoteses.push({
        tipo: 'apoio_sem_horario',
        probabilidade: 'media',
        evidencia: (apoioSemHorario.length === 1 ? 'O ponto ' : 'Os pontos ') + apoioSemHorario.join(', ') +
                   ' não têm horário comercial cadastrado, o que impede localizar com precisão onde a divergência nasceu.'
      });
    }
    if (pisoTrechos.length) {
      var maiorRazaoPiso = pisoTrechos.reduce(function(m, t) { return Math.max(m, t.kmUsado / (t.kmReal || 0.1)); }, 1);
      hipoteses.push({
        tipo: 'piso_tempo_minimo',
        probabilidade: maiorRazaoPiso >= 2 ? 'alta' : 'media',
        evidencia: pisoTrechos.map(function(t){ return t.de + ' → ' + t.para + ' (real ' + t.kmReal + ' km, usado ' + t.kmUsado + ' km)'; }).join('; ') +
                   ': trecho real menor que o piso mínimo de ' + MIN_LEG_KM + ' km — o tempo é calculado com o km do piso, não o real, inflando o tempo calculado.'
      });
    }
    if (!hipoteses.length) {
      hipoteses.push({
        tipo: 'indeterminado',
        probabilidade: 'baixa',
        evidencia: 'Nenhum padrão claro identificado nas evidências disponíveis para este intervalo.'
      });
    }

    return {
      id: 'div_' + (seq[fromIdx] ? seq[fromIdx].idPonto : '0') + '_' + p.idPonto,
      ponto: p.nomePonto || '',
      divergenciaMin: Math.round(diffMin),
      chegadaCalculada: _ms(cp.chegadaMin),
      horarioComercial: comVal,
      severidade: _sevOf(Math.abs(diffMin)),
      evidencias: {
        maiorParada: maiorParada,
        maiorTrecho: maiorTrecho,
        diferencaAcumuladaAntesMin: Math.round(diffAntesMin),
        diferencaGeradaNoIntervaloMin: Math.round(diffIntervaloMin),
        pontosApoioSemHorario: apoioSemHorario,
        qualidadeDados: _qualidadeDados(fromIdx, idx, calc),
        nomeOrigemIntervalo: nomeOrigemIntervalo,
        distIntervaloKm: Math.round(distIntervaloKm * 10) / 10,
        velComercialIntervalo: velComercialIntervalo,
        velCalculadaIntervalo: velCalculadaIntervalo
      },
      hipotesesIniciais: hipoteses
    };
  }

  return { buildContext: buildContext };

})();

// ── Controller ─────────────────────────────────────────────
function investigarDivergencia(idx) {
  if (!_lastCalc) { toast('Calcule o horário antes de investigar.', 'error'); return; }
  var pacote = DivergenceInvestigationModel.buildContext(idx, _seq, _lastCalc, _comercialTimes);
  if (!pacote) { toast('Sem dados suficientes para investigar este ponto.', 'error'); return; }
  _abrirModalInvestigacao(pacote);
}

          : 'Não foi possível calcular a velocidade sugerida pelo comercial (falta um ponto comercial de referência anterior).')

    + (ev.maiorTrecho ? '<div style="font-size:11.5px;color:#5a6070;margin-bottom:3px;">' + ico('map-pin', 11) + ' Maior trecho: <strong>' + esc(ev.maiorTrecho.de) + ' → ' + esc(ev.maiorTrecho.para) + '</strong> (' + ev.maiorTrecho.km + ' km, ' + _dur(ev.maiorTrecho.tempoMin) + ')</div>' : '')

/**
 * Percorre a sequência acumulando km desde o último ponto que satisfaz
 * isResetPoint(idx), sinalizando quando ultrapassa maxKm (error) ou warnKm
 * (warn) — com dedup (só o primeiro cruzamento gera alerta) e sempre
 * verificando o trecho final. minKm opcional sinaliza pontos de reset
 * próximos demais entre si (info). Genérico: usado tanto pro limite de
 * Ponto de Apoio (495km) quanto pro de Troca de Motorista (660km).
 * @returns {{ map: Object, accumKm: number, maxStretch: number, lastResetIdx: number }}
 */
function _computeAnttGeneric(c, isResetPoint, maxKm, warnKm, minKm) {
  var map = {};
  if (!c || _seq.length < 2) return { map: map, accumKm: 0, maxStretch: 0, lastResetIdx: 0 };

  var startIdx     = Math.min(_horStartIdx, _seq.length - 1);
  var vel          = parseFloat(document.getElementById('horVelMedia').value) || 80;
  var lastNome     = _seq[startIdx] ? _seq[startIdx].nomePonto : '';
  var lastResetIdx = startIdx;
  var accumDist    = 0;
  var maxStretch   = 0;   // maior trecho já fechado (entre dois resets)
  var warnFired    = false;
  var errorFired   = false;
  var warnIdx      = -1;

  for (var i = startIdx + 1; i < c.pontos.length; i++) {
    var p = c.pontos[i];
    if (p.preDep) continue;

    var seg = p.dist || 0;
    if (seg === 0 && p.tv > 0) seg = Math.round((p.tv / 60) * vel * 10) / 10;
    accumDist += seg;

    var isLast  = (i === _seq.length - 1);
    var isReset = isResetPoint(i);
    var d       = Math.round(accumDist);

    if (isReset) {
      if (d > maxStretch) maxStretch = d;
      if      (d > maxKm)                     map[i] = { type: 'error', dist: d, fromNome: lastNome };
      else if (d > warnKm)                    map[i] = { type: 'warn',  dist: d, fromNome: lastNome };
      else if (minKm && d > 0 && d < minKm)   map[i] = { type: 'info',  dist: d, fromNome: lastNome };
      lastNome     = _seq[i].nomePonto;
      lastResetIdx = i;
      accumDist    = 0;
      warnFired    = false;
      errorFired   = false;
    } else {
      if (!errorFired && d > maxKm) {
        if (warnFired) { delete map[warnIdx]; }
        map[i] = { type: 'error', dist: d, fromNome: lastNome };
        errorFired = true;
      } else if (!warnFired && d > warnKm) {
        map[i] = { type: 'warn', dist: d, fromNome: lastNome };
        warnIdx = i;
        warnFired = true;
      }
      if (isLast) {
        if (d > maxStretch) maxStretch = d;
        if (!map[i] && !errorFired) {
          if      (d > maxKm)  map[i] = { type: 'error', dist: d, fromNome: lastNome };
          else if (d > warnKm) map[i] = { type: 'warn',  dist: d, fromNome: lastNome };
        }
      }
    }
  }

  return { map: map, accumKm: Math.round(accumDist), maxStretch: maxStretch, lastResetIdx: lastResetIdx };
}

/** Limite ANTT de Ponto de Apoio (495km) — preenche _anttMap / _anttStatus. */
function _computeAnttAlerts(c) {
  var r = _computeAnttGeneric(c, _isApoioAntt, ANTT_MAX_KM, ANTT_WARN_KM, ANTT_MIN_KM);
  _anttMap = r.map;
  var apoioPt = _seq[r.lastResetIdx];
  _anttStatus = {
    accumKm:       r.accumKm,
    remaining:     Math.round(ANTT_MAX_KM - r.accumKm),
    maxStretch:    r.maxStretch,
    lastApoioNome: apoioPt ? apoioPt.nomePonto : '',
    lastApoioLat:  apoioPt ? (apoioPt.lat || null) : null,
    lastApoioLng:  apoioPt ? (apoioPt.lng || null) : null
  };

  _computeAnttTrocaAlerts(c);
}

/** Limite ANTT de Troca de Motorista (660km) — preenche _anttTrocaMap / _anttTrocaStatus. */
function _computeAnttTrocaAlerts(c) {
  var r = _computeAnttGeneric(c, _isTrocaAntt, ANTT_TROCA_MAX_KM, ANTT_TROCA_WARN_KM, 0);
  _anttTrocaMap = r.map;
  _anttTrocaStatus = {
    accumKm:    r.accumKm,
    remaining:  Math.round(ANTT_TROCA_MAX_KM - r.accumKm),
    maxStretch: r.maxStretch
  };
}

/**
 * Retorna true se o ponto pode ser candidato a apoio nas sugestões.
 * Usa o NOME (mais confiável que tipo) para excluir rodoviárias/terminais.
 */
function _isApoioCandidate(nome) {
  var n = (nome || '').trim().toUpperCase();
  return !['RODOVIARIA','RODOVIARIO','TERMINAL','ESTACAO'].some(function(k){
    return n.indexOf(k) !== -1;
  });
}

/** Distância em km entre dois pares de coordenadas (fórmula de Haversine). */
function _haversinKm(lat1, lng1, lat2, lng2) {
  var R = 6371, r = Math.PI / 180;
  var dLat = (lat2 - lat1) * r, dLng = (lng2 - lng1) * r;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2)
        + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/** Atualiza a barra de status ANTT (ok / warn / error) no card de pontos. */
function _updateAnttWarnBar() {
  var bar = document.getElementById('anttWarn');
  if (!bar) return;
  if (!_anttStatus) { bar.style.display = 'none'; return; }

  // Determina o pior estado em toda a rota
  var hasError = false, hasWarn = false, worstDist = 0;
  Object.keys(_anttMap).forEach(function(k) {
    var a = _anttMap[k];
    if (!a) return;
    if (a.type === 'error') { hasError = true; if (a.dist > worstDist) worstDist = a.dist; }
    if (a.type === 'warn'  && !hasError) { hasWarn = true; if (a.dist > worstDist) worstDist = a.dist; }
  });

  var icoHtml, cls, txt;
  if (hasError) {
    icoHtml = ico('alert-triangle', 14); cls = 'error';
    txt = worstDist + 'km sem apoio — excede o limite ANTT de ' + ANTT_MAX_KM + 'km';
  } else if (hasWarn) {
    icoHtml = ico('zap', 14); cls = 'warn';
    txt = worstDist + 'km no trecho mais longo — faltam ' + (ANTT_MAX_KM - worstDist) + 'km para o limite';
  } else {
    var ms = _anttStatus.maxStretch || _anttStatus.accumKm || 0;
    icoHtml = ico('check', 14); cls = 'ok';
    txt = 'Conforme ANTT — maior trecho: ' + ms + 'km / ' + ANTT_MAX_KM + 'km';
  }

  bar.className = 'antt-warn-bar ' + cls;
  bar.style.display = '';
  bar.innerHTML = '<span class="antt-warn-ico">' + icoHtml + '</span>'
    + '<span class="antt-warn-txt">' + txt + '</span>';
}

// ─── Sugestões de próximo apoio ──────────────────────────────

/**
 * Calcula até `max` candidatos de apoio mais próximos na direção do trajeto.
 * Retorna array de { local, estKm, realKm, isForward }.
 */
function _computeApoioSuggestions(max) {
  if (!_anttStatus || !_anttStatus.lastApoioLat || !_anttStatus.lastApoioLng) return [];

  // Referência = último apoio (onde o trecho problemático começa)
  var refLat = +_anttStatus.lastApoioLat, refLng = +_anttStatus.lastApoioLng;
  // Busca pontos até o limite máximo a partir do último apoio
  var searchRadius = ANTT_MAX_KM;

  // Vetor direcional: do último apoio para o último ponto da rota
  var tail = _seq[_seq.length - 1];
  var hasDirVec = tail && tail.lat && tail.lng
    && (+tail.lat !== refLat || +tail.lng !== refLng);
  var dirLat = hasDirVec ? (+tail.lat - refLat) : 0;
  var dirLng = hasDirVec ? (+tail.lng - refLng) : 0;

  // IDs já na sequência → não sugerir
  var inSeq = {};
  _seq.forEach(function(p) { inSeq[p.idPonto] = true; });

  var cands = [];
  _locais.forEach(function(l) {
    if (!_isApoioCandidate(l.descricao) || !l.lat || !l.lng || inSeq[l.codigo]) return;
    var linKm = _haversinKm(refLat, refLng, +l.lat, +l.lng);
    var estKm = Math.round(linKm * 1.3);
    if (estKm < 10 || estKm > searchRadius) return;

    var isForward = true;
    if (hasDirVec) {
      var vLat = +l.lat - refLat, vLng = +l.lng - refLng;
      isForward = (vLat * dirLat + vLng * dirLng) >= 0;
    }
    cands.push({ local: l, estKm: estKm, realKm: null, isForward: isForward });
  });

  cands.sort(function(a, b) {
    if (a.isForward !== b.isForward) return a.isForward ? -1 : 1;
    return a.estKm - b.estKm;
  });

  return cands.slice(0, max || 5);
}

/** Renderiza o painel de sugestões no sidebar. */
function _renderApoioSuggestions(cands) {
  var el = document.getElementById('anttSuggest');
  if (!el) return;
  if (!cands || !cands.length) { el.style.display = 'none'; return; }

  var isErr = _anttStatus && _anttStatus.accumKm > ANTT_MAX_KM;
  el.className = 'antt-sugg-panel' + (isErr ? ' error' : '');
  el.style.display = '';

  var html = '<div class="antt-sugg-head">' + ico('lightbulb', 13) + ' Sugestões de apoio</div>';
  html += cands.map(function(c) {
    var dClass = c.realKm ? 'real' : 'est';
    var dVal   = c.realKm ? c.realKm : c.estKm;
    var dPfx   = c.realKm ? '' : '~';
    return '<div class="antt-sugg-item" data-cod="' + esc(c.local.codigo) + '">'
      + '<div class="antt-sugg-info">'
        + '<div class="antt-sugg-nome">' + esc(c.local.descricao) + '</div>'
        + '<div class="antt-sugg-meta">'
          + '<span class="antt-sugg-dist ' + dClass + '">' + dPfx + dVal + 'km</span>'
          + (c.local.tipo ? ' · ' + esc(c.local.tipo) : '')
          + (!c.isForward ? ' <span class="antt-sugg-behind">' + ico('arrow-left', 11) + ' atrás</span>' : '')
        + '</div>'
      + '</div>'
      + '<button class="antt-sugg-add btn-add-sugg" data-cod="' + esc(c.local.codigo) + '">+</button>'
      + '</div>';
  }).join('');
  el.innerHTML = html;

  el.querySelectorAll('.antt-sugg-add').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var found = _locais.find(function(l){ return l.codigo === btn.getAttribute('data-cod'); });
      if (found) addPontoNoFim(found);
    });
  });
}

/**
 * Consulta o cache de distâncias (Sheets) para os pares
 * último-ponto → candidato e atualiza os km reais onde houver hit.
 */
function _refreshSuggestionsWithCache(cands) {
  if (!cands.length || typeof google === 'undefined' || !google.script) return;
  var lastPt = _seq.length ? _seq[_seq.length - 1] : null;
  if (!lastPt) return;

  // Evita re-consultar o mesmo conjunto
  var key = lastPt.idPonto + '|' + cands.map(function(c){ return c.local.codigo; }).join(',');
  if (key === _anttSuggCacheKey) return;
  _anttSuggCacheKey = key;

  var pairs = cands.map(function(c){ return { a: lastPt.idPonto, b: c.local.codigo }; });

  google.script.run
    .withSuccessHandler(function(cached) {
      var updated = false;
      cands.forEach(function(c) {
        var a = lastPt.idPonto, b = c.local.codigo;
        var k = (a <= b) ? (a + ':' + b) : (b + ':' + a);
        var ck = (cached[k] || {}).km || 0;
        if (ck > 0 && ck !== c.realKm) {
          c.realKm = ck;
          updated = true;
        }
      });
      if (!updated) return;
      // Re-ordena com distâncias reais
      cands.sort(function(a, b) {
        if (a.isForward !== b.isForward) return a.isForward ? -1 : 1;
        return (a.realKm || a.estKm) - (b.realKm || b.estKm);
      });
      _renderApoioSuggestions(cands);
    })
    .withFailureHandler(function(){})
    .getDistanciasCached(pairs);
}

/** Ponto de entrada: calcula, renderiza e dispara consulta ao cache. */
function _updateApoioSuggestions() {
  if (!_anttStatus || _anttStatus.accumKm <= ANTT_WARN_KM) {
    var el = document.getElementById('anttSuggest');
    if (el) el.style.display = 'none';
    _anttSuggCands = [];
    return;
  }
  _anttSuggCands = _computeApoioSuggestions(5);
  _renderApoioSuggestions(_anttSuggCands);
  _refreshSuggestionsWithCache(_anttSuggCands);
}

// ── Traçado real (geometria OSRM) ─────────────────────────────
// Mapeia cada índice de _seq com coordenadas para seu "rank" (posição entre os
// pontos com lat/lng, 0-based) — usado para localizar a leg de _osrmLegGeoms
// correspondente a um trecho entre dois índices quaisquer de _seq.
function _buildCoordRank() {
  var map = {}, r = 0;
  _seq.forEach(function(p, i) { if (p.lat && p.lng) { map[i] = r; r++; } });
  return map;
}

/**
 * Retorna a geometria real (curva, seguindo a via) entre dois índices de _seq,
 * concatenando as legs de _osrmLegGeoms no intervalo — ou null se a geometria
 * ainda não estiver disponível (usa-se então uma linha reta como fallback).
 */
function _realGeomBetween(fromIdx, toIdx, coordRank) {
  if (!_osrmLegGeoms) return null;
  var rFrom = coordRank[fromIdx], rTo = coordRank[toIdx];
  if (rFrom === undefined || rTo === undefined || rTo <= rFrom) return null;
  var out = [];
  for (var r = rFrom; r < rTo; r++) {
    var legGeom = _osrmLegGeoms[r];
    if (!legGeom) return null;
    legGeom.forEach(function(ll) {
      var last = out[out.length - 1];
      if (!last || last[0] !== ll[0] || last[1] !== ll[1]) out.push(ll);
    });
  }
  return out.length >= 2 ? out : null;
}

// ── ANTT map overlays ────────────────────────────────────────

/** Remove todas as camadas ANTT do mapa (stretch polys + suggestion markers). */
function _clearAnttMapLayers() {
  _stretchPolys.forEach(function(p){ p.remove(); });
  _stretchPolys = [];
  _suggMapMarkers.forEach(function(m){ m.remove(); });
  _suggMapMarkers = [];
  _anttMapActive = false;
  var anttLeg = document.getElementById('mapAnttLegend');
  if (anttLeg) anttLeg.style.display = 'none';
}

/**
 * Desenha no mapa:
 *  1. Polylines coloridas por trecho entre pontos de apoio (verde/âmbar/vermelho)
 *  2. Marcadores de sugestão de apoio (pins roxos clicáveis)
 * Chamada de updateMap() — ANTES de adicionar _poly para que a rota fique por cima.
 */
function _drawAnttOnMap() {
  _clearAnttMapLayers();
  if (!_map || _seq.length < 2) return;

  // Calcula horário + ANTT com as legs disponíveis
  var legs = Array.isArray(_osrmLegs) ? _osrmLegs : null;
  var c = _calcHorario(legs);
  _computeAnttAlerts(c);
  if (!_anttStatus) return;

  // Só exibe overlays se houver preocupação ANTT real
  var needsOverlay = _anttStatus.maxStretch > ANTT_WARN_KM || _anttStatus.accumKm > ANTT_WARN_KM;
  if (!needsOverlay) return;

  var clr = { error: '#ef4444', warn: '#f59e0b', ok: '#22c55e' };
  var startIdx    = Math.min(_horStartIdx, _seq.length - 1);
  var stretchStart = startIdx;
  var accumDist   = 0;
  var hasWarnErr  = false;

  function _flushStretch(endIdx) {
    var d = Math.round(accumDist);
    if (d <= 0) return; // sem distância (OSRM não respondeu ainda)
    var type = d > ANTT_MAX_KM ? 'error' : d > ANTT_WARN_KM ? 'warn' : 'ok';
    if (type !== 'ok') hasWarnErr = true;
    var coords = [];
    for (var j = stretchStart; j <= endIdx; j++) {
      var sp = _seq[j];
      if (sp && sp.lat && sp.lng) coords.push([+sp.lat, +sp.lng]);
    }
    if (coords.length < 2) return;
    var fromNome = (_seq[stretchStart] || {}).nomePonto || '?';
    var toNome   = (_seq[endIdx]       || {}).nomePonto || '?';
    var lbl  = type === 'error' ? 'Excede ANTT' : type === 'warn' ? 'Atenção ANTT' : 'Trecho OK';
    var tip  = '<b>' + lbl + '</b><br>' + d + ' km'
             + '<br><span style="font-size:10px;color:#ccc">' + esc(fromNome) + ' → ' + esc(toNome) + '</span>';
    var pl = L.polyline(coords, {
      color: clr[type], weight: 10, opacity: 0.32,
      lineCap: 'round', lineJoin: 'round'
    }).addTo(_map);
    pl.bindTooltip(tip, { sticky: true });
    _stretchPolys.push(pl);
  }

  for (var i = startIdx + 1; i < c.pontos.length; i++) {
    var p = c.pontos[i];
    if (p.preDep) continue;
    accumDist += p.dist || 0;
    var isApoio = _isApoioAntt(i);
    var isLast  = (i === c.pontos.length - 1);
    if (isApoio || isLast) {
      _flushStretch(i);
      if (isApoio) { stretchStart = i; accumDist = 0; }
    }
  }

  // Exibe seção ANTT na legenda do mapa
  _anttMapActive = hasWarnErr;
  var anttLeg = document.getElementById('mapAnttLegend');
  if (anttLeg) anttLeg.style.display = hasWarnErr ? '' : 'none';

  // Marcadores de sugestão de apoio
  var cands = _computeApoioSuggestions(5);
  _anttSuggCands = cands;
  cands.forEach(function(cand) {
    if (!cand.local || !cand.local.lat || !cand.local.lng) return;
    var dVal = cand.realKm || cand.estKm;
    var dPfx = cand.realKm ? '' : '~';
    var icon = L.divIcon({
      className: '',
      html: '<div class="antt-map-sugg-pin">+</div>',
      iconSize: [28, 28], iconAnchor: [14, 14]
    });
    var tipStr = '<b>' + esc(cand.local.descricao) + '</b>'
               + '<br><span style="font-size:10px;color:#a5b4fc">' + dPfx + dVal + ' km desde último apoio'
               + (cand.local.tipo ? ' · ' + esc(cand.local.tipo) : '') + '</span>'
               + '<br><span style="font-size:10px;color:#818cf8">Clique para adicionar ao esquema</span>';
    var m = L.marker([+cand.local.lat, +cand.local.lng], { icon: icon, zIndexOffset: 600 });
    m.bindTooltip(tipStr, { direction: 'top', offset: [0, -16] });
    m.on('click', (function(loc) {
      return function() { addPontoNoMapa(loc); };
    })(cand.local));
    m.addTo(_map);
    _suggMapMarkers.push(m);
  });
}

// ── Modo Comercial (mapa) ─────────────────────────────────────
// Alterna a análise do mapa entre "ANTT" (limites de km sem apoio) e
// "Comercial" (consistência do trecho frente ao horário comercial),
// reaproveitando o mesmo critério de 3 níveis usado na tabela de horário
// (delta-ok/warn/late, ±2min — ver _diffMin/_deltaCellHtml).
function setMapMode(mode) {
  if (mode !== 'antt' && mode !== 'comercial') return;
  if (mode === _mapMode) return;
  _mapMode = mode;
  try { localStorage.setItem('vc_mapMode', mode); } catch(e) {}
  document.querySelectorAll('.map-mode-btn').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-mode') === mode);
  });
  updateMap();
}

/** Remove as camadas do overlay do Modo Comercial (polys + marcadores ⚠). */
function _clearComercialMapLayers() {
  _comercialPolys.forEach(function(p){ p.remove(); });
  _comercialPolys = [];
  _comercialWarnMarkers.forEach(function(m){ m.remove(); });
  _comercialWarnMarkers = [];
  var leg = document.getElementById('mapComercialLegend');
  if (leg) leg.style.display = 'none';
}

/**
 * Colore cada trecho (par de pontos consecutivos, ambos com horário comercial
 * preenchido) segundo o quanto ele consumiu ou ganhou de margem em relação ao
 * horário comercial: verde = folgado, âmbar = apertado (~exato), vermelho =
 * estourou o horário. Marca com ⚠ os trechos cuja velocidade média exigida
 * pelo horário comercial é fisicamente irreal (> 100 km/h).
 */
function _drawComercialOnMap() {
  _clearComercialMapLayers();
  if (!_map || _seq.length < 2) return;

  var legs = Array.isArray(_osrmLegs) ? _osrmLegs : null;
  var c = _calcHorario(legs);
  _recomputeComercialBase(c);

  var clr = { ok: '#22c55e', warn: '#f59e0b', late: '#ef4444' };
  var hasAlert = false;
  var prevIdx = null;
  var coordRank = _buildCoordRank();

  for (var i = 0; i < c.pontos.length; i++) {
    var sp = _seq[i];
    if (!sp || !sp.lat || !sp.lng) continue;
    if (prevIdx === null) { prevIdx = i; continue; }

    var pp = _seq[prevIdx], pc = c.pontos[prevIdx], cc = c.pontos[i];
    var comA = _comercialTimes[pp.idPonto], comB = _comercialTimes[sp.idPonto];
    if (comA && comB && pc.chegadaMin !== null && cc.chegadaMin !== null) {
      var diffA = _diffMin(comA, pc.chegadaMin, pp.idPonto);
      var diffB = _diffMin(comB, cc.chegadaMin, sp.idPonto);
      var legDelta = diffB - diffA; // margem ganha (+) ou perdida (−) NESTE trecho
      var type = legDelta > 2 ? 'ok' : legDelta < -2 ? 'late' : 'warn';
      if (type === 'late') hasAlert = true;

      var distKm  = cc.dist || 0;
      var comAbsA = _comercialAbsMap[pp.idPonto], comAbsB = _comercialAbsMap[sp.idPonto];
      var comVel  = (comAbsA !== undefined && comAbsB !== undefined && comAbsB > comAbsA)
                    ? distKm / ((comAbsB - comAbsA) / 60) : null;
      var irreal  = comVel !== null && comVel > 100;

      // Segue o traçado real (curva da via) quando a geometria OSRM já chegou;
      // cai para linha reta enquanto isso não acontece.
      var coords = _realGeomBetween(prevIdx, i, coordRank) || [[+pp.lat, +pp.lng], [+sp.lat, +sp.lng]];
      var lbl = type === 'late' ? 'Atrasa o horário' : type === 'ok' ? 'Folgado' : 'Apertado';
      var tip = '<b>' + esc(lbl) + '</b>'
              + (irreal ? ' ' + ico('alert-triangle', 11) : '')
              + '<br><span style="font-size:10px;color:#ccc">' + esc(pp.nomePonto || '') + ' &rarr; ' + esc(sp.nomePonto || '') + '</span>'
              + '<br><span style="font-size:10px;color:#ccc">Variação de margem no trecho: ' + (legDelta >= 0 ? '+' : '') + Math.round(legDelta) + ' min</span>'
              + (comVel !== null ? '<br><span style="font-size:10px;color:#ccc">Vel. exigida p/ horário comercial: ' + Math.round(comVel) + ' km/h</span>' : '');
      var pl = L.polyline(coords, {
        color: clr[type], weight: 10, opacity: 0.32,
        lineCap: 'round', lineJoin: 'round'
      }).addTo(_map);
      pl.bindTooltip(tip, { sticky: true });
      _comercialPolys.push(pl);

      if (irreal) {
        var mid     = coords[Math.floor(coords.length / 2)];
        var midLat  = mid[0], midLng = mid[1];
        var icon = L.divIcon({
          className: '',
          html: '<div style="width:22px;height:22px;border-radius:50%;background:#ef4444;border:2px solid #fff;' +
                'display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:900;' +
                'box-shadow:0 2px 8px rgba(0,0,0,0.5);">!</div>',
          iconSize: [22, 22], iconAnchor: [11, 11]
        });
        var wm = L.marker([midLat, midLng], { icon: icon, zIndexOffset: 700 });
        wm.bindTooltip('<b>Inconsistência grave</b><br><span style="font-size:10px;color:#ccc">Velocidade exigida (' + Math.round(comVel) + ' km/h) é irreal para este trecho.</span>', { direction: 'top', offset: [0, -12] });
        wm.addTo(_map);
        _comercialWarnMarkers.push(wm);
      }
    }
    prevIdx = i;
  }

  var leg = document.getElementById('mapComercialLegend');
  if (leg) leg.style.display = '';
}

// ── IA: por que o horário comercial diverge da nossa proposta ────────────
// Reusa a mesma lógica de trecho (legDelta/comVel) do Modo Comercial, mas
// nesta fase (planejamento — o esquema ainda não rodou) manda os trechos com
// maior divergência para a IA (Groq) explicar a causa provável e sugerir
// ajuste, numa única chamada (visão geral, mesmo padrão do Diagnóstico
// Inteligente do relatório operacional).
function analisarDivergenciaComercial() {
  if (!_sel || _seq.length < 2) { toast('Selecione um esquema com pontos para analisar.', 'error'); return; }

  var legs = Array.isArray(_osrmLegs) ? _osrmLegs : null;
  var c = _calcHorario(legs);
  _recomputeComercialBase(c);

  var trechos = [];
  var prevIdx = null;
  for (var i = 0; i < c.pontos.length; i++) {
    var sp = _seq[i];
    if (!sp || !sp.lat || !sp.lng) continue;
    if (prevIdx === null) { prevIdx = i; continue; }

    var pp = _seq[prevIdx], pc = c.pontos[prevIdx], cc = c.pontos[i];
    var comA = _comercialTimes[pp.idPonto], comB = _comercialTimes[sp.idPonto];
    if (comA && comB && pc.chegadaMin !== null && cc.chegadaMin !== null) {
      var diffA = _diffMin(comA, pc.chegadaMin, pp.idPonto);
      var diffB = _diffMin(comB, cc.chegadaMin, sp.idPonto);
      var legDelta = diffB - diffA;
      var distKm  = cc.dist || 0;
      var tvCalcMin = cc.tv || 0;
      var calcVel = tvCalcMin > 0 ? (distKm / tvCalcMin) * 60 : null;
      var comAbsA = _comercialAbsMap[pp.idPonto], comAbsB = _comercialAbsMap[sp.idPonto];
      var comVel = (comAbsA !== undefined && comAbsB !== undefined && comAbsB > comAbsA)
                   ? distKm / ((comAbsB - comAbsA) / 60) : null;
      trechos.push({
        de: pp.nomePonto || '', para: sp.nomePonto || '',
        distKm: distKm, tvCalcMin: tvCalcMin, calcVel: calcVel, comVel: comVel,
        legDelta: legDelta, diffA: diffA, diffB: diffB,
        irreal: comVel !== null && comVel > 100
      });
    }
    prevIdx = i;
  }

  // Critério de seleção: ou o TRECHO em si já diverge (>2min de variação de
  // margem — pega desalinhos localizados), ou o ponto de chegada já acumula
  // mais de 2h de defasagem em relação ao horário comercial (>=120min, para
  // mais ou para menos — pega o arrasto de vários trechos pequenos que juntos
  // viram um problema grande, mesmo que nenhum trecho isolado pareça crítico).
  var LIMIAR_ACUM_MIN = 120;
  var divergentes = trechos.filter(function(t) {
    return Math.abs(t.legDelta) > 2 || t.irreal || Math.abs(t.diffB) >= LIMIAR_ACUM_MIN;
  }).sort(function(a, b) {
    return Math.max(Math.abs(b.diffB), Math.abs(b.legDelta)) - Math.max(Math.abs(a.diffB), Math.abs(a.legDelta));
  }).slice(0, 12);

  if (!divergentes.length) {
    if (!trechos.length) toast('Preencha o horário comercial dos pontos para poder analisar.', 'error');
    else toast('Nenhuma divergência relevante encontrada — horário comercial e proposta estão alinhados.', 'success');
    return;
  }

  var lastComIdx = -1;
  for (var k = _seq.length - 1; k >= 0; k--) {
    if (_comercialTimes[_seq[k].idPonto] && c.pontos[k] && c.pontos[k].chegadaMin !== null) { lastComIdx = k; break; }
  }
  var diffFinalMin = lastComIdx >= 0
    ? _diffMin(_comercialTimes[_seq[lastComIdx].idPonto], c.pontos[lastComIdx].chegadaMin, _seq[lastComIdx].idPonto)
    : null;

  var payload = {
    nomeLinha: (_sel.nome_linha || ''),
    indicadores: { totalKm: c.distTotal, tempoCalcMin: c.totalMin, diffFinalMin: diffFinalMin },
    trechos: divergentes
  };

  var btn = document.getElementById('btnIaDivergencia');
  if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; }
  loading('Analisando divergências com IA…');
  google.script.run
    .withSuccessHandler(function(res) {
      doneLoading();
      if (btn) { btn.disabled = false; btn.style.opacity = ''; }
      if (!res || !res.ok) { toast('Erro na análise: ' + (res && res.erro || 'falha desconhecida'), 'error'); return; }
      _abrirModalIaDivergencia(res.narrativa);
    })
    .withFailureHandler(function(e) {
      doneLoading();
      if (btn) { btn.disabled = false; btn.style.opacity = ''; }
      toast('Erro na análise: ' + (e.message || e), 'error');
    })
    .explicarDivergenciaComercial(payload);
}

      + '<div style="background:#1a1d23;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">'
        + '<div style="font-size:14px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px;">' + ico('lightbulb', 15) + ' Análise de divergência — IA</div>'
        + '<button onclick="_fecharModalIaDivergencia()" style="background:none;border:none;color:#9aa0ad;cursor:pointer;padding:4px;display:flex;">' + ico('x', 15) + '</button>'

      + '<div style="padding:18px 20px;overflow-y:auto;">'

        + '<button onclick="_fecharModalIaDivergencia()" style="padding:8px 18px;border:none;border-radius:6px;background:#f47920;color:#fff;font-size:12px;font-weight:700;cursor:pointer;">Fechar</button>'

function _fecharModalIaDivergencia() {
  var m = document.getElementById('iaDivOverlay');
  if (m) m.remove();
}

/** Remove as camadas de hover/click de trecho (tempo+km+vel) do mapa. */
function _clearLegHoverLayers() {
  _legHoverPolys.forEach(function(p){ p.remove(); });
  _legHoverPolys = [];
}

function _fmtLegDuration(min) {
  min = Math.round(min);
  var h = Math.floor(min / 60), m = min % 60;
  return h > 0 ? (h + 'h' + (m < 10 ? '0' : '') + m + 'min') : (m + ' min');
}

/**
 * Card do trecho: "são X km, a Y km/h, feito em Zh". Se ambos os pontos
 * tiverem horário comercial, mostra também um comparativo — entrada A → entrada
 * B (intervalo real da tabela comercial) e a velocidade média que o veículo
 * precisaria manter para cumprir esse intervalo com a mesma distância.
 */
function _legHoverTooltipHtml(A, B, distKm, tv) {
  var vel   = tv > 0 ? Math.round((distKm / tv) * 60) : null;
  var kmTxt = distKm.toFixed(1).replace('.', ',') + ' km';

  var html = '<div style="font-family:Inter,Arial,sans-serif;font-size:13px;line-height:1.6;min-width:230px;">'
    + '<div style="font-weight:700;font-size:13px;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid #e2e5ea;">'
    +   esc(A.nomePonto || '') + ' &rarr; ' + esc(B.nomePonto || '') + '</div>'
    + '<div style="color:#3a3f52;">'
    +   'São <strong>' + kmTxt + '</strong>'
    +   (vel !== null ? ', a uma velocidade média de <strong>' + vel + ' km/h</strong>' : '')
    +   ', feitos em <strong>' + _fmtLegDuration(tv) + '</strong>.'
    + '</div>';

  var comA = _comercialAbsMap[A.idPonto], comB = _comercialAbsMap[B.idPonto];
  if (comA !== undefined && comB !== undefined && comB > comA) {
    var diffMin  = comB - comA;
    var comVel   = distKm / (diffMin / 60);
    html += '<div style="margin-top:9px;padding-top:8px;border-top:1px dashed #d4d8e8;">'
      + '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#9aa0ad;margin-bottom:4px;">Horário comercial</div>'
      + '<div style="color:#3a3f52;">'
      +   esc(_comercialTimes[A.idPonto] || '') + ' &rarr; ' + esc(_comercialTimes[B.idPonto] || '')
      +   ' <span style="color:#9aa0ad;">(' + _fmtLegDuration(diffMin) + ')</span>'
      + '</div>'
      + '<div style="color:#3a3f52;margin-top:2px;">'
      +   'Velocidade média necessária: <strong style="color:#f47920;">' + Math.round(comVel) + ' km/h</strong>'
      + '</div>'
      + '</div>';
  }

  html += '</div>';
  return html;
}

/**
 * Desenha, entre cada par de pontos consecutivos do mapa (view "Mapa"), uma
 * camada invisível espessa que responde a hover/click mostrando tempo, km e
 * velocidade média daquele trecho — no estilo Google Maps. Fica por cima da
 * rota principal e do overlay ANTT para não perder o hover para eles.
 *
 * No Modo Comercial, os pontos de apoio (sem horário comercial) ficam ocultos
 * no mapa — então os trechos aqui também são agregados entre os pontos ainda
 * visíveis (início, fim e comerciais), somando km/tempo dos pulos ocultos no
 * meio, em vez de mostrar um card por perna intermediária escondida.
 */
function _drawLegHoverOnMap() {
  _clearLegHoverLayers();
  if (!_map || _seq.length < 2) return;
  var legs = Array.isArray(_osrmLegs) ? _osrmLegs : null;
  var c = _calcHorario(legs);
  _recomputeComercialBase(c);

  var seqCoordIdxs = [];
  _seq.forEach(function(p, i) { if (p.lat && p.lng) seqCoordIdxs.push(i); });
  var firstCoordIdx = seqCoordIdxs[0], lastCoordIdx = seqCoordIdxs[seqCoordIdxs.length - 1];
  var coordRank = _buildCoordRank();

  function isKeeper(idx) {
    return _mapMode !== 'comercial' || idx === firstCoordIdx || idx === lastCoordIdx || !_isApoioAntt(idx);
  }

  var prevKeeperIdx = null, accumDist = 0, accumTv = 0;
  _seq.forEach(function(sp, idx) {
    if (!sp.lat || !sp.lng) return;
    var calc = c.pontos[idx];
    if (prevKeeperIdx !== null && calc) {
      accumDist += calc.dist || 0;
      accumTv   += calc.tv   || 0;
    }
    if (!isKeeper(idx)) return;
    if (prevKeeperIdx !== null && (accumDist > 0 || accumTv > 0)) {
      var A = _seq[prevKeeperIdx], B = sp;
      // Segue o traçado real (curva da via) quando disponível — inclusive
      // quando o trecho agrega várias legs ocultas no Modo Comercial.
      var coords = _realGeomBetween(prevKeeperIdx, idx, coordRank) || [[+A.lat, +A.lng], [+B.lat, +B.lng]];
      var html = _legHoverTooltipHtml(A, B, accumDist, accumTv);
      var hit = L.polyline(coords, { color: '#000', weight: 14, opacity: 0 }).addTo(_map);
      hit.bindTooltip(html, { sticky: true, direction: 'top', className: 'leaflet-tooltip-leg' });
      hit.bindPopup(html, { className: 'leaflet-popup-light', maxWidth: 300 });
      _legHoverPolys.push(hit);
    }
    prevKeeperIdx = idx; accumDist = 0; accumTv = 0;
  });
}

/** Retorna o HTML do badge ANTT (Ponto de Apoio, 495km) para a célula de nome. */
function _anttBadgeHtml(idx) {
  var a = _anttMap[idx];
  if (!a) return '';
  var badgeIco = a.type === 'error' ? ico('alert-triangle', 11) : a.type === 'warn' ? ico('zap', 11) : ico('info', 11);
  var lbl = a.type === 'error'
    ? badgeIco + ' ' + a.dist + 'km s/ apoio'
    : a.type === 'warn'
    ? badgeIco + ' ' + a.dist + 'km (lim. ' + ANTT_MAX_KM + ')'
    : badgeIco + ' ' + a.dist + 'km (apoio próximo)';
  var tip = a.type === 'error'
    ? a.dist + 'km desde ' + a.fromNome + ' — excede o limite ANTT de ' + ANTT_MAX_KM + 'km entre pontos de apoio'
    : a.type === 'warn'
    ? a.dist + 'km desde ' + a.fromNome + ' — próximo ao limite ANTT (' + ANTT_MAX_KM + 'km)'
    : 'Apenas ' + a.dist + 'km desde ' + a.fromNome + ' — pontos de apoio muito próximos';
  return ' <span class="antt-badge antt-' + a.type + '" title="' + esc(tip) + '">' + lbl + '</span>';
}

/** Retorna o HTML do badge ANTT de Troca de Motorista (660km) para a célula de nome. */
function _anttTrocaBadgeHtml(idx) {
  var a = _anttTrocaMap[idx];
  if (!a) return '';
  var badgeIco = a.type === 'error' ? ico('alert-triangle', 11) : ico('zap', 11);
  var lbl = a.type === 'error'
    ? badgeIco + ' ' + a.dist + 'km s/ troca'
    : badgeIco + ' ' + a.dist + 'km (lim. ' + ANTT_TROCA_MAX_KM + ')';
  var tip = a.type === 'error'
    ? a.dist + 'km desde ' + a.fromNome + ' — excede o limite ANTT de ' + ANTT_TROCA_MAX_KM + 'km entre trocas de motorista'
    : a.dist + 'km desde ' + a.fromNome + ' — próximo ao limite ANTT de troca (' + ANTT_TROCA_MAX_KM + 'km)';
  return ' <span class="antt-badge antt-troca-' + a.type + '" title="' + esc(tip) + '">' + lbl + '</span>';
}

/** Atualiza indicadores ANTT nos TRs existentes (uso em partial updates). */
function _applyAnttToRows(c) {
  _computeAnttAlerts(c);
  for (var i = 0; i < c.pontos.length; i++) {
    var row = document.getElementById('horRow' + i);
    if (!row || c.pontos[i].preDep) continue;
    row.classList.remove('antt-row-error','antt-row-warn','antt-row-info','antt-troca-row-error','antt-troca-row-warn');
    var tds = row.querySelectorAll('td');
    if (!tds[0]) continue;
    tds[0].querySelectorAll('.antt-badge').forEach(function(el) { el.remove(); });
    var a = _anttMap[i];
    if (a) {
      row.classList.add('antt-row-' + a.type);
      tds[0].insertAdjacentHTML('beforeend', _anttBadgeHtml(i));
    }
    var at = _anttTrocaMap[i];
    if (at) {
      row.classList.add('antt-troca-row-' + at.type);
      tds[0].insertAdjacentHTML('beforeend', _anttTrocaBadgeHtml(i));
    }
  }
  _updateAnttWarnBar();
  _updateApoioSuggestions();
}

function _buildStatsHtml(c, osrmLegs) {
  var _S = function(bg,co,bo,txt){ return '<span style="background:'+bg+';color:'+co+';border:1px solid '+bo+';border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;">'+txt+'</span>'; };
  var distBadge = _osrmStatus === 'pending'
    ? _S('#e3f2fd','#1565c0','#90caf9','⏳ Calculando…')
    : _osrmStatus === 'ok'
      ? _S('#e8f5e9','#2e7d32','#a5d6a7', ico('map-pin',11) + ' Traçado real (OSM)')
      : _osrmStatus === 'cache'
        ? _S('#e8eaf6','#283593','#9fa8da', ico('archive',11) + ' Cache de distâncias')
        : _S('#fce4ec','#c62828','#ef9a9a', ico('alert-triangle',11) + ' OSRM indisponível — mín. 30 min');
  var timeBadge = '<span style="background:#fff8e1;color:#f57f17;border:1px solid #ffe082;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;">' + ico('gauge',11) + ' ' + Math.round(c.vel || 85) + ' km/h</span>';
  return '<div class="hor-src-bar">' + distBadge + timeBadge + '</div>'
    + '<div class="hor-summary">'
    + '<div class="hor-stat"><div class="hor-stat-val">' + c.distTotal + ' km</div><div class="hor-stat-lbl">Distância total</div></div>'
    + '<div class="hor-stat"><div class="hor-stat-val">' + _hhmm(c.tvTotal) + '</div><div class="hor-stat-lbl">Em deslocamento</div></div>'
    + '<div class="hor-stat"><div class="hor-stat-val">' + _hhmm(c.tpTotal) + '</div><div class="hor-stat-lbl">Em paradas</div></div>'
    + '<div class="hor-stat" style="background:#fff8f0;border-color:#fddcb3;">'
      + '<div class="hor-stat-val" style="color:#f47920;">' + _hhmm(c.totalMin) + '</div>'
      + '<div class="hor-stat-lbl">Tempo total</div></div>'
    + '</div>';
}

function _renderHorarioWith(osrmLegs) {
  var body = document.getElementById('horBody');
  if (!body) return;

  _updateStartPtSelect();

  var c       = _calcHorario(osrmLegs);
  _lastCalc   = c;
  _recomputeComercialBase(c);
  _computeAnttAlerts(c);
  var partida  = document.getElementById('horHoraPartida').value || '00:00';
  var startIdx = Math.min(_horStartIdx, _seq.length - 1);

  // ── Sidebar ────────────────────────────────────
  var sideItems = c.pontos.map(function(p, i) {
    var comVal   = _comercialTimes[_seq[i].idPonto] || '';
    var preDep   = p.preDep;
    var chegaStr = preDep ? '—' : (p.chegadaMin !== null ? _ms(p.chegadaMin) : partida);
    var deltaHtml = '';
    if (!preDep && comVal && p.chegadaMin !== null) {
      var diff = _diffMin(comVal, p.chegadaMin, _seq[i].idPonto);
      var cls3, sign3;
      if      (diff >  2) { cls3 = 'delta-ok';   sign3 = '+'; }
      else if (diff < -2) { cls3 = 'delta-late';  sign3 = '−'; }
      else                { cls3 = 'delta-warn';  sign3 = '≈'; }
      deltaHtml = '<span class="hor-sidebar-delta ' + cls3 + '">'
        + sign3 + (Math.abs(diff) > 1 ? _dur(Math.abs(diff)) : '') + '</span>';
    }
    var startMark = (i === startIdx)
      ? '<span style="display:inline-flex;align-items:center;background:#f47920;color:#fff;border-radius:3px;padding:1px 4px;margin-left:3px;">' + ico('send',9) + '</span>' : '';
    return '<div class="hor-sidebar-item" id="horSbar' + i + '"'
      + (preDep ? ' style="opacity:0.4;"' : '') + '>'
      + '<div class="hor-sidebar-num">' + (i + 1) + startMark + '</div>'
      + '<div class="hor-sidebar-name" title="' + esc(p.nomePonto) + '">' + esc(p.nomePonto) + '</div>'
      + '<div class="hor-sidebar-time">' + chegaStr + deltaHtml + '</div>'
      + '</div>';
  }).join('');

  var sidebarHidden = _horSidebarHidden;
  var sidebar = '<div class="hor-sidebar' + (sidebarHidden ? ' hor-sidebar-collapsed' : '') + '" id="horSidebarWrap">'
    + '<div class="hor-sidebar-head">Pontos <span class="count-badge">' + c.pontos.length + '</span>'
    + '<button class="hor-panel-close" onclick="toggleHorSidebar()" title="' + (sidebarHidden ? 'Mostrar' : 'Ocultar') + ' painel">×</button>'
    + '</div>'
    + '<div class="hor-sidebar-list">' + sideItems + '</div>'
    + '</div>';

  var stats = '<div id="horStatsPanel">' + _buildStatsHtml(c, osrmLegs) + '</div>';

  // ── Tabela por ponto ───────────────────────────
  var rows = c.pontos.map(function(p, i) {
    var isStart = (i === startIdx);
    var isLast  = (i === c.pontos.length - 1);
    var preDep  = p.preDep;

    var clsArr = [];
    if      (preDep)   clsArr.push('row-predep');
    else if (isStart)  clsArr.push('row-first');
    else if (isLast)   clsArr.push('row-last');
    var anttA = !preDep && _anttMap[i];
    if (anttA) clsArr.push('antt-row-' + anttA.type);
    var anttT = !preDep && _anttTrocaMap[i];
    if (anttT) clsArr.push('antt-troca-row-' + anttT.type);
    var cls = clsArr.length ? ' class="' + clsArr.join(' ') + '"' : '';

    if (preDep) {
      return '<tr id="horRow' + i + '" class="row-predep">'
        + '<td style="font-weight:600;">' + esc(p.nomePonto) + '</td>'
        + '<td colspan="6" style="text-align:center;font-style:italic;color:#bbb;font-size:10px;">pré-partida</td>'
        + '</tr>';

    var tvCel = _buildLegViaCell(i, c);

    var chegStr = p.chegadaMin !== null ? _ms(p.chegadaMin) : partida;
    if (isStart) chegStr = partida;
    var saidStr = p.saidaMin !== null
                ? _ms(p.saidaMin)
                : (p.chegadaMin !== null
                    ? '<strong style="color:#f47920;">' + ico('star',11) + ' ' + _ms(p.chegadaMin) + '</strong>'
                    : '—');

    var cidadeCell = '<td style="font-weight:600;">'
      + esc(p.nomePonto)
      + (isStart ? ' <span style="display:inline-flex;align-items:center;background:#f47920;color:#fff;border-radius:3px;padding:1px 4px;">' + ico('send',9) + '</span>' : '')
      + _anttBadgeHtml(i)
      + _anttTrocaBadgeHtml(i)
      + _tiposParadaCellHtml(i)
      + '</td>';

    var comVal  = _comercialTimes[_seq[i].idPonto] || '';
    var comCell;
    if (comVal) {
      comCell = '<span class="hor-com-display" onclick="editComercial(' + i + ',this)">'
              + esc(comVal) + '<span class="hor-com-edit-icon">' + ico('pencil',10) + '</span></span>';
    } else {
      comCell = '<input type="text" class="hor-com-input" placeholder="HH:MM" '
              + 'onfocus="highlightRow(' + i + ')" '
              + 'oninput="_autoFormatTime(this)" '
              + 'onblur="_confirmComercial(' + i + ',this,false)" '
              + 'onkeydown="if(event.key===\'Enter\'){event.preventDefault();_confirmComercial(' + i + ',this,true)}'

    var deltaCell = p.chegadaMin !== null ? _deltaCellHtml(comVal, p.chegadaMin, _seq[i].idPonto, i) : '—';
