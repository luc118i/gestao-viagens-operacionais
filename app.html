    /**
     * Confirma o cadastro do novo motorista: valida, persiste (se novo) e
     * substitui o formulário por uma linha de responsável já vinculada.
     */
    function _confirmarCadastroMotoristaTrecho(row, inpMat, inpNome, inpBase, selIni, selFim, btn) {
      var mat  = inpMat.value.trim();
      var nome = inpNome.value.trim();
      var base = inpBase ? inpBase.value.trim() : '';
      var ini  = selIni.value;
      var fim  = selFim.value;

      if (!nome)          { UIModule.showToast('Informe o nome do motorista.', 'error'); return; }
      if (!ini || !fim)   { UIModule.showToast('Selecione o ponto inicial e final do trecho.', 'error'); return; }

      _motoristasCadastrados = _motoristasCadastrados || [];

      var finalize = function (idx, msg, tipo) {
        row.remove();
        _addMotoristaTrechoRow({ motoristaIdx: idx, ini: ini, fim: fim });
        if (msg) UIModule.showToast(msg, tipo || 'success', 3500);
      };

      // Matrícula já cadastrada → apenas vincula (sem re-cadastrar)
      var idxExist = mat ? _idxMotoristaPorMatricula(mat) : -1;
      if (idxExist >= 0) {
        finalize(idxExist, '"' + nome + '" vinculado ao trecho.');
        return;
      }

      // Novo → persiste no sistema (aba MOTORISTAS + API) e vincula
      if (btn) { btn.disabled = true; btn.textContent = 'Cadastrando…'; }

      google.script.run
        .withSuccessHandler(function (salvo) {
          _motoristasCadastrados.push({
            matricula: (salvo && salvo.matricula) || mat || '',
            nome:      (salvo && salvo.nome)      || nome,
            base:      (salvo && salvo.base)      || base || ''
          });
          _ensureMatriculasDatalist();
          finalize(_motoristasCadastrados.length - 1, '"' + nome + '" cadastrado e vinculado ao trecho.');
        })
        .withFailureHandler(function (err) {
          // Falha ao persistir não impede o uso no relatório atual
          console.warn('[App] Falha ao cadastrar motorista:', err);
          _motoristasCadastrados.push({ matricula: mat || '', nome: nome, base: base || '' });
          _ensureMatriculasDatalist();
          finalize(_motoristasCadastrados.length - 1, '"' + nome + '" vinculado (falha ao cadastrar no sistema).', 'warning');
        })
        .salvarMotorista({ matricula: mat, nome: nome, base: base, ibutton: '' });
    }

    /** Limpa todas as linhas de responsáveis. */
    function _resetMotoristasTrecho() {
      var lista = document.getElementById('relMotoristasTrechoList');
      if (lista) lista.innerHTML = '';
    }

    /**
     * Coleta os responsáveis inseridos no modal, no formato esperado pelo
     * servidor: { nome, matricula, base, ponto_inicio, ponto_fim, inicioNome, fimNome }.
     * Ignora linhas sem motorista selecionado.
     */
    function _coletarMotoristasTrecho() {
      var lista = document.getElementById('relMotoristasTrechoList');
      if (!lista) return [];
      var out = [];
      lista.querySelectorAll('.rel-mot-trecho-row').forEach(function (row) {
        var selMot = row.querySelector('.rel-mot-sel');
        var selIni = row.querySelector('.rel-mot-ini');
        var selFim = row.querySelector('.rel-mot-fim');
        var idx = selMot ? parseInt(selMot.value, 10) : NaN;
        if (isNaN(idx) || !_motoristasCadastrados || !_motoristasCadastrados[idx]) return;
        var m = _motoristasCadastrados[idx];
        var ini = selIni ? selIni.value : '';
        var fim = selFim ? selFim.value : '';
        out.push({
          nome:         m.nome || '',
          matricula:    m.matricula || '',
          base:         m.base || '',
          ponto_inicio: ini,
          ponto_fim:    fim,
          inicioNome:   selIni && selIni.selectedOptions[0] ? selIni.selectedOptions[0].textContent : ini,
          fimNome:      selFim && selFim.selectedOptions[0] ? selFim.selectedOptions[0].textContent : fim,
          seqMin:       _seqPorPonto(ini),
          seqMax:       _seqPorPonto(fim),
        });
      });
      return out;
    }

    function _initModalRelatorio() {
      var overlay = document.getElementById("modalRelatorio");
      var btnOpen = document.getElementById("btnRelatorio");
      var btnClose = document.getElementById("btnCloseRelatorioModal");
      var btnCancel = document.getElementById("btnCancelRelatorioModal");
      var btnConfirm = document.getElementById("btnConfirmRelatorioModal");

      if (!overlay) return;

      var open = function () {
        _resetEvidenciasRel();
        _resetMotoristasTrecho();
        _carregarMotoristasCadastrados();
        overlay.classList.add("open");
      };
      var close = function () {
        overlay.classList.remove("open");
      };

      // Botão "Adicionar motorista" no bloco de responsáveis do trecho
      var btnAddMot = document.getElementById("btnAddMotoristaTrecho");
      if (btnAddMot) {
        btnAddMot.addEventListener("click", function () {
          _carregarMotoristasCadastrados(function () { _addMotoristaTrechoRow(); });
        });
      }

      // Botão "Cadastrar novo motorista" — registra no sistema e vincula ao trecho
      var btnCadMot = document.getElementById("btnCadastrarMotoristaTrecho");
      if (btnCadMot) {
        btnCadMot.addEventListener("click", function () {
          _carregarMotoristasCadastrados(function () { _addCadastroMotoristaTrechoRow(); });
        });
      }

      // Seleção de imagens/evidências
      var evInput = document.getElementById("relEvidenciasInput");
      if (evInput) {
        evInput.addEventListener("change", function () {
          _syncCaptionsRel();
          Array.prototype.forEach.call(this.files || [], function (f) {
            _pushEvidenciaFile(f);
          });
          this.value = ""; // permite reselecionar o mesmo arquivo
          _renderEvidenciasList();
        });
      }

      // Colar prints com Ctrl+V enquanto o modal estiver aberto
      document.addEventListener("paste", _onModalRelatorioPaste);

      if (btnOpen) btnOpen.addEventListener("click", open);
      if (btnClose) btnClose.addEventListener("click", close);
      if (btnCancel) btnCancel.addEventListener("click", close);
      overlay.addEventListener("click", function (e) {
        if (e.target === overlay) close();
      });

      // Toggle tipo de relatório no modal
      document
        .querySelectorAll('input[name="tipoRelatorioModal"]')
        .forEach(function (radio) {
          radio.addEventListener("change", function () {
            var val = radio.value;
            var motFields = document.getElementById("relMotoristaFields");
            var trcFields = document.getElementById("relTrechoFields");
            var cmpFields = document.getElementById("relCompletoFields");
            if (motFields) motFields.style.display = val === "MOTORISTA" ? "block" : "none";
            if (trcFields) trcFields.style.display = val === "TRECHO"    ? "block" : "none";
            if (cmpFields) cmpFields.style.display = val === "COMPLETO"  ? "block" : "none";
          });
        });

      if (btnConfirm) {
        btnConfirm.addEventListener("click", _onConfirmRelatorio);
      }
    }

        _vinculos.forEach(function (v, i) {
          var opt = document.createElement("option");
          opt.value = i;
          opt.textContent = v.nome + " (" + v.matricula + ")";
          selInline.appendChild(opt);
        });

      var selModo = document.getElementById("modoSelectMotorista");

    function _onConfirmRelatorio(skipGuard) {
      // Aviso: se há alertas pendentes sem justificativa, confirma antes de gerar.
      if (skipGuard !== true) {
        var _pend = _countAlertasPendentes();
        if (_pend > 0) {
          _abrirModalPendencias(_pend, function () { _onConfirmRelatorio(true); });
          return;
        }
      }

      var tipoEl = document.querySelector('input[name="tipoRelatorioModal"]:checked');
      var tipo = tipoEl ? tipoEl.value : "COMPLETO";
      var gerarParadas = !!(document.getElementById('chkParadasIrregulares') &&
                            document.getElementById('chkParadasIrregulares').checked);

      var selEsquema = document.getElementById("selectEsquema");
      var idEsquema = selEsquema ? selEsquema.value : "";
      var esqObj = _esquemas.find(function (e) { return e.id_esquema === idEsquema; });
      var nomeLinha = esqObj ? esqObj.nome_linha : "";

      var fmtEl = document.querySelector('input[name="formatoRelatorioModal"]:checked');
      var formato = fmtEl ? fmtEl.value : 'pdf';

      var params = {
        tipo: tipo,
        enviarAPI: true,
        formato: formato,
        idEsquema: idEsquema,
        nomeLinha: nomeLinha,
        horario: esqObj ? (esqObj.horario || '') : '',
        enrichedTrip: _enrichedTrip,
        esquemaPontos: _esquemaPontos,
        segments: _analysis ? _analysis.segments : [],
        summary:  _analysis ? _analysis.summary  : {},
        justificativas: _justState.justificativas || {},
        codLinha: esqObj ? (esqObj.cod_linha || '') : '',
        sentido:  esqObj ? (esqObj.sentido   || '') : '',
      };

      if (tipo === "MOTORISTA") {
        var selMot = document.getElementById("relSelectMotoristaModal");
        var idx = selMot ? parseInt(selMot.value, 10) : -1;
        if (isNaN(idx) || idx < 0 || !_vinculos[idx]) {
          UIModule.showToast("Selecione um motorista vinculado.", "error");
          return;
        }
        params.motorista = _vinculos[idx];
      } else if (tipo === "TRECHO") {
        var pontoA = document.getElementById("relPontoAModal") ? document.getElementById("relPontoAModal").value : "";
        var pontoB = document.getElementById("relPontoBModal") ? document.getElementById("relPontoBModal").value : "";
        if (!pontoA || !pontoB) {
          UIModule.showToast("Selecione os pontos A e B do trecho.", "error");
          return;
        }
        // Responsáveis inseridos manualmente no modal; se nenhum, tenta derivar dos vínculos
        var manuais = _coletarMotoristasTrecho();
        params.motoristasTrecho = manuais.length
          ? manuais
          : _motoristasDoTrecho(_seqPorPonto(pontoA), _seqPorPonto(pontoB));
        params.idPontoA = pontoA;
        params.idPontoB = pontoB;
      }

      // ── Estado de carregamento no botão ───────────────────────
      var btnConfirm = document.getElementById('btnConfirmRelatorioModal');
      var btnCancel  = document.getElementById('btnCancelRelatorioModal');
      var _setBusy = function(busy) {
        if (btnConfirm) {
          btnConfirm.disabled = busy;
          btnConfirm.innerHTML = busy
            ? '<span class="btn-spin"></span> Gerando...'
            : '<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="13" height="13"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg> Gerar';
        }
        if (btnCancel) btnCancel.disabled = busy;
      };

      _setBusy(true);
      UIModule.showLoading(
        _relFiles.length ? "Processando imagens e gerando relatório..." : "Capturando mapa e gerando relatório..."
      );

      _readEvidenciasBase64().then(function (evidencias) {
        params.evidencias = evidencias; // anexadas só na ocorrência principal (server)

        _gerarComCaptura(params,
          function (result) {
            UIModule.hideLoading();
            _setBusy(false);
            document.getElementById("modalRelatorio").classList.remove("open");
            console.log("[App] Payload do relatório:", result.payload);
            if (result.apiResponse) {
              console.log("[App] Resposta da API:", result.apiResponse);
              var _body = result.apiResponse.body || {};
              if (_body.url) {
                UIModule.showToast("Relatório gerado com sucesso!", "success", 4000);
                var fname = _buildPdfFilename(tipo, params.motorista, params.formato);
                _downloadPdf(_body.url, fname);
                UIModule.showToast((params.formato === 'docx' ? 'Documento Word' : 'PDF') + " pronto para download.", "success", 4000);
              } else {
                var _fmt = (params.formato === 'docx') ? 'DOCX' : 'PDF';
                UIModule.showToast(
                  'Ocorrência criada, mas o arquivo ' + _fmt + ' não foi gerado' +
                  (_body.warning ? ' — ' + _body.warning : '') + '.',
                  'error', 9000);
              }
            } else {
              UIModule.showToast("Relatório gerado com sucesso!", "success", 4000);
            }
            if (gerarParadas) {
              _launchParadasFora(params);
            }
          },
          function (err) {
            UIModule.hideLoading();
            _setBusy(false);
            var msg = err && err.message ? err.message : String(err);
            UIModule.showToast("Erro ao gerar relatório: " + msg, "error", 6000);
            console.error("[App] Erro ao gerar relatório:", err);
          }
        );
      });
    }

    /**
     * Lança enviarParadasFora em background e gerencia o card de progresso.
     */
    function _launchParadasFora(params) {
      // Redundante quando chamado após _gerarComCaptura (que já garante
      // login), mas necessário quando chamado direto por
      // criarParadaIrregularInline — ver guard lá.
      if (!params.analisadoPor) params.analisadoPor = _obterUsuarioAtual();

      var onDone = params._onDone || null;

      // Conta previamente quantas paradas fora existem para exibir no card
      var esquemaIdSet = {};
      (params.esquemaPontos || []).forEach(function(ep) {
        if (ep.id_ponto) esquemaIdSet[String(ep.id_ponto).trim()] = true;
      });
      var enriched = params.enrichedTrip || [];
      var lastIdx  = enriched.length - 1;
      var count = 0;
      enriched.forEach(function(pt, idx) {
        if (idx === 0 || idx === lastIdx) return;
        if (pt.apoioManual || pt.ignorarManual) return; // ajuste manual
        if (!pt.parada_s || pt.parada_s <= 0) return;
        if (pt.codigo && esquemaIdSet[String(pt.codigo).trim()]) return;
        if (!pt.proibido42) return;
        count++;
      });

      if (count === 0) {
        UIModule.showToast("Nenhuma parada irregular detectada.", "info", 3000);
        if (onDone) onDone();
        return;
      }

      _showBgProgress('Criando ' + count + ' ocorrência' + (count > 1 ? 's' : '') + ' de parada irregular…');

      var semEsquema = !(params.esquemaPontos && params.esquemaPontos.length > 0);

      google.script.run
        .withSuccessHandler(function(results) {
          if (onDone) onDone('');
          var ok  = (results || []).filter(function(r) { return r.status === 'ok'; }).length;
          var err = (results || []).length - ok;
          if (err === 0) {
            _updateBgProgress('success', '' + ok + ' ocorrência' + (ok !== 1 ? 's' : '') + ' criada' + (ok !== 1 ? 's' : ''));
          } else {
            _updateBgProgress('warning', ok + ' criada' + (ok !== 1 ? 's' : '') + ', ' + err + ' com erro');
          }
        })
        .withFailureHandler(function(e) {
          if (onDone) onDone();
          var msg = e && e.message ? e.message : String(e);
          _updateBgProgress('error', 'Erro: ' + msg.slice(0, 80));
          console.error('[App] enviarParadasFora falhou:', e);
        })
        .enviarParadasFora((function() {
          var p = Object.assign({}, params);
          delete p._onDone;
          return p;
        })());
    }

    function _showBgProgress(text) {
      var card   = document.getElementById('bgProgressCard');
      var textEl = document.getElementById('bgProgressText');
      if (!card) return;
      if (textEl) textEl.textContent = text;
      card.className = 'bg-progress-card running';
      card.style.display = 'flex';
    }

    function _updateBgProgress(state, text) {
      var card   = document.getElementById('bgProgressCard');
      var textEl = document.getElementById('bgProgressText');
      if (!card) return;

        );

          var alerts = analysisResult.alerts;

            AnalysisModule.renderPontosTable(_enrichedTrip);

          AnalysisModule.renderVelocidadeTable(segments);
          AnalysisModule.renderVelocidadeChart(segments);
          _renderAlertas(alerts);

          _agendarMapa(_enrichedTrip, _comparacao, _locaisCache);

          if (
            _isMapUsable() &&
            ponto.lat &&
            ponto.lng &&
            typeof MapModule.panTo === "function"
          ) {
            MapModule.panTo(ponto.lat, ponto.lng);

        })
        .withFailureHandler(_onError)
        .analyzeTrip(_enrichedTrip);
    }

    /** Helper: retorna seq do primeiro ponto do _enrichedTrip com código ou nome == idPonto */
    function _seqPorPonto(idPonto) {
      if (!idPonto || !_enrichedTrip.length) return null;
      var key = String(idPonto).trim();
      var found = _enrichedTrip.find(function(p) {
        return String(p.codigo || '').trim() === key ||
               String(p.ponto  || '').trim() === key;
      });
      return found ? found.seq : null;
    }

    // ============================================================
    //  EXCLUSIVIDADE DE TRECHO POR MOTORISTA
    // ============================================================

    /** Faixa de seq de um vínculo (usa seqMin/seqMax, ou deriva dos pontos). */
    function _rangeDoVinculo(v) {
      if (!v) return null;
      var min = (v.seqMin != null) ? v.seqMin : _seqPorPonto(v.ponto_inicio);
      var max = (v.seqMax != null) ? v.seqMax : _seqPorPonto(v.ponto_fim);
      if (min == null || max == null) return null;
      return { min: Math.min(min, max), max: Math.max(min, max) };
    }

    /**
     * Motoristas vinculados cuja faixa de responsabilidade se sobrepõe ao
     * trecho [seqA, seqB]. Retorna em ordem de viagem (por seqMin), com nomes
     * de pontos resolvidos para exibição no relatório.
     *
     * A sobreposição exige interior compartilhado (min(vMax,tMax) > max(vMin,tMin)):
     * um vínculo que apenas encosta no extremo do trecho (ponto de rendição) não
     * é considerado responsável pelo trecho.
     */
    function _motoristasDoTrecho(seqA, seqB) {
      if (seqA == null || seqB == null) return [];
      var tMin = Math.min(seqA, seqB), tMax = Math.max(seqA, seqB);
      return _vinculos
        .map(function (v) {
          var r = _rangeDoVinculo(v);
          return r ? { v: v, min: r.min, max: r.max } : null;
        })
        .filter(function (o) {
          return o && Math.min(o.max, tMax) > Math.max(o.min, tMin);
        })
        .sort(function (a, b) { return a.min - b.min; })
        .map(function (o) {
          var v = o.v;
          return {
            nome:         v.nome || '',
            matricula:    v.matricula && v.matricula !== '—' ? v.matricula : '',
            base:         v.base || '',
            ponto_inicio: v.ponto_inicio || '',
            ponto_fim:    v.ponto_fim || '',
            inicioNome:   _nomePontoPorId(v.ponto_inicio),
            fimNome:      _nomePontoPorId(v.ponto_fim),
            seqMin:       o.min,
            seqMax:       o.max,
          };
        });
    }

    /**
     * Vínculo que possui a seq no INTERIOR do seu trecho (extremos liberados p/ rendição).
     * @param {number} seq
     * @param {number} [excludeIdx]  índice de vínculo a ignorar (edição)
     */
    function _vinculoInteriorPorSeq(seq, excludeIdx) {
      if (seq == null) return null;
      for (var i = 0; i < _vinculos.length; i++) {
        if (i === excludeIdx) continue;
        var r = _rangeDoVinculo(_vinculos[i]);
        if (r && seq > r.min && seq < r.max) return _vinculos[i];
      }
      return null;
    }

    /** Vínculo que bloqueia um ponto (pelo valor do option: codigo/nome/id). */
    function _vinculoQueBloqueiaPonto(valorPonto, excludeIdx) {
      return _vinculoInteriorPorSeq(_seqPorPonto(valorPonto), excludeIdx);
    }

    /**
     * Retorna o vínculo conflitante se o trecho candidato sobrepõe o interior de
     * outro trecho já vinculado. Extremos compartilhados (rendição) não conflitam.
     */
    function _trechoConflita(valIni, valFim, excludeIdx) {
      var sa = _seqPorPonto(valIni), sb = _seqPorPonto(valFim);
      if (sa == null || sb == null) return null;
      var min = Math.min(sa, sb), max = Math.max(sa, sb);
      for (var i = 0; i < _vinculos.length; i++) {
        if (i === excludeIdx) continue;
        var r = _rangeDoVinculo(_vinculos[i]);
        if (r && r.min < max && min < r.max) return _vinculos[i]; // sobreposição de interior
      }
      return null;
    }

    /** Monta o <option> de um ponto, desabilitando quando já vinculado a outro motorista. */
    function _optionPontoHtml(p, excludeIdx) {
      var bloq = _vinculoQueBloqueiaPonto(p.valor, excludeIdx);
      var dis  = bloq ? ' disabled' : '';
      var suf  = bloq ? ' — já vinculado (' + _escHtml(bloq.nome || bloq.matricula || '') + ')' : '';
      return '<option value="' + _escHtml(p.valor) + '"' + dis + '>' + _escHtml(p.label) + suf + '</option>';
    }

    /** Reaplica o agrupamento por motorista na tabela de eventos (se houver análise). */
    function _refreshEventos() {
      if (_enrichedTrip.length && _analysis && typeof _aplicarFiltroModo === 'function') {
        _aplicarFiltroModo();
      }
    }

    /** Faixa de seq a partir dos pontos selecionados (com fallback). */
    function _computeSeqRange(inicio, fim, fbMin, fbMax) {
      var a = _seqPorPonto(inicio), b = _seqPorPonto(fim);
      if (a != null && b != null) return { min: Math.min(a, b), max: Math.max(a, b) };
      return { min: (fbMin != null ? fbMin : null), max: (fbMax != null ? fbMax : null) };
    }

    /** Filtra esquema ao intervalo entre dois pontos (por id_ponto ou nome_ponto). */
    function _filtrarEsquemaPorTrechoLocal(esquemaPontos, pontoA, pontoB) {
      if (!pontoA || !pontoB || !esquemaPontos.length) return esquemaPontos;
      var kA = String(pontoA).trim(), kB = String(pontoB).trim();
      var oA = null, oB = null;
      esquemaPontos.forEach(function(ep) {
        var id   = String(ep.id_ponto   || '').trim();
        var nome = String(ep.nome_ponto || '').trim();
        if (id === kA || nome === kA) oA = ep.ordem;
        if (id === kB || nome === kB) oB = ep.ordem;
      });
      if (oA === null || oB === null) return null;
      var lo = Math.min(oA, oB), hi = Math.max(oA, oB);
      return esquemaPontos.filter(function(ep) { return ep.ordem >= lo && ep.ordem <= hi; });
    }

    /**
     * Altera o modo de visualização ativo e re-aplica os filtros.
     */
    function _setModo(modo) {
      _modoAtivo = modo;

      // Atualiza botões da barra de modo
      ['COMPLETO', 'MOTORISTA', 'TRECHO'].forEach(function(m) {
        var btn = document.getElementById('modoBtn_' + m);
        if (btn) {
          if (m === modo) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      });

      // Mostra/oculta campos extras da barra
      var motF = document.getElementById('modoMotoristaFields');
      var trcF = document.getElementById('modoTrechoFields');
      if (motF) motF.style.display = modo === 'MOTORISTA' ? 'flex' : 'none';
      if (trcF) trcF.style.display = modo === 'TRECHO'    ? 'flex' : 'none';

      // Atualiza motorista ativo
      if (modo === 'MOTORISTA') {
        if (!_vinculos.length) {
          UIModule.showToast('Nenhum motorista vinculado. Use o botão <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="13" height="13"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Motorista.', 'warning');
        }
        var sel = document.getElementById('modoSelectMotorista');
        var idx = sel ? parseInt(sel.value, 10) : NaN;
        _motoristaAtivo = (!isNaN(idx) && _vinculos[idx]) ? _vinculos[idx] : null;
      } else {
        _motoristaAtivo = null;
      }

      _aplicarFiltroModo();
    }

    /**
     * Calcula a viagem e o esquema filtrados ao modo ativo
     * (COMPLETO/MOTORISTA/TRECHO). Computação pura — reutilizada pela
     * visualização (_aplicarFiltroModo) e pelo Diagnóstico Inteligente.
     * @returns {{tripView:Array, esquemaView:Array, pontoInicioKey:string, pontoFimKey:string, filtrado:boolean}}
     */
    function _computeModoView() {
      var tripView = _enrichedTrip;
      var esquemaView = _esquemaPontos;
      var seqA = null, seqB = null;
      var pontoInicioKey = null, pontoFimKey = null;
      var filtrado = false;

      if (_modoAtivo === 'MOTORISTA' && _motoristaAtivo) {
        pontoInicioKey = _motoristaAtivo.ponto_inicio;
        pontoFimKey    = _motoristaAtivo.ponto_fim;
        seqA = _seqPorPonto(pontoInicioKey);
        seqB = _seqPorPonto(pontoFimKey);
        // Fallback: se o lookup por nome retornou o mesmo ponto (ou nenhum),
        // usa o intervalo de seq armazenado no momento do vínculo
        if ((seqA === null || seqB === null || seqA === seqB) &&
            _motoristaAtivo.seqMin != null && _motoristaAtivo.seqMax != null &&
            _motoristaAtivo.seqMin !== _motoristaAtivo.seqMax) {
          seqA = _motoristaAtivo.seqMin;
          seqB = _motoristaAtivo.seqMax;
        }
      } else if (_modoAtivo === 'TRECHO') {
        var pA = document.getElementById('modoPontoA');
        var pB = document.getElementById('modoPontoB');
        pontoInicioKey = pA ? pA.value : '';
        pontoFimKey    = pB ? pB.value : '';
        seqA = _seqPorPonto(pontoInicioKey);
        seqB = _seqPorPonto(pontoFimKey);
      }

      if (seqA !== null && seqB !== null) {
        var minS = Math.min(seqA, seqB), maxS = Math.max(seqA, seqB);
        var filtered = _enrichedTrip.filter(function(p) { return p.seq >= minS && p.seq <= maxS; });
        if (filtered.length >= 2) {
          tripView = filtered;
          filtrado = true;

          // Codigos visitados no trecho (via seq range)
          var codigosNoTrecho = new Set(
            filtered.filter(function(p) { return p.matched && p.codigo; })
                    .map(function(p) { return String(p.codigo); })
          );

          // Tenta filtro por nome/id (inclui não-visitados do trecho)
          var schemaFiltered = _filtrarEsquemaPorTrechoLocal(_esquemaPontos, pontoInicioKey, pontoFimKey);

          if (schemaFiltered !== null) {
            esquemaView = schemaFiltered;
          } else {
            // Fallback: infere intervalo de ordem pelos pontos visitados no trecho
            var ordens = _esquemaPontos
              .filter(function(ep) { return codigosNoTrecho.has(String(ep.id_ponto)); })
              .map(function(ep) { return ep.ordem; });

            if (ordens.length >= 2) {
              var loOrdem = Math.min.apply(null, ordens);
              var hiOrdem = Math.max.apply(null, ordens);
              // Inclui TODOS os pontos do esquema no range — visitados e não-visitados
              esquemaView = _esquemaPontos.filter(function(ep) {
                return ep.ordem >= loOrdem && ep.ordem <= hiOrdem;
              });
            } else {
              // Último recurso: só visitados
              esquemaView = _esquemaPontos.filter(function(ep) {
                return codigosNoTrecho.has(String(ep.id_ponto));
              });
            }
          }
        }
      }

      return {
        tripView: tripView, esquemaView: esquemaView,
        pontoInicioKey: pontoInicioKey, pontoFimKey: pontoFimKey, filtrado: filtrado
      };
    }

    /**
     * Aplica o filtro do modo ativo (COMPLETO/MOTORISTA/TRECHO) à visualização
     * na tela: mapa, tabela de pontos e alertas.
     */
    function _aplicarFiltroModo() {
      if (!_enrichedTrip.length || !_analysis) return;

      var _mv = _computeModoView();
      var tripView = _mv.tripView;
      var esquemaView = _mv.esquemaView;

      _agendarMapa(tripView, null, _locaisCache);

      // Comparação filtrada ao modo
      var comparacaoView = null;
      if (esquemaView.length > 0) {
        var realizadosSet = new Set(
          tripView.filter(function(p) { return p.matched && p.codigo; })
                  .map(function(p) { return String(p.codigo); })
        );
        comparacaoView = esquemaView.map(function(ep) {
          var chave = String(ep.id_ponto);
          var visitado = realizadosSet.has(chave);
          return Object.assign({}, ep, {
            visitado:        visitado,
            ponto_realizado: visitado ? (tripView.find(function(p) { return p.matched && String(p.codigo) === chave; }) || null) : null,
            status:          visitado ? 'Realizado' : 'Não visitado'
          });
        });
      }

      // No modo "Por Motorista" a tabela já está filtrada a um único motorista;
      // restringe o agrupamento a ele para que o ponto de rendição (extremo
      // compartilhado) não receba o cabeçalho do motorista anterior.
      var grupoFiltroIdx = (_modoAtivo === 'MOTORISTA' && _motoristaAtivo)
        ? _vinculos.indexOf(_motoristaAtivo)
        : null;
      if (grupoFiltroIdx === -1) grupoFiltroIdx = null;

      AnalysisModule.renderPontosTable(tripView, comparacaoView, grupoFiltroIdx);
      if (comparacaoView) AnalysisModule.atualizarContadoresComparacao(comparacaoView);

      // Alertas filtrados ao modo
      if (_analysis.alerts) {
        var alertsBase = _analysis.alerts.filter(function(a) {
          return a.tipo !== 'PONTO_NAO_VISITADO';
        });
        // Filtra alertas de velocidade ao seq range
        if (tripView !== _enrichedTrip) {
          var minSeq = tripView[0].seq, maxSeq = tripView[tripView.length - 1].seq;
          alertsBase = alertsBase.filter(function(a) {
            return a.seq == null || (a.seq >= minSeq && a.seq <= maxSeq);
          });
        }
        // Reinsere pontos não visitados filtrados
        if (comparacaoView) {
          comparacaoView.forEach(function(c) {
            if (!c.visitado) {
              alertsBase.push({
                tipo: 'PONTO_NAO_VISITADO',
                descricao: 'Ponto "' + c.nome_ponto + '" não foi visitado nesta viagem',
                nivel: 'nao-visitado',
                trecho: c.nome_ponto
              });
            }
          });
        }
        _renderAlertas(alertsBase);
      }

      // O escopo (viagem/motorista/trecho) mudou → invalida o Diagnóstico para
      // que ele reflita o mesmo recorte.
      if (window.DiagnosticoModule) DiagnosticoModule.onScopeChanged();
    }

    // ============================================================
    //  FUZZY MATCHING DE MOTORISTAS (Levenshtein)
    // ============================================================

    /**
     * Distância de edição entre duas strings (Levenshtein).
     * Usado para sugerir motoristas com base no nome do CSV.
     */
    function _levenshtein(a, b) {
      a = (a || '').toUpperCase();
      b = (b || '').toUpperCase();
      var m = a.length, n = b.length;
      if (!m) return n;
      if (!n) return m;
      var dp = [];
      for (var i = 0; i <= m; i++) {
        dp[i] = [i];
        for (var j = 1; j <= n; j++) {
          dp[i][j] = i === 0 ? j
            : a[i-1] === b[j-1] ? dp[i-1][j-1]
            : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
        }
      }
      return dp[m][n];
    }

    function _similaridade(a, b) {
      if (!a || !b) return 0;
      var dist = _levenshtein(a, b);
      return 1 - dist / Math.max(a.length, b.length, 1);
    }

    /**
     * Similaridade orientada a nomes próprios.
     * Primeiro tenta match palavra-a-palavra (ignora artigos/preposições curtas).
     * Se todas as palavras significativas do nome menor aparecem no maior → 90%.
     * Se ≥ 67% das palavras batem → 75%.
     * Caso contrário cai no Levenshtein.
     */
    function _similaridadeNome(a, b) {
      if (!a || !b) return 0;
      var norm = function(s) {
        return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
      };
      var wordsA = norm(a).split(/\s+/).filter(function(w) { return w.length > 2; });
      var wordsB = norm(b).split(/\s+/).filter(function(w) { return w.length > 2; });
      if (!wordsA.length || !wordsB.length) return _similaridade(a, b);

      var shorter = wordsA.length <= wordsB.length ? wordsA : wordsB;
      var longer  = wordsA.length <= wordsB.length ? wordsB : wordsA;
      var matches = shorter.filter(function(w) { return longer.indexOf(w) !== -1; });

      if (matches.length === shorter.length) return 0.90;
      if (matches.length >= Math.ceil(shorter.length * 0.67)) return 0.75;
      return _similaridade(a, b);
    }

    // ============================================================
    //  AUTO-VÍNCULO DE MOTORISTA
    // ============================================================

    /**
     * Executa logo após processar o CSV.
     * Ordena enrichedTrip cronologicamente, extrai trecho e detecta motorista.
     */
    function _tentarAutoVinculo() {
      if (_vinculos.length > 0) return;

      var freq = {};
      _enrichedTrip.forEach(function(p) {
        var f = (p.funcionario || '').trim();
        if (f && f.toLowerCase() !== 'não informado' && f.toLowerCase() !== 'nao informado') {
          freq[f] = (freq[f] || 0) + 1;
        }
      });

      var nomes = Object.keys(freq).sort(function(a, b) { return freq[b] - freq[a]; });

      _autoVinculoDataList = nomes.map(function(nomeCsv) {
        var pontos = _enrichedTrip
          .filter(function(p) { return (p.funcionario || '').trim() === nomeCsv; })
          .sort(function(a, b) {
            var ta = a.entrada ? new Date(String(a.entrada).replace(' ', 'T')) : 0;
            var tb = b.entrada ? new Date(String(b.entrada).replace(' ', 'T')) : 0;
            return ta - tb;
          });

        // Intervalo real de seq do motorista (base para filtro de fallback)
        var seqs = pontos.map(function(p) { return p.seq; });
        var seqMin = seqs.length ? Math.min.apply(null, seqs) : null;
        var seqMax = seqs.length ? Math.max.apply(null, seqs) : null;

        // Usa TODOS os pontos do enrichedTrip no intervalo de seq para
        // determinar início e fim — os registros do próprio motorista podem
        // ter repetição de nome (garagem, pátio, etc.)
        var noTrecho = (seqMin !== null)
          ? _enrichedTrip.filter(function(p) {
              return p.seq >= seqMin && p.seq <= seqMax && (p.ponto || '').trim();
            })
          : pontos.filter(function(p) { return (p.ponto || '').trim(); });

        var nomesTrecho = noTrecho.map(function(p) { return (p.ponto || '').trim(); }).filter(Boolean);
        var pontoInicio = nomesTrecho[0] || '';
        var pontoFim    = nomesTrecho[nomesTrecho.length - 1] || '';

        var sugestao = _sugerirMotorista(nomeCsv);
        return {
          nomeCsv:     nomeCsv,
          motorista:   sugestao ? sugestao.motorista : null,
          score:       sugestao ? sugestao.score : 0,
          pontoInicio: pontoInicio,
          pontoFim:    pontoFim,
          seqMin:      seqMin,
          seqMax:      seqMax,
          editando:    false
        };
      });
    }

    /**
     * Seleciona a opção de um <select> cujo value corresponda ao alvo
     * (exato primeiro, depois trim+lowercase como fallback).
     */
    function _preencherSelectTrecho(sel, alvo) {
      if (!sel || !alvo) return;
      var alvoNorm = alvo.trim().toLowerCase();
      // 1. Match exato por value
      for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === alvo) { sel.selectedIndex = i; return; }
      }
      // 2. Match tolerante por value (trim + lowercase)
      for (var j = 0; j < sel.options.length; j++) {
        if (sel.options[j].value.trim().toLowerCase() === alvoNorm) {
          sel.selectedIndex = j; return;
        }
      }
      // 3. Match pelo texto/label da opção (quando o value é código mas o alvo é nome)
      for (var k = 0; k < sel.options.length; k++) {
        if (sel.options[k].text.trim().toLowerCase() === alvoNorm) {
          sel.selectedIndex = k; return;
        }
      }
    }

    /**
     * Busca o motorista mais similar ao nome/matrícula fornecido.
     * Retorna { motorista, score } se score >= 55%, ou null.
     */
    function _sugerirMotorista(termo) {
      if (!termo || !_motoristas || !_motoristas.length) return null;
      var t = String(termo).trim().toUpperCase();

      // 1. Match exato por iButton (código do CSV = ibutton cadastrado)
      for (var i = 0; i < _motoristas.length; i++) {
        var m = _motoristas[i];
        if (m.ibutton && m.ibutton.trim().toUpperCase() === t) {
          return { motorista: m, score: 100 };
        }
      }

      // 2. Match por nome (palavra-a-palavra) ou matrícula (Levenshtein)
      var melhor = null;
      var melhorScore = 0.55;
      _motoristas.forEach(function(m) {
        var scoreNome = _similaridadeNome(t, (m.nome || '').toUpperCase());
        var scoreMat  = _similaridade(t, String(m.matricula || '').toUpperCase());
        var score = Math.max(scoreNome, scoreMat);
        if (score > melhorScore) {
          melhorScore = score;
          melhor = m;
        }
      });
      return melhor ? { motorista: melhor, score: Math.round(melhorScore * 100) } : null;
    }

    /**
     * Popula os selects de trecho do sidebar (sidebarPontoInicio/Fim)
     * com os pontos únicos do _enrichedTrip, excluindo os que estão em
     * intervalos já ocupados por outros vínculos.
     */
    function _popularSidebarTrechoDeEnrichedTrip() {
      var pontos = [];
      var vistos = {};
      _enrichedTrip.forEach(function(p) {
        var nome = (p.ponto || '').trim();
        if (nome && !vistos[nome]) {
          vistos[nome] = true;
          pontos.push({ valor: nome, label: nome });
        }
      });

      var ocupados = _calcularPontosOcupados(pontos);
      var disponiveis = pontos.filter(function(p) { return !ocupados.has(p.valor); });

      ['sidebarPontoInicio', 'sidebarPontoFim'].forEach(function(id) {
        var sel = document.getElementById(id);
        if (!sel) return;
        sel.innerHTML = '<option value="">— Selecione —</option>';
        disponiveis.forEach(function(p) {
          var opt = document.createElement('option');
          opt.value = p.valor;
          opt.textContent = p.label;
          sel.appendChild(opt);
        });
      });
    }

    /**
     * Gera relatório diretamente a partir das seleções inline da Coluna 3.
     * Não abre o modal; usa enviarAPI=false.
     */
    function _onGerarRelatorioInline(skipGuard) {
      if (!_enrichedTrip || !_enrichedTrip.length) {
        UIModule.showToast('Processe uma viagem primeiro.', 'error');
        return;
      }

      // Aviso: se há alertas pendentes sem justificativa, confirma antes de gerar.
      if (skipGuard !== true) {
        var _pend = _countAlertasPendentes();
        if (_pend > 0) {
          _abrirModalPendencias(_pend, function () { _onGerarRelatorioInline(true); });

      var tipoEl = document.querySelector('input[name="tipoRelatorio"]:checked');

      var selEsquema = document.getElementById('selectEsquema');

      var esqObj = _esquemas.find(function(e) { return e.id_esquema === idEsquema; });
      var nomeLinha = esqObj ? esqObj.nome_linha : '';

      var gerarParadas = !!(document.getElementById('chkParadasIrregularesInline') &&
                            document.getElementById('chkParadasIrregularesInline').checked);

      var params = {
        tipo: tipo,
        enviarAPI: true,
        idEsquema: idEsquema,
        nomeLinha: nomeLinha,
        horario: esqObj ? (esqObj.horario || '') : '',
        enrichedTrip: _enrichedTrip,
        esquemaPontos: _esquemaPontos,
        segments: _analysis ? _analysis.segments : [],
        summary:  _analysis ? _analysis.summary  : {},
        justificativas: _justState.justificativas || {},
        codLinha: esqObj ? (esqObj.cod_linha || '') : '',
        sentido:  esqObj ? (esqObj.sentido   || '') : '',
      };

      if (tipo === 'MOTORISTA') {
        var selMot = document.getElementById('relSelectMotorista');
        var idx = selMot ? parseInt(selMot.value, 10) : NaN;
        if (isNaN(idx) || idx < 0 || !_vinculos[idx]) {
          UIModule.showToast('Selecione um motorista vinculado.', 'error');
          return;
        }
        params.motorista = _vinculos[idx];
      } else if (tipo === 'TRECHO') {
        var pontoA = document.getElementById('relPontoA') ? document.getElementById('relPontoA').value : '';
        var pontoB = document.getElementById('relPontoB') ? document.getElementById('relPontoB').value : '';
        if (!pontoA || !pontoB) {
          UIModule.showToast('Selecione os pontos A e B do trecho.', 'error');
          return;
        }
        params.idPontoA = pontoA;
        params.idPontoB = pontoB;
        // Motoristas responsáveis pelo trecho selecionado (todos que se sobrepõem)
        params.motoristasTrecho = _motoristasDoTrecho(_seqPorPonto(pontoA), _seqPorPonto(pontoB));
      }

      var btn = document.getElementById('btnGerarRelatorioInline');
      var _setBusy = function(busy) {
        if (btn) {
          btn.disabled = busy;
          btn.innerHTML = busy ? '<span class="btn-spin"></span> Gerando...' : '<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="13" height="13"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg> Gerar Relatório';
        }
      };

      _setBusy(true);
      UIModule.showLoading('Capturando mapa e gerando relatório...');

      _gerarComCaptura(params,
        function (result) {
          UIModule.hideLoading();
          _setBusy(false);
          console.log('[App] Payload do relatório:', result.payload);
          if (result.apiResponse) {
            console.log('[App] Resposta da API:', result.apiResponse);
            var _body2 = result.apiResponse.body || {};
            if (_body2.url) {
              UIModule.showToast('Relatório gerado com sucesso!', 'success', 4000);
              var fname2 = _buildPdfFilename(tipo, params.motorista, params.formato);
              _downloadPdf(_body2.url, fname2);
              UIModule.showToast((params.formato === 'docx' ? 'Documento Word' : 'PDF') + ' pronto para download.', 'success', 4000);
            } else {
              var _fmt2 = (params.formato === 'docx') ? 'DOCX' : 'PDF';
              UIModule.showToast(
                'Ocorrência criada, mas o arquivo ' + _fmt2 + ' não foi gerado' +
                (_body2.warning ? ' — ' + _body2.warning : '') + '.',
                'error', 9000);
            }
          } else {
            UIModule.showToast('Relatório gerado com sucesso!', 'success', 4000);
          }
          if (gerarParadas) {
            _launchParadasFora(params);
          }
        },
        function (err) {
          UIModule.hideLoading();
          _setBusy(false);
          var msg = err && err.message ? err.message : String(err);
          UIModule.showToast('Erro ao gerar relatório: ' + msg, 'error', 6000);
          console.error('[App] Erro ao gerar relatório:', err);
        }
      );
    }

    /**
     * Captura o mapa (se disponível), adiciona a base64 em params,
     * e então chama google.script.run.gerarRelatorio.
     */
    function _gerarComCaptura(params, successFn, failureFn) {
      // Exige login (conta do Gerador de Relatórios) antes de criar a
      // ocorrência — sem isso ela saía sempre no nome fixo do Script
      // Property REPORT_ANALISADO_POR (ver ReportService.js).
      if (!_authLogado()) {
        abrirModalUsuario();
        if (failureFn) failureFn(new Error('Entre com sua conta (botão 👤 no topo) antes de gerar o relatório.'));
        return;
      }
      // Garante um access_token fresco (renova via refresh_token se
      // tiver vencido) antes de disparar — assim params.analisadoPor
      // sai sempre com o nome de quem está de fato logado.
      _authGarantirTokenValido().then(function () {
        params.analisadoPor = _obterUsuarioAtual();

        // Calcula o intervalo de seq para que o servidor filtre o enrichedTrip corretamente.
        // O mapa do PDF é gerado server-side via Google Maps Static API (mais confiável que html2canvas).
        var tipo = params.tipo;
        var seqA = null, seqB = null;

        if (tipo === 'MOTORISTA' && params.motorista) {
          seqA = _seqPorPonto(params.motorista.ponto_inicio);
          seqB = _seqPorPonto(params.motorista.ponto_fim);
        } else if (tipo === 'TRECHO' && params.idPontoA && params.idPontoB) {
          seqA = _seqPorPonto(params.idPontoA);
          seqB = _seqPorPonto(params.idPontoB);
        }

        if (seqA !== null && seqB !== null) {
          params.seqInicio = Math.min(seqA, seqB);
          params.seqFim    = Math.max(seqA, seqB);
        }

        google.script.run
          .withSuccessHandler(successFn)
          .withFailureHandler(failureFn)
          .gerarRelatorio(params);
      });
    }

    function _buildPdfFilename(tipo, motorista, formato) {
      var ext = (String(formato || 'pdf').toLowerCase() === 'docx') ? '.docx' : '.pdf';
      var veiculo = (_analysis && _analysis.summary && _analysis.summary.veiculo)
        ? String(_analysis.summary.veiculo).trim() : '';
      var data = (_analysis && _analysis.summary && _analysis.summary.dataViagem)
        ? _analysis.summary.dataViagem.replace(/\//g, '-') : '';
      function slug(s) { return String(s).replace(/[^\w\u00C0-\u024F\-]/g, ' ').replace(/\s+/g, ' ').trim(); }
      if (tipo === 'MOTORISTA' && motorista) {
        var mat = motorista.matricula ? String(motorista.matricula).trim() : '';
        var nome = motorista.nome ? slug(motorista.nome) : '';
        return [mat, nome, veiculo, data].filter(Boolean).join(' - ') + ext;
      }
      return [veiculo, 'ANALISE DE VIAGEM', data].filter(Boolean).join(' - ') + ext;
    }

    /**
     * Baixa um PDF a partir de uma URL remota (ex: signed URL do Supabase).
     * Faz fetch → Blob → objectURL para contornar a limitação cross-origin
     * do atributo `download`, abrindo o diálogo de "Salvar arquivo".
     * Em caso de falha no fetch, abre em nova aba como fallback.
     */
    function _downloadPdf(url, filename) {
      UIModule.showToast('Preparando download…', 'info', 2500);
      fetch(url)
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.blob();
        })
        .then(function(blob) {
          var blobUrl = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = blobUrl;
          a.download = filename || 'relatorio.pdf';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function() { URL.revokeObjectURL(blobUrl); }, 10000);
        })
        .catch(function() {
          // Fallback: abre em nova aba se o fetch falhar (ex: CORS restritivo)
          window.open(url, '_blank');
        });
    }

    function _escHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // ============================================================

    /** Garante que alertas gerados no cliente (parada proibida / não visitado)
     *  tenham alertKey/severidade/diagnóstico no mesmo formato do servidor. */
    function _fillAlertMeta(a) {
      if (!a.alertKey) {
        a.alertKey = a.tipo + '|' + (a.trecho || '') + (a.seq != null ? '|' + a.seq : '');
      }
      if (!a.severidade) {
        a.severidade = (a.nivel === 'critico' || a.tipo === 'PARADA_PROIBIDA') ? 'critico'
          : (a.tipo === 'PONTO_NAO_VISITADO' || a.tipo === 'LOCAL_NAO_IDENTIFICADO') ? 'revisar'
          : 'atencao';
      }
      if (!a.diagnostico) {
        if (a.tipo === 'PARADA_PROIBIDA') {
          a.diagnostico = 'Parada registrada em local não autorizado. Inconsistência crítica que deve ser tratada como ocorrência.';
        } else if (a.tipo === 'PONTO_NAO_VISITADO') {
          a.diagnostico = 'Ponto previsto no esquema da linha não foi visitado nesta viagem. Verifique se houve desvio de rota ou falha de registro.';
        } else {
          a.diagnostico = a.descricao || '';
        }
      }
      return a;
    }

    /** Renderiza os alertas com o estado de justificativas atual.
     *  Aceita um array explícito (ex.: recorte por modo) ou usa _analysis.alerts. */
    function _renderAlertas(alertsArr) {
      var arr = alertsArr || (_analysis && _analysis.alerts);
      if (!arr) return;
      arr.forEach(_fillAlertMeta);
      AnalysisModule.renderAlertas(arr, _justState);
    }

    /** Conta alertas operacionais pendentes (não justificados, auto ou manual). */
    function _countAlertasPendentes() {
      if (!_analysis || !_analysis.alerts) return 0;
      var manualMap = _justState.justificativas || {};
      var validos = {
        VELOCIDADE_EXCESSIVA: 1, VELOCIDADE_ALTA: 1, VELOCIDADE_BAIXA: 1,
        PARADA_PROIBIDA: 1, PARADA_LONGA: 1, LOCAL_NAO_IDENTIFICADO: 1, PONTO_NAO_VISITADO: 1
      };
      var n = 0;
      _analysis.alerts.forEach(function (a) {
        if (!validos[a.tipo]) return;
        _fillAlertMeta(a);
        var manual = manualMap[a.alertKey];
        var reaberto = manual && manual.status === 'reaberto';
        var isJust = (manual && !reaberto) || (a.autoJustificado && !reaberto);
        if (!isJust) n++;
      });
      return n;
    }

    var _pendingReportFn = null; // callback a executar se o usuário optar por gerar mesmo assim

    /** Abre o aviso de pendências; guarda a ação de geração para o "Gerar mesmo assim". */
    function _abrirModalPendencias(n, proceedFn) {
      _pendingReportFn = proceedFn;
      var plural = n > 1;
      var msg = document.getElementById('pendenciasMsg');
      if (msg) {
        msg.innerHTML =
          'Existe' + (plural ? 'm' : '') + ' <strong style="color:var(--text);">' + n +
          ' alerta' + (plural ? 's' : '') + ' operacion' + (plural ? 'ais' : 'al') +
          ' sem justificativa</strong>.<br><br>' +
          'Alertas não justificados entram como pendência no relatório. Recomenda-se revisar e justificar antes de gerar.';
      }
      var ov = document.getElementById('modalConfirmarPendencias');
      if (ov) ov.classList.add('open');
    }

    function fecharModalPendencias() {
      var ov = document.getElementById('modalConfirmarPendencias');
      if (ov) ov.classList.remove('open');
      _pendingReportFn = null;
    }

    function confirmarGerarComPendencias() {
      var fn = _pendingReportFn;
      _pendingReportFn = null;
      var ov = document.getElementById('modalConfirmarPendencias');
      if (ov) ov.classList.remove('open');
      if (typeof fn === 'function') fn();
    }

    /** Busca no servidor as justificativas manuais salvas para a viagem atual. */
    function _loadJustificativas() {
      if (!_enrichedTrip.length) return;
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) {
            _justState = { hash: res.hash || '', justificativas: res.justificativas || {} };
            _renderAlertas();
          }
        })
        .withFailureHandler(function () { /* silencioso — cards permanecem pendentes */ })
        .getJustificativasAlerta({ enrichedTrip: _enrichedTrip });
    }

    /** Liga/desliga o estado de carregamento (spinner) de um botão .op-btn-sm. */
    function _btnLoading(btn, loading, label) {
      if (!btn) return;
      if (loading) {
        btn.dataset.originalHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="op-btn-spin"></span>' + (label ? ' ' + label : '');
      } else {
        btn.disabled = false;
        if (btn.dataset.originalHtml != null) {
          btn.innerHTML = btn.dataset.originalHtml;
          delete btn.dataset.originalHtml;
        }
      }
    }

    /** Categoria e placeholder padrão do modal Justificar conforme o tipo do alerta. */
    function _justDefaults(tipo) {
      if (String(tipo).indexOf('VELOCIDADE') === 0) {
        return { categoria: 'Via urbana', placeholder: 'Ex: trecho em área urbana com semáforos' };
      }
      if (tipo === 'PARADA_PROIBIDA') {
        return { categoria: 'Condição operacional prevista', placeholder: 'Ex: parada autorizada para abastecimento / troca de motorista' };
      }
      if (tipo === 'PARADA_LONGA') {
        return { categoria: 'Condição operacional prevista', placeholder: 'Ex: refeição, apoio ou espera prevista na operação' };
      }
      if (tipo === 'PONTO_NAO_VISITADO') {
        return { categoria: 'Condição operacional prevista', placeholder: 'Ex: ponto suprimido por ordem da operação' };
      }
      if (tipo === 'LOCAL_NAO_IDENTIFICADO') {
        return { categoria: 'Outro', placeholder: 'Ex: local recém-inaugurado, ainda não cadastrado' };
      }
      return { categoria: 'Outro', placeholder: 'Descreva o motivo da justificativa' };
    }

    /** Abre o modal Justificar para o alerta do card do botão clicado. */
    function abrirModalJustificar(btn) {
      var card = btn && btn.closest ? btn.closest('.op-alert-card') : null;
      if (!card) return;
      _justModalKey = card.dataset.alertKey || '';
      var ref = document.getElementById('justificarRef');
      if (ref) {
        ref.innerHTML = '<strong>' + _escHtml(card.dataset.alertTitle || 'Alerta') + '</strong>'
          + (card.dataset.alertTrecho ? '<br>' + _escHtml(card.dataset.alertTrecho) : '');
      }
      var cat = document.getElementById('justificarCategoria');
      var mot = document.getElementById('justificarMotivo');
      var obs = document.getElementById('justificarObs');
      // Defaults contextuais conforme o TIPO do alerta (não sempre velocidade).
      var def = _justDefaults(card.dataset.alertTipo || '');
      if (cat) cat.value = def.categoria;
      if (mot) { mot.value = ''; mot.placeholder = def.placeholder; }
      if (obs) obs.value = '';
      var overlay = document.getElementById('modalJustificarAlerta');
      if (overlay) overlay.classList.add('open');
      if (mot) setTimeout(function () { mot.focus(); }, 60);
    }

    function _fecharModalJustificar() {
      var overlay = document.getElementById('modalJustificarAlerta');
      if (overlay) overlay.classList.remove('open');
      _justModalKey = null;
    }

    /** Salva a justificativa manual do alerta em edição. */
    function salvarJustificativa() {
      if (!_justModalKey) { _fecharModalJustificar(); return; }
      var btn = document.getElementById('btnConfirmJustificar');
      var categoria = (document.getElementById('justificarCategoria') || {}).value || 'Outro';
      var motivo = ((document.getElementById('justificarMotivo') || {}).value || '').trim();
      var obs = ((document.getElementById('justificarObs') || {}).value || '').trim();
      var key = _justModalKey;

      if (btn) { btn.dataset.originalHtml = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Salvando…'; }

      google.script.run
        .withSuccessHandler(function (res) {
          if (btn) { btn.disabled = false; if (btn.dataset.originalHtml != null) { btn.innerHTML = btn.dataset.originalHtml; delete btn.dataset.originalHtml; } }
          if (!res || !res.ok) {
            UIModule.showToast((res && res.erro) || 'Erro ao salvar justificativa.', 'error');
            return;
          }
          if (res.hash) _justState.hash = res.hash;
          _justState.justificativas[key] = res.justificativa;
          _fecharModalJustificar();
          _renderAlertas();
          UIModule.showToast('Alerta justificado.', 'success', 2500);
        })
        .withFailureHandler(function (e) {
          if (btn) { btn.disabled = false; if (btn.dataset.originalHtml != null) { btn.innerHTML = btn.dataset.originalHtml; delete btn.dataset.originalHtml; } }
          UIModule.showToast('Falha ao salvar: ' + (e && e.message ? e.message : String(e)), 'error');
        })
        .salvarJustificativaAlerta({
          enrichedTrip: _enrichedTrip, alertKey: key,
          categoria: categoria, motivo: motivo, observacao: obs
        });
    }

    /** Reabre um alerta justificado (manual → remove; automático → override). */
    function reabrirAlerta(btn) {
      var card = btn && btn.closest ? btn.closest('.op-alert-card') : null;
      if (!card) return;
      var key = card.dataset.alertKey || '';
      var auto = btn.dataset.auto === '1';
      _btnLoading(btn, true, '');

      function done(res) {
        _btnLoading(btn, false);
        if (!res || !res.ok) {
          UIModule.showToast((res && res.erro) || 'Erro ao reabrir o alerta.', 'error');
          return;
        }
        if (auto) _justState.justificativas[key] = { status: 'reaberto' };
        else delete _justState.justificativas[key];
        _renderAlertas();
        UIModule.showToast('Alerta reaberto.', 'info', 2500);
      }
      function fail(e) {
        _btnLoading(btn, false);
        UIModule.showToast('Falha ao reabrir: ' + (e && e.message ? e.message : String(e)), 'error');
      }

      var runner = google.script.run.withSuccessHandler(done).withFailureHandler(fail);
      if (auto) runner.reabrirAlertaAuto({ enrichedTrip: _enrichedTrip, alertKey: key });
      else runner.removerJustificativaAlerta({ enrichedTrip: _enrichedTrip, alertKey: key });
    }

    /**
     * Cria ocorrência de parada irregular para um único evento Não Aut. (tipo 42).
     * Chamado pelo botão inline nos cards de alerta PARADA_PROIBIDA.
     */
    function criarParadaIrregularInline(tagEl, seq) {
      if (!_authLogado()) {
        abrirModalUsuario();
        UIModule.showToast('Entre com sua conta (botão 👤 no topo) antes de gerar ocorrências.', 'error', 5000);
        return;
      }
      if (_vinculos.length === 0) {
        var btnVincular = document.getElementById('btnVincularMotorista');
        if (btnVincular) btnVincular.click();
        UIModule.showToast('Vincule um motorista e clique em "Gerar Ocorrência" novamente.', 'info', 5000);
        return;
      }

      // Feedback visual no span-tag
      function _resetTag(textFinal) {
        if (!tagEl) return;
        tagEl.style.opacity = '';
        tagEl.style.pointerEvents = '';
        tagEl.classList.add('tag-ocorrencia-hover');
        var normalSpan = tagEl.querySelector('.tag-txt-normal');
        var hoverSpan  = tagEl.querySelector('.tag-txt-hover');
        if (normalSpan) normalSpan.textContent = textFinal || 'Não Aut.';
        if (hoverSpan)  hoverSpan.style.display = '';
      }

      if (tagEl) {
        tagEl.style.opacity = '0.6';
        tagEl.style.pointerEvents = 'none';
        tagEl.classList.remove('tag-ocorrencia-hover');
        var normalSpan = tagEl.querySelector('.tag-txt-normal');
        var hoverSpan  = tagEl.querySelector('.tag-txt-hover');
        if (normalSpan) normalSpan.textContent = 'Criando…';
        if (hoverSpan)  hoverSpan.style.display = 'none';
      }

      // Força proibido42=true no ponto alvo; demais ficam false para este relatório
      var seqNum = Number(seq);
      var pontoAlvo = _enrichedTrip.find(function(pt) { return Number(pt.seq) === seqNum; });
      if (!pontoAlvo) {
        _resetTag();
        UIModule.showToast('Ponto não encontrado.', 'error', 3000);
        return;
      }

      var tripFiltrado = _enrichedTrip.map(function(pt) {
        if (Number(pt.seq) !== seqNum) return Object.assign({}, pt, { proibido42: false });
        // garante matched=true para que o filtro do servidor aceite o ponto
        return Object.assign({}, pt, { proibido42: true, matched: true });
      });

      var idEsquema = (document.getElementById('selectEsquema') || {}).value || '';
      var esqObj = _esquemas.find(function(e) { return e.id_esquema === idEsquema; });

      _launchParadasFora({
        enrichedTrip:  tripFiltrado,
        esquemaPontos: _esquemaPontos,
        motorista:     _vinculos[0],
        nomeLinha:     esqObj ? esqObj.nome_linha : '',
        horario:       esqObj ? (esqObj.horario || '') : '',
        codLinha:      esqObj ? (esqObj.cod_linha || '') : '',
        sentido:       esqObj ? (esqObj.sentido   || '') : '',
        summary:       _analysis ? (_analysis.summary || {}) : {},
        _onDone:       _resetTag,
      });
    }

    /**
     * Cria ocorrência EXCESSO_PERMANENCIA para a parada prolongada do card.
     * Botão inline nos cards do grupo "Paradas Prolongadas".
     */
    function criarExcessoPermanenciaInline(btn, seq) {
      if (!_authLogado()) {
        abrirModalUsuario();
        UIModule.showToast('Entre com sua conta (botão 👤 no topo) antes de gerar ocorrências.', 'error', 5000);
        return;
      }
      if (_vinculos.length === 0) {
        var btnVincular = document.getElementById('btnVincularMotorista');
        if (btnVincular) btnVincular.click();
        UIModule.showToast('Vincule um motorista e clique em "+ Criar ocorrência" novamente.', 'info', 5000);
        return;
      }

      var seqNum = Number(seq);
      var pontoAlvo = _enrichedTrip.find(function (pt) { return Number(pt.seq) === seqNum; });
      if (!pontoAlvo) {
        UIModule.showToast('Ponto não encontrado.', 'error', 3000);
        return;
      }

      var idEsquema = (document.getElementById('selectEsquema') || {}).value || '';
      var esqObj = _esquemas.find(function (e) { return e.id_esquema === idEsquema; });

      _btnLoading(btn, true, 'Criando…');
      google.script.run
        .withSuccessHandler(function (results) {
          var r = (results && results[0]) || null;
          if (r && r.status === 'ok') {
            if (btn) {
              btn.disabled = true;
              btn.classList.add('op-btn-done');
              btn.innerHTML = '✓ Ocorrência criada';
              delete btn.dataset.originalHtml;
            }
            UIModule.showToast('Ocorrência de excesso de permanência criada.', 'success', 3500);
          } else {
            _btnLoading(btn, false);
            UIModule.showToast('Falha ao criar ocorrência' + (r && r.message ? ': ' + String(r.message).slice(0, 120) : '') + '.', 'error', 6000);
          }
        })
        .withFailureHandler(function (e) {
          _btnLoading(btn, false);
          UIModule.showToast('Erro: ' + (e && e.message ? e.message : String(e)), 'error', 6000);
        })
        .enviarExcessoPermanencia({
          enrichedTrip:  _enrichedTrip,
          esquemaPontos: _esquemaPontos,
          motorista:     _vinculos[0],
          nomeLinha:     esqObj ? esqObj.nome_linha : '',
          horario:       esqObj ? (esqObj.horario || '') : '',
          codLinha:      esqObj ? (esqObj.cod_linha || '') : '',
          sentido:       esqObj ? (esqObj.sentido   || '') : '',
          summary:       _analysis ? (_analysis.summary || {}) : {},
          seqAlvo:       seqNum,
          analisadoPor:  _obterUsuarioAtual(),
        });
    }

    /**
     * Monta o payload para o Diagnóstico Inteligente a partir do estado atual.
     * Retorna null se não houver viagem processada.
     */
    function getDiagnosticoPayload() {
      if (!_analysis || !_enrichedTrip || !_enrichedTrip.length) return null;
      var selEsquema = document.getElementById('selectEsquema');
      var idEsquema = selEsquema ? selEsquema.value : '';
      var esqObj = _esquemas.find(function (e) { return String(e.id_esquema) === String(idEsquema); });

      // Respeita o modo de visualização ativo: viagem inteira, por motorista ou
      // por trecho. O servidor recomputa segmentos/resumo a partir deste recorte.
      var mv = _computeModoView();
      var escopo = '';
      if (mv.filtrado && mv.tripView.length) {
        var ini = mv.tripView[0].ponto;
        var fim = mv.tripView[mv.tripView.length - 1].ponto;
        if (_modoAtivo === 'MOTORISTA' && _motoristaAtivo && _motoristaAtivo.nome) {
          escopo = 'Motorista: ' + _motoristaAtivo.nome;
        } else if (_modoAtivo === 'TRECHO') {
          escopo = 'Trecho: ' + ini + ' → ' + fim;
        }
      }

      return {
        enrichedTrip:  mv.tripView,
        esquemaPontos: mv.esquemaView || [],
        nomeLinha:     esqObj ? esqObj.nome_linha : '',
        idEsquema:     idEsquema || '',
        escopo:        escopo,
        modo:          _modoAtivo
      };
    }

    /**
     * Retorna a linha selecionada no combobox do cabeçalho, independente de
     * já existir uma viagem processada na sessão (ao contrário de
     * getDiagnosticoPayload, que exige _analysis/_enrichedTrip). Usado pela
     * Análise em Massa, que só precisa saber qual linha está selecionada.
     * @returns {{idEsquema:string, nomeLinha:string}}
     */
    function getEsquemaSelecionado() {
      var idEsquema = (document.getElementById('selectEsquema') || {}).value || '';
      var esqObj = _esquemas.find(function (e) { return String(e.id_esquema) === String(idEsquema); });
      return { idEsquema: idEsquema, nomeLinha: esqObj ? esqObj.nome_linha : '' };
    }

    /**
     * Lista de esquemas carregados (id/nome/horário/sentido), para telas
     * que precisam do próprio seletor de linha — ex: Análise em Massa, que
     * fica disponível mesmo no modo "upload-only" (combobox do cabeçalho
     * escondido antes de processar uma viagem).
     * @returns {Array}
     */
    function getEsquemas() {
      return _esquemas;
    }

    return {
      init,
      getTrip,
      getAnalysis,
      getLocais,
      getComparacao,
      getVinculos,
      getDiagnosticoPayload,
      getEsquemaSelecionado,
      getEsquemas,
      _removerVinculo,
      _confirmarCard,
      _toggleEditCard,
      _toggleCadastroCard,
      _buscarMotoristaCard,
      _descartarCard,
      _cadastrarConfirmarCard,
      _buscarMotoristaManual,
      _confirmarManual,
      _onGerarRelatorioInline,
      criarParadaIrregularInline: criarParadaIrregularInline,
      criarExcessoPermanenciaInline: criarExcessoPermanenciaInline,
      abrirModalJustificar: abrirModalJustificar,
      salvarJustificativa: salvarJustificativa,
      fecharModalJustificar: _fecharModalJustificar,
      reabrirAlerta: reabrirAlerta,
      fecharModalPendencias: fecharModalPendencias,
      confirmarGerarComPendencias: confirmarGerarComPendencias,
      _novaAnalise: _onLimpar,
      _setModo,
      abrirMapa,
      abrirModalUsuario: abrirModalUsuario,
      fecharModalUsuario: fecharModalUsuario,
      _authFazerLogin: _authFazerLogin,
    };
  })();

  // ============================================================
  //  SectionGuide — guia de seções/subseções na lateral esquerda
  //  Lista dinamicamente as seções visíveis + suas subseções
  //  (qualquer elemento [data-guide-anchor] com data-guide-label),
  //  com scroll-spy e navegação por clique.
  // ============================================================
  var SectionGuide = (function () {
    var SECTIONS = [
      { id: 'sectionResumo',      label: 'Resumo' },
      { id: 'sectionMapa',        label: 'Mapa Operacional' },
      { id: 'sectionEventos',     label: 'Eventos da Rota' },
      { id: 'sectionVelChart',    label: 'Velocidade por Trecho' },
      { id: 'sectionAlertas',     label: 'Alertas Operacionais' },
      { id: 'sectionDiagnostico', label: 'Diagnóstico' }
    ];
    var HEADER_OFFSET = 72;   // altura do header sticky + folga
    var _targets = [];        // [{key, el}] em ordem do documento (para o spy)
    var _raf = null, _debounce = null;

    function _esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function _visible(el) {
      return !!(el && el.offsetParent !== null && el.getClientRects().length > 0);
    }

    // Seções que, quando têm subitens, viram um rótulo de grupo (não clicável)
    // em vez de item de navegação — os subitens passam a ser a navegação real.
    // Puramente visual: não muda quais seções existem nem seus dados.
    var GROUP_HEADER_IDS = { sectionAlertas: true };

    function _splitCountLabel(lbl) {
      // "Paradas Irregulares (7)" → { text: "Paradas Irregulares", count: "7" }
      var m = /^(.*)\s\((\d+)\)\s*$/.exec(lbl);
      return m ? { text: m[1], count: m[2] } : { text: lbl, count: null };
    }

    function refresh() {
      var listEl = document.getElementById('guideList');
      var wrap = document.querySelector('.app-wrapper');
      if (!listEl || !wrap) return;

      var html = '', targets = [];
      html += '<li class="guide-group-label">Análise</li>';
      SECTIONS.forEach(function (sec) {
        var el = document.getElementById(sec.id);
        if (!_visible(el)) return;

        var anchors = el.querySelectorAll('[data-guide-anchor]');
        var isGroupHeader = GROUP_HEADER_IDS[sec.id] && anchors.length > 0;

        if (isGroupHeader) {
          html += '<li class="guide-group-label">' + _esc(sec.label) + '</li>';
        } else {
          targets.push({ key: sec.id, el: el });
          html += '<li>'
            + '<div class="guide-item" data-target="' + sec.id + '">'
            + '<span class="guide-dot"></span><span>' + _esc(sec.label) + '</span></div>';
        }

        var subHtml = '';
        Array.prototype.forEach.call(anchors, function (an, i) {
          if (!_visible(an)) return;
          if (!an.id) an.id = sec.id + '_sub_' + i;
          var parts = _splitCountLabel(an.getAttribute('data-guide-label') || 'Seção');
          targets.push({ key: an.id, el: an });
          subHtml += '<li><div class="guide-sub" data-target="' + an.id + '">'
            + '<span class="guide-tick"></span><span class="guide-sub-label">' + _esc(parts.text) + '</span>'
            + (parts.count != null ? '<span class="guide-sub-count">' + _esc(parts.count) + '</span>' : '')
            + '</div></li>';
        });
        if (subHtml) html += '<ul class="guide-sublist">' + subHtml + '</ul>';
        if (!isGroupHeader) html += '</li>';
      });

      if (!targets.length) {
        wrap.classList.remove('has-guide');
        listEl.innerHTML = '';
        _targets = [];
        return;
      }

      wrap.classList.add('has-guide');
      listEl.innerHTML = html;
      _targets = targets;

      Array.prototype.forEach.call(listEl.querySelectorAll('[data-target]'), function (node) {
        node.addEventListener('click', function () {
          var t = document.getElementById(node.getAttribute('data-target'));
          if (!t) return;
          var y = t.getBoundingClientRect().top + window.pageYOffset - HEADER_OFFSET;
          window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
        });
      });

      _spy();
    }

    function _spy() {
      if (!_targets.length) return;
      var listEl = document.getElementById('guideList');
      if (!listEl) return;
      var probe = window.pageYOffset + HEADER_OFFSET + 8;
      var activeKey = _targets[0].key;
      for (var i = 0; i < _targets.length; i++) {
        var top = _targets[i].el.getBoundingClientRect().top + window.pageYOffset;
        if (top - 1 <= probe) activeKey = _targets[i].key; else break;
      }
      Array.prototype.forEach.call(listEl.querySelectorAll('[data-target]'), function (n) {
        n.classList.toggle('active', n.getAttribute('data-target') === activeKey);
      });
    }

    function _onScroll() {
      if (_raf) return;
      _raf = requestAnimationFrame(function () { _raf = null; _spy(); });
    }
    function _schedRefresh() {
      clearTimeout(_debounce);
      _debounce = setTimeout(refresh, 160);
    }

    function init() {
      var wrap = document.querySelector('.app-wrapper');
      if (!wrap) return;
      window.addEventListener('scroll', _onScroll, { passive: true });
      window.addEventListener('resize', _schedRefresh);
      // Observa apenas o show/hide das seções (troca de view/modo) — barato.
      var mo = new MutationObserver(_schedRefresh);
      SECTIONS.forEach(function (s) {
        var el = document.getElementById(s.id);
        if (el) mo.observe(el, { attributes: true, attributeFilter: ['style', 'class'] });
      });
      refresh();
    }

    return { init: init, refresh: refresh };
  })();

  // ---- Inicialização quando o DOM estiver pronto ----
  document.addEventListener("DOMContentLoaded", function () {
    AppModule.init();
    SectionGuide.init();
  });
</script>
