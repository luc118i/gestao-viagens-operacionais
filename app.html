<script>
  // ============================================================
  //  app.js  —  Orquestrador principal da aplicação
  //  Tema: claro (redesign)
  // ============================================================

  const AppModule = (() => {
    // ---- Estado global da sessão ----
    let _enrichedTrip = [];
    let _analysis = null;
    let _locaisCache = [];
    let _mapsReady = false;
    let _tripReady = false;

    let _esquemas = [];
    let _esquemaPontos = [];
    let _comparacao = null;
    let _vinculos = [];
    let _motoristas = [];
    let _autoVinculoDataList = []; // [{ nomeCsv, motorista, score, pontoInicio, pontoFim }]
    let _mapPending = null; // { trip, comp, locais } — aguardando clique do usuário

    // Modo de visualização ativo na tela (afeta mapa, tabela e alertas)
    let _modoAtivo = 'COMPLETO';
    let _motoristaAtivo = null; // vinculo ativo quando modo=MOTORISTA

    // Justificativas de alertas (manuais + override "reaberto"), por alertKey.
    let _justState = { hash: '', justificativas: {} };
    let _justModalKey = null; // alertKey do alerta em edição no modal Justificar

    function _isMapUsable() {
      return (
        typeof MapModule !== "undefined" &&
        MapModule &&
        typeof MapModule.isReady === "function" &&
        MapModule.isReady()
      );
    }

    // ============================================================
    //  AUTENTICAÇÃO — mesma conta do Gerador de Relatórios Operacionais
    // ============================================================
    // Este web app não tem backend de auth próprio (executeAs:
    // USER_DEPLOYING / access: ANYONE_ANONYMOUS — ver appsscript.json),
    // então Session.getActiveUser() do Apps Script não dá pra confiar
    // pra saber quem está gerando o relatório. As ocorrências
    // (ANALISE_OP, DESCUMP_OP_PARADA_FORA, EXCESSO_PERMANENCIA) sempre
    // saíam no mesmo nome fixo (Script Property REPORT_ANALISADO_POR,
    // fallback "LUCAS" — ver ReportService.js). Em vez disso, login
    // aqui é feito direto contra o Supabase Auth (GoTrue) do projeto
    // usado pelo Gerador de Relatórios — mesma URL/anon key já
    // embutidas no bundle daquele app (a anon key é pública por
    // design; só a senha de cada conta autentica de verdade). O nome
    // resolvido (tabela "profiles") vai em params.analisadoPor pra
    // cada chamada a gerarRelatorio/enviarParadasFora/enviarExcessoPermanencia,
    // e o servidor (ReportService.js) passa a preferir esse valor ao
    // invés do fallback fixo.
    const SUPABASE_URL = "https://rolcprjrwxmdibzajvri.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvbGNwcmpyd3htZGliemFqdnJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyODY0ODIsImV4cCI6MjA4NTg2MjQ4Mn0.VSoKSDQOQHXR6bWHzxetfRwF50KG4I22K1hdcBpDP68";
    const AUTH_STORAGE_KEY = "ao_auth_sessao"; // { access_token, refresh_token, expires_at, email, nome }

    let _authSession = null;

    function _authCarregarSessao() {
      try {
        var raw = localStorage.getItem(AUTH_STORAGE_KEY);
        _authSession = raw ? JSON.parse(raw) : null;
      } catch (e) {
        _authSession = null;
      }
      return _authSession;
    }

    function _authSalvarSessao(sessao) {
      _authSession = sessao;
      try {
        if (sessao) localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(sessao));
        else localStorage.removeItem(AUTH_STORAGE_KEY);
      } catch (e) {
        // localStorage indisponível (modo privado, etc.) — segue sem persistir
      }
      _atualizarBotaoUsuarioAtual();
    }

    function _authLogado() {
      return !!(_authSession && _authSession.access_token);
    }

    // Nome usado em params.analisadoPor — null se ninguém autenticado
    // ainda (bloqueia a geração, ver guards em _gerarComCaptura etc.).
    function _obterUsuarioAtual() {
      return (_authSession && (_authSession.nome || _authSession.email)) || null;
    }

    // Busca o nome de exibição na tabela "profiles" — mesma regra do
    // AuthContext.tsx do Gerador de Relatórios: profiles.nome, com
    // fallback pro display_name/metadata ou pro que vier antes do @
    // no e-mail.
    function _authBuscarNomePerfil(userId, accessToken) {
      return fetch(SUPABASE_URL + "/rest/v1/profiles?id=eq." + userId + "&select=nome", {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + accessToken },
      })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (rows) { return (rows && rows[0] && String(rows[0].nome || "").trim()) || ""; })
        .catch(function () { return ""; });
    }

    function _authMontarSessaoDoToken(tokenJson) {
      var user = tokenJson.user || {};
      var meta = user.user_metadata || {};
      var fallback = meta.nome || meta.display_name || meta.full_name || meta.name ||
        (user.email || "").split("@")[0] || "Analista";

      return _authBuscarNomePerfil(user.id, tokenJson.access_token).then(function (nomePerfil) {
        return {
          access_token: tokenJson.access_token,
          refresh_token: tokenJson.refresh_token,
          expires_at: tokenJson.expires_at, // epoch em segundos, já vem pronto da API
          email: user.email || "",
          nome: nomePerfil || fallback,
        };
      });
    }

    function _authLogin(email, senha) {
      return fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY },
        body: JSON.stringify({ email: email.trim(), password: senha }),
      })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, json: j }; }); })
        .then(function (res) {
          if (!res.ok) {
            throw new Error((res.json && (res.json.error_description || res.json.msg)) || "E-mail ou senha inválidos.");
          }
          return _authMontarSessaoDoToken(res.json);
        })
        .then(function (sessao) {
          _authSalvarSessao(sessao);
          return sessao;
        });
    }

    function _authLogout() {
      _authSalvarSessao(null);
    }

    // Renova o access_token com o refresh_token quando ele estiver perto
    // de expirar (ou já venceu) — evita pedir senha de novo a cada ~1h
    // só pra gerar um relatório. Se o refresh falhar, desloga e deixa o
    // guard em _gerarComCaptura pedir login de novo.
    function _authGarantirTokenValido() {
      if (!_authSession) return Promise.resolve(null);
      var expiraEmMs = (_authSession.expires_at || 0) * 1000;
      var folgaMs = 60 * 1000;
      if (expiraEmMs - Date.now() > folgaMs) return Promise.resolve(_authSession);

      return fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY },
        body: JSON.stringify({ refresh_token: _authSession.refresh_token }),
      })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, json: j }; }); })
        .then(function (res) {
          if (!res.ok) { _authSalvarSessao(null); return null; }
          return _authMontarSessaoDoToken(res.json).then(function (sessao) {
            _authSalvarSessao(sessao);
            return sessao;
          });
        })
        .catch(function () { return _authSession; });
    }

    // ── Modal "Sua conta" (navbar) — UI de login/logout ─────────────
    function _atualizarBotaoUsuarioAtual() {
      var el = document.getElementById("btnUsuarioAtualNome");
      if (!el) return;
      el.textContent = _authLogado() ? (_authSession.nome || _authSession.email) : "Entrar";
    }

    function _renderModalUsuario() {
      var logado = _authLogado();
      var boxLogado = document.getElementById("usuarioLogadoBox");
      var boxLogin = document.getElementById("usuarioLoginBox");
      if (boxLogado) boxLogado.style.display = logado ? "" : "none";
      if (boxLogin) boxLogin.style.display = logado ? "none" : "";

      var btnPrimario = document.getElementById("usuarioBtnPrimario");
      var btnSecundario = document.getElementById("usuarioBtnSecundario");
      if (!btnPrimario || !btnSecundario) return;

      if (logado) {
        document.getElementById("usuarioLogadoNome").textContent = _authSession.nome || "—";
        document.getElementById("usuarioLogadoEmail").textContent = _authSession.email || "—";
        btnPrimario.textContent = "Sair";
        btnPrimario.onclick = _authFazerLogout;
        btnSecundario.textContent = "Fechar";
      } else {
        btnPrimario.textContent = "Entrar";
        btnPrimario.onclick = _authFazerLogin;
        btnSecundario.textContent = "Cancelar";
      }
    }

    function abrirModalUsuario() {
      var status = document.getElementById("usuarioStatus");
      if (status) status.textContent = "";
      _renderModalUsuario();
      var overlay = document.getElementById("modalUsuario");
      if (overlay) overlay.classList.add("open");
      if (!_authLogado()) {
        var emailEl = document.getElementById("usuarioLoginEmail");
        if (emailEl) emailEl.focus();
      }
    }

    function fecharModalUsuario() {
      var overlay = document.getElementById("modalUsuario");
      if (overlay) overlay.classList.remove("open");
    }

    function _authFazerLogin() {
      var email = document.getElementById("usuarioLoginEmail").value.trim();
      var senha = document.getElementById("usuarioLoginSenha").value;
      var status = document.getElementById("usuarioStatus");
      var btn = document.getElementById("usuarioBtnPrimario");

      if (!email || !senha) {
        status.textContent = "Informe e-mail e senha.";
        status.className = "modal-status err";
        return;
      }

      btn.disabled = true;
      status.textContent = "Entrando...";
      status.className = "modal-status";

      _authLogin(email, senha)
        .then(function () {
          status.textContent = "";
          document.getElementById("usuarioLoginSenha").value = "";
          _renderModalUsuario();
          btn.disabled = false;
        })
        .catch(function (err) {
          status.textContent = err.message || "Erro ao entrar.";
          status.className = "modal-status err";
          btn.disabled = false;
        });
    }

    function _authFazerLogout() {
      _authLogout();
      _renderModalUsuario();
    }

    // ============================================================
    //  INICIALIZAÇÃO
    // ============================================================

    function init() {
      // Mapa inicializado sob demanda (clique em "Visualizar Mapa")
      _mapsReady = false;

      // Sessão de login (conta do Gerador de Relatórios) — ver bloco
      // de autenticação acima.
      _authCarregarSessao();
      _atualizarBotaoUsuarioAtual();

      // Módulos de UI
      UIModule.initUpload(_onFileLoaded);
      UIModule.initManualPointModal(_onManualPointAdded);
      UIModule.initLimpar(_onLimpar);
      UIModule.initPrint();
      UIModule.initTabs();

      // Botão Processar
      var btnProcessar = document.getElementById("btnProcessar");
      if (btnProcessar) {
        btnProcessar.addEventListener("click", _processarViagem);
      }

      // Form inline de motorista
      _initSidebarMotorista();

      // Botão "+" — atalho para o modal de motoristas
      var btnAddMot = document.getElementById('btnAddMotorista');
      if (btnAddMot) {
        btnAddMot.addEventListener('click', function() {
          var overlay = document.getElementById('modalMotorista');
          if (overlay) { overlay.classList.add('open'); _renderModalMotorista(); }
        });
      }

      // Modal de motorista e relatório
      _initModalMotorista();
      _initModalRelatorio();

      // Análise em Massa (importação de PDFs)
      if (typeof MassaModule !== 'undefined') MassaModule.init();

      // Botão "Gerar Relatório" inline (Coluna 3)
      var btnGerarInline = document.getElementById('btnGerarRelatorioInline');
      if (btnGerarInline) {
        btnGerarInline.addEventListener('click', _onGerarRelatorioInline);
      }

      // Combobox pesquisável de esquema (navbar + upload)
      _initEsquemaSearch();
      _initUploadEsquemaSearch();

      // Listener de radio tipoRelatorio (na seção de config, inline)
      document
        .querySelectorAll('input[name="tipoRelatorio"]')
        .forEach(function (radio) {
          radio.addEventListener("change", function () {
            var val = radio.value;
            _modoAtivo = val;
            var motF = document.getElementById("relMotoristaFieldsInline");
            var trcF = document.getElementById("relTrechoFieldsInline");
            if (motF) motF.style.display = val === "MOTORISTA" ? "block" : "none";
            if (trcF) trcF.style.display = val === "TRECHO"    ? "block" : "none";
            _atualizarPreviewRelatorio();
            _aplicarFiltroModo();
          });
        });

      // Atualiza view quando motorista selecionado muda
      var selMot = document.getElementById("relSelectMotorista");
      if (selMot) selMot.addEventListener("change", function() {
        var idx = parseInt(selMot.value, 10);
        _motoristaAtivo = (!isNaN(idx) && _vinculos[idx]) ? _vinculos[idx] : null;
        _atualizarPreviewRelatorio();
        _aplicarFiltroModo();
      });

      // Atualiza view quando pontos A/B mudam (selects ocultos do modal)
      ["relPontoA", "relPontoB"].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener("change", function() {
          _atualizarPreviewRelatorio();
          _aplicarFiltroModo();
        });
      });

      // Barra de modo — select de motorista
      var modoSelMot = document.getElementById('modoSelectMotorista');
      if (modoSelMot) modoSelMot.addEventListener('change', function() {
        var idx = parseInt(modoSelMot.value, 10);
        _motoristaAtivo = (!isNaN(idx) && _vinculos[idx]) ? _vinculos[idx] : null;
        _aplicarFiltroModo();
      });

      // Barra de modo — pontos de início/fim do trecho
      ['modoPontoA', 'modoPontoB'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('change', function() { _aplicarFiltroModo(); });
      });

      // Carrega dados iniciais
      _loadDadosIniciais();

      // Progressive disclosure: começa com tela de upload limpa
      var wrapper = document.querySelector('.app-wrapper');
      if (wrapper) wrapper.classList.add('app--upload-only');
    }

    // ============================================================
    //  CARREGAMENTO DE DADOS INICIAIS
    // ============================================================

    function _loadDadosIniciais() {
      google.script.run
        .withSuccessHandler(function (dados) {
          _esquemas = dados.esquemas || [];
          _motoristas = dados.motoristas || [];

          // Popula o combobox pesquisável com os esquemas carregados
          _renderEsquemaOpts('');

          // Mostra aviso de "sem esquemas" no card de upload
          var emptyEl = document.getElementById('uploadEsquemaEmpty');
          if (emptyEl) emptyEl.style.display = _esquemas.length === 0 ? 'block' : 'none';

          console.log(
            "[App] Dados iniciais: " +
              _esquemas.length +
              " esquemas, " +
              _motoristas.length +
              " motoristas",
          );
        })
        .withFailureHandler(function (err) {
          console.warn("[App] Aviso: não foi possível carregar dados iniciais.", err);
          UIModule.showToast('Erro ao carregar esquemas: ' + (err && err.message ? err.message : String(err)), 'error', 8000);
        })
        .getDadosIniciais();

      _loadLocais();
    }

    function _loadLocais() {
      google.script.run
        .withSuccessHandler(function (locais) {
          _locaisCache = locais || [];
          console.log(
            "[App] Base de locais: " + _locaisCache.length + " registros",
          );
        })
        .withFailureHandler(function (err) {
          console.warn(
            "[App] Aviso: não foi possível pré-carregar locais.",
            err,
          );
        })
        .getLocais();
    }

    // ============================================================
    //  SELEÇÃO DE ESQUEMA
    // ============================================================

    function _onEsquemaChanged() {
      var sel = document.getElementById("selectEsquema");
      var idEsquema = sel ? sel.value : "";
      var infoEl = document.getElementById("esquemaInfo");

      // Atualiza widget de upload: aviso/confirmação de esquema
      var uploadAviso = document.getElementById('uploadEsquemaAviso');
      var uploadInfo  = document.getElementById('uploadEsquemaInfo');

      if (!idEsquema) {
        _esquemaPontos = [];
        _comparacao = null;
        if (infoEl) infoEl.style.display = "none";
        if (uploadAviso) uploadAviso.style.display = 'block';
        if (uploadInfo)  uploadInfo.style.display  = 'none';
        // Desabilita btnProcessar se não há esquema
        var btnP = document.getElementById('btnProcessar');
        if (btnP && !UIModule.getCsvText()) btnP.disabled = true;
        return;
      }

      if (uploadAviso) uploadAviso.style.display = 'none';

      var esqObj = _esquemas.find(function (e) {
        return e.id_esquema === idEsquema;
      });

      google.script.run
        .withSuccessHandler(function (pontos) {
          _esquemaPontos = pontos || [];

          var esqLabel = (esqObj ? esqObj.nome_linha + (esqObj.sentido ? " · " + esqObj.sentido : "") + " · " : "") + _esquemaPontos.length + " pontos";
          // No navbar o combobox já exibe linha/sentido/horário — aqui mostra só a contagem de pontos (sem redundância)
          if (infoEl) {
            infoEl.textContent = _esquemaPontos.length + (_esquemaPontos.length === 1 ? " ponto" : " pontos");
            infoEl.style.display = _esquemaPontos.length > 0 ? "inline-flex" : "none";
          }
          if (uploadInfo) {
            uploadInfo.textContent = "" + esqLabel;
            uploadInfo.style.display = 'block';
          }
          // Habilita btnProcessar se CSV também já carregado
          var btnP = document.getElementById('btnProcessar');
          if (btnP && UIModule.getCsvText()) btnP.disabled = false;

          _popularDropdownsPontos(_esquemaPontos);

          // Mostra seção de trecho no form inline se aberto
          var sidebarTrecho = document.getElementById("sidebarTrechoSection");
          var sidebarForm = document.getElementById("motoristaFormInline");
          if (
            sidebarTrecho &&
            sidebarForm &&
            sidebarForm.style.display !== "none"
          ) {
            sidebarTrecho.style.display =
              _esquemaPontos.length > 0 ? "block" : "none";
          }

          if (_enrichedTrip.length > 0) {
            _calcularComparacao();
          }

          console.log(
            "[App] Esquema " +
              idEsquema +
              ": " +
              _esquemaPontos.length +
              " pontos",
          );
        })
        .withFailureHandler(function (err) {
          console.warn("[App] Erro ao carregar pontos do esquema:", err);
          UIModule.showToast("Erro ao carregar esquema.", "error");
        })
        .getEsquemaPontos(idEsquema);
    }

    // ============================================================
    //  COMBOBOX PESQUISÁVEL DE ESQUEMA
    // ============================================================

    function _initEsquemaSearch() {
      var wrap    = document.getElementById('esquemaCombobox');
      var input   = document.getElementById('esquemaSearch');
      var dropdown = document.getElementById('esquemaDropdown');
      if (!wrap || !input || !dropdown) return;

      // Abre ao clicar no input
      input.addEventListener('focus', function() {
        wrap.classList.add('open');
        input.classList.add('open');
        _renderEsquemaOpts(input.value);
      });

      // Filtra enquanto digita
      input.addEventListener('input', function() {
        wrap.classList.add('open');
        _renderEsquemaOpts(input.value);
      });

      // Fecha ao clicar fora
      document.addEventListener('click', function(e) {
        var btn = document.getElementById('btnRefreshEsquemas');
        if (!wrap.contains(e.target) && e.target !== btn) {
          _fecharEsquemaDropdown();
        }
      });

      // Botão de refresh: invalida cache no servidor e recarrega
      var btnRefresh = document.getElementById('btnRefreshEsquemas');
      if (btnRefresh) {
        btnRefresh.addEventListener('click', function() {
          btnRefresh.textContent = '…';
          btnRefresh.disabled = true;
          google.script.run
            .withSuccessHandler(function(novosEsquemas) {
              _esquemas = novosEsquemas || [];
              _renderEsquemaOpts(
                document.getElementById('esquemaSearch')
                  ? document.getElementById('esquemaSearch').value : ''
              );
              btnRefresh.textContent = '↻';
              btnRefresh.disabled = false;
              UIModule.showToast(_esquemas.length + ' esquemas carregados.', 'success', 2500);
            })
            .withFailureHandler(function(err) {
              btnRefresh.textContent = '↻';
              btnRefresh.disabled = false;
              UIModule.showToast('Erro ao atualizar esquemas.', 'error');
            })
            .refreshEsquemas();
        });
      }

      // Teclado: ESC fecha, Enter seleciona o primeiro resultado
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') { _fecharEsquemaDropdown(); return; }
        if (e.key === 'Enter') {
          var first = dropdown.querySelector('.esquema-opt');
          if (first) first.click();
        }
      });
    }

    function _renderEsquemaOpts(query) {
      var dropdown = document.getElementById('esquemaDropdown');
      if (!dropdown) return;

      var q = (query || '').trim().toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

      var filtrados = _esquemas.filter(function(esq) {
        if (!q) return true;
        var id   = String(esq.id_esquema || '').toLowerCase();
        var nome = (esq.nome_linha || '').toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        var hor  = (esq.horario || '').toLowerCase();
        var sent = (esq.sentido || '').toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        return id.includes(q) || nome.includes(q) || hor.includes(q) || sent.includes(q);
      });

      var selectedId = document.getElementById('selectEsquema')
        ? document.getElementById('selectEsquema').value : '';

      if (filtrados.length === 0) {
        dropdown.innerHTML = '<div class="esquema-opt-noresult">Nenhum resultado encontrado.</div>';
        return;
      }

      dropdown.innerHTML = filtrados.map(function(esq) {
        var id   = _escHtml(String(esq.id_esquema));
        var nome = _escHtml(esq.nome_linha || esq.id_esquema);
        var hor  = esq.horario ? _escHtml(esq.horario) : '';
        var sent = esq.sentido ? _escHtml(esq.sentido) : '';
        var isSel = String(esq.id_esquema) === selectedId ? ' selected' : '';

        // Destaca o trecho que casou com a busca
        if (q) {
          nome = _highlightMatch(nome, query);
          hor  = hor  ? _highlightMatch(hor,  query) : hor;
          id   = _highlightMatch(id, query);
        }

        var meta = '';
        if (hor)  meta += '<span class="tag-horario">' + hor + '</span>';
        if (sent) meta += '<span class="tag-sentido">' + sent + '</span>';

        return '<div class="esquema-opt' + isSel + '" data-id="' + _escHtml(String(esq.id_esquema)) + '">' +
          '<div class="esquema-opt-main">' + id + ' &mdash; ' + nome + '</div>' +
          (meta ? '<div class="esquema-opt-meta">' + meta + '</div>' : '') +
          '</div>';
      }).join('');

      // Wires de clique
      dropdown.querySelectorAll('.esquema-opt').forEach(function(el) {
        el.addEventListener('click', function() {
          var id = el.getAttribute('data-id');
          _selecionarEsquema(id);
        });
      });
    }

    function _selecionarEsquema(idEsquema) {
      var hidden = document.getElementById('selectEsquema');
      var input  = document.getElementById('esquemaSearch');
      if (hidden) hidden.value = idEsquema || '';

      var esqObj = _esquemas.find(function(e) { return String(e.id_esquema) === String(idEsquema); });
      if (input) {
        if (esqObj) {

        uploadInput.value = esqObj.id_esquema + ' — ' + (esqObj.nome_linha || esqObj.id_esquema);

      _fecharEsquemaDropdown();

    // Mini combobox de esquema dentro do card de upload
    function _initUploadEsquemaSearch() {
      var wrap     = document.getElementById('uploadEsquemaCombobox');
      var input    = document.getElementById('uploadEsquemaSearch');
      var dropdown = document.getElementById('uploadEsquemaDropdown');
      if (!wrap || !input || !dropdown) return;

      function show() {
        renderOpts(input.value);
        dropdown.style.display = 'block';
      }
      function hide() {
        dropdown.style.display = 'none';
      }

      function renderOpts(query) {
        var q = (query || '').trim().toLowerCase()
          .normalize('NFD').replace(/[̀-ͯ]/g, '');
        var list = _esquemas.filter(function(esq) {
          if (!q) return true;
          var id   = String(esq.id_esquema || '').toLowerCase();
          var nome = (esq.nome_linha || '').toLowerCase()
            .normalize('NFD').replace(/[̀-ͯ]/g, '');
          var hor  = (esq.horario || '').toLowerCase();
          var sent = (esq.sentido || '').toLowerCase();
          return id.includes(q) || nome.includes(q) || hor.includes(q) || sent.includes(q);
        });

        if (list.length === 0) {
          var msg = _esquemas.length === 0 ? 'Nenhum esquema cadastrado.' : 'Nenhum resultado.';
          var managerBtn = (typeof WEB_APP_URL !== 'undefined' && WEB_APP_URL)
            ? '<div style="padding:6px 12px 8px; border-top:1px solid var(--border-light,#eee);">' +
              '<a onclick="window.open(WEB_APP_URL+\'?page=manager\',\'_blank\')" style="color:var(--laranja);font-size:12px;font-weight:600;cursor:pointer;">+ Cadastrar esquemas</a>' +
              '</div>' : '';
          dropdown.innerHTML = '<div style="padding:8px 12px;font-size:12px;color:var(--text3);">' + msg + '</div>' + managerBtn;
          return;
        }

        dropdown.innerHTML = list.slice(0, 30).map(function(esq) {
          var nome = _escHtml(esq.id_esquema + ' — ' + (esq.nome_linha || esq.id_esquema));
          var meta = '';
          if (esq.horario) meta += '<span class="tag-horario">' + _escHtml(esq.horario) + '</span>';
          if (esq.sentido) meta += ' <span class="tag-sentido">' + _escHtml(esq.sentido) + '</span>';
          return '<div data-id="' + _escHtml(String(esq.id_esquema)) + '" style="padding:8px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--border-light,#eee);" onmouseover="this.style.background=\'var(--bg2)\'" onmouseout="this.style.background=\'\'">' +
            nome +
            (meta ? '<div class="esquema-opt-meta" style="margin-top:3px;">' + meta + '</div>' : '') +
            '</div>';
        }).join('');

        dropdown.querySelectorAll('[data-id]').forEach(function(el) {
          el.addEventListener('click', function() {
            var id = el.getAttribute('data-id');
            _selecionarEsquema(id);
            var esqObj = _esquemas.find(function(e) { return String(e.id_esquema) === String(id); });
            if (esqObj) {
              input.value = esqObj.id_esquema + ' — ' + (esqObj.nome_linha || esqObj.id_esquema);
            }
            hide();
          });
        });
      }

      input.addEventListener('focus', show);
      input.addEventListener('input', show);
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') { hide(); input.blur(); }
        if (e.key === 'Enter') {
          var first = dropdown.querySelector('[data-id]');
          if (first) first.click();
        }
      });

      // Fecha ao clicar fora — mesmo padrão do header (mais confiável que blur em iframe)
      document.addEventListener('click', function(e) {
        if (!wrap.contains(e.target)) hide();
      });
    }

    /** Envolve o trecho que casou com `query` em <mark> */
    function _highlightMatch(html, query) {
      if (!query) return html;
      var q = query.trim();
      var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return html.replace(re, '<mark>$1</mark>');
    }

    /**
     * Dado um array ordenado de { valor, label }, calcula o conjunto de
     * valores que estão dentro de algum intervalo já ocupado em _vinculos.
     * O intervalo é inclusivo: todos os pontos entre ponto_inicio e ponto_fim
     * (na ordem da lista) são considerados ocupados.
     * @param {Array<{valor:string, label:string}>} pontos
     * @returns {Set<string>}
     */
    function _calcularPontosOcupados(pontos) {
      var ocupados = new Set();
      _vinculos.forEach(function(v) {
        var idxInicio = -1, idxFim = -1;
        for (var i = 0; i < pontos.length; i++) {
          if (pontos[i].valor === v.ponto_inicio) idxInicio = i;
          if (pontos[i].valor === v.ponto_fim)    idxFim    = i;
        }
        if (idxInicio >= 0 && idxFim >= 0) {
          var lo = Math.min(idxInicio, idxFim);
          var hi = Math.max(idxInicio, idxFim);
          for (var j = lo; j <= hi; j++) {
            ocupados.add(pontos[j].valor);
          }
        }
      });
      return ocupados;
    }

    function _getPontosLista() {
      var pontos = [];
      if (_enrichedTrip && _enrichedTrip.length > 0) {
        var vistos = {};
        _enrichedTrip.forEach(function(p) {
          var nome = (p.ponto || '').trim();
          if (nome && !vistos[nome]) {
            vistos[nome] = true;
            pontos.push({ valor: (p.codigo || nome), label: nome });
          }
        });
      } else if (_esquemaPontos && _esquemaPontos.length > 0) {
        _esquemaPontos.forEach(function(p) {
          pontos.push({ valor: p.id_ponto, label: p.nome_ponto || p.id_ponto });
        });
      }
      return pontos;
    }

    // ============================================================
    //  CÁLCULO DE COMPARAÇÃO
    // ============================================================

    function _calcularComparacao() {
      if (!_esquemaPontos.length || !_enrichedTrip.length) {
        _comparacao = null;
        return;
      }

      var realizadosSet = new Set(
        _enrichedTrip
          .filter(function (p) {
            return p.matched && p.codigo;
          })
          .map(function (p) {
            return String(p.codigo);
          }),
      );

      _comparacao = _esquemaPontos.map(function (ep) {
        var chave = String(ep.id_ponto);
        var visitado = realizadosSet.has(chave);
        var pontoReal = visitado
          ? _enrichedTrip.find(function (p) {
              return p.matched && String(p.codigo) === chave;
            }) || null
          : null;
        return Object.assign({}, ep, {
          visitado: visitado,
          ponto_realizado: pontoReal,
          status: visitado ? "Realizado" : "Não visitado",
        });
      });

      // Re-renderiza tabela e mapa
      if (_analysis) {
        AnalysisModule.renderPontosTable(_enrichedTrip, _comparacao);
      }

      _agendarMapa(_enrichedTrip, _comparacao, _locaisCache);

      // Atualiza contadores na seção resumo
      AnalysisModule.atualizarContadoresComparacao(_comparacao);

      // Habilita botões de ação no header
      var btnVincular = document.getElementById("btnVincularMotorista");
      var btnRel = document.getElementById("btnRelatorio");
      if (btnVincular) btnVincular.disabled = false;
      if (btnRel) btnRel.disabled = false;

      // Gera alertas de pontos não visitados + paradas não autorizadas (fora do esquema)
      if (_analysis && _analysis.alerts) {
        var alertsFiltrados = _analysis.alerts.filter(function (a) {
          return a.tipo !== "PONTO_NAO_VISITADO" && a.tipo !== "PARADA_PROIBIDA";
        });

        // Pontos não visitados
        _comparacao.forEach(function (c) {
          if (!c.visitado) {
            alertsFiltrados.push({
              tipo: "PONTO_NAO_VISITADO",
              descricao: 'Ponto "' + c.nome_ponto + '" (ID: ' + c.id_ponto + ") não foi visitado nesta viagem",
              nivel: "nao-visitado",
              trecho: c.nome_ponto,
            });
          }
        });

        // Paradas não autorizadas: ponto com parada, identificado na base,
        // mas FORA do esquema da linha
        var codigosEsquema = new Set(
          _esquemaPontos.map(function(ep) { return String(ep.id_ponto); })
        );
        var TOLERANCIA_NAO_AUT_S = 5 * 60;
        _enrichedTrip.forEach(function(pt) {
          if (!pt.matched || !pt.parada_s || pt.parada_s <= TOLERANCIA_NAO_AUT_S) return;
          if (pt.codigo && codigosEsquema.has(String(pt.codigo))) return; // está no esquema
          alertsFiltrados.push({
            tipo: "PARADA_PROIBIDA",
            descricao: 'Parada de ' + Math.round(pt.parada_s / 60) + ' min em local não autorizado: "' + pt.ponto + '"',
            nivel: "critico",
            seq: pt.seq,
            trecho: pt.ponto
          });
        });

        _analysis.alerts = alertsFiltrados;
        _renderAlertas();
      }

      var naoVisitados = _comparacao.filter(function (c) {
        return !c.visitado;
      }).length;
      UIModule.showToast(
        "Comparação: " +
          (_comparacao.length - naoVisitados) +
          " visitados, " +
          naoVisitados +
          " não visitados.",
        naoVisitados > 0 ? "warning" : "success",
        5000,
      );
    }

    // ============================================================
    //  DETECÇÃO DE PARADAS EM LOCAIS PROIBIDOS (TIPO 42)
    // ============================================================

    function _haversineM(lat1, lng1, lat2, lng2) {
      var R = 6371000;
      var toRad = function(d) { return d * Math.PI / 180; };
      var dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
      var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
              Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    /**
     * Detecta paradas em locais proibidos (tipo 42) por proximidade de coordenadas.
     * Marca pt.proibido42 = true e injeta alertas PARADA_PROIBIDA em _analysis.alerts.
     */
    /** Retorna true para qualquer representação de "tipo 42 não autorizado". */
    function _isTipo42(tipo) {
      var t = String(tipo || '').trim();
      if (/\b42\b/.test(t)) return true;
      var norm = t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      return norm.indexOf('nao autorizado') !== -1;
    }

    function _detectarParadasProibidas() {
      if (!_enrichedTrip.length || !_analysis) return;

      // Passo 1 — marca por código: pontos casados com tipo 42 na base de locais
      _enrichedTrip.forEach(function(pt) {
        if (pt.proibido42) return;
        if (pt.matched && _isTipo42(pt.tipo) && pt.parada_s > 0) {
          pt.proibido42 = true;
        }
      });

      // Passo 2 — marca por proximidade GPS (complementa casos sem tipo no ponto)
      if (_locaisCache.length) {
        var locais42 = _locaisCache.filter(function(l) {
          return _isTipo42(l.tipo);
        });

        if (locais42.length) {
          var MIN_PARADA_S  = 60;
          var RAIO_PADRAO_M = 100;

          _enrichedTrip.forEach(function(pt) {
            if (pt.proibido42) return;
            if (!pt.parada_s || pt.parada_s < MIN_PARADA_S) return;
            if (!pt.lat || !pt.lng) return;

            for (var i = 0; i < locais42.length; i++) {
              var l = locais42[i];
              if (!l.lat || !l.lng) continue;
              var raioM = l.raio > 0 ? l.raio : RAIO_PADRAO_M;
              if (_haversineM(pt.lat, pt.lng, l.lat, l.lng) <= raioM) {
                pt.proibido42     = true;
                pt.nomeProibido42 = l.descricao || l.descResumida || l.codigo || pt.ponto;
                break;
              }
            }
          });
        }
      }

      // Passo 3 — reconstrói alertas PARADA_PROIBIDA a partir de todos os pts marcados
      var outros = (_analysis.alerts || []).filter(function(a) { return a.tipo !== 'PARADA_PROIBIDA'; });
      _enrichedTrip.forEach(function(pt) {
        if (!pt.proibido42) return;
        var paradaMin = Math.round(pt.parada_s / 60);
        outros.push({
          tipo:      'PARADA_PROIBIDA',
          descricao: 'Parada de ' + paradaMin + ' min em local proibido: "' + (pt.nomeProibido42 || pt.ponto) + '"',
          nivel:     'critico',
          seq:       pt.seq,
          trecho:    pt.nomeProibido42 || pt.ponto
        });
      });
      _analysis.alerts = outros;
    }

    // ============================================================
    //  FLUXO: UPLOAD → PROCESSAR → ANALISAR → RENDERIZAR
    // ============================================================

    function _onFileLoaded(csvText) {
      UIModule.showToast(
        'Arquivo carregado. Clique em "Processar Viagem".',
        "info",
      );
    }

    function _processarViagem() {
      var csvText = UIModule.getCsvText();
      if (!csvText) {
        UIModule.showToast("Nenhum arquivo selecionado.", "error");
        return;
      }

      var selEsquema = document.getElementById("selectEsquema");
      if (!selEsquema || !selEsquema.value) {
        UIModule.showToast("Selecione o esquema da viagem antes de processar.", "error");
        return;
      }

      UIModule.showLoading("Processando relatório de viagem...");

      google.script.run
        .withSuccessHandler(_onReportProcessed)
        .withFailureHandler(_onError)
        .processReport(csvText);
    }

    function _onReportProcessed(enrichedTrip) {
      if (!enrichedTrip || enrichedTrip.length === 0) {
        UIModule.hideLoading();
        UIModule.showToast(
          "Nenhum ponto válido encontrado no relatório.",
          "error",
        );
        return;
      }

      _enrichedTrip = enrichedTrip;
      _justState = { hash: '', justificativas: {} }; // nova viagem → zera justificativas
      UIModule.showLoading("Calculando velocidades e alertas...");

      google.script.run
        .withSuccessHandler(_onTripAnalyzed)
        .withFailureHandler(_onError)
        .analyzeTrip(enrichedTrip);
    }

    function _onTripAnalyzed(analysisResult) {
      UIModule.hideLoading();

      if (!analysisResult) {
        UIModule.showToast("Erro ao analisar a viagem.", "error");
        return;
      }

      // Revela a UI completa (remove modo upload-only — mostra header-center, etc.)
      var wrapper = document.querySelector('.app-wrapper');
      if (wrapper) wrapper.classList.remove('app--upload-only');

      // Oculta o card de upload após processar
      var secConfig = document.getElementById('sectionConfig');
      if (secConfig) {
        secConfig.style.transition = 'opacity 0.3s';
        secConfig.style.opacity = '0';
        setTimeout(function() {
          secConfig.style.display = 'none';
          secConfig.style.opacity = '';
          secConfig.style.transition = '';
        }, 300);
      }

      _analysis = analysisResult;
      _tripReady = true;

      var segments = analysisResult.segments;
      var alerts = analysisResult.alerts;
      var summary = analysisResult.summary;

      // Renderiza resumo (mostra sectionResumo e sectionAnalise)
      AnalysisModule.renderSummary(summary);

      // Detecção de locais proibidos (tipo 42) — marca pt.proibido42 antes de renderizar
      _detectarParadasProibidas();

      // Tabela de pontos
      if (_esquemaPontos.length > 0) {
        _calcularComparacao();
      } else {
        AnalysisModule.renderPontosTable(_enrichedTrip);

        // Contadores de realizados/não visitados quando sem esquema
        var matchados = _enrichedTrip.filter(function (p) {
          return p.matched;
        }).length;
        var naoMatch = _enrichedTrip.length - matchados;
        var elRealizados = document.getElementById("sumRealizados");
        if (elRealizados) {
          elRealizados.textContent = matchados;
          elRealizados.className = "sum-value verde";
        }
        var elNao = document.getElementById("sumNaoVisitados");
        if (elNao) {
          elNao.textContent = naoMatch;
          elNao.className = "sum-value" + (naoMatch > 0 ? " amarelo" : "");
        }
        var elPlan = document.getElementById("sumPlanejados");
        if (elPlan) elPlan.textContent = _enrichedTrip.length;
      }

      // Tabela de velocidade (legado — mantida) + gráfico por trecho
      AnalysisModule.renderVelocidadeTable(segments);
      AnalysisModule.renderVelocidadeChart(segments);

      // Alertas (render imediato; justificativas salvas chegam em seguida)
      _renderAlertas();
      _loadJustificativas();

      // Exibe e habilita botões no header (Relatório e Motorista)
      var btnVincular = document.getElementById("btnVincularMotorista");
      var btnRel = document.getElementById("btnRelatorio");
      if (btnVincular) { btnVincular.style.display = ''; btnVincular.disabled = false; }
      if (btnRel) { btnRel.style.display = ''; btnRel.disabled = false; }

      // Exibe barra de modo de visualização
      var secModo = document.getElementById('sectionModoVisualizacao');
      if (secModo) secModo.style.display = '';

      // Revela o alternador de visão e prepara o Diagnóstico Inteligente
      var secSwitcher = document.getElementById('sectionViewSwitcher');
      if (secSwitcher) secSwitcher.style.display = '';
      if (window.DiagnosticoModule) DiagnosticoModule.onNewTrip();

      _agendarMapa(_enrichedTrip, _comparacao, _locaisCache);

      var totalPontos = _enrichedTrip.length;
      var pontosNaoId = _enrichedTrip.filter(function (p) {
        return !p.matched;
      }).length;
      var naoIdMsg =
        pontosNaoId > 0
          ? " (" +
            pontosNaoId +
            " não identificado" +
            (pontosNaoId > 1 ? "s" : "") +
            ")"
          : "";

      UIModule.showToast(
        totalPontos +
          " pontos processados" +
          naoIdMsg +
          ". " +
          alerts.length +
          " alerta" +
          (alerts.length !== 1 ? "s" : "") +
          ".",
        alerts.length > 0 ? "warning" : "success",
        5000,
      );

      // Atualiza preview de relatório com dados recém-processados
      _atualizarPreviewRelatorio();

      // Tenta auto-vínculo de motorista pelo nome do CSV
      _tentarAutoVinculo();

      // Rola para o mapa após a transição de ocultar o upload
      setTimeout(function () {
        var secMapa = document.getElementById("sectionMapa");
        if (secMapa)
          secMapa.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 450);
    }

    function _initSidebarMotorista() {
      var btnEdit = document.getElementById("btnEditDriver");
      var displayEl = document.getElementById("motoristaDisplay");
      var formInline = document.getElementById("motoristaFormInline");
      var inputMat = document.getElementById("sidebarMatricula");
      var inputNome = document.getElementById("sidebarNomeMotorista");
      var nomeResult = document.getElementById("sidebarNomeResult");
      var btnBuscar = document.getElementById("btnSidebarBuscar");
      var btnConfirmar = document.getElementById("btnSidebarConfirmar");
      var btnCancelar = document.getElementById("btnSidebarCancelar");

      if (!btnEdit) return;

      btnEdit.addEventListener("click", function () {
        var currentName =
          (document.getElementById("driverName") || {}).textContent || "";
        if (inputNome)
          inputNome.value = currentName === "Não Informado" ? "" : currentName;
        if (inputMat) inputMat.value = "";
        if (nomeResult) {
          nomeResult.textContent = "";
          nomeResult.style.color = "";
        }

        if (_vinculos.length > 0) {
          var ultimo = _vinculos[_vinculos.length - 1];
          var selIni = document.getElementById("sidebarPontoInicio");
          var selFim = document.getElementById("sidebarPontoFim");
          if (selIni && ultimo.ponto_inicio) selIni.value = ultimo.ponto_inicio;
          if (selFim && ultimo.ponto_fim) selFim.value = ultimo.ponto_fim;
        }

        var trechoSection = document.getElementById("sidebarTrechoSection");
        if (trechoSection) {
          var temPontos = _esquemaPontos.length > 0 || _enrichedTrip.length > 0;
          trechoSection.style.display = temPontos ? "block" : "none";
          // Popula selects do trecho com pontos do enrichedTrip quando não há esquema
          if (_esquemaPontos.length === 0 && _enrichedTrip.length > 0) {
            _popularSidebarTrechoDeEnrichedTrip();
          }
        }

        if (displayEl) displayEl.style.display = "none";
        if (formInline) formInline.style.display = "block";
        if (inputMat)
          setTimeout(function () {
            inputMat.focus();
          }, 50);
      });

      if (btnCancelar) {
        btnCancelar.addEventListener("click", function () {
          if (displayEl) displayEl.style.display = "block";
          if (formInline) formInline.style.display = "none";
        });
      }

      function _buscar() {
        var mat = inputMat ? inputMat.value.trim() : "";
        if (!mat) {
          UIModule.showToast("Informe a matrícula.", "error");
          return;
        }
        var found = _motoristas.find(function (m) {
          return String(m.matricula).trim() === mat;
        });
        if (found) {
          if (inputNome) inputNome.value = found.nome;
          if (nomeResult) {
            nomeResult.textContent =
              found.nome + (found.base ? " · " + found.base : "");
            nomeResult.style.color = "var(--verde)";
          }
        } else {
          if (nomeResult) {
            nomeResult.textContent = "Matrícula não encontrada.";
            nomeResult.style.color = "var(--vermelho)";
          }
        }
      }

      if (btnBuscar) btnBuscar.addEventListener("click", _buscar);
      if (inputMat) {
        inputMat.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            _buscar();
          }
        });
      }

      if (btnConfirmar) {
        btnConfirmar.addEventListener("click", function () {
          var nome = inputNome ? inputNome.value.trim() : "";
          var mat = inputMat ? inputMat.value.trim() : "";

          if (!nome) {
            UIModule.showToast("Informe o nome do motorista.", "error");
            return;
          }

          if (_analysis && _analysis.summary) {
            _analysis.summary.motorista = nome;
          }

          var driverNameEl = document.getElementById("driverName");
          if (driverNameEl) {
            driverNameEl.textContent = nome;
            driverNameEl.className = "driver-name";
          }

          var trechoSection = document.getElementById("sidebarTrechoSection");
          var trechoAtivo =
            trechoSection && trechoSection.style.display !== "none";
          var selIni = document.getElementById("sidebarPontoInicio");
          var selFim = document.getElementById("sidebarPontoFim");
          var inicio = selIni ? selIni.value : "";
          var fim = selFim ? selFim.value : "";
          var trechoSumEl = document.getElementById("trechoSummary");

          if (trechoAtivo && inicio && fim) {
            var existIdx = mat
              ? _vinculos.findIndex(function (v) {
                  return v.matricula === mat;
                })
              : -1;
            var conflitoI = _trechoConflita(inicio, fim, existIdx);
            if (conflitoI) {
              UIModule.showToast('Trecho conflita com "' + (conflitoI.nome || conflitoI.matricula || '') + '" — pontos já vinculados a outro motorista.', 'error', 5000);
              return;
            }
            var _ri = _computeSeqRange(inicio, fim, null, null);
            var vinculo = {
              matricula: mat || "—",
              nome: nome,
              ponto_inicio: inicio,
              ponto_fim: fim,
              seqMin: _ri.min,
              seqMax: _ri.max,
            };
            if (existIdx >= 0) {
              _vinculos[existIdx] = vinculo;
            } else {
              _vinculos.push(vinculo);
            }

            _populaSelectMotoristaRelatorio();
            _renderVinculadosList();
            _refreshEventos();

            var inicioNome = _nomePontoPorId(inicio);
            var fimNome = _nomePontoPorId(fim);
            if (trechoSumEl) {
              trechoSumEl.innerHTML =
                '<span style="color:var(--laranja);">▸</span> ' +
                _escHtml(inicioNome) +
                ' <span style="color:var(--text3); margin:0 3px;">→</span> ' +
                _escHtml(fimNome);
              trechoSumEl.style.display = "block";
            }

            UIModule.showToast(
              '"' + nome + '" · ' + inicioNome + " → " + fimNome,
              "success",
              4000,
            );
          } else {
            if (trechoSumEl) trechoSumEl.style.display = "none";
            UIModule.showToast("Motorista definido: " + nome, "success", 3000);
          }

          if (displayEl) displayEl.style.display = "block";
          if (formInline) formInline.style.display = "none";
        });
      }

      if (inputNome) {
        inputNome.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            if (btnConfirmar) btnConfirmar.click();
          }
        });
      }
    }

    function _initModalMotorista() {
      var overlay   = document.getElementById("modalMotorista");
      var btnOpen   = document.getElementById("btnVincularMotorista");
      var btnClose  = document.getElementById("btnCloseMotoristaModal");
      var btnCancel = document.getElementById("btnCancelMotoristaModal");
      if (!overlay) return;

      var open  = function() { overlay.classList.add("open");    _renderModalMotorista(); };
      var close = function() { overlay.classList.remove("open"); };

      if (btnOpen)   btnOpen.addEventListener("click", open);
      if (btnClose)  btnClose.addEventListener("click", close);
      if (btnCancel) btnCancel.addEventListener("click", close);
      overlay.addEventListener("click", function(e) { if (e.target === overlay) close(); });
    }

    // ---- Render master do modal ----
    function _renderModalMotorista() {
      _renderIbuttonAviso();
      _renderDetectadosList();
      _renderVinculadosList();
    }

    function _renderIbuttonAviso() {
      var el = document.getElementById('motoristaIbuttonAviso');
      if (!el) return;
      var temDados = _autoVinculoDataList.length > 0 || _vinculos.length > 0;
      el.style.display = temDados ? 'none' : '';
    }

    function _renderDetectadosList() {
      var container = document.getElementById('motoristaDetectadosList');
      if (!container) return;
      if (!_autoVinculoDataList.length) { _renderManualAddCard(); return; }

      var html = '<div style="font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text3); margin:16px 0 8px;">Detectados pelo iButton</div>';
      html += _autoVinculoDataList.map(function(d, idx) {
        if (d.cadastrando) return _renderCardCadastro(d, idx);
        if (d.editando)    return _renderCardEdit(d, idx);
        return _renderCardView(d, idx);
      }).join('');

      // Seção manual sempre visível abaixo dos cards detectados
      html += _buildManualAddHtml();

      container.innerHTML = html;

      // Popula selects de cards em modo edição ou cadastro
      _autoVinculoDataList.forEach(function(d, idx) {
        if (d.editando || d.cadastrando) _popularSelectsCard(idx);
      });

      // Popula selects da seção manual
      _popularSelectsManual();
    }

    function _toggleCadastroCard(idx) {
      var d = _autoVinculoDataList[idx];
      if (!d) return;
      d.cadastrando = !d.cadastrando;
      d.editando    = false;
      _renderDetectadosList();
    }

    function _cadastrarConfirmarCard(idx) {
      var d = _autoVinculoDataList[idx];
      if (!d) return;

      var matInput  = document.getElementById('mCard_mat_' + idx);
      var nomeInput = document.getElementById('mCard_nomeInput_' + idx);
      var selIni    = document.getElementById('mCard_ini_' + idx);
      var selFim    = document.getElementById('mCard_fim_' + idx);

      var mat    = matInput  ? matInput.value.trim()  : '';
      var nome   = nomeInput ? nomeInput.value.trim() : '';
      var inicio = selIni    ? selIni.value           : '';
      var fim    = selFim    ? selFim.value            : '';

      if (!nome) { UIModule.showToast('Informe o nome do motorista.', 'error'); return; }
      if (!inicio || !fim) { UIModule.showToast('Selecione o ponto inicial e final.', 'error'); return; }

      if (mat) {
        var dup = _vinculos.find(function(v) { return v.matricula && v.matricula === mat; });
        if (dup) { UIModule.showToast('Este motorista já está vinculado.', 'warning'); return; }
      }

      var conflito = _trechoConflita(inicio, fim, -1);
      if (conflito) { UIModule.showToast('Trecho conflita com "' + (conflito.nome || conflito.matricula || '') + '" — pontos já vinculados a outro motorista.', 'error', 5000); return; }

      // Confirma vínculo imediatamente (otimista)
      var _r = _computeSeqRange(inicio, fim, d.seqMin, d.seqMax);
      _vinculos.push({ matricula: mat, nome: nome, nomeCsv: d.nomeCsv, ponto_inicio: inicio, ponto_fim: fim, seqMin: _r.min, seqMax: _r.max });
      _autoVinculoDataList.splice(idx, 1);
      _populaSelectMotoristaRelatorio();
      _atualizarPreviewRelatorio();
      _renderModalMotorista();
      _refreshEventos();
      UIModule.showToast('Motorista "' + nome + '" vinculado.', 'success', 3000);

      // Salva na planilha em background (falha não bloqueia)
      google.script.run
        .withSuccessHandler(function(saved) {
          _motoristas.push({ matricula: saved.matricula || mat, nome: saved.nome || nome, base: saved.base || '' });
          UIModule.showToast('"' + (saved.nome || nome) + '" cadastrado na base de motoristas.', 'info', 3000);
        })
        .withFailureHandler(function(err) {
          console.warn('[App] Erro ao salvar motorista na planilha:', err);
          UIModule.showToast('Vinculado localmente, mas falha ao salvar na planilha.', 'warning');
        })
        .salvarMotorista({ matricula: mat, nome: nome, base: '', ibutton: d.nomeCsv || '' });
    }

    function _popularSelectsCard(idx) {
      var d = _autoVinculoDataList[idx];
      if (!d) return;
      var pontos = _getPontosLista();
      var optsBase = '<option value="">— Selecione —</option>' +
        pontos.map(function(p) { return _optionPontoHtml(p, -1); }).join('');

      var selIni = document.getElementById('mCard_ini_' + idx);
      var selFim = document.getElementById('mCard_fim_' + idx);
      if (selIni) { selIni.innerHTML = optsBase; _preencherSelectTrecho(selIni, d.pontoInicio); }
      if (selFim) { selFim.innerHTML = optsBase; _preencherSelectTrecho(selFim, d.pontoFim || d.pontoInicio); }
    }

    function _toggleEditCard(idx) {
      var d = _autoVinculoDataList[idx];
      if (!d) return;
      if (!d.editando) {
        d.editMat  = d.motorista ? String(d.motorista.matricula || '') : '';
        d.editNome = d.motorista ? d.motorista.nome : '';
      }
      d.editando = !d.editando;
      _renderDetectadosList();
    }

    function _buscarMotoristaCard(idx) {
      var matInput  = document.getElementById('mCard_mat_' + idx);
      var nomeInput = document.getElementById('mCard_nomeInput_' + idx);
      var d = _autoVinculoDataList[idx];
      if (!matInput || !d) return;

      var mat = matInput.value.trim();
      var encontrado = mat ? _motoristas.find(function(m) { return String(m.matricula).trim() === mat; }) : null;

      d.editMat  = mat;
      d.editNome = encontrado ? encontrado.nome : (nomeInput ? nomeInput.value.trim() : '');

      if (nomeInput) {
        if (encontrado) {
          nomeInput.value = encontrado.nome;
          nomeInput.style.color = 'var(--verde)';
          nomeInput.title = encontrado.base ? encontrado.base : '';
        } else if (mat) {
          UIModule.showToast('Matrícula ' + mat + ' não encontrada na base local.', 'warning', 3000);
          nomeInput.style.color = '';
        }
      }
    }

    function _confirmarCard(idx) {
      var d = _autoVinculoDataList[idx];
      if (!d) return;

      var mat, nome, inicio, fim;

      if (d.editando) {
        var matInput    = document.getElementById('mCard_mat_' + idx);
        var nomeInputEl = document.getElementById('mCard_nomeInput_' + idx);
        var selIni      = document.getElementById('mCard_ini_' + idx);
        var selFim      = document.getElementById('mCard_fim_' + idx);
        mat    = matInput    ? matInput.value.trim()    : '';
        nome   = nomeInputEl ? nomeInputEl.value.trim() : '';
        inicio = selIni ? selIni.value : '';
        fim    = selFim ? selFim.value : '';
        if (!inicio || !fim) { UIModule.showToast('Selecione o ponto inicial e final.', 'error'); return; }
        if (!nome) nome = d.nomeCsv;
      } else {
        if (!d.pontoInicio) { UIModule.showToast('Trecho não detectado. Clique em Editar.', 'warning'); return; }
        mat    = d.motorista ? String(d.motorista.matricula || '') : '';
        nome   = d.motorista ? d.motorista.nome : d.nomeCsv;
        inicio = d.pontoInicio;
        fim    = d.pontoFim || d.pontoInicio;
      }

      if (mat) {
        var dup = _vinculos.find(function(v) { return v.matricula && v.matricula === mat; });
        if (dup) { UIModule.showToast('Este motorista já está vinculado.', 'warning'); return; }
      }

      var conflitoC = _trechoConflita(inicio, fim, -1);
      if (conflitoC) { UIModule.showToast('Trecho conflita com "' + (conflitoC.nome || conflitoC.matricula || '') + '" — pontos já vinculados a outro motorista.', 'error', 5000); return; }

      var _rc = _computeSeqRange(inicio, fim, d.seqMin, d.seqMax);
      _vinculos.push({ matricula: mat, nome: nome || d.nomeCsv, nomeCsv: d.nomeCsv, ponto_inicio: inicio, ponto_fim: fim, seqMin: _rc.min, seqMax: _rc.max });
      _autoVinculoDataList.splice(idx, 1);
      _populaSelectMotoristaRelatorio();
      _atualizarPreviewRelatorio();
      UIModule.showToast('Motorista "' + (nome || d.nomeCsv) + '" vinculado.', 'success', 3000);
      _renderModalMotorista();
      _refreshEventos();

      // Salva o iButton na planilha para reconhecimento automático nas próximas sessões
      if (d.nomeCsv && d.motorista && !d.motorista.ibutton) {
        google.script.run
          .atualizarIbuttonMotorista(mat, nome || d.nomeCsv, d.nomeCsv);
        d.motorista.ibutton = d.nomeCsv;
      }
    }

    function _descartarCard(idx) {
      _autoVinculoDataList.splice(idx, 1);
      _renderDetectadosList();

    function _buscarMotoristaManual() {
      var matInput  = document.getElementById('mManual_mat');
      var nomeDisp  = document.getElementById('mManual_nomeDisp');
      var nomeInput = document.getElementById('mManual_nome');
      var baseInput = document.getElementById('mManual_base');
      var cadNote   = document.getElementById('mManual_cadastroNote');
      if (!matInput) return;
      var mat = matInput.value.trim();
      var encontrado = mat ? _motoristas.find(function(m) { return String(m.matricula).trim() === mat; }) : null;

      if (encontrado) {
        if (nomeDisp) {
          nomeDisp.textContent = encontrado.nome + (encontrado.base ? ' · ' + encontrado.base : '');
          nomeDisp.style.color = 'var(--verde)';
        }
        if (nomeInput) nomeInput.value = encontrado.nome;
        if (baseInput) baseInput.value = encontrado.base || '';
        if (cadNote)   cadNote.style.display = 'none';
      } else {
        if (nomeDisp) {
          nomeDisp.textContent = mat ? 'Matrícula não encontrada' : '—';
          nomeDisp.style.color = mat ? 'var(--vermelho)' : 'var(--text3)';

        if (cadNote) cadNote.style.display = mat ? 'inline-flex' : 'none';

    function _vincularMotorista(mat, nome, base, inicio, fim, msg) {
      var _r = _computeSeqRange(inicio, fim, null, null);
      _vinculos.push({ matricula: mat || '—', nome: nome, base: base || '', ponto_inicio: inicio, ponto_fim: fim, seqMin: _r.min, seqMax: _r.max });
      _populaSelectMotoristaRelatorio();
      _atualizarPreviewRelatorio();
      UIModule.showToast(msg || ('"' + nome + '" vinculado com sucesso.'), 'success', 3000);
      _renderModalMotorista();
      _refreshEventos();
    }

    function _confirmarManual() {
      var matInput  = document.getElementById('mManual_mat');
      var nomeInput = document.getElementById('mManual_nome');
      var baseInput = document.getElementById('mManual_base');
      var selIni    = document.getElementById('mManual_ini');
      var selFim    = document.getElementById('mManual_fim');
      var mat    = matInput  ? matInput.value.trim()  : '';
      var nome   = nomeInput ? nomeInput.value.trim() : '';
      var base   = baseInput ? baseInput.value.trim() : '';
      var inicio = selIni    ? selIni.value           : '';
      var fim    = selFim    ? selFim.value           : '';
      if (!nome)           { UIModule.showToast('Informe o nome do motorista.', 'error'); return; }
      if (!inicio || !fim) { UIModule.showToast('Selecione o ponto inicial e final.', 'error'); return; }
      var dup = mat ? _vinculos.find(function(v) { return v.matricula === mat; }) : null;
      if (dup) { UIModule.showToast('Este motorista já está vinculado.', 'warning'); return; }

      var conflitoM = _trechoConflita(inicio, fim, -1);
      if (conflitoM) { UIModule.showToast('Trecho conflita com "' + (conflitoM.nome || conflitoM.matricula || '') + '" — pontos já vinculados a outro motorista.', 'error', 5000); return; }

      var jaCadastrado = mat
        ? _motoristas.find(function(m) { return String(m.matricula).trim() === mat; })
        : _motoristas.find(function(m) { return String(m.nome).trim().toUpperCase() === nome.toUpperCase(); });

      // Já existe na base → apenas vincula
      if (jaCadastrado) {
        _vincularMotorista(mat, nome, base || jaCadastrado.base || '', inicio, fim);
        return;
      }

      // Novo motorista → persiste no sistema (aba MOTORISTAS + API) e depois vincula
      var btn = document.getElementById('mManual_confirmBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Cadastrando…'; }

      google.script.run
        .withSuccessHandler(function(salvo) {
          // Atualiza o cache local para buscas futuras na mesma sessão
          _motoristas.push({
            matricula: (salvo && salvo.matricula) || mat || '',
            nome:      (salvo && salvo.nome)      || nome,
            base:      (salvo && salvo.base)      || base || '',
            ibutton:   (salvo && salvo.ibutton)   || ''
          });
          _vincularMotorista(mat, nome, base, inicio, fim, '"' + nome + '" cadastrado e vinculado.');
        })
        .withFailureHandler(function(err) {
          // Falha ao persistir não impede o uso na análise atual
          console.warn('[App] Falha ao cadastrar motorista:', err);
          _vincularMotorista(mat, nome, base, inicio, fim, '"' + nome + '" vinculado (falha ao cadastrar no sistema).');
        })
        .salvarMotorista({ matricula: mat, nome: nome, base: base, ibutton: '' });
    }

    /** Adiciona um arquivo de imagem à lista de evidências. Retorna true se aceito. */
    function _pushEvidenciaFile(file) {
      if (!file || !file.type || file.type.indexOf('image/') !== 0) return false;
      _relFiles.push({ id: 'ev' + (_relEvSeq++), file: file, caption: '' });
      return true;
    }

    /** Cola imagens do clipboard (Ctrl+V) enquanto o modal de relatório está aberto. */
    function _onModalRelatorioPaste(e) {
      var overlay = document.getElementById('modalRelatorio');
      if (!overlay || !overlay.classList.contains('open')) return;

      var items = (e.clipboardData && e.clipboardData.items) || [];
      var added = 0;
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.kind === 'file' && it.type && it.type.indexOf('image/') === 0) {
          var blob = it.getAsFile();
          if (!blob) continue;
          var ext = (it.type.split('/')[1] || 'png').replace(/[^a-z0-9]/gi, '') || 'png';
          var named;
          try {
            named = new File([blob], 'colado-' + Date.now() + '-' + i + '.' + ext, { type: it.type });
          } catch (err) {
            named = blob; // navegadores sem construtor File: usa o blob direto
          }
          if (_pushEvidenciaFile(named)) added++;
        }
      }

      if (added > 0) {
        e.preventDefault();
        _syncCaptionsRel();
        _renderEvidenciasList();
        if (typeof UIModule !== 'undefined' && UIModule.showToast) {
          UIModule.showToast(added > 1 ? (added + ' imagens coladas.') : 'Imagem colada.', 'success', 2500);
        }
      }
    }

    /**
     * Reduz a imagem (máx. 1280px, JPEG 0.82) e devolve base64 — alivia o
     * transporte via google.script.run; a API ainda reduz para 800px no servidor.
     */
    function _fileToResizedBase64(file) {
      return new Promise(function (resolve) {
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function () {
          var maxDim = 1280;
          var w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else        { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          try {
            var dataUrl = canvas.toDataURL('image/jpeg', 0.82);
            resolve({ base64: dataUrl.split(',')[1] });
          } catch (e) { resolve(null); }
        };
        img.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
        img.src = url;
      });
    }

    /** Lê todas as imagens selecionadas → array p/ a API. */
    function _readEvidenciasBase64() {
      _syncCaptionsRel();
      if (!_relFiles.length) return Promise.resolve([]);
      return Promise.all(_relFiles.map(function (item) {
        return _fileToResizedBase64(item.file).then(function (res) {
          if (!res) return null;
          var nome = String(item.file.name || 'evidencia').replace(/\.[^/.]+$/, '') + '.jpg';
          return { nome: nome, mime: 'image/jpeg', base64: res.base64, legenda: item.caption || '' };
        });
      })).then(function (arr) { return arr.filter(Boolean); });
    }

    // Lista de motoristas cadastrados (aba MOTORISTAS), carregada sob demanda.
    var _motoristasCadastrados = null;

    /** Carrega a lista de motoristas cadastrados (uma vez) e chama cb(). */
    function _carregarMotoristasCadastrados(cb) {
      if (_motoristasCadastrados) { if (cb) cb(); return; }
      google.script.run
        .withSuccessHandler(function (lista) {
          _motoristasCadastrados = (lista || []).slice().sort(function (a, b) {
            return String(a.nome || '').localeCompare(String(b.nome || ''));
          });
          _ensureMatriculasDatalist();
          if (cb) cb();
        })
        .withFailureHandler(function () {
          _motoristasCadastrados = [];
          if (cb) cb();
        })
        .getMotoristas();
    }

    /** Garante um <datalist> global com as matrículas cadastradas (autocomplete). */
    function _ensureMatriculasDatalist() {
      var dl = document.getElementById('relMatriculasDatalist');
      if (!dl) {
        dl = document.createElement('datalist');
        dl.id = 'relMatriculasDatalist';
        document.body.appendChild(dl);
      }
      dl.innerHTML = '';
      (_motoristasCadastrados || []).forEach(function (m) {
        if (!m.matricula) return;
        var opt = document.createElement('option');
        opt.value = String(m.matricula);
        opt.textContent = m.nome || '';
        dl.appendChild(opt);
      });
      return dl;
    }

    /** Índice do motorista cadastrado por matrícula (exata). -1 se não achar. */
    function _idxMotoristaPorMatricula(mat) {
      var key = String(mat || '').trim();
      if (!key || !_motoristasCadastrados) return -1;
      return _motoristasCadastrados.findIndex(function (m) {
        return String(m.matricula || '').trim() === key;
      });
    }

    function _clonarOpcoesPonto(sel) {
      var base = document.getElementById('relPontoAModal');
      if (base) {
        sel.innerHTML = base.innerHTML;
      } else {
        sel.innerHTML = '<option value="">— Selecione —</option>';
      }
    }

    /** Adiciona uma linha de responsável (motorista + ponto início + ponto fim). */
    function _addMotoristaTrechoRow(prefill) {
      var lista = document.getElementById('relMotoristasTrechoList');
      if (!lista) return;
      prefill = prefill || {};

      _ensureMatriculasDatalist();

      var row = document.createElement('div');
      row.className = 'rel-mot-trecho-row';
      row.style.cssText = 'display:flex;flex-direction:column;gap:6px;border:1px solid var(--border);border-radius:8px;padding:8px;';

      // ── Linha 1: matrícula + motorista ───────────────────────────
      var linha1 = document.createElement('div');
      linha1.style.cssText = 'display:flex;gap:6px;align-items:center;';

      // Campo de matrícula (digita → seleciona no select)
      var inpMat = document.createElement('input');
      inpMat.type = 'text';
      inpMat.className = 'form-input rel-mot-mat';
      inpMat.placeholder = 'Matrícula';
      inpMat.setAttribute('list', 'relMatriculasDatalist');
      inpMat.style.cssText = 'flex:0 0 96px;min-width:0;';

      // Select do motorista cadastrado
      var selMot = document.createElement('select');
      selMot.className = 'form-input rel-mot-sel';
      selMot.style.cssText = 'flex:1;min-width:0;';
      selMot.innerHTML = '<option value="">— Motorista —</option>';
      (_motoristasCadastrados || []).forEach(function (m, i) {
        var opt = document.createElement('option');
        opt.value = i;
        opt.textContent = m.nome + (m.matricula ? ' (' + m.matricula + ')' : '');
        selMot.appendChild(opt);
      });

      // Digitar matrícula → seleciona motorista correspondente
      inpMat.addEventListener('input', function () {
        var idx = _idxMotoristaPorMatricula(inpMat.value);
        selMot.value = idx >= 0 ? String(idx) : '';
      });
      // Selecionar no select → reflete a matrícula no campo
      selMot.addEventListener('change', function () {
        var i = parseInt(selMot.value, 10);
        inpMat.value = (!isNaN(i) && _motoristasCadastrados[i]) ? (_motoristasCadastrados[i].matricula || '') : '';
      });

      linha1.appendChild(inpMat);
      linha1.appendChild(selMot);

      // Pré-seleção (usado ao cadastrar um novo motorista e já vinculá-lo)
      var _pidx = (prefill.motoristaIdx != null)
        ? prefill.motoristaIdx
        : (prefill.matricula ? _idxMotoristaPorMatricula(prefill.matricula) : -1);
      if (_pidx >= 0 && _motoristasCadastrados && _motoristasCadastrados[_pidx]) {
        selMot.value = String(_pidx);
        inpMat.value = _motoristasCadastrados[_pidx].matricula || '';
      }

      // ── Linha 2: ponto início → ponto fim + remover ──────────────
      var linha2 = document.createElement('div');
      linha2.style.cssText = 'display:flex;gap:6px;align-items:center;';

      var selIni = document.createElement('select');
      selIni.className = 'form-input rel-mot-ini';
      selIni.style.cssText = 'flex:1;min-width:0;';
      _clonarOpcoesPonto(selIni);

      var seta = document.createElement('span');
      seta.textContent = '→';
      seta.style.cssText = 'color:var(--laranja);flex:0 0 auto;font-weight:700;';

      var selFim = document.createElement('select');
      selFim.className = 'form-input rel-mot-fim';
      selFim.style.cssText = 'flex:1;min-width:0;';
      _clonarOpcoesPonto(selFim);

      // Prefill (padrão: trecho A→B do relatório)
      var pA = document.getElementById('relPontoAModal');
      var pB = document.getElementById('relPontoBModal');
      selIni.value = prefill.ini != null ? prefill.ini : (pA ? pA.value : '');
      selFim.value = prefill.fim != null ? prefill.fim : (pB ? pB.value : '');

      // Botão remover
      var btnDel = document.createElement('button');
      btnDel.type = 'button';
      btnDel.className = 'btn btn-ghost';

    function _addCadastroMotoristaTrechoRow() {

      var inpNome = document.createElement('input');

      var inpBase = document.createElement('input');
