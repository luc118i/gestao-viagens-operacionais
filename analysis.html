<script>
  // ============================================================
  //  analysis.js  —  Módulo de análise e renderização de dados
  //  Tema: claro (redesign)
  // ============================================================

  const AnalysisModule = (() => {

    var TEMPO_ESPERADO_PADRAO = 30 * 60; // fallback 00:30 (fora da aba TEMPO_PERMANENCIA)
    var TOLERANCIA_S = 5 * 60; // margem de segurança antes de marcar excesso
    var APOIO_LIMITE_S = 30 * 60; // teto de permanência mesmo em ponto de apoio (30min)

    // Ajuste manual de status por ponto (seq → 'apoio' | 'ignorar').
    // 'apoio'  = parada legítima (some das ocorrências/excessos do relatório).
    // 'ignorar'= remove totalmente o ponto do relatório/PDF.
    var _apoioState = {};
    var _lastTrip = null;
    var _lastComp = null;

    /** Estado de override de um ponto pela seq. */
    function _ovState(seq) {
      return (seq == null) ? undefined : _apoioState[String(seq)];
    }

    /** Indica se o status do ponto pode ser ajustado manualmente (clicável). */
    function _isAjustavel(ponto, excessoS) {
      if (!ponto) return false;
      if (_ovState(ponto.seq)) return true;        // já ajustado → permite reverter
      if (ponto.proibido42) return true;           // local proibido
      if ((ponto.parada_s || 0) > 0 && !ponto.matched) return true; // parada em local não id.
      if ((excessoS || 0) > 0) return true;        // excesso de tempo
      return false;
    }

    /** Badge de status quando há override manual. */
    function _statusOverrideTag(state) {
      if (state === 'apoio') {
        return '<span class="tag tag-realizado" title="Ponto de apoio (ajustado manualmente) — não conta no relatório"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="13" height="13"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Apoio</span>';
      }
      if (state === 'ignorar') {
        return '<span class="tag tag-nao-visitado" title="Ignorado no relatório (ajustado manualmente)"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="13" height="13"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg> Ignorado</span>';
      }
      return '';
    }

    /**
     * Envolve a célula de STATUS tornando-a clicável quando o ponto é ajustável.
     * Clique alterna: status calculado → Apoio → Ignorar → calculado.
     */
    function _statusCell(seq, ajustavel, innerHtml) {
      if (!ajustavel || seq == null) {
        return '<td>' + innerHtml + '</td>';
      }
      return '<td onclick="AnalysisModule.toggleApoioStatus(' + Number(seq) + ')" ' +
        'style="cursor:pointer;" title="Clique para ajustar: Apoio → Ignorar → normal">' +
        innerHtml + '</td>';
    }

    /** Alterna o status manual de um ponto e re-renderiza. */
    function toggleApoioStatus(seq) {
      var key = String(seq);
      var cur = _apoioState[key];
      var next = cur === undefined ? 'apoio' : cur === 'apoio' ? 'ignorar' : undefined;
      if (next === undefined) delete _apoioState[key];
      else _apoioState[key] = next;

      // Estampa as flags no ponto do enrichedTrip (mesma referência enviada ao relatório)
      if (_lastTrip) {
        for (var i = 0; i < _lastTrip.length; i++) {
          if (Number(_lastTrip[i].seq) === Number(seq)) {
            _lastTrip[i].apoioManual   = (next === 'apoio');
            _lastTrip[i].ignorarManual = (next === 'ignorar');
            break;
          }
        }
      }
      renderPontosTable(_lastTrip, _lastComp);
    }

    /** Mapa seq→estado (para o app aplicar ao relatório, se necessário). */
    function getApoioState() { return _apoioState; }

    // ============================================================
    //  Agrupamento por motorista (cores + cabeçalho de grupo)
    // ============================================================
    var GRUPO_CORES = ['#f47920','#1565c0','#22a96a','#8e24aa','#d94040','#0097a7','#c2185b','#5d4037'];
    var _grupos = [];
    var _lastGrupoIdx = null;

    // Lê os vínculos do AppModule e monta as faixas de seq coloridas, ordenadas.
    // soIdx (opcional): restringe o agrupamento a um único vínculo (modo "Por
    // Motorista"). Sem ele, monta todos os grupos (modo Completo). Restringir
    // evita que o ponto de rendição — extremo compartilhado entre dois
    // motoristas — receba o cabeçalho do motorista anterior.
    function _buildGruposMotorista(soIdx) {
      _grupos = [];
      var vinc = (typeof AppModule !== 'undefined' && AppModule.getVinculos) ? (AppModule.getVinculos() || []) : [];
      vinc.forEach(function(v, i) {
        if (v.seqMin == null || v.seqMax == null) return;
        if (soIdx != null && i !== soIdx) return; // só o motorista ativo
        _grupos.push({
          idx:  i,
          min:  Math.min(v.seqMin, v.seqMax),
          max:  Math.max(v.seqMin, v.seqMax),
          nome: v.nome || v.matricula || ('Motorista ' + (i + 1)),
          mat:  (v.matricula && v.matricula !== '—') ? v.matricula : '',
          ini:  v.ponto_inicio || '',
          fim:  v.ponto_fim || '',
          cor:  GRUPO_CORES[i % GRUPO_CORES.length]
        });
      });
      _grupos.sort(function(a, b) { return a.min - b.min; });
    }

    function _grupoPorSeq(seq) {
      if (seq == null) return null;
      for (var i = 0; i < _grupos.length; i++) {
        if (seq >= _grupos[i].min && seq <= _grupos[i].max) return _grupos[i];
      }
      return null;
    }

    /**
     * Emite o cabeçalho do grupo quando o motorista muda e aplica a borda colorida no tr.
     * Deve ser chamado ANTES de tbody.appendChild(tr). Pontos sem seq (não visitados)
     * não alteram o agrupamento.
     */
    function _grupoDecorate(tbody, tr, seq) {
      if (seq == null) return;
      var g = _grupoPorSeq(seq);
      var key = g ? g.idx : null;
      if (key !== _lastGrupoIdx) {
        _lastGrupoIdx = key;
        if (g) {
          var hr = document.createElement('tr');
          hr.className = 'grupo-header-row';
          var trechoTxt = (g.ini && g.fim) ? (g.ini + ' → ' + g.fim) : '';
          hr.innerHTML = '<td colspan="10" style="padding:7px 12px;background:' + g.cor + '14;border-left:4px solid ' + g.cor + ';">' +
            '<span style="display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:' + g.cor + ';">' +
            '<span style="width:9px;height:9px;border-radius:50%;background:' + g.cor + ';display:inline-block;flex-shrink:0;"></span>' +
            _escHtml(g.nome) + (g.mat ? ' · mat. ' + _escHtml(g.mat) : '') +
            (trechoTxt ? '<span style="color:var(--text3);font-weight:500;margin-left:4px;">' + _escHtml(trechoTxt) + '</span>' : '') +
            '</span></td>';
          tbody.appendChild(hr);
        }
      }
      if (g) tr.style.borderLeft = '4px solid ' + g.cor;
    }

    // ============================================================
    //  renderPontosTable — nova tabela de eventos (colunas: #, Ponto, Status, Parada, Excesso)
    // ============================================================

    /**
     * Renderiza a tabela de eventos (pontos) na nova coluna da direita.
     * @param {Array} enrichedTrip
     * @param {Array} [comparacao]
     * @param {number} [grupoFiltroIdx] índice do vínculo ativo — restringe o
     *   agrupamento a um único motorista (modo "Por Motorista").
     */
    function renderPontosTable(enrichedTrip, comparacao, grupoFiltroIdx) {
      const tbody = document.getElementById('tbodyPontos');
      if (!tbody) return;
      tbody.innerHTML = '';
      _lastTrip = enrichedTrip || null;
      _lastComp = comparacao || null;
      _buildGruposMotorista(grupoFiltroIdx);
      _lastGrupoIdx = null;

      // Mapa código → comparação
      const statusMap = {};
      if (comparacao && comparacao.length) {
        comparacao.forEach(function(c) {
          if (c.id_ponto) statusMap[String(c.id_ponto)] = c;
        });
      }

      // Se temos esquema, usar comparação como base + paradas fora do esquema intercaladas
      if (comparacao && comparacao.length) {
        var extras = _renderMergedRows(tbody, comparacao, enrichedTrip);
        _setText('countPontos', comparacao.length + extras);
      } else {
        _renderEnrichedRows(tbody, enrichedTrip);
        _setText('countPontos', enrichedTrip.length);
      }
    }

    function _renderEnrichedRows(tbody, enrichedTrip) {
      enrichedTrip.forEach(function(ponto, idx) {
        var tr = document.createElement('tr');
        _grupoDecorate(tbody, tr, ponto.seq);

        var paradaS  = ponto.parada_s || 0;
        var esperado = _getTempoEsperado(ponto);
        var excessoS = _calcExcessoS(paradaS, esperado);
        var _ov = _ovState(ponto.seq);

        // Classe da linha baseada em severidade contextual (suprimida quando ajustado)
        if (_ov) {
          if (_ov === 'ignorar') tr.classList.add('row-nao-visitado');
        } else if (!ponto.matched && paradaS > 5 * 60) {
          tr.classList.add('row-critico'); // parada prolongada em local desconhecido
        } else if (excessoS > 30 * 60) {
          tr.classList.add('row-critico');
        } else if (excessoS > 0 || (!ponto.matched && paradaS > 0)) {
          tr.classList.add('row-excesso');
        } else if (!ponto.matched) {
          tr.classList.add('row-nao-visitado');
        }

        var statusTag = _ov ? _statusOverrideTag(_ov) : _getStatusTag(ponto, excessoS);
        var tipoTag   = _buildTipoTag(_ov ? Object.assign({}, ponto, { proibido42: false }) : ponto);

        var paradaHtml = paradaS > 0 ? _fmtDuration(paradaS) : '—';
        var _excEx = _excessoExibido(_ov, excessoS, paradaS);
        var excessoHtml = (_excEx > 0)
          ? '<span style="color:' + (_excEx > 30*60 ? 'var(--vermelho)' : 'var(--amarelo)') + '; font-weight:600;">' + _fmtDuration(_excEx) + '</span>'
          : '<span style="color:var(--text3);">—</span>';

        tr.innerHTML =
          '<td class="seq-cell">' + ponto.seq + '</td>' +
          '<td class="ponto-cell" title="' + _escHtml(ponto.ponto) + '">' + _escHtml(_truncate(ponto.ponto, 32)) + '</td>' +
          '<td>' + tipoTag + '</td>' +
          _statusCell(ponto.seq, _isAjustavel(ponto, excessoS), statusTag) +
          '<td style="white-space:nowrap; font-size:11px; font-family:monospace; color:var(--text2);">' + _fmtDatetime(ponto.entrada) + '</td>' +
          _comercialCells('', ponto.entrada, ponto.saida, idx === 0) +
          '<td style="white-space:nowrap; font-size:11px; font-family:monospace; color:var(--text2);">' + _fmtDatetime(ponto.saida) + '</td>' +
          '<td style="white-space:nowrap; font-size:12px;">' + paradaHtml + '</td>' +
          '<td style="white-space:nowrap; font-size:12px;">' + excessoHtml + '</td>';

        tbody.appendChild(tr);
      });
    }

    function _renderComparacaoRows(tbody, comparacao) {
      comparacao.forEach(function(item, idx) {
        var tr = document.createElement('tr');
        var pr = item.ponto_realizado;
        var seq = pr ? pr.seq : null;
        var _ov = _ovState(seq);
        _grupoDecorate(tbody, tr, seq);

        var paradaS  = pr ? (pr.parada_s || 0) : 0;
        var esperado = pr ? _getTempoEsperado(pr) : TEMPO_ESPERADO_PADRAO;
        var excessoS = _calcExcessoS(paradaS, esperado);

        if (_ov) {
          if (_ov === 'ignorar') tr.classList.add('row-nao-visitado');
        } else if (!item.visitado) {
          tr.classList.add('row-nao-visitado');
        } else if (pr) {
          if (excessoS > 30 * 60) tr.classList.add('row-critico');
          else if (excessoS > 0)  tr.classList.add('row-excesso');
        }

        var statusTag = _ov
          ? _statusOverrideTag(_ov)
          : item.visitado
            ? _getStatusTag(pr, excessoS)
            : '<span class="tag tag-nao-visitado"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="13" height="13"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Não visitado</span>';

        var paradaHtml = paradaS > 0 ? _fmtDuration(paradaS) : '—';
        var _excEx = _excessoExibido(_ov, excessoS, paradaS);
        var excessoHtml = (_excEx > 0)
          ? '<span style="color:' + (_excEx > 30*60 ? 'var(--vermelho)' : 'var(--amarelo)') + '; font-weight:600;">' + _fmtDuration(_excEx) + '</span>'
          : '<span style="color:var(--text3);">—</span>';

        var tipoTag = pr ? _buildTipoTag(_ov ? Object.assign({}, pr, { proibido42: false }) : pr) : '<span class="tag-tipo tag-desconhecido">—</span>';

        tr.innerHTML =
          '<td class="seq-cell">' + (item.ordem || (idx + 1)) + '</td>' +
          '<td class="ponto-cell" title="' + _escHtml(item.nome_ponto) + '">' + _escHtml(_truncate(item.nome_ponto, 32)) + '</td>' +
          '<td>' + tipoTag + '</td>' +
          _statusCell(seq, _isAjustavel(pr, excessoS), statusTag) +
          '<td style="white-space:nowrap; font-size:11px; font-family:monospace; color:var(--text2);">' + (pr ? _fmtDatetime(pr.entrada) : '—') + '</td>' +
          _comercialCells(item.horario_comercial, pr ? pr.entrada : null, pr ? pr.saida : null, idx === 0) +
          '<td style="white-space:nowrap; font-size:11px; font-family:monospace; color:var(--text2);">' + (pr ? _fmtDatetime(pr.saida) : '—') + '</td>' +
          '<td style="white-space:nowrap; font-size:12px;">' + paradaHtml + '</td>' +
          '<td style="white-space:nowrap; font-size:12px;">' + excessoHtml + '</td>';

        tbody.appendChild(tr);
      });
    }

    /**
     * Renderiza comparação do esquema intercalada com paradas fora do esquema.
     * Retorna o número de paradas extras (não esquema) renderizadas.
     */
    function _renderMergedRows(tbody, comparacao, enrichedTrip) {
      // Seq dos pontos já cobertos pelo comparacao (visitados)
      var seqsUsados = new Set();
      comparacao.forEach(function(c) {
        if (c.ponto_realizado && c.ponto_realizado.seq != null) seqsUsados.add(c.ponto_realizado.seq);
      });

      // Codigos do esquema (para excluir pontos que são do esquema mas aparecem no enrichedTrip)
      var codigosEsquema = new Set(comparacao.map(function(c) { return String(c.id_ponto || ''); }));

      // Paradas fora do esquema: matched, com parada > 0, não já cobertas pelo esquema
      var extras = enrichedTrip.filter(function(pt) {
        if (!pt.matched || !pt.parada_s || pt.parada_s <= 0) return false;
        if (seqsUsados.has(pt.seq)) return false;
        if (pt.codigo && codigosEsquema.has(String(pt.codigo))) return false;
        return true;
      });

      if (!extras.length) {
        _renderComparacaoRows(tbody, comparacao);
        return 0;
      }

      // Ordena extras por entrada
      extras.sort(function(a, b) {
        return (a.entrada || '') < (b.entrada || '') ? -1 : 1;
      });

      // Merge: insere cada extra antes do próximo ponto visitado do esquema com entrada > extra.entrada
      var extraIdx = 0;
      comparacao.forEach(function(item, idx) {
        var schemaTime = item.ponto_realizado ? (item.ponto_realizado.entrada || '') : '';
        // Insere extras que ocorreram antes deste ponto do esquema
        while (extraIdx < extras.length) {
          var stopTime = extras[extraIdx].entrada || '';
          if (schemaTime && stopTime && stopTime < schemaTime) {
            _renderNonSchemaStopRow(tbody, extras[extraIdx]);
            extraIdx++;
          } else {
            break;
          }
        }
        _renderSchemaRow(tbody, item, idx === 0);
      });
      // Extras restantes (após o último ponto visitado)
      while (extraIdx < extras.length) {
        _renderNonSchemaStopRow(tbody, extras[extraIdx]);
        extraIdx++;
      }

      return extras.length;
    }

    function _renderSchemaRow(tbody, item, isFirst) {
      var tr = document.createElement('tr');
      var pr = item.ponto_realizado;
      var seq = pr ? pr.seq : null;
      var _ov = _ovState(seq);
      _grupoDecorate(tbody, tr, seq);

      var paradaS  = pr ? (pr.parada_s || 0) : 0;
      var esperado = pr ? _getTempoEsperado(pr) : TEMPO_ESPERADO_PADRAO;
      var excessoS = _calcExcessoS(paradaS, esperado);

      if (_ov) {
        if (_ov === 'ignorar') tr.classList.add('row-nao-visitado');
      } else if (!item.visitado) {
        tr.classList.add('row-nao-visitado');
      } else if (pr) {
        if (excessoS > 30 * 60) tr.classList.add('row-critico');
        else if (excessoS > 0)  tr.classList.add('row-excesso');
      }

      var statusTag = _ov
        ? _statusOverrideTag(_ov)
        : item.visitado
          ? _getStatusTag(pr, excessoS)
          : '<span class="tag tag-nao-visitado"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="13" height="13"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Não visitado</span>';

      var paradaHtml = paradaS > 0 ? _fmtDuration(paradaS) : '—';
      var _excEx = _excessoExibido(_ov, excessoS, paradaS);
      var excessoHtml = (_excEx > 0)
        ? '<span style="color:' + (_excEx > 30*60 ? 'var(--vermelho)' : 'var(--amarelo)') + '; font-weight:600;">' + _fmtDuration(_excEx) + '</span>'
        : '<span style="color:var(--text3);">—</span>';

      var tipoTag = pr ? _buildTipoTag(_ov ? Object.assign({}, pr, { proibido42: false }) : pr) : '<span class="tag-tipo tag-desconhecido">—</span>';

      tr.innerHTML =
        '<td class="seq-cell">' + (item.ordem || '') + '</td>' +
        '<td class="ponto-cell" title="' + _escHtml(item.nome_ponto) + '">' + _escHtml(_truncate(item.nome_ponto, 32)) + '</td>' +
        '<td>' + tipoTag + '</td>' +
        _statusCell(seq, _isAjustavel(pr, excessoS), statusTag) +
        '<td style="white-space:nowrap; font-size:11px; font-family:monospace; color:var(--text2);">' + (pr ? _fmtDatetime(pr.entrada) : '—') + '</td>' +
        _comercialCells(item.horario_comercial, pr ? pr.entrada : null, pr ? pr.saida : null, !!isFirst) +
        '<td style="white-space:nowrap; font-size:11px; font-family:monospace; color:var(--text2);">' + (pr ? _fmtDatetime(pr.saida) : '—') + '</td>' +
        '<td style="white-space:nowrap; font-size:12px;">' + paradaHtml + '</td>' +
        '<td style="white-space:nowrap; font-size:12px;">' + excessoHtml + '</td>';

      tbody.appendChild(tr);
    }

    function _renderNonSchemaStopRow(tbody, ponto) {
      var tr = document.createElement('tr');
      var paradaS  = ponto.parada_s || 0;
      var excessoS = paradaS; // parada inteira é excesso — não deveria existir
      var _ov = _ovState(ponto.seq);
      _grupoDecorate(tbody, tr, ponto.seq);

      tr.style.fontStyle = 'italic';

      // Detecta tipo 42 mesmo quando proibido42 ainda não foi marcado (ex.: "Local Não Autorizado - 42")
      var tipoStr = String(ponto.tipo || '').trim();
      var ehProibido = !_ov && (ponto.proibido42 ||
        /\b42\b/.test(tipoStr) ||
        tipoStr.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').indexOf('nao autorizado') !== -1);

      var tipoTag = _buildTipoTag(Object.assign({}, ponto, { proibido42: ehProibido }));
      var statusTag;
      if (_ov) {
        if (_ov === 'ignorar') tr.classList.add('row-nao-visitado');
        statusTag = _statusOverrideTag(_ov);
      } else if (ehProibido) {
        tr.classList.add('row-critico');
        statusTag = '<span class="tag tag-status-critico" title="Parada de ' + Math.round(paradaS/60) + ' min em local proibido"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="13" height="13"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg> Parada Irregular</span>';
      } else {
        if (paradaS > 15 * 60) tr.classList.add('row-critico');
        else if (paradaS > 0)   tr.classList.add('row-excesso');
        statusTag = _getStatusTag(ponto, excessoS);
      }

      var paradaHtml = paradaS > 0 ? _fmtDuration(paradaS) : '—';
      var _excEx = _excessoExibido(_ov, excessoS, paradaS);
      var excessoHtml = (_excEx > 0)
        ? '<span style="color:' + (_excEx > 30*60 ? 'var(--vermelho)' : 'var(--amarelo)') + '; font-weight:600;">' + _fmtDuration(_excEx) + '</span>'
        : '<span style="color:var(--text3);">—</span>';

      tr.innerHTML =
        '<td class="seq-cell" style="color:var(--text3);">•</td>' +
        '<td class="ponto-cell" title="' + _escHtml(ponto.ponto) + '">' + _escHtml(_truncate(ponto.ponto, 32)) + '</td>' +
        '<td>' + tipoTag + '</td>' +
        _statusCell(ponto.seq, true, statusTag) +
        '<td style="white-space:nowrap; font-size:11px; font-family:monospace; color:var(--text2);">' + _fmtDatetime(ponto.entrada) + '</td>' +
        _comercialCells('', ponto.entrada, ponto.saida, false) +
        '<td style="white-space:nowrap; font-size:11px; font-family:monospace; color:var(--text2);">' + _fmtDatetime(ponto.saida) + '</td>' +
        '<td style="white-space:nowrap; font-size:12px;">' + paradaHtml + '</td>' +
        '<td style="white-space:nowrap; font-size:12px;">' + excessoHtml + '</td>';

      tbody.appendChild(tr);
    }

    // ============================================================
    //  renderComparacao — alias legado
    // ============================================================

    function renderComparacao(comparacao) {
      renderPontosTable([], comparacao);
    }

    // ============================================================
    //  renderVelocidadeTable — inalterada (alimenta tab legado)
    // ============================================================

    function renderVelocidadeTable(segments) {
      const tbody = document.getElementById('tbodyVelocidade');
      if (!tbody) return;
      tbody.innerHTML = '';

      segments.forEach(function(seg) {
        var tr = document.createElement('tr');

        var dist  = seg.distKm  != null ? seg.distKm.toFixed(1)  + ' km' : '—';
        var tempo = seg.tempoMin != null ? _fmtMinutes(seg.tempoMin) : '—';

        var velHtml   = '—';
        var rowClass  = '';

        if (seg.velocidadeKmh != null) {
          var vel      = seg.velocidadeKmh;
          var velClass = 'vel-aceitavel';
          if (vel > 95)      { velClass = 'vel-alta';  rowClass = 'row-vel-alta';  }
          else if (vel < 70) { velClass = 'vel-baixa'; rowClass = 'row-vel-baixa'; }
          velHtml = '<span class="vel-cell ' + velClass + '">' + vel.toFixed(1) + ' km/h</span>';
        } else {
          velHtml = '<span class="vel-nd">—</span>';
        }

        if (rowClass) tr.className = rowClass;

        var alertasHtml = '';
        if (seg.alertas && seg.alertas.length > 0) {
          alertasHtml = seg.alertas.map(function(a) {
            var color = a.nivel === 'critico' ? 'var(--vermelho)' : a.nivel === 'parada' ? 'var(--azul)' : 'var(--amarelo)';
            return '<span style="font-size:10px; color:' + color + ';" title="' + _escHtml(a.descricao) + '">•</span>';
          }).join(' ');
        }

        tr.innerHTML =
          '<td class="seq-cell">' + seg.seq + '</td>' +
          '<td class="ponto-cell" title="' + _escHtml(seg.de) + '">' + _escHtml(_truncate(seg.de, 28)) + '</td>' +
          '<td class="ponto-cell" title="' + _escHtml(seg.para) + '">' + _escHtml(_truncate(seg.para, 28)) + '</td>' +
          '<td style="text-align:right; white-space:nowrap; font-family:monospace;">' + dist + '</td>' +
          '<td style="text-align:right; white-space:nowrap;">' + tempo + '</td>' +
          '<td style="text-align:right;">' + velHtml + '</td>' +
          '<td style="text-align:center;">' + (alertasHtml || '<span style="color:var(--text3)">—</span>') + '</td>';

        tbody.appendChild(tr);
      });

      _setText('countTrechos', segments.length);
    }

    // ============================================================
    //  renderVelocidadeChart — gráfico de barras da velocidade por trecho
    // ============================================================

    function _velColor(v) {
      if (v < 70)  return 'var(--amarelo)';   // abaixo do ideal
      if (v <= 90) return 'var(--verde)';      // faixa aceitável (ideal 80–90)
      if (v <= 100) return 'var(--laranja)';   // excesso
      return 'var(--vermelho)';                // crítico
    }

    function _velLegItem(colorVar, texto, isBand) {
      return '<span class="vcl-item">'
        + (isBand ? '<span class="vcl-band"></span>' : '<span class="vcl-dot" style="background:' + colorVar + ';"></span>')
        + _escHtml(texto) + '</span>';
    }

    function _escAttr(str) {
      return _escHtml(str).replace(/"/g, '&quot;');
    }

    function renderVelocidadeChart(segments) {
      var wrap = document.getElementById('velChartWrap');
      var section = document.getElementById('sectionVelChart');
      if (!wrap) return;

      var chartable = (segments || []).filter(function(s) { return s.velocidadeKmh != null; });
      _setText('countVelChart', chartable.length);

      if (section) section.style.display = chartable.length > 0 ? 'block' : 'none';
      if (chartable.length === 0) {
        wrap.innerHTML = '';
        if (typeof SectionGuide !== 'undefined') SectionGuide.refresh();
        return;
      }

      var legend = document.getElementById('velChartLegend');
      if (legend) {
        legend.innerHTML =
          _velLegItem('var(--amarelo)', 'Abaixo do ideal (< 70)')
          + _velLegItem('var(--verde)', 'Aceitável (70–90)')
          + _velLegItem('var(--laranja)', 'Excesso (90–100)')
          + _velLegItem('var(--vermelho)', 'Crítico (> 100)')
          + _velLegItem('', 'Faixa ideal (80–90)', true);
      }

      var IDEAL_MIN = 80, IDEAL_MAX = 90;
      var maxVel = chartable.reduce(function(m, s) { return Math.max(m, s.velocidadeKmh); }, 0);
      var maxY = Math.max(100, Math.ceil(maxVel / 20) * 20);

      var barW = 28, gap = 12, leftPad = 40, rightPad = 14, topPad = 16, bottomPad = 74;
      var plotH = 200;
      var H = topPad + plotH + bottomPad;
      var innerW = chartable.length * barW + (chartable.length - 1) * gap;
      var W = leftPad + innerW + rightPad;

      function y(v) { return topPad + plotH * (1 - v / maxY); }

      var svg = '<svg class="vel-chart-svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg">';

      // Faixa ideal destacada
      svg += '<rect x="' + leftPad + '" y="' + y(IDEAL_MAX) + '" width="' + innerW
        + '" height="' + (y(IDEAL_MIN) - y(IDEAL_MAX)) + '" fill="rgba(34,169,106,0.10)"/>';

      // Linhas de grade + rótulos do eixo Y
      for (var g = 0; g <= maxY; g += 20) {
        var gy = y(g);
        svg += '<line x1="' + leftPad + '" y1="' + gy + '" x2="' + (leftPad + innerW) + '" y2="' + gy
          + '" stroke="var(--border)" stroke-width="1"/>';
        svg += '<text x="' + (leftPad - 8) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="10" fill="var(--text3)">' + g + '</text>';
      }

      // Barras
      chartable.forEach(function(s, i) {
        var v = s.velocidadeKmh;
        var bx = leftPad + i * (barW + gap);
        var by = y(v);
        var bh = Math.max(0, (topPad + plotH) - by);
        var lx = bx + barW / 2, ly = topPad + plotH + 13;
        var label = _truncate(s.para || '', 13);

        svg += '<g class="vel-bar"'
          + ' data-de="' + _escAttr(s.de || '') + '"'
          + ' data-para="' + _escAttr(s.para || '') + '"'
          + ' data-vel="' + v.toFixed(1) + '"'
          + ' data-dist="' + (s.distKm != null ? s.distKm.toFixed(1) : '—') + '"'
          + ' data-tempo="' + (s.tempoMin != null ? Math.round(s.tempoMin) : '—') + '">';
        svg += '<rect x="' + bx + '" y="' + by + '" width="' + barW + '" height="' + bh + '" rx="3" fill="' + _velColor(v) + '"/>';
        svg += '<text x="' + lx + '" y="' + (by - 5) + '" text-anchor="middle" font-size="9.5" fill="var(--text2)">' + Math.round(v) + '</text>';
        svg += '<text x="' + lx + '" y="' + ly + '" text-anchor="end" font-size="9.5" fill="var(--text3)" transform="rotate(-40 ' + lx + ' ' + ly + ')">' + _escHtml(label) + '</text>';
        svg += '</g>';
      });

      svg += '</svg>';
      wrap.innerHTML = svg;

      _bindVelChartTooltip(wrap);
      if (typeof SectionGuide !== 'undefined') SectionGuide.refresh();
    }

    function _bindVelChartTooltip(wrap) {
      var tip = wrap.querySelector('.vel-chart-tip');
      if (!tip) {
        tip = document.createElement('div');
        tip.className = 'vel-chart-tip';
        tip.style.display = 'none';
        wrap.appendChild(tip);
      }
      wrap.onmousemove = function(e) {
        var g = e.target && e.target.closest ? e.target.closest('.vel-bar') : null;
        if (!g) { tip.style.display = 'none'; return; }
        tip.innerHTML =
          '<div class="vct-t">' + _escHtml(g.getAttribute('data-de')) + ' → ' + _escHtml(g.getAttribute('data-para')) + '</div>'
          + '<div class="vct-v">🚍 ' + g.getAttribute('data-vel') + ' km/h</div>'
          + '<div class="vct-m">📏 ' + g.getAttribute('data-dist') + ' km · ⏱ ' + g.getAttribute('data-tempo') + ' min</div>';
        tip.style.display = 'block';
        var r = wrap.getBoundingClientRect();
        var x = e.clientX - r.left + wrap.scrollLeft;
        var yy = e.clientY - r.top;
        var left = Math.min(x + 12, wrap.scrollLeft + wrap.clientWidth - tip.offsetWidth - 8);
        tip.style.left = Math.max(wrap.scrollLeft + 4, left) + 'px';
        tip.style.top = Math.max(6, yy - tip.offsetHeight - 10) + 'px';
      };
      wrap.onmouseleave = function() { tip.style.display = 'none'; };
    }

    // ============================================================
    //  renderAlertas — cards no novo layout + grid legado
    // ============================================================

    // Metadados de severidade (emoji + rótulo) para o pill do card.
    var _SEV_META = {
      critico:     { emoji: '🔴', label: 'Crítico' },
      atencao:     { emoji: '🟠', label: 'Atenção' },
      revisar:     { emoji: '🟡', label: 'Revisar' },
      justificado: { emoji: '🟢', label: 'Justificado' }
    };
    var _TIPO_LABEL = {
      VELOCIDADE_EXCESSIVA:   'Excesso Crítico de Velocidade',
      VELOCIDADE_ALTA:        'Excesso de Velocidade',
      VELOCIDADE_BAIXA:       'Velocidade Abaixo do Ideal',
      PARADA_PROIBIDA:        'Parada em Local Proibido',
      PARADA_LONGA:           'Parada Prolongada',
      LOCAL_NAO_IDENTIFICADO: 'Local Não Identificado',
      PONTO_NAO_VISITADO:     'Ponto Não Visitado'
    };

    function _sevFromTipo(tipo) {
      if (tipo === 'VELOCIDADE_EXCESSIVA' || tipo === 'PARADA_PROIBIDA') return 'critico';
      if (tipo === 'LOCAL_NAO_IDENTIFICADO' || tipo === 'PONTO_NAO_VISITADO') return 'revisar';
      return 'atencao';
    }

    // Agrupa os alertas pendentes por categoria (para as subseções).
    var _GRUPO_ORDEM = ['velocidade', 'parada_irregular', 'parada_longa', 'nao_visitado', 'nao_id', 'outros'];
    function _grupoAlerta(tipo) {
      if (String(tipo).indexOf('VELOCIDADE') === 0) return { key: 'velocidade',       label: 'Velocidade' };
      if (tipo === 'PARADA_PROIBIDA')               return { key: 'parada_irregular', label: 'Paradas Irregulares' };
      if (tipo === 'PARADA_LONGA')                  return { key: 'parada_longa',     label: 'Paradas Prolongadas' };
      if (tipo === 'PONTO_NAO_VISITADO')            return { key: 'nao_visitado',     label: 'Pontos Não Visitados' };
      if (tipo === 'LOCAL_NAO_IDENTIFICADO')        return { key: 'nao_id',           label: 'Locais Não Identificados' };
      return { key: 'outros', label: 'Outros' };
    }

    var _PIN_SVG = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="13" height="13"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';

    function _chip(ico, val, label, hl) {
      return '<span class="op-chip' + (hl ? ' hl' : '') + '">'
        + ico + ' '
        + (label ? '<span style="color:var(--text3);">' + label + '</span> ' : '')
        + '<strong>' + _escHtml(val) + '</strong></span>';
    }

    // ============================================================
    //  renderAlertas — cards modernos + severidade + justificativa
    //  justState = { hash, justificativas: { alertKey: {categoria,motivo,observacao,status} } }
    // ============================================================

    function renderAlertas(alerts, justState) {
      var container = document.getElementById('alertasGrid');
      if (!container) return;
      container.innerHTML = '';

      justState = justState || {};
      var manualMap = justState.justificativas || {};

      var operacionais = (alerts || []).filter(function(a) {
        return _TIPO_LABEL.hasOwnProperty(a.tipo);
      });

      var sectionAlertas = document.getElementById('sectionAlertas');
      if (sectionAlertas) {
        sectionAlertas.style.display = operacionais.length > 0 ? 'block' : 'none';
      }

      // Resolve o status de cada alerta: auto-justificado, override "reaberto",
      // justificativa manual, ou pendente.
      var pendentes = [], justificados = [];
      operacionais.forEach(function(a) {
        var manual   = manualMap[a.alertKey];
        var reaberto = manual && manual.status === 'reaberto';
        var justObj = null, isJust = false;

        if (manual && !reaberto) {
          justObj = { categoria: manual.categoria, motivo: manual.motivo, observacao: manual.observacao, auto: false };
          isJust = true;
        } else if (a.autoJustificado && !reaberto) {
          justObj = a.justificativa || { categoria: '—', auto: true };
          justObj.auto = true;
          isJust = true;
        }

        var sev = isJust ? 'justificado' : (a.severidade || _sevFromTipo(a.tipo));
        var entry = { a: a, sev: sev, justObj: justObj };
        if (isJust) justificados.push(entry); else pendentes.push(entry);
      });

      var ordemSev = { critico: 0, atencao: 1, revisar: 2 };
      pendentes.sort(function(x, y) {
        var px = ordemSev[x.sev] == null ? 9 : ordemSev[x.sev];
        var py = ordemSev[y.sev] == null ? 9 : ordemSev[y.sev];
        return px - py;
      });

      // Contadores: badge = pendências; nota verde = justificados.
      _setText('countAlertas', pendentes.length);
      var jb = document.getElementById('countAlertasJustificados');
      if (jb) {
        if (justificados.length) {
          jb.textContent = justificados.length + ' justificado' + (justificados.length > 1 ? 's' : '');
          jb.style.display = '';
        } else {
          jb.style.display = 'none';
        }
      }

      if (operacionais.length === 0) {
        container.innerHTML = '<div class="op-empty"><span class="op-empty-ico">✅</span>Nenhum alerta operacional identificado nesta viagem.</div>';
        return;
      }

      if (pendentes.length > 0) {
        // Agrupa por categoria (Velocidade, Paradas Irregulares, etc.)
        var grupos = {};
        pendentes.forEach(function(e) {
          var g = _grupoAlerta(e.a.tipo);
          if (!grupos[g.key]) grupos[g.key] = { label: g.label, items: [] };
          grupos[g.key].items.push(e);
        });

        _GRUPO_ORDEM.forEach(function(gkey) {
          var grp = grupos[gkey];
          if (!grp) return;

          var head = document.createElement('div');
          head.className = 'op-subgroup';
          head.setAttribute('data-guide-anchor', '');
          head.setAttribute('data-guide-label', grp.label + ' (' + grp.items.length + ')');
          head.innerHTML =
            '<span>' + grp.label + '</span>'
            + '<span class="op-subgroup-count">' + grp.items.length + '</span>'
            + '<span class="op-subgroup-line"></span>';
          container.appendChild(head);

          grp.items.forEach(function(e) {
            container.appendChild(_buildAlertCard(e.a, e.sev, e.justObj));
          });
        });
      } else {
        var clear = document.createElement('div');
        clear.className = 'op-empty';
        clear.innerHTML = '<span class="op-empty-ico">✅</span>Nenhuma pendência — todos os alertas foram justificados.';
        container.appendChild(clear);
      }

      if (justificados.length) {
        var divider = document.createElement('div');
        divider.className = 'op-group-divider collapsed';
        divider.setAttribute('data-guide-anchor', '');
        divider.setAttribute('data-guide-label', 'Justificados (' + justificados.length + ')');
        divider.innerHTML =
          '<svg class="op-group-caret" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="12" height="12"><polyline points="6 9 12 15 18 9"/></svg>'
          + '<span>Justificados</span>'
          + '<span class="op-group-count">' + justificados.length + '</span>'
          + '<span class="op-group-line"></span>';

        var body = document.createElement('div');
        body.className = 'op-group-body collapsed';
        justificados.forEach(function(e) {
          body.appendChild(_buildAlertCard(e.a, 'justificado', e.justObj));
        });

        divider.addEventListener('click', function() {
          divider.classList.toggle('collapsed');
          body.classList.toggle('collapsed');
        });

        container.appendChild(divider);
        container.appendChild(body);
      }

      // Atualiza o guia lateral (subseções Pendentes/Justificados mudaram)
      if (typeof SectionGuide !== 'undefined') SectionGuide.refresh();
    }

    function _buildAlertCard(a, sev, justObj) {
      var meta = _SEV_META[sev] || { emoji: '⚪', label: 'Info' };
      var titulo = _TIPO_LABEL[a.tipo] || a.tipo;
      var isVel = a.velocidadeKmh != null && a.distKm != null;

      var card = document.createElement('div');
      card.className = 'op-alert-card sev-' + sev;
      card.dataset.alertKey    = a.alertKey || '';
      card.dataset.alertTipo   = a.tipo || '';
      card.dataset.alertTitle  = titulo;
      card.dataset.alertTrecho = a.trecho || '';

      var html = ''
        + '<div class="op-alert-head">'
        +   '<div class="op-alert-head-left">'
        +     '<span class="op-sev-pill">' + meta.emoji + ' ' + meta.label + '</span>'
        +     '<span class="op-alert-title">' + _escHtml(titulo) + '</span>'
        +   '</div>'
        + '</div>';

      if (a.trecho) {
        html += '<div class="op-alert-trecho">' + _PIN_SVG + '<span>' + _escHtml(a.trecho) + '</span></div>';
      }

      var chips = [];
      if (a.distKm != null)        chips.push(_chip('📏', a.distKm.toFixed(1) + ' km'));
      if (a.tempoMin != null)      chips.push(_chip('⏱', _fmtHHMM(a.tempoMin), 'HH:mm'));
      if (a.velocidadeKmh != null) chips.push(_chip('🚍', a.velocidadeKmh + ' km/h', 'média'));
      if (isVel)                   chips.push(_chip('🎯', (a.velEsperadaMin || 80) + '–' + (a.velEsperadaMax || 90) + ' km/h', 'esperada', true));
      if (a.contextoLabel)         chips.push(_chip('🛣️', a.contextoLabel));
      if (chips.length) html += '<div class="op-chips">' + chips.join('') + '</div>';

      if (a.diagnostico) {
        html += '<div class="op-diag"><span class="op-diag-ico">🧠</span>'
          + '<div><strong>Diagnóstico:</strong> ' + _escHtml(a.diagnostico) + '</div></div>';
      }

      if (justObj) {
        html += '<div class="op-just">'
          + '<div class="op-just-head">📝 Justificativa'
          + (justObj.auto ? ' <span class="op-just-auto">(automática)</span>' : '')
          + '</div>'
          + '<span class="op-just-cat">' + _escHtml(justObj.categoria || '—') + '</span>'
          + (justObj.motivo ? ' ' + _escHtml(justObj.motivo) : '')
          + (justObj.observacao ? '<div style="margin-top:5px;">' + _escHtml(justObj.observacao) + '</div>' : '')
          + '</div>';
      }

      var actions = [];
      if (sev !== 'justificado') {
        actions.push('<button type="button" class="op-btn-sm primary" onclick="AppModule.abrirModalJustificar(this)">📝 Justificar</button>');
        if (a.tipo === 'PARADA_PROIBIDA' && a.seq != null) {
          actions.push('<button type="button" class="op-btn-sm danger" onclick="AppModule.criarParadaIrregularInline(this,' + Number(a.seq) + ')">+ Criar ocorrência</button>');
        } else if (a.tipo === 'PARADA_LONGA' && a.seq != null) {
          actions.push('<button type="button" class="op-btn-sm" onclick="AppModule.criarExcessoPermanenciaInline(this,' + Number(a.seq) + ')">+ Criar ocorrência</button>');
        }
      } else {
        var autoFlag = (justObj && justObj.auto) ? '1' : '';
        actions.push('<button type="button" class="op-btn-sm" data-auto="' + autoFlag + '" onclick="AppModule.reabrirAlerta(this)">↩ Reabrir</button>');
      }
      if (actions.length) html += '<div class="op-alert-actions">' + actions.join('') + '</div>';

      card.innerHTML = html;
      return card;
    }

    // ============================================================
    //  renderSummary — preenche cards de resumo + badges
    // ============================================================

    function renderSummary(summary) {
      // Cards da seção resumo
      _setText('sumKm',      summary.totalKm != null ? summary.totalKm + ' km' : '—');
      _setText('sumTempo',   summary.tempoTotalMin > 0 ? _fmtMinutes(summary.tempoTotalMin) : '—');

      // Planejados = total de pontos (até esquema sobrescrever)
      _setText('sumPlanejados', summary.totalPontos || '—');

      // Realizados = pontos matched (sobrescrito depois pela comparação)
      _setText('sumRealizados', '—');
      _setText('sumNaoVisitados', '—');

      // Maior parada: duração como valor, nome do ponto como label secundária
      var mp = summary.maiorParada;
      if (mp) {
        _setText('sumMaiorParadaDur', mp.duracaoStr);
        _setText('sumMaiorParadaLabel', mp.ponto);
        var card = document.getElementById('sumMaiorParadaCard');
        if (card) card.title = 'Local com maior tempo de permanência: ' + mp.ponto + ' — ' + mp.duracaoStr;
      } else {
        _setText('sumMaiorParadaDur', '—');
        _setText('sumMaiorParadaLabel', 'Maior Parada');
      }

      // Badges no header
      _showBadge('badgeVeiculo', true);
      _setText('badgeVeiculoNum', summary.veiculo || '—');

      if (summary.totalAlertas > 0) {
        _showBadge('badgeAlertas', true);
        _setText('badgeAlertasNum', summary.totalAlertas);
      } else {
        _showBadge('badgeAlertas', false);
      }

      _showBadge('badgeStatus', true);

      // Motorista na coluna de configuração
      var driverName = document.getElementById('driverName');
      if (driverName) {
        driverName.textContent = summary.motorista || 'Não Informado';
        driverName.className = 'driver-name' +
          (!summary.motorista || summary.motorista === 'Não Informado' ? ' uninformed' : '');
      }

      // Footer período
      var footerPeriodo = document.getElementById('footerPeriodo');
      if (footerPeriodo && summary.dataViagem) {
        footerPeriodo.textContent = 'Viagem: ' + summary.dataViagem +
          (summary.dataFim && summary.dataFim !== summary.dataViagem ? ' – ' + summary.dataFim : '');
      }

      // Mostrar seção resumo
      var secResumo = document.getElementById('sectionResumo');
      if (secResumo) secResumo.style.display = 'block';

      // Mostrar seções exclusivas de mapa e eventos
      var secMapa = document.getElementById('sectionMapa');
      if (secMapa) secMapa.style.display = 'block';

      var secEventos = document.getElementById('sectionEventos');
      if (secEventos) secEventos.style.display = 'block';
    }

    // ============================================================
    //  Atualiza contadores de comparação (chamado por _calcularComparacao)
    // ============================================================

    function atualizarContadoresComparacao(comparacao) {
      if (!comparacao) return;
      var realizados   = comparacao.filter(function(c) { return c.visitado; }).length;
      var naoVisitados = comparacao.length - realizados;

      var elRealizados = document.getElementById('sumRealizados');
      if (elRealizados) {
        elRealizados.textContent = realizados;
        elRealizados.className = 'sum-value verde';
      }

      var elNao = document.getElementById('sumNaoVisitados');
      if (elNao) {
        elNao.textContent = naoVisitados;
        elNao.className = 'sum-value' + (naoVisitados > 0 ? ' vermelho' : '');
      }

      _setText('sumPlanejados', comparacao.length);
    }

    // ============================================================
    //  resetUI
    // ============================================================

    function resetUI() {
      // Limpa ajustes manuais de status
      _apoioState = {};
      _lastTrip = null;
      _lastComp = null;

      // Limpa tabela de eventos
      var tbodyPontos = document.getElementById('tbodyPontos');
      if (tbodyPontos) tbodyPontos.innerHTML = '';

      var tbodyVel = document.getElementById('tbodyVelocidade');
      if (tbodyVel) tbodyVel.innerHTML = '';

      // Limpa o gráfico de velocidade por trecho (senão a barra da análise
      // anterior fica visível até a próxima viagem ser processada)
      var velChartWrap = document.getElementById('velChartWrap');
      if (velChartWrap) velChartWrap.innerHTML = '';
      var velChartLegend = document.getElementById('velChartLegend');
      if (velChartLegend) velChartLegend.innerHTML = '';
      _setText('countVelChart', '0');

      var alertasGrid = document.getElementById('alertasGrid');
      if (alertasGrid) alertasGrid.innerHTML = '';

      // Oculta seções
      ['sectionResumo', 'sectionMapa', 'sectionEventos', 'sectionAlertas', 'sectionVelChart'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });

      // Badges
      ['badgeVeiculo', 'badgeAlertas', 'badgeStatus'].forEach(function(id) {
        _showBadge(id, false);
      });

      // Contadores
      ['countPontos', 'countTrechos', 'countAlertas'].forEach(function(id) {
        _setText(id, '0');
      });

      // Cards de resumo
      ['sumKm', 'sumTempo', 'sumMaiorParadaDur', 'sumPlanejados', 'sumRealizados', 'sumNaoVisitados'].forEach(function(id) {
        _setText(id, '—');
      });
      _setText('sumMaiorParadaLabel', 'Maior Parada');

      // Resets de classe dos cards
      ['sumRealizados', 'sumNaoVisitados', 'sumMaiorParadaDur'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.className = 'sum-value';
      });
      var elReal = document.getElementById('sumRealizados');
      if (elReal) elReal.classList.add('verde');

      // Mapa
      var mapEl = document.getElementById('map');
      var mapPH = document.getElementById('mapPlaceholder');
      if (mapEl) mapEl.style.display = 'none';
      if (mapPH) mapPH.style.display = 'flex';

      // Footer período
      var fp = document.getElementById('footerPeriodo');
      if (fp) fp.textContent = '';

      // Motorista
      var driverName = document.getElementById('driverName');
      if (driverName) {
        driverName.textContent = 'Não Informado';
        driverName.className = 'driver-name uninformed';
      }
    }

    // ============================================================
    //  Helpers privados
    // ============================================================

    /**
     * Retorna a tag de status contextual baseada em tempo + identificação do ponto.
     * Mais informativa que o simples "OK" / "Não id."
     */
    function _getStatusTag(ponto, excessoS) {
      var paradaS = ponto ? (ponto.parada_s || 0) : 0;
      excessoS = excessoS || 0;

      // Local proibido (tipo 42) — crítico imediato
      if (ponto && ponto.proibido42) {
        return '<span class="tag tag-status-critico" title="Parada em local proibido — ' + Math.round(paradaS/60) + ' min"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="13" height="13"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg> Local Proibido</span>';
      }

      // Ponto não identificado na base de locais
      if (!ponto || !ponto.matched) {
        if (paradaS === 0) {
          // Apenas passou sem parar — irrelevante, mas registrado
          return '<span class="tag tag-nao-visitado" title="Local não cadastrado">Não id.</span>';
        }
        if (paradaS <= 3 * 60) {
          // Parada muito curta (sinal, tráfego) — informativo
          return '<span class="tag tag-status-transito" title="Parada breve (' + Math.round(paradaS/60) + ' min) em local não identificado">Parada breve</span>';
        }
        if (paradaS <= 15 * 60) {
          // Parada relevante fora de ponto conhecido
          return '<span class="tag tag-status-excesso" title="' + Math.round(paradaS/60) + ' min em local não identificado">Parada não aut.</span>';
        }
        // Parada longa em local desconhecido — crítico
        return '<span class="tag tag-status-critico" title="' + Math.round(paradaS/60) + ' min em local não identificado — atenção">Parada não aut.</span>';
      }

      // Ponto identificado — analisa tempo de parada
      if (paradaS === 0) {
        // Passou sem parar (sem tempo de parada registrado)
        return '<span class="tag tag-status-transito" title="Ponto visitado sem parada registrada">Em trânsito</span>';
      }
      if (excessoS <= 0) {
        return '<span class="tag tag-realizado" title="Parada dentro do tempo esperado"><svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="13" height="13"><polyline points="20 6 9 17 4 12"/></svg> OK</span>';
      }
      if (excessoS <= 10 * 60) {
        // Excesso leve — até 10 min
        return '<span class="tag tag-status-leve" title="Excesso de ' + Math.round(excessoS/60) + ' min">Excesso leve</span>';
      }
      if (excessoS <= 30 * 60) {
        // Parada prolongada — entre 10 e 30 min de excesso
        return '<span class="tag tag-status-excesso" title="Excesso de ' + Math.round(excessoS/60) + ' min">Prolongada</span>';
      }
      // Excesso crítico — mais de 30 min
      return '<span class="tag tag-status-critico" title="Excesso crítico de ' + Math.round(excessoS/60) + ' min">Crítico</span>';
    }

    // Tempo de parada esperado (segundos). Fonte única: aba TEMPO_PERMANENCIA
    // (por código), calculada no servidor e entregue em ponto.tempoEsperadoMin.
    // Quem não está na aba usa o fallback de 30min (TEMPO_ESPERADO_PADRAO).
    function _getTempoEsperado(ponto) {
      if (!ponto) return TEMPO_ESPERADO_PADRAO;
      if (ponto.proibido42) return 0; // qualquer parada em local proibido = excesso total
      if (ponto.tempoEsperadoMin != null) return ponto.tempoEsperadoMin * 60;
      return TEMPO_ESPERADO_PADRAO;
    }

    /**
     * Excesso de parada exibido (segundos). A TOLERÂNCIA só decide SE marca
     * excesso (evita ruído em atrasos pequenos); o valor mostrado é o excesso
     * REAL sobre o esperado (parada − esperado), sem descontar a tolerância.
     * Ex.: esperado 15min, parada 23min → excesso 8min (não 3min).
     */
    function _calcExcessoS(paradaS, esperado) {
      var overage = Math.max(0, (paradaS || 0) - (esperado || 0));
      return overage > TOLERANCIA_S ? overage : 0;
    }

    /**
     * Excesso a EXIBIR considerando o ajuste manual do ponto:
     * - 'ignorar' → sem excesso (removido do relatório);
     * - 'apoio'   → parada legítima, MAS com teto de 30min; acima disso o
     *               excesso (parada − 30min) ainda é registrado;
     * - normal    → excesso calculado por _calcExcessoS.
     */
    function _excessoExibido(ov, excessoS, paradaS) {
      if (ov === 'ignorar') return 0;
      if (ov === 'apoio') return Math.max(0, (paradaS || 0) - APOIO_LIMITE_S);
      return excessoS;
    }

     function _buildTipoTag(ponto) {
       var seq = ponto.seq != null ? Number(ponto.seq) : -1;

       if (ponto.proibido42) {
         if (seq >= 0) {
           return '<span class="tag-tipo tag-ocorrencia-hover" style="background:#d00000;color:#fff;border-color:#d00000;" onclick="AppModule.criarParadaIrregularInline(this,' + seq + ')" title="Clique para gerar ocorrência">' +
                  '<span class="tag-txt-normal">&#x26D4; Proibido</span>' +
                  '<span class="tag-txt-hover">Gerar Ocorrência</span>' +
                  '</span>';
         }
         return '<span class="tag-tipo" style="background:#d00000;color:#fff;">&#x26D4; Proibido</span>';
       }
       if (!ponto.matched) return '<span class="tag-tipo tag-desconhecido">Não id.</span>';
       if (ponto.garagem)    return '<span class="tag-tipo tag-garagem">Garagem</span>';
       if (ponto.rodoviaria) return '<span class="tag-tipo tag-rodoviaria">Rodoviária</span>';
       if (ponto.pedagio)    return '<span class="tag-tipo tag-rodoviaria">Pedágio</span>';
       var tipo = (ponto.tipo || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
       if (tipo.indexOf('controle') !== -1) return '<span class="tag-tipo tag-controle">Controle</span>';
       if (tipo.indexOf('auxiliar') !== -1) return '<span class="tag-tipo tag-auxiliar">Auxiliar</span>';
       if (tipo.indexOf('nao autorizado') !== -1) {
         if (seq >= 0) {
           return '<span class="tag-tipo tag-nao-aut tag-ocorrencia-hover" onclick="AppModule.criarParadaIrregularInline(this,' + seq + ')" title="Clique para gerar ocorrência">' +
                  '<span class="tag-txt-normal">Não Aut.</span>' +
                  '<span class="tag-txt-hover">Gerar Ocorrência</span>' +
                  '</span>';
         }
         return '<span class="tag-tipo tag-nao-aut">Não Aut.</span>';
       }
       return '<span class="tag-tipo tag-desconhecido">' + _escHtml(ponto.tipo || '—') + '</span>';
     }

    function _fmtDatetime(dtStr) {
      if (!dtStr || dtStr.trim() === '') return '—';
      var clean = dtStr.trim().replace('T', ' ').split(' ');
      if (clean.length < 2) return dtStr;
      var d = clean[0].split('-');
      var t = clean[1].split(':');
      if (d.length < 3 || t.length < 2) return dtStr;
      return d[2] + '/' + d[1] + ' ' + t[0] + ':' + t[1];
    }

    function _fmtDuration(seconds) {
      if (!seconds || seconds <= 0) return '—';
      var h = Math.floor(seconds / 3600);
      var m = Math.floor((seconds % 3600) / 60);
      var s = seconds % 60;
      if (h > 0 && m > 0) return h + 'h ' + m + 'min';
      if (h > 0) return h + 'h';
      if (m > 0 && s > 0) return m + 'min ' + s + 's';
      if (m > 0) return m + 'min';
      return s + 's';
    }

    function _fmtMinutes(minutes) {
      if (!minutes) return '—';
      var h = Math.floor(minutes / 60);
      var m = Math.round(minutes % 60);
      if (h > 0 && m > 0) return h + 'h ' + m + 'min';
      if (h > 0) return h + 'h';
      return m + 'min';
    }

    // Formata minutos como "HH:mm" (ex.: 227 → "03:47").
    function _fmtHHMM(minutes) {
      if (minutes == null) return '—';
      var total = Math.round(minutes);
      var h = Math.floor(total / 60);
      var m = total % 60;
      return (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
    }

    // Extrai "HH:MM" de um timestamp ("YYYY-MM-DD HH:MM:SS" ou "HH:MM").
    function _extractHHMM(ts) {
      if (!ts) return null;
      var m = String(ts).match(/(\d{1,2}):(\d{2})/);
      return m ? (('0' + m[1]).slice(-2) + ':' + m[2]) : null;
    }

    // Diferença assinada (min) entre real e comercial. + = atraso; trata virada de meia-noite.
    function _diffMin(realHHMM, schedHHMM) {
      if (!realHHMM || !schedHHMM) return null;
      var r = String(realHHMM).match(/(\d{1,2}):(\d{2})/);
      var s = String(schedHHMM).match(/(\d{1,2}):(\d{2})/);
      if (!r || !s) return null;
      var rMin = parseInt(r[1], 10) * 60 + parseInt(r[2], 10);
      var sMin = parseInt(s[1], 10) * 60 + parseInt(s[2], 10);
      var d = ((rMin - sMin) % 1440 + 1440) % 1440;
      if (d > 720) d -= 1440;
      return d;
    }

    // Formata diferença assinada: "+33min" / "+1h47" / "no horário".
    function _fmtDiff(min) {
      if (min == null) return '—';
      var abs = Math.abs(Math.round(min));
      if (abs === 0) return 'no horário';
      var sign = min > 0 ? '+' : '−';
      if (abs < 60) return sign + abs + 'min';
      var hh = Math.floor(abs / 60);
      var mm = abs % 60;
      return sign + hh + 'h' + (mm > 0 ? ('0' + mm).slice(-2) : '');
    }

    // Monta as duas células <td> (Comercial + Dif.).
    // No 1º ponto (origem) a comparação é com a SAÍDA (partida); nos demais, com a entrada (chegada).
    function _comercialCells(comercial, entradaReal, saidaReal, usarSaida) {
      var com = comercial ? String(comercial).trim() : '';
      var real = _extractHHMM(usarSaida ? saidaReal : entradaReal);
      var dif = (com && real) ? _diffMin(real, com) : null;
      var comCel = com
        ? '<span style="color:#1565c0; font-family:monospace; font-size:11px;">' + _escHtml(com) + '</span>'
        : '<span style="color:var(--text3);">—</span>';
      var cor = dif == null ? 'var(--text3)' : dif > 0 ? 'var(--vermelho)' : dif < 0 ? 'var(--verde)' : 'var(--text2)';
      var difCel = '<span style="color:' + cor + '; font-weight:' + (dif ? '600' : '400') + '; font-size:11px;">' + _fmtDiff(dif) + '</span>';
      return '<td style="white-space:nowrap;">' + comCel + '</td>' +
             '<td style="white-space:nowrap;">' + difCel + '</td>';
    }

    function _setText(id, val) {
      var el = document.getElementById(id);
      if (el) el.textContent = String(val);
    }

    function _showBadge(id, show) {
      var el = document.getElementById(id);
      if (el) el.style.display = show ? 'inline-flex' : 'none';
    }

    function _escHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function _truncate(str, maxLen) {
      if (!str) return '';
      return str.length > maxLen ? str.substring(0, maxLen) + '…' : str;
    }

    return {
      renderPontosTable,
      renderComparacao,
      renderVelocidadeTable,
      renderVelocidadeChart,
      renderAlertas,
      renderSummary,
      atualizarContadoresComparacao,
      resetUI,
      toggleApoioStatus,
      getApoioState
    };
  })();
</script>
